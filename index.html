e로 변환을 정의한 뒤, recipe job을 실행해 정리된 데이터를 생성하는 것입니다. 따라서 B안이 정답입니다.", "en": "AWS Glue DataBrew supports datasets sourced directly from Amazon S3 paths. To clean and normalize data, AWS documentation specifies using DataBrew recipes, which define transformation steps such as standardization, deduplication, and formatting. A profile job is used only for data analysis and statistics generation, not for transformation. A recipe job applies actual transformations to the data and writes the output to Amazon S3. JDBC connections are used for relational databases, not S3 buckets. Therefore, options C and D are invalid. AWS clearly documents that the correct workflow is: Create a DataBrew dataset from an S3 path Define transformations using a recipe Run a recipe job to produce cleaned data Thus, Option B is the correct and AWS-aligned answer."}, {"n": 150, "t": "single", "q": "A company is training a deep learning model to detect abnormalities in images. The company has limited GPU resources and a large hyperparameter space to explore. The company needs to test different configurations and avoid wasting computation time on poorly performing models that show weak validation accuracy in early epochs. Which hyperparameter optimization strategy should the company use?", "kq": "어떤 회사가 이미지의 이상을 탐지하는 딥러닝 모델을 학습시키고 있습니다. 회사는 GPU 리소스가 제한적이고 탐색해야 할 하이퍼파라미터 공간이 넓습니다. 회사는 다양한 구성을 테스트하되, 초기 에포크에서 검증 정확도가 낮게 나타나는 부진한 모델에 연산 시간을 낭비하지 않으려고 합니다. 회사가 사용해야 할 하이퍼파라미터 최적화 전략은 무엇입니까?", "o": [{"k": "A", "t": "Grid search across all possible combinations", "kt": "가능한 모든 조합에 대한 그리드 탐색"}, {"k": "B", "t": "Bayesian optimization with early stopping", "kt": "조기 종료를 적용한 베이지안 최적화"}, {"k": "C", "t": "Manual tuning of each parameter individually", "kt": "각 파라미터를 개별적으로 수동 튜닝"}, {"k": "D", "t": "Exhaustive search without early stopping", "kt": "조기 종료 없는 전수 탐색"}], "a": ["B"], "ko": "GPU 리소스가 제한되어 있고 하이퍼파라미터 탐색 공간이 클 때 AWS 문서는 조기 종료와 결합한 베이지안 최적화를 강력히 권장합니다. 베이지안 최적화는 이전 평가 결과를 활용해 다음에 테스트할 하이퍼파라미터 조합을 지능적으로 선택하므로, 모든 조합을 시도하는 대신 유망한 탐색 영역에 집중할 수 있습니다. Amazon SageMaker에서 베이지안 최적화는 하이퍼파라미터 튜닝 작업의 기본이자 권장 전략입니다. 이는 그리드 탐색이나 랜덤 탐색보다 필요한 학습 실행 횟수를 크게 줄여 딥러닝 워크로드에서 비용 효율적입니다. 조기 종료는 초기 에포크에서 검증 성능이 낮은 학습 작업을 중단하여 효율성을 더욱 높입니다. 이를 통해 성능이 좋지 않을 가능성이 큰 구성에 GPU 시간을 낭비하지 않을 수 있습니다. AWS 문서에서도 조기 종료를 학습 비용과 시간을 제어하는 핵심 기능으로 설명합니다. 그리드 탐색과 exhaustive search는 계산 비용이 높고 큰 탐색 공간에는 비현실적이며, 수동 튜닝은 느리고 오류가 발생하기 쉽고 확장성이 낮습니다. 따라서 베이지안 최적화와 조기 종료를 함께 사용하는 B안이 정답입니다.", "en": "When GPU resources are limited and the hyperparameter search space is large, AWS documentation strongly recommends Bayesian optimization combined with early stopping. Bayesian optimization uses past evaluation results to intelligently select the next set of hyperparameters to test, focusing exploration on promising regions of the search space rather than testing all combinations. In Amazon SageMaker, Bayesian optimization is the default and recommended strategy for hyperparameter tuning jobs. It significantly reduces the number of training runs required compared to grid or random search, making it highly cost-efficient for deep learning workloads. Early stopping further improves efficiency by terminating training jobs that show poor validation performance in early epochs. This prevents wasted GPU time on configurations that are unlikely to perform well. AWS explicitly documents early stopping as a key feature for controlling training cost and duration. Grid search and exhaustive search are computationally expensive and impractical for large hyperparameter spaces. Manual tuning is slow, error-prone, and does not scale. By combining Bayesian optimization with early stopping, the company can rapidly converge on high- performing hyperparameter configurations while minimizing resource usage. Therefore, Option B is the correct and AWS-aligned solution."}, {"n": 151, "t": "single", "q": "An ML company wants to monitor and analyze the API calls that its AWS resources make. The company has created an AWS CloudTrail log file that logs to an Amazon S3 bucket. The company has also created an organization in AWS Organizations to manage permissions across accounts. The company needs to enable log file validation to ensure the integrity of its log files. Which solution will meet these requirements?", "kq": "어떤 ML 회사가 자사 AWS 리소스가 수행하는 API 호출을 모니터링하고 분석하려고 합니다. 회사는 Amazon S3 버킷에 로그를 기록하는 AWS CloudTrail 로그 파일을 만들었습니다. 또한 계정 간 권한을 관리하기 위해 AWS Organizations에 조직을 만들었습니다. 회사는 로그 파일의 무결성을 보장하기 위해 로그 파일 검증을 활성화해야 합니다. 어떤 솔루션이 이러한 요구 사항을 충족할까요?", "o": [{"k": "A", "t": "Enable CloudTrail log file integrity validation.", "kt": "CloudTrail 로그 파일 무결성 검증을 활성화합니다."}, {"k": "B", "t": "Create a multi-Region trail in CloudTrail.", "kt": "CloudTrail에서 다중 리전 추적을 만듭니다."}, {"k": "C", "t": "Create a trail in CloudTrail for the organization.", "kt": "CloudTrail에서 조직용 추적을 만듭니다."}, {"k": "D", "t": "Enable Amazon CloudWatch Logs delivery.", "kt": "Amazon CloudWatch Logs 전달을 활성화합니다."}], "a": ["A"], "ko": "정답은 A입니다. CloudTrail 로그 파일 무결성 검증을 활성화하는 것입니다. AWS CloudTrail은 AWS 서비스에 대한 API 호출을 기록하고 로그 파일을 Amazon S3 버킷으로 전달합니다. 로그 파일의 진위성과 무결성을 보장해야 하는 조직의 경우, AWS는 로그 파일 무결성 검증을 활성화할 것을 권장합니다. 이 기능은 각 로그 파일에 해시 함수를 적용하고 해시 값을 별도로 저장하여, 로그 파일이 전달된 이후 변경, 삭제 또는 변조되지 않았는지 확인할 수 있게 합니다. 특히 ML 운영 환경에서 모델 학습 파이프라인, 운영 추론 호출, 계정 간 시스템 접근 패턴을 감사할 때 로그 무결성 검증은 중요합니다. 여러 계정을 AWS Organizations로 관리하는 환경에서는 여러 계정의 로그가 통합되므로, 이 검증 기능은 로그 신뢰성을 높이는 추가 보안 계층을 제공합니다. B안은 여러 리전의 API 활동을 로깅하지만 로그 무결성을 보장하지는 않습니다. C안은 조직 전체의 로깅을 중앙화하지만 로그가 변경되지 않았는지를 자동으로 검증하지는 않습니다. D안은 CloudWatch Logs로 실시간 모니터링과 알림을 가능하게 하지만 과거 로그 파일의 무결성 검증은 제공하지 않습니다. 따라서 CloudTrail 로그 파일 무결성 검증을 활성화하는 것이 올바른 해결책입니다.", "en": "The correct answer is A. Enable CloudTrail log file integrity validation. AWS CloudTrail provides the ability to record API calls made to AWS services and delivers log files to an Amazon S3 bucket. For organizations that need to ensure the authenticity and integrity of these log files, AWS recommends enabling log file integrity validation. This feature applies a hash function to each log file and stores the hash separately, allowing you to verify that the logs have not been altered, deleted, or tampered with after delivery. Enabling log file integrity validation is critical in ML operations when auditing model training pipelines, production inference calls, or system access patterns across accounts. It ensures that security-sensitive API activity is accurately recorded and verifiable. In multi-account environments managed by AWS Organizations, this validation provides an extra layer of trust when logs are consolidated from multiple accounts. Option B, creating a multi-Region trail, ensures that API activity across regions is logged but does not inherently guarantee the integrity of logs. Option C, creating an organization trail, centralizes logging for all accounts, which is valuable for governance, but again does not automatically provide verification of log integrity. Option D, enabling CloudWatch Logs delivery, allows real-time monitoring and alerting but does not address the verification of historical log files. By enabling log file integrity validation, organizations can cryptographically verify each log file, detect unauthorized changes, and meet compliance requirements for secure ML monitoring and auditing. This aligns with AWS best practices for ML solution monitoring, maintenance, and security, ensuring reliable tracking of model operations and API usage across distributed ML systems."}, {"n": 152, "t": "single", "q": "A company has an ML model that generates text descriptions based on images that customers upload to the company's website. The images can be up to 50 MB in total size. An ML engineer decides to store the images in an Amazon S3 bucket. The ML engineer must implement a processing solution that can scale to accommodate changes in demand. Which solution will meet these requirements with the LEAST operational overhead?", "kq": "어떤 회사가 고객이 회사 웹사이트에 업로드한 이미지를 기반으로 텍스트 설명을 생성하는 ML 모델을 보유하고 있습니다. 이미지는 전체 크기가 최대 50MB까지 될 수 있습니다. ML 엔지니어는 이미지를 Amazon S3 버킷에 저장하기로 결정했습니다. ML 엔지니어는 수요 변화에 맞춰 확장할 수 있는 처리 솔루션을 구현해야 합니다. 어떤 솔루션이 최소한의 운영 오버헤드로 이러한 요구 사항을 충족할까요?", "o": [{"k": "A", "t": "Create an Amazon SageMaker batch transform job to process all the images in the S3 bucket.", "kt": "Amazon SageMaker 배치 변환 작업을 만들어 S3 버킷의 모든 이미지를 처리합니다."}, {"k": "B", "t": "Create an Amazon SageMaker Asynchronous Inference endpoint and a scaling policy. Run a script to make an inference request for each image.", "kt": "Amazon SageMaker 비동기 추론(Asynchronous Inference) 엔드포인트와 스케일링 정책을 만듭니다. 각 이미지에 대해 추론 요청을 수행하는 스크립트를 실행합니다."}, {"k": "C", "t": "Create an Amazon Elastic Kubernetes Service (Amazon EKS) cluster that uses Karpenter for auto scaling. Host the model on the EKS cluster. Run a script to make an inference request for each image.", "kt": "Karpenter를 Auto Scaling에 사용하는 Amazon EKS 클러스터를 만듭니다. EKS 클러스터에 모델을 호스팅합니다. 각 이미지에 대해 추론 요청을 수행하는 스크립트를 실행합니다."}, {"k": "D", "t": "Create an AWS Batch job that uses an Amazon Elastic Container Service (Amazon ECS) cluster.Specify a list of images to process for each AWS Batch job.", "kt": "Amazon ECS 클러스터를 사용하는 AWS Batch 작업을 만듭니다. 각 AWS Batch 작업마다 처리할 이미지 목록을 지정합니다."}], "a": ["B"], "ko": "SageMaker 비동기 추론은 최대 50MB와 같은 대용량 이미지 페이로드를 처리하도록 설계되어 있으며, 즉시 응답이 필요하지 않은 요청에 적합합니다. 수요에 따라 자동으로 확장할 수 있어 운영 부담을 최소화하면서 비용 효율성을 확보할 수 있습니다. 스크립트를 사용해 각 이미지에 대한 추론 요청을 보낼 수 있고, 결과는 비동기적으로 가져올 수 있습니다. 이 방식은 트래픽 변동을 수용하면서 수동 개입을 최소화해야 하는 경우에 이상적입니다.", "en": "SageMaker Asynchronous Inference is designed for processing large payloads, such as images up to 50 MB, and can handle requests that do not require an immediate response. It scales automatically based on the demand, minimizing operational overhead while ensuring cost- efficiency. A script can be used to send inference requests for each image, and the results can be retrieved asynchronously. This approach is ideal for accommodating varying levels of traffic with minimal manual intervention."}, {"n": 153, "t": "single", "q": "A company runs an Amazon SageMaker AI domain in a public subnet of a newly created VPC. The network is configured properly, and ML engineers can access the SageMaker AI domain. Recently, the company discovered suspicious traffic to the domain from a specific IP address. The company needs to block traffic from the specific IP address. Which update to the network configuration will meet this requirement?", "kq": "어떤 회사가 새로 만든 VPC의 퍼블릭 서브넷에서 Amazon SageMaker AI 도메인을 운영하고 있습니다. 네트워크는 올바르게 구성되어 있고 ML 엔지니어들이 SageMaker AI 도메인에 접근할 수 있습니다. 최근 회사는 특정 IP 주소에서 도메인으로 향하는 의심스러운 트래픽을 발견했습니다. 회사는 해당 특정 IP 주소의 트래픽을 차단해야 합니다. 이 요구 사항을 충족하는 네트워크 구성 변경은 무엇입니까?", "o": [{"k": "A", "t": "Create a security group inbound rule to deny traffic from the specific IP address. Assign the security group to the domain.", "kt": "특정 IP 주소의 트래픽을 거부하는 보안 그룹 인바운드 규칙을 만듭니다. 해당 보안 그룹을 도메인에 할당합니다."}, {"k": "B", "t": "Create a network ACL inbound rule to deny traffic from the specific IP address. Assign the rule to the default network ACL for the subnet where the domain is located.", "kt": "특정 IP 주소의 트래픽을 거부하는 네트워크 ACL 인바운드 규칙을 만듭니다. 도메인이 위치한 서브넷의 기본 네트워크 ACL에 해당 규칙을 할당합니다."}, {"k": "C", "t": "Create a shadow variant for the domain. Configure SageMaker Inference Recommender to send traffic from the specific IP address to the shadow endpoint.", "kt": "도메인용 섀도 변형을 만듭니다. 특정 IP 주소의 트래픽을 섀도 엔드포인트로 보내도록 SageMaker Inference Recommender를 구성합니다."}, {"k": "D", "t": "Create a VPC route table to deny inbound traffic from the specific IP address. Assign the route table to the domain.", "kt": "특정 IP 주소의 인바운드 트래픽을 거부하는 VPC 라우팅 테이블을 만듭니다. 해당 라우팅 테이블을 도메인에 할당합니다."}], "a": ["B"], "ko": "AWS 네트워킹에서 보안 그룹은 상태 저장 방식이며 허용 규칙만 지원하므로 특정 트래픽을 명시적으로 거부할 수 없습니다. 따라서 A안은 적절하지 않습니다. 반면 네트워크 ACL은 상태 비저장 방식이며 허용 및 거부 규칙을 모두 지원하므로 특정 IP 주소의 트래픽을 차단하는 올바른 수단입니다. SageMaker AI 도메인이 퍼블릭 서브넷에 배포되어 있으므로, 인바운드 트래픽은 리소스에 도달하기 전에 서브넷 경계에서 평가됩니다. AWS 문서에서도 네트워크 ACL은 서브넷 수준에서 평가되며 IP 기반 차단 규칙을 구현하는 데 적합하다고 설명합니다. 라우팅 테이블은 트래픽 경로를 제어할 뿐 필터링 기능을 제공하지 않으므로 D안은 부적절합니다. C안은 네트워크 보안과 관련이 없으며 트래픽을 차단하지 않습니다. 따라서 서브넷의 네트워크 ACL에 특정 IP 주소를 거부하는 인바운드 규칙을 생성하는 B안이 정답입니다.", "en": "In AWS networking, security groups are stateful and allow-only, meaning they cannot explicitly deny traffic. As a result, Option A is invalid. Network ACLs (NACLs), on the other hand, are stateless and support both allow and deny rules, making them the correct mechanism for blocking traffic from specific IP addresses. Because the SageMaker AI domain is deployed in a public subnet, inbound traffic reaches the subnet before it reaches the resource. AWS documentation states that NACLs are evaluated at the subnet level and are ideal for implementing IP-based blocking rules. Route tables control routing paths, not traffic filtering, so Option D is incorrect. Option C is unrelated to network security and does not block traffic. AWS best practices clearly recommend using network ACL deny rules when an explicit block is required for a specific IP address at the subnet boundary. Therefore, Option B is the correct and AWS-aligned solution."}, {"n": 155, "t": "single", "q": "A logistics company has installed in-vehicle cameras for basic monitoring of its drivers. The company wants to improve driver safety by identifying distractions that could lead to accidents. Which solution will meet this requirement with the LEAST operational effort?", "kq": "어떤 물류 회사가 운전자에 대한 기본 모니터링을 위해 차량 내 카메라를 설치했습니다. 회사는 사고로 이어질 수 있는 주의 산만 요소를 식별해 운전자 안전을 개선하려고 합니다. 어떤 솔루션이 최소한의 운영 노력으로 이 요구 사항을 충족할까요?", "o": [{"k": "A", "t": "Use Amazon Rekognition eye gaze direction detection to monitor driver behavior and identify distractions.", "kt": "Amazon Rekognition의 시선 방향 탐지를 사용해 운전자 행동을 모니터링하고 주의 산만을 식별합니다."}, {"k": "B", "t": "Use Amazon SageMaker AI to customize an AI model to monitor driver behavior and identify distractions.", "kt": "Amazon SageMaker AI로 AI 모델을 사용자 지정해 운전자 행동을 모니터링하고 주의 산만을 식별합니다."}, {"k": "C", "t": "Integrate a third-party driver monitoring system with Amazon Rekognition to monitor driver behavior and identify distractions.", "kt": "서드파티 운전자 모니터링 시스템을 Amazon Rekognition과 통합해 운전자 행동을 모니터링하고 주의 산만을 식별합니다."}, {"k": "D", "t": "Use Amazon Comprehend to analyze text-based driver feedback and identify distractions.", "kt": "Amazon Comprehend를 사용해 텍스트 기반 운전자 피드백을 분석하고 주의 산만을 식별합니다."}], "a": ["A"], "ko": "A안이 정답입니다. Amazon Rekognition은 사람의 시선 방향을 나타내는 EyeDirection 속성을 기본 제공하며, 이 값은 pitch와 yaw로 표현됩니다. AWS 문서에서는 EyeDirection이 머리 자세와 독립적으로 눈이 바라보는 방향을 보여준다고 설명합니다. 운전자 모니터링 사용 사례에서는 운전자가 도로에서 시선을 돌리고 있는지 확인하는 데 직접적으로 활용할 수 있으므로, 주의 산만 여부를 식별하는 데 적합합니다. Rekognition은 완전 관리형 서비스이며 바로 사용할 수 있는 컴퓨터 비전 기능을 제공하므로, SageMaker에서 데이터를 수집하고 라벨링한 뒤 사용자 지정 모델을 학습·운영하는 방식보다 운영 노력이 훨씬 적습니다. B안은 기술적으로 가능할 수 있지만 사용자 지정 모델 개발과 유지보수가 필요합니다. C안은 AWS가 이미 제공하는 기능이 있는데도 타사 시스템을 추가해 복잡성을 높입니다. D안의 Amazon Comprehend는 텍스트 분석 서비스로, 카메라 영상 분석에는 적합하지 않습니다. 따라서 운영 노력이 가장 적은 해결책은 Amazon Rekognition의 시선 방향 탐지 기능을 사용하는 A안입니다.", "en": "Option A is correct because Amazon Rekognition provides a built-in EyeDirection attribute that indicates the direction a person's eyes are gazing, expressed through pitch and yaw. AWS documentation describes EyeDirection as showing where the eyes are looking independently of head pose. For a driver-monitoring use case, this is directly useful for identifying whether a driver is looking away from the road and may be distracted. AWS also announced that Rekognition's eye gaze direction detection is intended to support safety use cases and to help identify where users focus their attention. That makes it a strong match for monitoring in-vehicle cameras for distraction detection. Because Rekognition is a fully managed service with ready-to-use computer vision capabilities, it requires far less operational effort than collecting data, labeling it, training a custom model in SageMaker, and maintaining that model over time. The other options are less appropriate. Option B could work technically, but building and maintaining a custom SageMaker model would require significantly more engineering and operational work than using a managed Rekognition feature. Option C introduces unnecessary complexity by adding a third- party system when AWS already provides a directly relevant managed capability. Option D is unrelated because Amazon Comprehend analyzes text, while the input here is camera footage. Since the question asks for the solution with the least operational effort, the best AWS-aligned answer is to use the managed Rekognition eye gaze detection capability. Therefore, the fully verified answer is A."}, {"n": 157, "t": "single", "q": "An ML engineer needs to use an ML model to predict the price of apartments in a specific location. Which metric should the ML engineer use to evaluate the model's performance?", "kq": "ML 엔지니어가 특정 지역의 아파트 가격을 예측하기 위해 ML 모델을 사용해야 합니다. 모델 성능을 평가할 때 사용해야 할 지표는 무엇입니까?", "o": [{"k": "A", "t": "Accuracy", "kt": "정확도(Accuracy)"}, {"k": "B", "t": "Area Under the ROC Curve (AUC)", "kt": "ROC 곡선 아래 면적(AUC)"}, {"k": "C", "t": "F1 score", "kt": "F1 점수"}, {"k": "D", "t": "Mean absolute error (MAE)", "kt": "평균 절대 오차(MAE)"}], "a": ["D"], "ko": "아파트 가격과 같은 연속형 변수를 예측하는 경우에는 회귀 문제에 적합한 평가 지표를 사용해야 합니다. 평균절대오차(MAE)는 예측값과 실제값의 절대 차이를 평균한 값으로, 예측 오차의 평균 크기를 직관적으로 보여줍니다. MAE는 목표 변수와 동일한 단위로 표현되므로 해석이 쉽고, 큰 오차를 제곱하지 않기 때문에 평균제곱오차보다 이상치에 덜 민감합니다. 정확도, AUC, F1 점수는 이산 라벨을 예측하는 분류 문제용 지표이므로 연속형 가격 예측에는 적합하지 않습니다. 따라서 아파트 가격을 예측하는 회귀 모델의 성능 평가지표로는 MAE가 적절하며, D안이 정답입니다.", "en": "When predicting continuous variables, such as apartment prices, it's essential to evaluate the model's performance using appropriate regression metrics. The Mean Absolute Error (MAE) is a widely used metric for this purpose. Understanding Mean Absolute Error (MAE): MAE measures the average magnitude of errors in a set of predictions, without considering their direction. It calculates the average absolute difference between predicted values and actual values, providing a straightforward interpretation of prediction accuracy. Advantages of MAE: Interpretability: MAE is expressed in the same units as the target variable, making it easy to understand. Robustness to Outliers: Unlike metrics that square the errors (e.g., Mean Squared Error), MAE does not disproportionately penalize larger errors, making it more robust to outliers. Comparison with Other Metrics: Accuracy, AUC, F1 Score: These metrics are designed for classification tasks, where the goal is to predict discrete labels. They are not suitable for regression problems involving continuous target variables. Mean Squared Error (MSE): While MSE also measures prediction errors, it squares the differences, giving more weight to larger errors. This can be useful in certain contexts but may be sensitive to outliers. Conclusion: For evaluating the performance of a model predicting apartment prices-a continuous variable-MAE is an appropriate and effective metric. It provides a clear indication of the average prediction error in the same units as the target variable, facilitating straightforward interpretation and comparison. References: Regression Metrics - GeeksforGeeks Evaluation Metrics for Your Regression Model - Analytics Vidhya Regression Metrics for Machine Learning - Machine Learning Mastery"}, {"n": 158, "t": "multi", "q": "An ML engineer is designing an AI-powered traffic management system. The system must use near real-time inference to predict congestion and prevent collisions. The system must also use batch processing to perform historical analysis of predictions over several hours to improve the model. The inference endpoints must scale automatically to meet demand. Which combination of solutions will meet these requirements? (Select TWO.)", "kq": "ML 엔지니어가 AI 기반 교통 관리 시스템을 설계하고 있습니다. 이 시스템은 혼잡을 예측하고 충돌을 방지하기 위해 준실시간 추론을 사용해야 합니다. 또한 모델을 개선하기 위해 수 시간에 걸친 예측의 과거 분석을 배치 처리로 수행해야 합니다. 추론 엔드포인트는 수요에 맞춰 자동으로 확장되어야 합니다. 요구 사항을 충족하는 조합은 무엇입니까? (2개 선택)", "o": [{"k": "A", "t": "Use Amazon SageMaker real-time inference endpoints with automatic scaling based on ConcurrentInvocationsPerInstance.", "kt": "ConcurrentInvocationsPerInstance 기반 Auto Scaling이 적용된 Amazon SageMaker 실시간 추론 엔드포인트를 사용합니다."}, {"k": "B", "t": "Use AWS Lambda with reserved concurrency and SnapStart to connect to SageMaker endpoints.", "kt": "예약된 동시성과 SnapStart가 적용된 AWS Lambda를 사용해 SageMaker 엔드포인트에 연결합니다."}, {"k": "C", "t": "Use an Amazon SageMaker Processing job for batch historical analysis. Schedule the job with Amazon EventBridge.", "kt": "배치 과거 분석에 Amazon SageMaker Processing 작업을 사용합니다. Amazon EventBridge로 작업을 예약합니다."}, {"k": "D", "t": "Use Amazon EC2 Auto Scaling to host containers for batch analysis.", "kt": "배치 분석용 컨테이너를 호스팅하기 위해 Amazon EC2 Auto Scaling을 사용합니다."}, {"k": "E", "t": "Use AWS Lambda for historical analysis.", "kt": "과거 분석에 AWS Lambda를 사용합니다."}], "a": ["A", "C"], "ko": "준실시간 예측에는 Amazon SageMaker 실시간 추론 엔드포인트가 적합합니다. 이 엔드포인트는 ConcurrentInvocationsPerInstance와 같은 지표를 기반으로 자동 확장을 지원하므로, 교통량 급증 시에도 낮은 지연 시간과 높은 가용성을 유지할 수 있습니다. 여러 시간 동안의 과거 예측 분석과 같은 장시간 배치 분석에는 SageMaker Processing 작업이 적절합니다. Processing 작업은 배치 워크로드용으로 설계되어 있고 수 시간 동안 실행될 수 있으며, SageMaker 파이프라인과도 자연스럽게 통합됩니다. EventBridge로 작업을 예약하면 완전 관리형이고 확장 가능한 서버리스 방식으로 실행할 수 있습니다. Lambda는 수 시간 동안 실행되는 작업에 적합하지 않으며, EC2 Auto Scaling은 불필요한 인프라 관리 부담을 추가합니다. 따라서 A와 C를 함께 사용하는 것이 모든 요구 사항을 충족합니다.", "en": "For near real-time predictions, AWS documentation recommends Amazon SageMaker real-time inference endpoints. These endpoints support automatic scaling based on metrics such as ConcurrentInvocationsPerInstance, ensuring low latency and high availability during traffic spikes. For long-running historical analysis, SageMaker Processing jobs are the appropriate solution. Processing jobs are designed for batch workloads, can run for hours, and integrate cleanly with SageMaker pipelines. Scheduling them with Amazon EventBridge provides a fully managed, scalable, and serverless solution. AWS Lambda is unsuitable for multi-hour workloads. EC2 Auto Scaling adds unnecessary infrastructure management overhead. Therefore, Options A and C together meet all requirements and align with AWS best practices."}, {"n": 160, "t": "match", "q": "A company uses a training job on Amazon SageMaker Al to train a neural network. The job first trains a model and then evaluates the model's performance against a test dataset. The company uses the results from the evaluation phase to decide if the trained model will go to production. The training phase takes too long. The company needs solutions that can shorten training time without decreasing the model's final performance. Select the correct solutions from the following list to meet the requirements for each description. Select each solution one time or not at all. (Select THREE.)", "kq": "어떤 회사가 신경망을 학습시키기 위해 Amazon SageMaker AI의 학습 작업을 사용합니다. 이 작업은 먼저 모델을 학습시킨 뒤 테스트 데이터셋에 대해 모델 성능을 평가합니다. 회사는 평가 단계의 결과로 학습된 모델을 운영 환경에 올릴지 결정합니다. 현재 학습 단계가 너무 오래 걸립니다. 회사는 모델의 최종 성능을 떨어뜨리지 않으면서 학습 시간을 단축할 수 있는 방법이 필요합니다. 아래 목록에서 각 설명의 요구 사항에 맞는 방법을 선택하세요. 각 방법은 한 번만 선택하거나 선택하지 않습니다. (3개 선택)", "p": ["Change the number of samples used in each iteration of training.", "Increase the number of instances used during training.", "Stop training before the maximum number of epochs are reached if performance is sufficient and not improving."], "c": ["Change the epoch count.", "Choose an Amazon EC2 Spot Fleet.", "Change the batch size.", "Use early stopping on the training job.", "Use the SageMaker AI distributed data parallelism (SMDDP) library.", "Stop the training job."], "kp": ["학습의 각 반복에서 사용하는 샘플 수를 변경한다.", "학습 중 사용하는 인스턴스 수를 늘린다.", "성능이 충분하고 더 개선되지 않으면 최대 에포크 수에 도달하기 전에 학습을 중단한다."], "kc": ["에포크 수를 변경한다.", "Amazon EC2 Spot Fleet을 선택한다.", "배치 크기를 변경한다.", "학습 작업에 조기 종료(early stopping)를 사용한다.", "SageMaker AI 분산 데이터 병렬 처리(SMDDP) 라이브러리를 사용한다.", "학습 작업을 중단한다."], "a": [2, 4, 3], "ko": "각 학습 반복에서 사용하는 샘플 수를 변경해야 하는 항목의 정답은 배치 크기 변경입니다. 배치 크기를 늘리면 에포크당 반복 횟수가 줄어들어 학습 시간을 크게 단축할 수 있으며, 적절히 조정하면 모델 품질도 유지할 수 있습니다. 학습에 사용하는 인스턴스 수를 늘려야 하는 항목의 정답은 SageMaker AI 분산 데이터 병렬 처리(SMDDP) 라이브러리 사용입니다. SMDDP는 여러 GPU 인스턴스에 학습 데이터를 효율적으로 분산하고 기울기 동기화를 최적화하여, 모델 수렴이나 정확도에 영향을 주지 않으면서 학습을 가속화합니다. 성능이 충분하고 더 이상 개선되지 않을 때 최대 에포크 전에 학습을 중단해야 하는 항목의 정답은 학습 작업에 조기 종료를 사용하는 것입니다. 조기 종료는 검증 지표가 더 이상 개선되지 않을 때 학습을 자동으로 종료하여, 최적의 모델 성능을 유지하면서 불필요한 컴퓨팅 시간을 줄입니다.", "en": "Change the number of samples used in each iteration of training Correct selection: Change the batch size Why: Increasing the batch size reduces the number of iterations per epoch, which can significantly shorten training time while maintaining model quality when tuned appropriately. AWS explicitly recommends batch size tuning as a primary performance optimization.Increase the number of instances used during training Correct selection: Use the SageMaker AI distributed data parallelism (SMDDP) library Why: SMDDP is designed to efficiently distribute training data across multiple GPU instances with optimized gradient synchronization. This accelerates training without affecting model convergence or accuracy, unlike naive scaling approaches. Stop training before the maximum number of epochs are reached if performance is sufficient and not improving Correct selection: Use early stopping on the training job Why: Early stopping automatically terminates training when validation metrics stop improving. AWS recommends this to reduce wasted compute time while preserving optimal model performance."}, {"n": 161, "t": "single", "q": "A credit card company has a fraud detection model in production on an Amazon SageMaker endpoint. The company develops a new version of the model. The company needs to assess the new model's performance by using live data and without affecting production end users. Which solution will meet these requirements?", "kq": "어떤 신용카드 회사가 Amazon SageMaker 엔드포인트에서 사기 탐지 모델을 운영하고 있습니다. 회사는 모델의 새 버전을 개발했습니다. 회사는 운영 환경의 최종 사용자에게 영향을 주지 않으면서 실시간 데이터로 새 모델의 성능을 평가해야 합니다. 어떤 솔루션이 이러한 요구 사항을 충족할까요?", "o": [{"k": "A", "t": "Set up SageMaker Debugger and create a custom rule.", "kt": "SageMaker Debugger를 설정하고 사용자 지정 규칙을 만듭니다."}, {"k": "B", "t": "Set up blue/green deployments with all-at-once traffic shifting.", "kt": "한 번에 전체 트래픽을 전환하는 블루/그린 배포를 설정합니다."}, {"k": "C", "t": "Set up blue/green deployments with canary traffic shifting.", "kt": "카나리 트래픽 전환 방식의 블루/그린 배포를 설정합니다."}, {"k": "D", "t": "Set up shadow testing with a shadow variant of the new model.", "kt": "새 모델의 섀도 변형으로 섀도 테스트를 설정합니다."}], "a": ["D"], "ko": "섀도 테스트는 기존 운영 모델에 영향을 주지 않으면서 새 모델의 섀도 변형으로 실제 운영 트래픽의 복사본을 보낼 수 있게 합니다. 이를 통해 최종 사용자에게 영향을 주지 않고 라이브 데이터를 사용해 새 모델의 성능을 실시간으로 평가할 수 있습니다. SageMaker 엔드포인트는 섀도 변형으로 트래픽 미러링을 지원하므로, 새 모델 성능을 평가하기에 적합한 해결책입니다.", "en": "Shadow testing allows you to send a copy of live production traffic to a shadow variant of the new model while keeping the existing production model unaffected. This enables you to evaluate the performance of the new model in real-time with live data without impacting end users. SageMaker endpoints support this setup by allowing traffic mirroring to the shadow variant, making it an ideal solution for assessing the new model's performance."}, {"n": 163, "t": "single", "q": "A company has deployed an ML model that detects fraudulent credit card transactions in real time in a banking application. The model uses Amazon SageMaker Asynchronous Inference. Consumers are reporting delays in receiving the inference results. An ML engineer needs to implement a solution to improve the inference performance. The solution also must provide a notification when a deviation in model quality occurs. Which solution will meet these requirements?", "kq": "어떤 회사가 뱅킹 애플리케이션에서 사기 신용카드 거래를 실시간으로 탐지하는 ML 모델을 배포했습니다. 이 모델은 Amazon SageMaker 비동기 추론(Asynchronous Inference)을 사용합니다. 소비자들이 추론 결과 수신이 지연된다고 보고하고 있습니다. ML 엔지니어는 추론 성능을 개선하는 솔루션을 구현해야 합니다. 또한 솔루션은 모델 품질에 편차가 발생할 때 알림을 제공해야 합니다. 어떤 솔루션이 이러한 요구 사항을 충족할까요?", "o": [{"k": "A", "t": "Use SageMaker real-time inference for inference. Use SageMaker Model Monitor for notifications about model quality.", "kt": "추론에 SageMaker 실시간 추론을 사용합니다. 모델 품질 알림에는 SageMaker Model Monitor를 사용합니다."}, {"k": "B", "t": "Use SageMaker batch transform for inference. Use SageMaker Model Monitor for notifications about model quality.", "kt": "추론에 SageMaker 배치 변환을 사용합니다. 모델 품질 알림에는 SageMaker Model Monitor를 사용합니다."}, {"k": "C", "t": "Use SageMaker Serverless Inference for inference. Use SageMaker Inference Recommender for notifications about model quality.", "kt": "추론에 SageMaker Serverless Inference를 사용합니다. 모델 품질 알림에는 SageMaker Inference Recommender를 사용합니다."}, {"k": "D", "t": "Keep using SageMaker Asynchronous Inference for inference. Use SageMaker Inference Recommender for notifications about model quality.", "kt": "추론에 SageMaker 비동기 추론을 계속 사용합니다. 모델 품질 알림에는 SageMaker Inference Recommender를 사용합니다."}], "a": ["A"], "ko": "SageMaker 실시간 추론은 은행 애플리케이션의 사기 거래 탐지처럼 낮은 지연 시간이 필요한 실시간 사용 사례를 위해 설계되었습니다. 비동기 추론에서 발생할 수 있는 결과 지연을 제거하여 추론 성능을 개선할 수 있습니다. 또한 SageMaker Model Monitor는 배포된 모델의 데이터 품질, 모델 성능 및 기타 지표의 편차를 모니터링하는 도구를 제공합니다. 모델 품질 편차가 탐지될 때 알림을 보내도록 구성할 수 있으므로 시스템의 신뢰성을 유지할 수 있습니다.", "en": "SageMaker real-time inference is designed for low-latency, real-time use cases, such as detecting fraudulent transactions in banking applications. It eliminates the delays associated with SageMaker Asynchronous Inference, improving inference performance. SageMaker Model Monitor provides tools to monitor deployed models for deviations in data quality, model performance, and other metrics. It can be configured to send notifications when a deviation in model quality is detected, ensuring the system remains reliable."}, {"n": 164, "t": "single", "q": "An ML engineer wants to deploy an Amazon SageMaker AI model for inference. The payload sizes are less than 3 MB. Processing time does not exceed 45 seconds. The traffic patterns will be irregular or unpredictable. Which inference option will meet these requirements MOST cost-effectively?", "kq": "ML 엔지니어가 추론을 위해 Amazon SageMaker AI 모델을 배포하려고 합니다. 페이로드 크기는 3MB 미만입니다. 처리 시간은 45초를 넘지 않습니다. 트래픽 패턴은 불규칙하거나 예측 불가능합니다. 어떤 추론 옵션이 가장 비용 효율적으로 이러한 요구 사항을 충족할까요?", "o": [{"k": "A", "t": "Asynchronous inference", "kt": "비동기 추론(Asynchronous inference)"}, {"k": "B", "t": "Real-time inference", "kt": "실시간 추론(Real-time inference)"}, {"k": "C", "t": "Serverless inference", "kt": "서버리스 추론(Serverless inference)"}, {"k": "D", "t": "Batch transform", "kt": "배치 변환(Batch transform)"}], "a": ["C"], "ko": "Amazon SageMaker Serverless Inference는 불규칙하거나 예측하기 어려운 트래픽 패턴에 적합하도록 설계되어 있습니다. 요청량에 따라 컴퓨팅 리소스를 자동으로 프로비저닝하고 확장하며, 유휴 상태에서는 0으로 축소되므로 가장 비용 효율적인 옵션입니다. 서버리스 추론은 최대 6MB의 페이로드와 최대 60초의 요청 처리 시간을 지원하므로, 문제에서 제시한 3MB 미만의 페이로드와 45초 이하의 처리 시간 조건을 충분히 충족합니다. 사용자는 추론 실행 중 실제 사용한 컴퓨팅에 대해서만 비용을 지불하며 유휴 용량 비용은 발생하지 않습니다. 비동기 추론은 장시간 실행 작업과 대용량 페이로드에 적합하고, 실시간 추론은 항상 실행되는 인스턴스가 필요해 유휴 시간 비용이 증가합니다. Batch Transform은 오프라인 처리용입니다. 따라서 서버리스 추론이 최적의 선택입니다.", "en": "Amazon SageMaker Serverless Inference is designed for irregular or unpredictable traffic patterns. It automatically provisions and scales compute resources based on request volume and scales down to zero when idle, making it the most cost-effective option. Serverless inference supports payloads up to 6 MB and request durations up to 60 seconds, which comfortably meets the stated constraints. Customers are billed only for actual compute usage during inference execution, not for idle capacity. Asynchronous inference is intended for long-running jobs (up to 1 hour) and large payloads (up to 1 GB). Real-time inference requires always-on instances, increasing cost during idle periods. Batch transform is designed for offline processing. Therefore, serverless inference is the optimal choice."}, {"n": 165, "t": "single", "q": "A company is running ML models on premises by using custom Python scripts and proprietary datasets. The company is using PyTorch. The model building requires unique domain knowledge. The company needs to move the models to AWS. Which solution will meet these requirements with the LEAST development effort?", "kq": "어떤 회사가 사용자 지정 Python 스크립트와 독자적인 데이터셋을 사용해 온프레미스에서 ML 모델을 실행하고 있습니다. 회사는 PyTorch를 사용합니다. 모델 구축에는 고유한 도메인 지식이 필요합니다. 회사는 이 모델들을 AWS로 옮겨야 합니다. 어떤 솔루션이 최소한의 개발 노력으로 이러한 요구 사항을 충족할까요?", "o": [{"k": "A", "t": "Use SageMaker AI built-in algorithms to train the proprietary datasets.", "kt": "SageMaker AI 내장 알고리즘으로 독자적인 데이터셋을 학습시킵니다."}, {"k": "B", "t": "Use SageMaker AI script mode and premade images for ML frameworks.", "kt": "SageMaker AI 스크립트 모드와 ML 프레임워크용 사전 제작 이미지를 사용합니다."}, {"k": "C", "t": "Build a container on AWS that includes custom packages and a choice of ML frameworks.", "kt": "사용자 지정 패키지와 선택한 ML 프레임워크가 포함된 컨테이너를 AWS에서 빌드합니다."}, {"k": "D", "t": "Purchase similar production models through AWS Marketplace.", "kt": "AWS Marketplace를 통해 유사한 운영 모델을 구매합니다."}], "a": ["B"], "ko": "회사는 이미 사용자 지정 Python 학습 스크립트와 독자적인 데이터셋을 보유하고 있으며 PyTorch를 사용하고 있습니다. 또한 모델에는 도메인 특화 로직이 포함되어 있으므로, 최소한의 개발 노력으로 AWS로 이전하려면 기존 코드를 최대한 재사용해야 합니다. Amazon SageMaker AI script mode는 이러한 상황을 위해 설계된 기능입니다. Script mode를 사용하면 기존 학습 스크립트를 거의 변경하지 않고 SageMaker의 사전 구축 PyTorch 프레임워크 컨테이너에서 실행할 수 있습니다. 이를 통해 모델 구조나 학습 로직을 다시 설계하지 않고도 SageMaker의 관리형 인프라, 확장성, 모니터링, 보안 기능을 활용할 수 있습니다. SageMaker 내장 알고리즘은 데이터 형식과 학습 로직을 AWS 제공 구현에 맞춰야 하므로 개발 부담이 커질 수 있습니다. 사용자 지정 컨테이너를 직접 구축하는 방식은 의존성 관리, 보안 업데이트, 컨테이너 수명주기 관리가 필요하므로 더 복잡합니다. AWS Marketplace 모델 구매는 회사의 독자적 데이터와 도메인 지식을 반영할 수 없습니다. 따라서 사전 구축 PyTorch 컨테이너와 SageMaker script mode를 사용하는 B안이 가장 적절합니다.", "en": "The company already has custom Python training scripts, proprietary datasets, and uses PyTorch, with significant domain-specific logic embedded in the model. The goal is to migrate these workloads to AWS with the least development effort. According to AWS documentation, Amazon SageMaker AI script mode is explicitly designed for this scenario. Script mode allows customers to bring their existing training scripts with minimal or no code changes and run them using prebuilt SageMaker framework containers, including PyTorch. This approach eliminates the need to redesign models or rewrite training logic while still benefiting from SageMaker's managed infrastructure, scalability, monitoring, and security. Option A is incorrect because SageMaker built-in algorithms require adapting data formats and training logic to AWS-provided implementations, which would increase development effort and may not support proprietary domain logic. Option C is also incorrect because building and maintaining a custom container requires additional effort for containerization, dependency management, security updates, and lifecycle maintenance- making it more complex than necessary. Option D is not viable because purchasing models from AWS Marketplace would not support the company's proprietary datasets or unique domain knowledge embedded in existing models. Therefore, using SageMaker AI script mode with prebuilt PyTorch containers is the fastest, most efficient, and AWS-recommended migration path that minimizes development effort while preserving existing workflows."}, {"n": 166, "t": "single", "q": "A company has a large, unstructured dataset. The dataset includes many duplicate records across several key attributes. Which solution on AWS will detect duplicates in the dataset with the LEAST code development?", "kq": "어떤 회사가 대규모 비정형 데이터셋을 보유하고 있습니다. 이 데이터셋에는 여러 핵심 속성에 걸쳐 중복 레코드가 많이 있습니다. 코드 개발이 가장 적게 드는 방식으로 AWS에서 데이터셋의 중복을 탐지하는 방법은 무엇입니까?", "o": [{"k": "A", "t": "Use Amazon Mechanical Turk jobs to detect duplicates.", "kt": "Amazon Mechanical Turk 작업을 사용해 중복을 탐지합니다."}, {"k": "B", "t": "Use Amazon QuickSight ML Insights to build a custom deduplication model.", "kt": "Amazon QuickSight ML Insights를 사용해 사용자 지정 중복 제거 모델을 만듭니다."}, {"k": "C", "t": "Use Amazon SageMaker Data Wrangler to pre-process and detect duplicates.", "kt": "Amazon SageMaker Data Wrangler를 사용해 전처리하고 중복을 탐지합니다."}, {"k": "D", "t": "Use the AWS Glue FindMatches transform to detect duplicates.", "kt": "AWS Glue의 FindMatches 변환을 사용해 중복을 탐지합니다."}], "a": ["D"], "ko": "이 시나리오는 여러 핵심 속성에 걸쳐 중복 레코드가 포함된 대규모 비정형 데이터셋에서 최소한의 코드 개발로 중복을 탐지해야 하는 상황입니다. AWS Glue의 FindMatches 변환은 구조화 또는 반구조화 데이터셋에서 중복 레코드를 식별하도록 특별히 설계된 기능입니다. 이 기능은 머신러닝을 사용해 구성 가능한 임계값을 기준으로 중복 가능성이 있는 레코드를 탐지하며, 정확도 조정을 위한 유연성도 제공합니다. Glue Studio의 대화형 콘솔을 사용하면 복잡한 코드를 작성하지 않고도 FindMatches 변환을 구성하고 실행할 수 있습니다. 구현 절차는 데이터를 S3에 업로드하고 필요한 경우 스키마를 정의한 뒤, AWS Glue Studio에서 Glue 작업을 생성하고 FindMatches 변환을 선택하여 중복 판단에 사용할 주요 속성을 지정하는 방식입니다. 이후 Glue 작업을 실행하고 결과를 검토하여 중복을 확인한 뒤, 결과를 S3로 내보내거나 추가 처리할 수 있습니다. 따라서 최소한의 코드 개발로 중복 탐지를 수행하려면 AWS Glue FindMatches transform을 사용하는 D안이 가장 적절합니다.", "en": "Scenario: The dataset contains duplicate records that need to be detected with minimal code development. Why FindMatches in AWS Glue? Purpose-Built for Deduplication: The FindMatches transform in AWS Glue is specifically designed to identify duplicate records in structured or semi-structured datasets. Machine Learning-Based: It uses ML to identify duplicates based on configurable thresholds and provides flexibility for tuning accuracy. Low Code Overhead: Minimal development effort is required as Glue provides an interactive console for configuring and running FindMatches transforms. Steps to Implement: Prepare the Data: Upload the unstructured dataset to an S3 bucket and define a schema if needed. Create a Glue Job: Use the AWS Glue Studio to create a job and select the FindMatches transform. Specify key attributes for deduplication. Run and Evaluate: Execute the Glue job, and review the results for duplicates. Resolve Duplicates: Export results to an S3 bucket or process them as needed. References: AWS Glue FindMatches Documentation FindMatches Transform Example"}, {"n": 167, "t": "single", "q": "A company uses an NFS-based data store to store data for ML training. Linux-based systems access the data store. The company needs a hybrid system to make the shared data store accessible to on-premises servers and Amazon SageMaker AI notebooks that will consume the data. File locking is required for the data producers. Which AWS storage solution will meet these requirements?", "kq": "어떤 회사가 ML 학습용 데이터를 저장하기 위해 NFS 기반 데이터 저장소를 사용합니다. Linux 기반 시스템들이 이 데이터 저장소에 접근합니다. 회사는 공유 데이터 저장소를 온프레미스 서버와 데이터를 사용할 Amazon SageMaker AI 노트북 모두가 접근할 수 있게 하는 하이브리드 시스템이 필요합니다. 데이터 생산자를 위해 파일 잠금(file locking)이 필요합니다. 요구 사항을 충족하는 AWS 스토리지 솔루션은 무엇입니까?", "o": [{"k": "A", "t": "Use an Amazon S3 bucket to store the data. Use Mountpoint for Amazon S3 to mount the S3 bucket to the on-premises servers and the SageMaker AI notebooks.", "kt": "데이터를 Amazon S3 버킷에 저장합니다. Mountpoint for Amazon S3를 사용해 S3 버킷을 온프레미스 서버와 SageMaker AI 노트북에 마운트합니다."}, {"k": "B", "t": "Use an Amazon Elastic File System (Amazon EFS) file system to store the data. Mount the file system to the on-premises servers and the SageMaker AI notebooks.", "kt": "데이터를 Amazon EFS 파일 시스템에 저장합니다. 파일 시스템을 온프레미스 서버와 SageMaker AI 노트북에 마운트합니다."}, {"k": "C", "t": "Use an Amazon FSx for Lustre file system to store the data. Mount the file system to the on- premises servers and the SageMaker AI notebooks.", "kt": "데이터를 Amazon FSx for Lustre 파일 시스템에 저장합니다. 파일 시스템을 온프레미스 서버와 SageMaker AI 노트북에 마운트합니다."}, {"k": "D", "t": "Use an Amazon Elastic Block Store (Amazon EBS) volume to store the data. Mount the volume to the on-premises servers and the SageMaker AI notebooks.", "kt": "데이터를 Amazon EBS 볼륨에 저장합니다. 볼륨을 온프레미스 서버와 SageMaker AI 노트북에 마운트합니다."}], "a": ["B"], "ko": "B안이 정답입니다. Amazon EFS는 Linux 클라이언트를 지원하는 관리형 NFS 기반 공유 파일 시스템이며, 하이브리드 접근과 파일 잠금 같은 파일 시스템 의미 체계를 제공합니다. AWS 문서에 따르면 Amazon EFS는 강력한 데이터 일관성과 파일 잠금을 지원하며, 이는 문제에서 명시한 요구 사항과 직접적으로 일치합니다. 또한 AWS Direct Connect 또는 Site-to-Site VPN을 통해 Amazon VPC에 연결된 온프레미스 데이터센터 서버에서도 EFS 파일 시스템을 마운트할 수 있습니다. SageMaker 측면에서도 SageMaker Studio 도메인은 기본적으로 Amazon EFS 볼륨을 사용하며, 사용자 지정 EFS 파일 시스템을 추가해 Studio 사용자가 접근하도록 구성할 수 있습니다. 따라서 온프레미스 서버와 SageMaker 노트북이 함께 사용하는 공유 파일 저장소에는 EFS가 가장 자연스러운 선택입니다. S3와 Mountpoint for Amazon S3는 객체 스토리지 접근 방식이므로 NFS 스타일의 공유 데이터 저장소와 파일 잠금 요구 사항에는 적합하지 않습니다. FSx for Lustre는 고성능 병렬 파일 스토리지이지만, 문제는 NFS 기반 공유 데이터 저장소를 명시하고 있으므로 AWS의 네이티브 NFS 파일 서비스인 EFS가 더 적절합니다. EBS는 온프레미스 서버와 SageMaker 노트북에서 동시에 공유 파일 시스템으로 마운트할 수 없습니다. 따라서 B안이 가장 적합합니다.", "en": "Option B is correct because Amazon EFS is a managed NFS-based shared file system that supports Linux clients, hybrid access, and file-system semantics such as file locking. AWS documentation states that Amazon EFS provides strong data consistency and file locking, which is an explicit requirement in the question. AWS also states that you can mount EFS file systems on on-premises data center servers when connected to your Amazon VPC through AWS Direct Connect or Site-to-Site VPN, which directly satisfies the hybrid access requirement. For the SageMaker side, AWS documentation states that SageMaker AI creates a default Amazon EFS volume for Studio domains, and you can also add a custom Amazon EFS file system so domain users can access it in SageMaker Studio. AWS also notes that SageMaker AI Studio notebooks use Amazon EFS as a persistent storage layer. That makes EFS the most natural AWS storage service for a shared file repository that must be accessible from SageMaker notebooks. The other choices are weaker. Amazon S3 with Mountpoint is object storage access and is not the best answer for a shared NFS-style data store with file locking requirements. FSx for Lustre is high- performance parallel file storage and can support on-premises bursting, but the question explicitly starts from an NFS-based shared data store, and EFS is AWS's native NFS file service. Amazon EBS cannot be mounted simultaneously across on-premises servers and SageMaker notebooks as a shared, managed hybrid file system. Therefore, the best verified AWS-docs answer is B."}, {"n": 168, "t": "single", "q": "A company has a binary classification model in production. An ML engineer needs to develop a new version of the model. The new model version must maximize correct predictions of positive labels and negative labels. The ML engineer must use a metric to recalibrate the model to meet these requirements. Which metric should the ML engineer use for the model recalibration?", "kq": "어떤 회사가 운영 환경에 이진 분류 모델을 보유하고 있습니다. ML 엔지니어는 모델의 새 버전을 개발해야 합니다. 새 모델 버전은 양성 레이블과 음성 레이블의 올바른 예측을 모두 최대화해야 합니다. ML 엔지니어는 이 요구 사항을 충족하도록 모델을 재보정하기 위해 지표를 사용해야 합니다. 모델 재보정에 사용해야 할 지표는 무엇입니까?", "o": [{"k": "A", "t": "Accuracy", "kt": "정확도(Accuracy)"}, {"k": "B", "t": "Precision", "kt": "정밀도(Precision)"}, {"k": "C", "t": "Recall", "kt": "재현율(Recall)"}, {"k": "D", "t": "Specificity", "kt": "특이도(Specificity)"}], "a": ["A"], "ko": "정확도는 전체 예측 중 양성 라벨과 음성 라벨을 모두 포함해 올바르게 예측한 비율을 측정하는 지표입니다. 목표가 양성과 음성 라벨 모두에 대한 올바른 예측을 최대화하는 것이라면 정확도가 적절한 지표입니다. 다만 정확도는 클래스가 비교적 균형을 이룬다는 가정이 있을 때 특히 유용합니다. 클래스 불균형이 심한 경우에는 구체적인 목적에 따라 정밀도, 재현율 또는 특이도와 같은 다른 지표가 더 적합할 수 있습니다. 이 문제에서는 양성과 음성 예측 모두의 전체적인 정답 비율을 높이는 것이 목표이므로 정확도인 A안이 정답입니다.", "en": "Accuracy measures the proportion of correctly predicted labels (both positive and negative) out of the total predictions. It is the appropriate metric when the goal is to maximize the correct predictions of both positive and negative labels. However, it assumes that the classes are balanced; if the classes are imbalanced, other metrics like precision, recall, or specificity may be more relevant depending on the specific needs."}, {"n": 169, "t": "single", "q": "A company has used Amazon SageMaker to deploy a predictive ML model in production. The company is using SageMaker Model Monitor on the model. After a model update, an ML engineer notices data quality issues in the Model Monitor checks. What should the ML engineer do to mitigate the data quality issues that Model Monitor has identified?", "kq": "어떤 회사가 Amazon SageMaker를 사용해 예측 ML 모델을 운영 환경에 배포했습니다. 회사는 이 모델에 SageMaker Model Monitor를 사용하고 있습니다. 모델 업데이트 후 ML 엔지니어가 Model Monitor 점검에서 데이터 품질 문제를 발견했습니다. Model Monitor가 식별한 데이터 품질 문제를 완화하려면 어떻게 해야 합니까?", "o": [{"k": "A", "t": "Adjust the model's parameters and hyperparameters.", "kt": "모델의 파라미터와 하이퍼파라미터를 조정합니다."}, {"k": "B", "t": "Initiate a manual Model Monitor job that uses the most recent production data.", "kt": "가장 최근의 운영 데이터를 사용하는 Model Monitor 작업을 수동으로 시작합니다."}, {"k": "C", "t": "Create a new baseline from the latest dataset. Update Model Monitor to use the new baseline for evaluations.", "kt": "최신 데이터셋으로 새 기준선(baseline)을 만듭니다. 평가에 새 기준선을 사용하도록 Model Monitor를 업데이트합니다."}, {"k": "D", "t": "Include additional data in the existing training set for the model. Retrain and redeploy the model.", "kt": "모델의 기존 학습 세트에 추가 데이터를 포함시킵니다. 모델을 재학습시켜 재배포합니다."}], "a": ["C"], "ko": "Model Monitor가 데이터 품질 문제를 식별한 경우, 원래 기준선과 비교했을 때 현재 운영 데이터의 분포가 변화했기 때문일 수 있습니다. 최신 운영 데이터를 사용해 새로운 기준선을 만들고 Model Monitor가 이 기준선을 기준으로 평가하도록 업데이트하면, 모니터링이 현재 데이터 패턴과 더 잘 맞게 됩니다. 이 접근 방식은 불필요한 오탐을 줄이고, 모델을 즉시 재학습하지 않더라도 변경된 데이터 특성을 반영할 수 있게 합니다. 따라서 최신 데이터셋으로 새 기준선을 생성하고 Model Monitor가 해당 기준선을 사용하도록 업데이트하는 C안이 적절합니다.", "en": "When Model Monitor identifies data quality issues, it might be due to a shift in the data distribution compared to the original baseline. By creating a new baseline using the most recent production data and updating Model Monitor to evaluate against this baseline, the ML engineer ensures that the monitoring is aligned with the current data patterns. This approach mitigates false positives and reflects the updated data characteristics without immediately retraining the model."}, {"n": 171, "t": "match", "q": "A company wants to evaluate a new ML model architecture to understand its performance before deploying the model to production. The company wants to use Amazon SageMaker AI shadow testing. The company needs to analyze the performance metrics of the shadow model and the production model without affecting the existing production endpoint. The analysis must use real-time inference requests. Select and order the correct steps to implement shadow testing and compare the model variants in SageMaker AI. Select each step one time or not at all (Select and order Three)", "kq": "어떤 회사가 새로운 ML 모델 아키텍처를 운영 환경에 배포하기 전에 성능을 파악하기 위해 평가하려고 합니다. 회사는 Amazon SageMaker AI 섀도 테스트를 사용하려고 합니다. 회사는 기존 운영 엔드포인트에 영향을 주지 않으면서 섀도 모델과 운영 모델의 성능 지표를 분석해야 합니다. 분석에는 실시간 추론 요청을 사용해야 합니다. SageMaker AI에서 섀도 테스트를 구현하고 모델 변형을 비교할 올바른 단계를 선택해 순서대로 배치하세요. 각 단계는 한 번만 선택하거나 선택하지 않습니다. (3개 선택 및 순서 배치)", "p": ["Step 1", "Step 2", "Step 3"], "c": ["Create a new endpoint that includes the production model and the shadow model.", "Create a shadow test.", "Open the Amazon SageMaker Model Monitoring dashboard to access the production model and shadow model analytics.", "Update the existing endpoint with a shadow variant. Pick a suitable duration. Start the shadow test.", "Use the SageMaker shadow testing dashboard to analyze the performance differences between the variants."], "kp": ["1단계", "2단계", "3단계"], "kc": ["운영 모델과 섀도 모델을 모두 포함하는 새 엔드포인트를 만든다.", "섀도 테스트를 생성한다.", "운영 모델과 섀도 모델의 분석 정보를 확인하기 위해 Amazon SageMaker Model Monitoring 대시보드를 연다.", "기존 엔드포인트를 섀도 변형으로 업데이트한다. 적절한 기간을 선택한다. 섀도 테스트를 시작한다.", "SageMaker 섀도 테스트 대시보드를 사용해 변형 간 성능 차이를 분석한다."], "a": [3, 1, 4], "ko": "올바른 순서는 1단계: 기존 엔드포인트를 섀도 변형으로 업데이트하고 적절한 기간을 선택한 뒤 섀도 테스트를 시작하는 것입니다. 2단계: 섀도 테스트를 생성합니다. 3단계: SageMaker 섀도 테스트 대시보드를 사용해 프로덕션 변형과 섀도 변형 간의 성능 차이를 분석합니다. SageMaker 섀도 테스트는 기존 프로덕션 엔드포인트에 대해 실행할 수 있으며, 프로덕션 변형은 계속 실제 추론 요청에 응답하는 동안 섀도 변형은 복제된 실시간 요청을 받지만 사용자에게 응답을 반환하지 않습니다. 따라서 운영 엔드포인트에 영향을 주지 않고 실제 추론 트래픽으로 새 모델을 분석해야 한다는 요구 사항을 충족합니다. 또한 SageMaker 섀도 테스트 대시보드는 지연 시간, 오류율 등 프로덕션 및 섀도 변형의 지표를 나란히 비교할 수 있게 제공합니다. 기존 프로덕션 엔드포인트에 영향을 주지 않아야 하므로 새 엔드포인트를 만들어 프로덕션 모델과 섀도 모델을 포함하는 방식은 적절하지 않습니다. 이 시나리오에서 변형 비교에 사용하는 기능은 Model Monitoring 대시보드가 아니라 SageMaker 섀도 테스트 대시보드입니다.", "en": "Step 1: Update the existing endpoint with a shadow variant. Pick a suitable duration. Start the shadow test. Step 2: Create a shadow test. Step 3: Use the SageMaker shadow testing dashboard to analyze the performance differences between the variants. This is the correct order because SageMaker shadow testing can run against an existing production endpoint. The production variant continues to receive and respond to inference requests, while the shadow variant receives replicated real-time requests but does not return responses to users. That satisfies the requirement to analyze the new model with real inference traffic without affecting the production endpoint. AWS also states that the SageMaker shadow testing dashboard provides side- by-side comparison metrics for the production and shadow variants, such as latency and error rate. Do not choose \"Create a new endpoint that includes the production model and the shadow model,\" because the question explicitly says the analysis must not affect the existing production endpoint. Also, do not use the Amazon SageMaker Model Monitoring dashboard here; the specific feature for comparing variants in this scenario is the SageMaker shadow testing dashboard."}, {"n": 172, "t": "single", "q": "A company is building an Amazon SageMaker AI pipeline for an ML model. The pipeline uses distributed processing and distributed training. An ML engineer needs to encrypt network communication between instances that run distributed jobs. The ML engineer configures the distributed jobs to run in a private VPC. What should the ML engineer do to meet the encryption requirement?", "kq": "어떤 회사가 ML 모델용 Amazon SageMaker AI 파이프라인을 구축하고 있습니다. 이 파이프라인은 분산 처리와 분산 학습을 사용합니다. ML 엔지니어는 분산 작업을 실행하는 인스턴스 간 네트워크 통신을 암호화해야 합니다. ML 엔지니어는 분산 작업이 프라이빗 VPC에서 실행되도록 구성했습니다. 암호화 요구 사항을 충족하려면 어떻게 해야 합니까?", "o": [{"k": "A", "t": "Enable network isolation.", "kt": "네트워크 격리(network isolation)를 활성화합니다."}, {"k": "B", "t": "Configure traffic encryption by using security groups.", "kt": "보안 그룹을 사용해 트래픽 암호화를 구성합니다."}, {"k": "C", "t": "Enable inter-container traffic encryption.", "kt": "컨테이너 간 트래픽 암호화(inter-container traffic encryption)를 활성화합니다."}, {"k": "D", "t": "Enable VPC flow logs.", "kt": "VPC 흐름 로그를 활성화합니다."}], "a": ["C"], "ko": "Amazon SageMaker에서 분산 학습 및 분산 처리 작업은 여러 인스턴스가 네트워크를 통해 데이터를 교환하는 경우가 많습니다. 이러한 작업이 VPC 내부에서 실행되면 네트워크 트래픽은 사설망 안에 머물지만, 인스턴스 간 트래픽이 자동으로 암호화되는 것은 아닙니다. 규정 준수 또는 보안 요구 사항상 전송 중 데이터 암호화가 필요하다면 추가 설정이 필요합니다. 올바른 해결책은 인터컨테이너 트래픽 암호화를 활성화하는 것입니다. 이 기능은 서로 다른 인스턴스에서 실행되는 컨테이너 간 모든 네트워크 통신을 TLS로 암호화합니다. 네트워크 격리는 컨테이너의 외부 네트워크 호출을 제한하는 기능이지 인스턴스 간 트래픽을 암호화하지 않습니다. 보안 그룹은 네트워크 접근과 흐름을 제어할 뿐 암호화를 제공하지 않습니다. VPC Flow Logs는 네트워크 트래픽 모니터링과 감사용 기능이지 암호화 기능이 아닙니다. 따라서 분산 SageMaker 작업에서 인스턴스 간 통신 암호화 요구 사항을 직접 충족하는 유일한 방법은 인터컨테이너 트래픽 암호화를 활성화하는 것입니다.", "en": "In Amazon SageMaker, distributed training and distributed processing jobs often involve multiple instances exchanging data over the network. By default, when these jobs run inside a VPC, network traffic remains private but is not automatically encrypted between instances. When compliance or security requirements mandate encryption of in-transit data, additional configuration is required. The correct solution is to enable inter-container traffic encryption, which ensures that all network communication between containers running on different instances is encrypted using TLS. Amazon SageMaker provides a built-in feature for this purpose. When inter-container traffic encryption is enabled, SageMaker automatically configures secure communication channels between all nodes participating in a distributed job, including training clusters and processing jobs. Option A (Network isolation) is incorrect because network isolation prevents containers from making outbound network calls and accessing the internet. It does not encrypt traffic between instances. Option B (Security groups) is incorrect because security groups control network access and traffic flow, not encryption. They can restrict which instances can communicate, but they do not provide data-in-transit encryption. Option D (VPC flow logs) is incorrect because VPC flow logs are used for monitoring and auditing network traffic, not for encrypting it. AWS documentation explicitly states that enabling inter-container traffic encryption is the recommended and supported approach for encrypting data exchanged between instances during distributed SageMaker jobs. This feature aligns with enterprise security best practices and regulatory requirements for protecting sensitive ML training data in transit. Therefore, Option C is the only solution that directly fulfills the encryption requirement for distributed SageMaker workloads."}, {"n": 173, "t": "single", "q": "An ML engineer is using Amazon SageMaker to train a deep learning model that requires distributed training. After some training attempts, the ML engineer observes that the instances are not performing as expected. The ML engineer identifies communication overhead between the training instances. What should the ML engineer do to MINIMIZE the communication overhead between the instances?", "kq": "ML 엔지니어가 분산 학습이 필요한 딥러닝 모델을 Amazon SageMaker에서 학습시키고 있습니다. 몇 차례 학습을 시도한 후 ML 엔지니어는 인스턴스들이 기대만큼 성능을 내지 못하는 것을 확인했습니다. ML 엔지니어는 학습 인스턴스 간 통신 오버헤드를 원인으로 파악했습니다. 인스턴스 간 통신 오버헤드를 최소화하려면 어떻게 해야 합니까?", "o": [{"k": "A", "t": "Place the instances in the same VPC subnet. Store the data in a different AWS Region from where the instances are deployed.", "kt": "인스턴스를 같은 VPC 서브넷에 배치합니다. 데이터는 인스턴스가 배포된 곳과 다른 AWS 리전에 저장합니다."}, {"k": "B", "t": "Place the instances in the same VPC subnet but in different Availability Zones. Store the data in a different AWS Region from where the instances are deployed.", "kt": "인스턴스를 같은 VPC 서브넷에 두되 서로 다른 가용 영역에 배치합니다. 데이터는 인스턴스가 배포된 곳과 다른 AWS 리전에 저장합니다."}, {"k": "C", "t": "Place the instances in the same VPC subnet. Store the data in the same AWS Region and Availability Zone where the instances are deployed.", "kt": "인스턴스를 같은 VPC 서브넷에 배치합니다. 데이터는 인스턴스가 배포된 것과 같은 AWS 리전 및 가용 영역에 저장합니다."}, {"k": "D", "t": "Place the instances in the same VPC subnet. Store the data in the same AWS Region but in a different Availability Zone from where the instances are deployed.", "kt": "인스턴스를 같은 VPC 서브넷에 배치합니다. 데이터는 같은 AWS 리전에 저장하되 인스턴스가 배포된 곳과 다른 가용 영역에 저장합니다."}], "a": ["C"], "ko": "분산 학습 중 통신 오버헤드를 최소화하려면 학습 인스턴스를 동일한 VPC 서브넷에 배치하고, 데이터도 인스턴스가 배포된 동일한 AWS 리전 및 가용 영역에 저장하는 것이 가장 적절합니다. 동일한 서브넷은 인스턴스 간 네트워크 지연 시간을 줄이고, 동일한 리전과 가용 영역은 교차 가용 영역 또는 교차 리전 통신으로 인한 추가 지연과 비용을 줄입니다. 또한 학습 데이터가 동일한 리전과 가용 영역에 있으면 데이터 접근 지연도 최소화됩니다. 따라서 인스턴스 간 통신 효율을 최적화하고 학습 중 오버헤드를 줄이려면 C안이 가장 적절합니다.", "en": "To minimize communication overhead during distributed training: 1. Same VPC Subnet: Ensures low-latency communication between training instances by keeping the network traffic within a single subnet. 2. Same AWS Region and Availability Zone: Reduces network latency further because cross-AZ communication incurs additional latency and costs. 3. Data in the Same Region and AZ: Ensures that the training data is accessed with minimal latency, improving performance during training. This configuration optimizes communication efficiency and minimizes overhead."}, {"n": 174, "t": "single", "q": "A company is developing a customer support AI assistant by using an Amazon Bedrock Retrieval Augmented Generation (RAG) pipeline. The AI assistant retrieves articles from a knowledge base stored in Amazon S3. The company uses Amazon OpenSearch Service to index the knowledge base. The AI assistant uses an Amazon Bedrock Titan Embeddings model for vector search. The company wants to improve the relevance of the retrieved articles to improve the quality of the AI assistant's answers. Which solution will meet these requirements?", "kq": "어떤 회사가 Amazon Bedrock RAG(검색 증강 생성) 파이프라인을 사용해 고객 지원 AI 어시스턴트를 개발하고 있습니다. 이 AI 어시스턴트는 Amazon S3에 저장된 지식 기반에서 문서를 검색합니다. 회사는 지식 기반을 인덱싱하기 위해 Amazon OpenSearch Service를 사용합니다. AI 어시스턴트는 벡터 검색에 Amazon Bedrock Titan Embeddings 모델을 사용합니다. 회사는 AI 어시스턴트 답변의 품질을 높이기 위해 검색된 문서의 관련성을 개선하려고 합니다. 어떤 솔루션이 이러한 요구 사항을 충족할까요?", "o": [{"k": "A", "t": "Use auto-summarization on the retrieved articles by using Amazon SageMaker JumpStart.", "kt": "Amazon SageMaker JumpStart를 사용해 검색된 문서에 자동 요약을 적용합니다."}, {"k": "B", "t": "Use a reranker model before passing the articles to the foundation model (FM).", "kt": "문서를 파운데이션 모델(FM)에 전달하기 전에 리랭커(reranker) 모델을 사용합니다."}, {"k": "C", "t": "Use Amazon Athena to pre-filter the articles based on metadata before retrieval.", "kt": "검색 전에 Amazon Athena로 메타데이터를 기준으로 문서를 사전 필터링합니다."}, {"k": "D", "t": "Use Amazon Bedrock Provisioned Throughput to process queries more efficiently.", "kt": "쿼리를 더 효율적으로 처리하기 위해 Amazon Bedrock Provisioned Throughput을 사용합니다."}], "a": ["B"], "ko": "RAG 아키텍처에서는 검색 품질이 응답 정확도에 직접적인 영향을 미칩니다. Bedrock 및 OpenSearch 관련 AWS 문서에서는 초기 벡터 검색 이후 관련성을 높이기 위해 리랭커 모델을 사용하는 방식을 강조합니다. 벡터 검색은 임베딩 유사도를 기준으로 문서를 가져오지만, 상위 검색 결과가 항상 문맥적으로 가장 관련성이 높은 것은 아닙니다. 리랭커 모델은 검색된 문서를 사용자 질의와 비교해 의미적 관련성 기준으로 다시 정렬한 뒤 기반 모델에 전달합니다. 자동 요약은 가독성을 높일 수는 있지만 검색 관련성을 개선하지는 않습니다. Athena로 사전 필터링하면 검색 전 후보를 줄일 수 있지만 재현율이 낮아질 수 있습니다. Provisioned Throughput은 처리 성능을 높이는 기능이지 관련성을 개선하는 기능이 아닙니다. 따라서 RAG 시스템에서 답변 품질을 개선하기 위한 모범 사례는 리랭커 모델을 사용하는 B안입니다.", "en": "In a Retrieval Augmented Generation (RAG) architecture, retrieval quality directly impacts response accuracy. AWS documentation for Bedrock and OpenSearch highlights the use of reranker models to improve relevance after initial vector search retrieval. Vector search retrieves documents based on embedding similarity, but the top results are not always the most contextually relevant. A reranker model evaluates the retrieved documents against the user query and reorders them based on semantic relevance before sending them to the foundation model. Option A improves readability but does not improve retrieval relevance. Option C filters data before retrieval, which can reduce recall. Option D improves performance, not relevance. AWS explicitly recommends reranking as a best practice for improving answer quality in RAG systems. Therefore, Option B is the correct solution."}, {"n": 175, "t": "single", "q": "An ML engineer receives datasets that contain missing values, duplicates, and extreme outliers. The ML engineer must consolidate these datasets into a single data frame and must prepare the data for ML. Which solution will meet these requirements?", "kq": "ML 엔지니어가 결측값, 중복, 극단적 이상치가 포함된 데이터셋들을 받았습니다. ML 엔지니어는 이 데이터셋들을 하나의 데이터 프레임으로 통합하고 ML을 위해 데이터를 준비해야 합니다. 어떤 솔루션이 이러한 요구 사항을 충족할까요?", "o": [{"k": "A", "t": "Use Amazon SageMaker Data Wrangler to import the datasets and to consolidate them into a single data frame. Use the cleansing and enrichment functionalities to prepare the data.", "kt": "Amazon SageMaker Data Wrangler로 데이터셋을 가져와 하나의 데이터 프레임으로 통합합니다. 정제 및 보강 기능으로 데이터를 준비합니다."}, {"k": "B", "t": "Use Amazon SageMaker Ground Truth to import the datasets and to consolidate them into a single data frame. Use the human-in-the-loop capability to prepare the data.", "kt": "Amazon SageMaker Ground Truth로 데이터셋을 가져와 하나의 데이터 프레임으로 통합합니다. 휴먼 인 더 루프(human-in-the-loop) 기능으로 데이터를 준비합니다."}, {"k": "C", "t": "Manually import and merge the datasets. Consolidate the datasets into a single data frame. Use Amazon Q Developer to generate code snippets that will prepare the data.", "kt": "데이터셋을 수동으로 가져와 병합합니다. 하나의 데이터 프레임으로 통합합니다. Amazon Q Developer로 데이터 준비 코드 스니펫을 생성합니다."}, {"k": "D", "t": "Manually import and merge the datasets. Consolidate the datasets into a single data frame. Use Amazon SageMaker data labeling to prepare the data.", "kt": "데이터셋을 수동으로 가져와 병합합니다. 하나의 데이터 프레임으로 통합합니다. Amazon SageMaker 데이터 레이블링으로 데이터를 준비합니다."}], "a": ["A"], "ko": "Amazon SageMaker Data Wrangler는 ML용 데이터셋을 가져오고 통합하며 준비하기 위한 종합적인 솔루션입니다. Data Wrangler는 결측값, 중복값, 이상치를 처리할 수 있는 내장 정리 및 보강 기능을 제공하므로, ML 엔지니어가 여러 데이터셋을 하나의 데이터 프레임으로 통합하고 최소한의 수작업으로 데이터를 효율적으로 준비할 수 있습니다. Ground Truth는 데이터 라벨링용 서비스이고, 수동 병합 후 코드 생성 또는 데이터 라벨링 기능을 사용하는 방식은 운영 부담이 더 큽니다. 따라서 Data Wrangler를 사용해 데이터셋을 가져오고 통합한 뒤 정리 및 보강 기능으로 데이터를 준비하는 A안이 정답입니다.", "en": "Amazon SageMaker Data Wrangler provides a comprehensive solution for importing, consolidating, and preparing datasets for ML. It offers tools to handle missing values, duplicates, and outliers through its built-in cleansing and enrichment functionalities, allowing the ML engineer to efficiently prepare the data in a single environment with minimal manual effort."}, {"n": 176, "t": "single", "q": "An ML engineering team has a data processing pipeline that ingests sensor data from IoT devices into an Amazon S3 bucket. The pipeline then processes the data by using AWS Glue extract, transform, and load (ETL) jobs for ML modeling. The team noticed throttling errors in the ETL jobs. The data ingestion process has also been slower than normal. What is the cause of the problem?", "kq": "어떤 ML 엔지니어링 팀이 IoT 디바이스의 센서 데이터를 Amazon S3 버킷으로 수집하는 데이터 처리 파이프라인을 운영하고 있습니다. 이 파이프라인은 ML 모델링을 위해 AWS Glue ETL 작업으로 데이터를 처리합니다. 팀은 ETL 작업에서 쓰로틀링 오류를 발견했습니다. 데이터 수집 프로세스도 평소보다 느려졌습니다. 이 문제의 원인은 무엇입니까?", "o": [{"k": "A", "t": "The AWS Glue service quotas have been reached.", "kt": "AWS Glue 서비스 할당량에 도달했습니다."}, {"k": "B", "t": "The network bandwidth between the IoT devices and the AWS Region is insufficient.", "kt": "IoT 디바이스와 AWS 리전 간 네트워크 대역폭이 부족합니다."}, {"k": "C", "t": "The AWS Glue ETL jobs are not optimized for parallel processing.", "kt": "AWS Glue ETL 작업이 병렬 처리에 최적화되어 있지 않습니다."}, {"k": "D", "t": "The AWS Glue execution role is missing Amazon S3 permissions.", "kt": "AWS Glue 실행 역할에 Amazon S3 권한이 없습니다."}], "a": ["A"], "ko": "정답은 A입니다. AWS Glue 서비스 할당량에 도달했기 때문입니다. AWS Glue는 ML 데이터 준비 파이프라인에서 모델 학습 또는 특성 엔지니어링 전에 ETL 작업을 수행하는 데 자주 사용됩니다. Glue 워크로드가 계정 또는 리전 수준 서비스 할당량을 초과하면 작업이 지연되거나 큐에 쌓이거나 제한되거나 실패할 수 있습니다. 문제의 핵심 단서는 ETL 작업에서 throttling errors가 발생했다는 점입니다. AWS Glue API 요청은 서비스 성능 유지를 위해 계정 및 리전 단위로 제한될 수 있습니다. 많은 작업을 동시에 실행하거나 대량의 센서 데이터를 처리하거나 너무 많은 Glue 작업 실행을 동시에 시작하면 허용된 할당량을 초과해 throttling이 발생할 수 있습니다. 네트워크 대역폭 부족은 S3 수집 속도 저하는 설명할 수 있지만 Glue ETL throttling 오류를 직접 설명하지는 못합니다. 병렬 처리 최적화 부족은 긴 실행 시간의 원인이 될 수 있지만 서비스 수준 throttling의 직접 원인은 아닙니다. S3 권한 부족은 일반적으로 access denied 또는 권한 오류를 발생시키며 throttling이 아닙니다. 따라서 가장 가능성 높은 원인은 동시 작업 실행, API 속도 제한, DPU 용량 등 AWS Glue 서비스 할당량에 도달한 것입니다.", "en": "The correct answer is A. The AWS Glue service quotas have been reached. AWS Glue is commonly used in ML data preparation pipelines to perform ETL operations before model training or feature engineering. When AWS Glue workloads exceed account-level or Region-level service quotas, jobs can be delayed, queued, throttled, or fail. AWS documentation states that AWS Glue has service quotas, also called limits, for resources and operations in each account and Region. These include quotas for concurrent compute capacity measured in DPUs, crawlers, jobs, triggers, queued job runs, and other Glue resources. The key clue in the question is \"throttling errors in the ETL jobs.\" AWS specifically explains that Glue API requests are throttled on a per-account, per-Region basis to maintain service performance. If the team is running many jobs, processing a large amount of sensor data, or starting too many Glue job runs concurrently, the workload can exceed the permitted quota and cause throttling. Option B is less likely because insufficient network bandwidth between IoT devices and the AWS Region would mainly explain slower ingestion into S3, but it would not directly explain AWS Glue ETL throttling errors. Option C might cause poor job performance, but lack of parallel optimization usually causes long runtimes, not service-level throttling. Option D is incorrect because missing Amazon S3 permissions would typically cause access-denied or authorization failures, not throttling. Therefore, the best cause is that the AWS Glue service quotas, such as concurrent job runs, API rate limits, or DPU capacity limits, have been reached."}, {"n": 177, "t": "match", "q": "An ML engineer needs to choose the most appropriate data format for various data uses. Different teams will access the data for analytics, ML, and reporting purposes. Select the correct data format from the following list to meet the requirements for each use case. Select each data format one time. (Select FOUR.)", "kq": "ML 엔지니어가 다양한 데이터 용도에 가장 적합한 데이터 형식을 선택해야 합니다. 여러 팀이 분석, ML, 보고 목적으로 이 데이터에 접근할 예정입니다. 아래 목록에서 각 사용 사례의 요구 사항에 맞는 데이터 형식을 선택하세요. 각 데이터 형식은 한 번만 선택합니다. (4개 선택)", "p": ["A company requires fast read performance to run complex analytical queries on large datasets. Most of the data is structured. The company needs to filter and aggregate data to minimize query response times and storage costs.", "A web application generates semi-structured log data in real time. The data needs to be stored in a flexible format that supports nested structures and can be ingested for further data analysis and ML.", "A company needs to export data to a spreadsheet for occasional analysis. The dataset is small and needs to be human-readable to build an ML model.", "A big data processing pipeline requires high compression and columnar storage. The data is structured and stored in Apache Hive. The pipeline is optimized for read-heavy workloads."], "c": ["CSV", "JSON", "ORC", "Parquet"], "kp": ["대규모 데이터셋에 복잡한 분석 쿼리를 실행하기 위해 빠른 읽기 성능이 필요하다. 데이터는 대부분 구조화되어 있다. 쿼리 응답 시간과 스토리지 비용을 최소화하기 위해 데이터를 필터링하고 집계해야 한다.", "웹 애플리케이션이 실시간으로 반정형 로그 데이터를 생성한다. 데이터는 중첩 구조를 지원하는 유연한 형식으로 저장되어야 하고, 추가 데이터 분석과 ML에 수집될 수 있어야 한다.", "간헐적인 분석을 위해 데이터를 스프레드시트로 내보내야 한다. 데이터셋은 작고, ML 모델을 만들기 위해 사람이 읽을 수 있어야 한다.", "빅데이터 처리 파이프라인이 높은 압축률과 컬럼 기반 스토리지를 요구한다. 데이터는 구조화되어 있고 Apache Hive에 저장되어 있다. 파이프라인은 읽기 중심 워크로드에 최적화되어 있다."], "kc": ["CSV", "JSON", "ORC", "Parquet"], "a": [3, 1, 0, 2], "ko": "가장 적절한 데이터 형식은 순서대로 Parquet, JSON, CSV, ORC입니다. Parquet는 대규모 구조화 데이터셋에 대한 복잡한 분석 쿼리에 가장 적합한 컬럼 기반 형식입니다. 컬럼 기반 저장 방식은 Amazon Athena, AWS Glue, Spark 같은 쿼리 엔진이 전체 행을 스캔하지 않고 필요한 컬럼만 읽을 수 있게 하므로, 필터링과 집계 성능을 높이고 쿼리 응답 시간 및 비용을 줄입니다. JSON은 유연하고 중첩된 구조를 지원하므로 반정형 실시간 로그, 애플리케이션 이벤트, 스키마가 변할 수 있는 데이터에 적합합니다. CSV는 간단한 행 기반 형식으로, 소규모 스프레드시트 내보내기나 사람이 직접 확인하는 간헐적 분석에 적합하지만 대규모 분석 성능에는 적합하지 않습니다. ORC는 Apache Hive 기반의 읽기 중심 빅데이터 파이프라인에 적합한 컬럼 기반 고성능 형식으로, 높은 압축률과 효율적인 읽기 성능을 제공합니다.", "en": "The best answers are Parquet, JSON, CSV, and ORC in that order. Parquet is the strongest choice for complex analytical queries over large structured datasets because it is a columnar format. Columnar storage allows query engines such as Amazon Athena, AWS Glue, and Spark to read only the columns required by the query instead of scanning full rows. AWS documentation states that Apache Parquet and ORC are columnar storage formats optimized for fast retrieval in analytical applications, and that column-level compression can reduce storage space and I/O during query processing. This directly matches the need to filter, aggregate, reduce query response time, and lower storage/query cost. JSON is correct for semi-structured real-time logs because JSON supports flexible and nested data structures. AWS Glue documentation describes JSON as a format for data structures with consistent shape but flexible contents and notes that it is not row-based or column-based. That makes it appropriate for application logs, event records, and evolving schemas used later for analytics or ML ingestion. CSV is correct for small spreadsheet exports and occasional human-readable analysis. AWS Glue describes CSV as a minimal, row-based data format. CSV is widely supported by spreadsheet tools and is easy for humans to inspect, but it is not ideal for large-scale analytical performance because it lacks efficient column pruning and rich schema support. ORC is correct for the Apache Hive read-heavy big data pipeline. ORC is a performance-oriented, column- based format, and it is strongly associated with Hive-based analytics workloads. It provides high compression and efficient reads, making it well suited for structured data in read-heavy big data pipelines."}, {"n": 178, "t": "single", "q": "An ML model is deployed in production. The model has performed well and has met its metric thresholds for months. An ML engineer who is monitoring the model observes a sudden degradation. The performance metrics of the model are now below the thresholds. What could be the cause of the performance degradation?", "kq": "어떤 ML 모델이 운영 환경에 배포되어 있습니다. 이 모델은 몇 달간 좋은 성능을 보이며 지표 임계값을 충족했습니다. 모델을 모니터링하던 ML 엔지니어가 갑작스러운 성능 저하를 관찰했습니다. 이제 모델의 성능 지표가 임계값 아래로 떨어졌습니다. 성능 저하의 원인은 무엇일 수 있습니까?", "o": [{"k": "A", "t": "Lack of training data", "kt": "학습 데이터 부족"}, {"k": "B", "t": "Drift in production data distribution", "kt": "운영 데이터 분포의 드리프트"}, {"k": "C", "t": "Compute resource constraints", "kt": "컴퓨팅 리소스 제약"}, {"k": "D", "t": "Model overfitting", "kt": "모델 과적합"}], "a": ["B"], "ko": "오랜 기간 안정적으로 동작하던 모델 성능이 갑자기 저하되는 것은 데이터 드리프트의 전형적인 징후입니다. AWS ML 문서에 따르면 운영 데이터 분포 드리프트는 들어오는 데이터의 통계적 속성이 학습 데이터셋과 비교해 시간이 지남에 따라 변하는 경우 발생합니다. 이러한 변화는 사용자 행동, 시장 상황, 계절적 추세, 상위 데이터 파이프라인 변경 등으로 인해 발생할 수 있습니다. 드리프트가 발생하면 모델이 학습한 패턴이 실제 운영 데이터와 더 이상 맞지 않아 정확도와 기타 성능 지표가 저하됩니다. 학습 데이터 부족이나 과적합은 보통 초기 학습 단계에서 나타나는 문제이지 몇 달간 안정적으로 운영된 뒤 갑자기 발생하는 문제는 아닙니다. 컴퓨팅 리소스 제약은 지연 시간에는 영향을 줄 수 있지만 지속적인 정확도 저하의 일반적 원인은 아닙니다. 따라서 관찰된 성능 저하의 가장 가능성 높은 원인은 운영 데이터 분포의 드리프트입니다.", "en": "A sudden drop in model performance after a long period of stability is a classic indicator of data drift. According to AWS ML documentation, production data distribution drift occurs when the statistical properties of incoming data change over time compared to the training dataset. This drift can be caused by changes in user behavior, market conditions, seasonal trends, or upstream data pipelines. When drift occurs, the model's learned patterns no longer align with real-world data, leading to degraded accuracy and other performance metrics. Lack of training data (Option A) and overfitting (Option D) are issues that typically manifest during initial training, not after months of stable production performance. Compute constraints (Option C) may affect latency but do not usually cause sustained accuracy degradation. AWS recommends using SageMaker Model Monitor to detect such drift and trigger retraining workflows. Therefore, drift in the production data distribution is the most likely cause of the observed performance degradation."}, {"n": 179, "t": "single", "q": "Case study An ML engineer is developing a fraud detection model on AWS. The training dataset includes transaction logs, customer profiles, and tables from an on-premises MySQL database. The transaction logs and customer profiles are stored in Amazon S3. The dataset has a class imbalance that affects the learning of the model's algorithm. Additionally, many of the features have interdependencies. The algorithm is not capturing all the desired underlying patterns in the data. The training dataset includes categorical data and numerical data. The ML engineer must prepare the training dataset to maximize the accuracy of the model. Which action will meet this requirement with the LEAST operational overhead?", "kq": "[사례 연구] ML 엔지니어가 AWS에서 사기 탐지 모델을 개발하고 있습니다. 학습 데이터셋에는 거래 로그, 고객 프로필, 그리고 온프레미스 MySQL 데이터베이스의 테이블들이 포함됩니다. 거래 로그와 고객 프로필은 Amazon S3에 저장되어 있습니다. 데이터셋에는 모델 알고리즘의 학습에 영향을 주는 클래스 불균형이 있습니다. 또한 많은 특성들이 서로 종속되어 있습니다. 알고리즘이 데이터에 내재된 패턴을 모두 포착하지 못하고 있습니다. 학습 데이터셋에는 범주형 데이터와 수치형 데이터가 모두 포함되어 있습니다. ML 엔지니어는 모델 정확도를 최대화하기 위해 학습 데이터셋을 준비해야 합니다. 어떤 조치가 최소한의 운영 오버헤드로 이 요구 사항을 충족할까요?", "o": [{"k": "A", "t": "Use AWS Glue to transform the categorical data into numerical data.", "kt": "AWS Glue를 사용해 범주형 데이터를 수치형 데이터로 변환합니다."}, {"k": "B", "t": "Use AWS Glue to transform the numerical data into categorical data.", "kt": "AWS Glue를 사용해 수치형 데이터를 범주형 데이터로 변환합니다."}, {"k": "C", "t": "Use Amazon SageMaker Data Wrangler to transform the categorical data into numerical data.", "kt": "Amazon SageMaker Data Wrangler를 사용해 범주형 데이터를 수치형 데이터로 변환합니다."}, {"k": "D", "t": "Use Amazon SageMaker Data Wrangler to transform the numerical data into categorical data.", "kt": "Amazon SageMaker Data Wrangler를 사용해 수치형 데이터를 범주형 데이터로 변환합니다."}], "a": ["C"], "ko": "범주형 데이터와 수치형 데이터가 모두 포함된 학습 데이터셋을 준비하는 것은 모델 정확도를 높이는 데 중요합니다. 대부분의 ML 알고리즘은 범주형 데이터를 직접 처리할 수 없으므로 숫자 형식으로 변환해야 합니다. Amazon SageMaker Data Wrangler는 300개 이상의 내장 데이터 변환 기능과 시각적 인터페이스를 제공하며, 범주형 변수 인코딩을 위한 도구도 포함합니다. ML 엔지니어는 S3나 온프레미스 데이터베이스 같은 소스에서 데이터를 가져오고, Data Wrangler의 데이터 유형 추론 기능으로 범주형 컬럼을 식별한 뒤, 원-핫 인코딩 또는 순서형 인코딩 같은 적절한 변환을 선택해 범주형 특성을 숫자 형식으로 변환할 수 있습니다. 이후 변환된 데이터셋을 검토하여 정확성과 완전성을 확인할 수 있습니다. Data Wrangler는 사용하기 쉬운 인터페이스와 다양한 데이터 소스 및 변환 기법을 지원하므로 운영 부담을 최소화하면서 데이터 준비를 효율적으로 수행할 수 있습니다. 따라서 SageMaker Data Wrangler로 범주형 데이터를 수치형 데이터로 변환하는 C안이 정답입니다.", "en": "Preparing a training dataset that includes both categorical and numerical data is essential for maximizing the accuracy of a machine learning model. Transforming categorical data into numerical format is a critical step, as most ML algorithms require numerical input. Why Transform Categorical Data into Numerical Data? Model Compatibility: Many ML algorithms cannot process categorical data directly and require numerical representations. Improved Performance: Proper encoding of categorical variables can enhance model accuracy and convergence speed. Why Use Amazon SageMaker Data Wrangler? Amazon SageMaker Data Wrangler offers a visual interface with over 300 built-in data transformations, including tools for encoding categorical variables. Implementation Steps: Import Data: Load the dataset into SageMaker Data Wrangler from sources like Amazon S3 or on-premises databases. Identify Categorical Features: Use Data Wrangler's data type inference to detect categorical columns. Apply Categorical Encoding: Choose appropriate encoding techniques (e.g., one-hot encoding or ordinal encoding) from Data Wrangler's transformation options. Apply the selected transformation to convert categorical features into numerical format. Validate Transformations: Review the transformed dataset to ensure accuracy and completeness. Advantages of Using SageMaker Data Wrangler: Ease of Use: Provides a user-friendly interface for data transformation without extensive coding. Operational Efficiency: Integrates data preparation steps, reducing the need for multiple tools and minimizing operational overhead. Flexibility: Supports various data sources and transformation techniques, accommodating diverse datasets. By utilizing SageMaker Data Wrangler to transform categorical data into numerical format, the ML engineer can efficiently prepare the dataset, thereby enhancing the model's accuracy with minimal operational overhead. Transform Data - Amazon SageMaker Prepare ML Data with Amazon SageMaker Data Wrangler"}, {"n": 180, "t": "single", "q": "A company wants to build an anomaly detection ML model. The model will use large-scale tabular data that is stored in an Amazon S3 bucket. The company does not have expertise in Python, Spark, or other languages for ML. An ML engineer needs to transform and prepare the data for ML model training. Which solution will meet these requirements?", "kq": "어떤 회사가 이상 탐지 ML 모델을 만들려고 합니다. 이 모델은 Amazon S3 버킷에 저장된 대규모 표 형식 데이터를 사용합니다. 회사에는 Python, Spark 등 ML용 언어에 대한 전문성이 없습니다. ML 엔지니어는 ML 모델 학습을 위해 데이터를 변환하고 준비해야 합니다. 어떤 솔루션이 이러한 요구 사항을 충족할까요?", "o": [{"k": "A", "t": "Prepare the data by using Amazon EMR Serverless applications that host Amazon SageMaker Studio notebooks.", "kt": "Amazon SageMaker Studio 노트북을 호스팅하는 Amazon EMR Serverless 애플리케이션으로 데이터를 준비합니다."}, {"k": "B", "t": "Prepare the data by using the Amazon SageMaker Data Wrangler visual interface in Amazon SageMaker Canvas.", "kt": "Amazon SageMaker Canvas의 Amazon SageMaker Data Wrangler 시각적 인터페이스로 데이터를 준비합니다."}, {"k": "C", "t": "Run SQL queries from a JupyterLab space in Amazon SageMaker Studio. Process the data further by using pandas DataFrames.", "kt": "Amazon SageMaker Studio의 JupyterLab 공간에서 SQL 쿼리를 실행합니다. pandas DataFrame으로 데이터를 추가 처리합니다."}, {"k": "D", "t": "Prepare the data by using a JupyterLab notebook in Amazon SageMaker Studio.", "kt": "Amazon SageMaker Studio의 JupyterLab 노트북으로 데이터를 준비합니다."}], "a": ["B"], "ko": "회사에 프로그래밍 전문성이 없으므로 노코드 또는 로우코드 솔루션이 필요합니다. Amazon SageMaker Canvas에는 Data Wrangler의 시각적 인터페이스가 포함되어 있어 사용자가 그래픽 워크플로를 통해 데이터를 가져오고 변환하며 준비할 수 있습니다. Canvas의 Data Wrangler는 결측값 처리, 정규화, 이상치 탐지, 특성 엔지니어링 등 일반적인 전처리 작업을 코드 없이 수행할 수 있으며, Amazon S3와 직접 통합되고 대규모 표 형식 데이터셋에도 적합합니다. EMR Serverless, JupyterLab, pandas 또는 일반 SageMaker Studio 노트북을 사용하는 다른 선택지는 Spark, SQL, Python 등 코딩 기술이 필요하므로 제약 조건에 맞지 않습니다. 따라서 SageMaker Canvas의 Data Wrangler 시각적 인터페이스를 사용하는 B안이 정답입니다.", "en": "The company lacks programming expertise, so a no-code/low-code solution is required. Amazon SageMaker Canvas includes Data Wrangler's visual interface, which enables users to import, transform, and prepare data using a graphical workflow. Data Wrangler in Canvas supports common preprocessing tasks-such as handling missing values, normalization, outlier detection, and feature engineering-without writing code. It integrates directly with Amazon S3 and is suitable for large tabular datasets. Options A, C, and D require coding skills (Spark, SQL, or Python), which violates the stated constraint. Therefore, using the visual interface of SageMaker Data Wrangler in Canvas is the correct solution."}, {"n": 181, "t": "single", "q": "An ML engineer wants to re-train an XGBoost model at the end of each month. A data team prepares the training data. The training dataset is a few hundred megabytes in size. When the data is ready, the data team stores the data as a new file in an Amazon S3 bucket. The ML engineer needs a solution to automate this pipeline. The solution must register the new model version in Amazon SageMaker Model Registry within 24 hours. Which solution will meet these requirements?", "kq": "ML 엔지니어가 매월 말에 XGBoost 모델을 재학습시키려고 합니다. 데이터 팀이 학습 데이터를 준비합니다. 학습 데이터셋의 크기는 수백 메가바이트입니다. 데이터가 준비되면 데이터 팀은 이를 Amazon S3 버킷에 새 파일로 저장합니다. ML 엔지니어는 이 파이프라인을 자동화할 솔루션이 필요합니다. 솔루션은 24시간 내에 새 모델 버전을 Amazon SageMaker Model Registry에 등록해야 합니다. 어떤 솔루션이 이러한 요구 사항을 충족할까요?", "o": [{"k": "A", "t": "Create an AWS Lambda function that runs one time each week to poll the S3 bucket for new files. Invoke the Lambda function asynchronously. Configure the Lambda function to start the pipeline if the function detects new data.", "kt": "주 1회 실행되어 S3 버킷에서 새 파일을 폴링하는 AWS Lambda 함수를 만듭니다. Lambda 함수를 비동기로 호출합니다. 새 데이터가 감지되면 파이프라인을 시작하도록 Lambda 함수를 구성합니다."}, {"k": "B", "t": "Create an Amazon CloudWatch rule that runs on a schedule to start the pipeline every 30 days.", "kt": "30일마다 파이프라인을 시작하도록 일정에 따라 실행되는 Amazon CloudWatch 규칙을 만듭니다."}, {"k": "C", "t": "Create an S3 Lifecycle rule to start the pipeline every time a new object is uploaded to the S3 bucket.", "kt": "S3 버킷에 새 객체가 업로드될 때마다 파이프라인을 시작하는 S3 Lifecycle 규칙을 만듭니다."}, {"k": "D", "t": "Create an Amazon EventBridge rule to start an AWS Step Functions TrainingStep every time a new object is uploaded to the S3 bucket.", "kt": "S3 버킷에 새 객체가 업로드될 때마다 AWS Step Functions TrainingStep을 시작하는 Amazon EventBridge 규칙을 만듭니다."}], "a": ["D"], "ko": "요구 사항은 Amazon S3에 새 데이터가 도착했을 때 이벤트 기반으로 자동화하고, 이후 학습과 모델 등록까지 수행하는 것입니다. Amazon EventBridge는 S3 객체 생성 이벤트를 기본적으로 지원하며, 새 파일이 업로드되면 downstream 워크플로를 즉시 트리거할 수 있습니다. EventBridge를 사용해 학습 단계와 SageMaker Model Registry 등록 단계를 포함한 AWS Step Functions 워크플로를 시작하면, 새 데이터 업로드 직후 파이프라인이 자동 실행되므로 24시간 이내 등록 요구 사항을 충분히 충족할 수 있습니다. A안은 불필요한 폴링과 지연을 발생시키며, B안은 시간 기반 실행이므로 데이터 준비 시점과 맞지 않을 수 있습니다. C안의 S3 Lifecycle 규칙은 객체 전환이나 만료를 관리하는 기능이지 워크플로 실행 기능이 아닙니다. 따라서 EventBridge로 Step Functions를 트리거하는 D안이 정답입니다.", "en": "The requirement is event-driven automation when new data arrives in Amazon S3, followed by training and model registration. Amazon EventBridge natively supports S3 object creation events and can trigger downstream workflows immediately. By using EventBridge to start an AWS Step Functions workflow that includes a training step and a SageMaker Model Registry registration step, the pipeline runs automatically as soon as new data is uploaded-well within the 24-hour requirement. Option A introduces unnecessary polling and delay. Option B is time-based and does not ensure alignment with data readiness. Option C is invalid because S3 Lifecycle rules manage object transitions, not workflow execution. There
