<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MLA-C01 문제은행</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --paper:#F2F4F7; --surface:#FFFFFF; --surface-2:#E9EDF2; --surface-3:#DFE5EC;
  --ink:#16212D; --ink-2:#4A5B6E; --ink-3:#7C8B9C;
  --line:#D3DAE3; --line-2:#BFC9D5;
  --accent:#C9600F; --accent-2:#A94E08; --accent-soft:#FBEEE1;
  --ok:#1B7A4B; --ok-soft:#E6F4EC; --ok-line:#A8D7BD;
  --bad:#B02A25; --bad-soft:#FAEAE9; --bad-line:#E6B5B2;
  --flag:#8A6100; --flag-soft:#FBF2DC;
  --shadow:0 1px 2px rgba(22,33,45,.06), 0 8px 24px -12px rgba(22,33,45,.18);
  --sans:"IBM Plex Sans KR",-apple-system,"Segoe UI","Malgun Gothic",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"Consolas",monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0E1620; --surface:#18212D; --surface-2:#202C3A; --surface-3:#283646;
    --ink:#E7EDF4; --ink-2:#A6B4C4; --ink-3:#77869a;
    --line:#2A3747; --line-2:#3A4A5D;
    --accent:#F09A4E; --accent-2:#FFB46E; --accent-soft:#2C2013;
    --ok:#56C68A; --ok-soft:#10261B; --ok-line:#2C5B41;
    --bad:#F0867F; --bad-soft:#2A1616; --bad-line:#5E2E2C;
    --flag:#D9AA53; --flag-soft:#251E10;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --paper:#0E1620; --surface:#18212D; --surface-2:#202C3A; --surface-3:#283646;
  --ink:#E7EDF4; --ink-2:#A6B4C4; --ink-3:#77869a;
  --line:#2A3747; --line-2:#3A4A5D;
  --accent:#F09A4E; --accent-2:#FFB46E; --accent-soft:#2C2013;
  --ok:#56C68A; --ok-soft:#10261B; --ok-line:#2C5B41;
  --bad:#F0867F; --bad-soft:#2A1616; --bad-line:#5E2E2C;
  --flag:#D9AA53; --flag-soft:#251E10;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);
     font-size:15px;line-height:1.6;display:flex;flex-direction:column;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- top bar ---------- */
.bar{flex:none;background:var(--surface);border-bottom:1px solid var(--line);
     padding-block:10px;padding-inline:16px;display:flex;flex-direction:column;gap:9px}
.bar-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:9px;margin-right:auto;min-width:0}
.brand b{font-size:15px;font-weight:700;letter-spacing:-.01em;white-space:nowrap}
.brand span{font-family:var(--mono);font-size:11px;color:var(--ink-3);letter-spacing:.04em;white-space:nowrap}
.tally{display:flex;gap:6px;font-family:var(--mono);font-size:11.5px;font-weight:500;
       font-variant-numeric:tabular-nums}
.tally i{font-style:normal;padding:3px 8px;border-radius:999px;border:1px solid transparent}
.t-ok{color:var(--ok);background:var(--ok-soft);border-color:var(--ok-line)!important}
.t-bad{color:var(--bad);background:var(--bad-soft);border-color:var(--bad-line)!important}
.t-left{color:var(--ink-2);background:var(--surface-2);border-color:var(--line)!important}
.tool{background:var(--surface-2);border:1px solid var(--line);border-radius:7px;
      padding:5px 11px;font-size:12.5px;font-weight:500;color:var(--ink-2);white-space:nowrap}
.tool:hover{border-color:var(--line-2);color:var(--ink)}
.tool[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.track{height:3px;background:var(--surface-3);border-radius:2px;overflow:hidden;display:flex}
.track i{display:block;height:100%}
.track .f-ok{background:var(--ok)}
.track .f-bad{background:var(--bad)}

/* ---------- stage ---------- */
main{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.stage{max-width:820px;margin:0 auto;padding:22px 16px 30px}
.qhead{display:flex;align-items:center;gap:9px;margin-bottom:12px;flex-wrap:wrap}
.qno{font-family:var(--mono);font-size:12px;font-weight:600;letter-spacing:.06em;
     color:var(--accent);font-variant-numeric:tabular-nums}
.badge{font-family:var(--mono);font-size:10.5px;font-weight:500;letter-spacing:.07em;
       text-transform:uppercase;color:var(--ink-3);border:1px solid var(--line);
       padding:2px 7px;border-radius:4px}
.flagbtn{margin-left:auto;background:none;border:1px solid var(--line);border-radius:7px;
         padding:4px 10px;font-size:12px;color:var(--ink-3)}
.flagbtn[aria-pressed="true"]{color:var(--flag);border-color:var(--flag);background:var(--flag-soft)}
.stem{font-size:16px;line-height:1.66;margin:0 0 6px;color:var(--ink);text-wrap:pretty}
.stem:last-of-type{margin-bottom:18px}
.stem-ko{font-size:15px;line-height:1.72;margin:0 0 18px;color:var(--ink-2);
         border-left:2px solid var(--accent);padding-left:12px;text-wrap:pretty}
.tx-ko{display:block;margin-top:5px;font-size:13.5px;line-height:1.6;color:var(--ink-2)}
.lab-ko{font-size:13.5px;line-height:1.6;color:var(--ink-2);
        border-left:2px solid var(--line-2);padding-left:9px}

/* ---------- options ---------- */
.opts{display:flex;flex-direction:column;gap:8px;list-style:none;margin:0;padding:0}
.opt{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:start;
     width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);
     border-radius:9px;padding:12px 13px;line-height:1.55;transition:border-color .12s,background .12s}
.opt:hover:not([disabled]){border-color:var(--line-2)}
.opt .k{font-family:var(--mono);font-size:12px;font-weight:600;width:22px;height:22px;
        display:grid;place-items:center;border-radius:5px;background:var(--surface-2);
        color:var(--ink-2);flex:none;margin-top:1px}
.opt .mk{font-family:var(--mono);font-size:13px;font-weight:600;opacity:0}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.opt[aria-pressed="true"] .k{background:var(--accent);color:#fff}
.opt.is-ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.is-ok .k{background:var(--ok);color:#fff}
.opt.is-ok .mk{opacity:1;color:var(--ok)}
.opt.is-bad{border-color:var(--bad);background:var(--bad-soft)}
.opt.is-bad .k{background:var(--bad);color:#fff}
.opt.is-bad .mk{opacity:1;color:var(--bad)}
.opt[disabled]{cursor:default}

/* ---------- match rows ---------- */
.rows{display:flex;flex-direction:column;gap:10px}
.row{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:12px 13px;
     display:grid;gap:9px}
.row.is-ok{border-color:var(--ok);background:var(--ok-soft)}
.row.is-bad{border-color:var(--bad);background:var(--bad-soft)}
.row .lab{font-size:14.5px;line-height:1.55;color:var(--ink)}
.row .lab.step{font-family:var(--mono);font-size:12px;font-weight:600;letter-spacing:.06em;
               text-transform:uppercase;color:var(--ink-3)}
.row select{width:100%;font:inherit;font-size:14px;color:var(--ink);background:var(--surface-2);
            border:1px solid var(--line-2);border-radius:7px;padding:9px 10px;
            appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink-3) 50%),linear-gradient(135deg,var(--ink-3) 50%,transparent 50%);
            background-position:calc(100% - 17px) calc(50% + 1px),calc(100% - 12px) calc(50% + 1px);
            background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:34px}
.row select:disabled{opacity:1;color:var(--ink-2)}
.fix{font-size:13px;color:var(--ok);display:flex;gap:7px;align-items:baseline}
.fix b{font-family:var(--mono);font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;
       color:var(--ink-3);flex:none}

/* ---------- verdict + explanation ---------- */
.actions{display:flex;gap:9px;margin-top:20px;flex-wrap:wrap}
.btn{border-radius:8px;padding:10px 18px;font-size:14px;font-weight:600;border:1px solid transparent}
.btn-a{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn-a:hover{background:var(--accent-2);border-color:var(--accent-2)}
.btn-a[disabled]{opacity:.45;cursor:default}
.btn-g{background:var(--surface);border-color:var(--line);color:var(--ink-2)}
.btn-g:hover{border-color:var(--line-2);color:var(--ink)}

.verdict{margin-top:22px;border-top:2px solid var(--line);padding-top:16px}
.vline{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.vtag{font-family:var(--mono);font-size:12px;font-weight:600;letter-spacing:.06em;
      padding:4px 10px;border-radius:6px;text-transform:uppercase}
.vtag.ok{color:var(--ok);background:var(--ok-soft);border:1px solid var(--ok-line)}
.vtag.bad{color:var(--bad);background:var(--bad-soft);border:1px solid var(--bad-line)}
.vtag.idle{color:var(--ink-2);background:var(--surface-2);border:1px solid var(--line)}
.vans{font-family:var(--mono);font-size:13.5px;font-weight:600;color:var(--ink)}
.vans em{font-style:normal;color:var(--ink-3);font-weight:400}
.exp{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--accent);
     border-radius:0 9px 9px 0;padding:15px 17px}
.exp h3{margin:0 0 9px;font-size:11px;font-family:var(--mono);font-weight:600;letter-spacing:.1em;
        text-transform:uppercase;color:var(--accent)}
.exp p{margin:0;font-size:14.5px;line-height:1.78;color:var(--ink-2);text-wrap:pretty}
details.en{margin-top:11px;border-top:1px dashed var(--line);padding-top:10px}
details.en summary{font-family:var(--mono);font-size:11px;font-weight:500;letter-spacing:.07em;
                   text-transform:uppercase;color:var(--ink-3);cursor:pointer;list-style:none}
details.en summary::-webkit-details-marker{display:none}
details.en summary::before{content:"▸ ";color:var(--ink-3)}
details.en[open] summary::before{content:"▾ "}
details.en p{margin:9px 0 0;font-size:13.5px;line-height:1.72;color:var(--ink-3)}

/* ---------- bottom nav ---------- */
.nav{flex:none;background:var(--surface);border-top:1px solid var(--line);
     padding:9px 16px;padding-bottom:calc(9px + env(safe-area-inset-bottom,0px));
     display:flex;align-items:center;gap:9px}
.nav .pos{font-family:var(--mono);font-size:12px;color:var(--ink-3);margin:0 auto;
          font-variant-numeric:tabular-nums;letter-spacing:.03em}
.nb{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;
    padding:8px 15px;font-size:13.5px;font-weight:500}
.nb:hover:not([disabled]){border-color:var(--line-2)}
.nb[disabled]{opacity:.4;cursor:default}

/* ---------- grid overlay ---------- */
.sheet{position:fixed;inset:0;background:rgba(14,22,32,.55);z-index:20;
       display:flex;align-items:flex-end;justify-content:center}
.sheet[hidden]{display:none}
.panel{background:var(--paper);width:100%;max-width:860px;max-height:86%;
       border-radius:14px 14px 0 0;display:flex;flex-direction:column;
       box-shadow:var(--shadow);border:1px solid var(--line);border-bottom:0}
.panel-h{padding:15px 18px 12px;border-bottom:1px solid var(--line);display:flex;
         align-items:center;gap:10px;flex-wrap:wrap}
.panel-h b{font-size:14.5px;margin-right:auto}
.panel-b{overflow-y:auto;padding:15px 18px calc(20px + env(safe-area-inset-bottom,0px))}
.cells{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:6px}
.cell{font-family:var(--mono);font-size:12px;font-weight:500;padding:8px 2px;border-radius:6px;
      border:1px solid var(--line);background:var(--surface);color:var(--ink-2);
      font-variant-numeric:tabular-nums;position:relative}
.cell:hover{border-color:var(--line-2)}
.cell.c-ok{background:var(--ok-soft);border-color:var(--ok-line);color:var(--ok)}
.cell.c-bad{background:var(--bad-soft);border-color:var(--bad-line);color:var(--bad)}
.cell.c-now{outline:2px solid var(--accent);outline-offset:1px}
.cell.c-flag::after{content:"";position:absolute;top:3px;right:3px;width:5px;height:5px;
                    border-radius:50%;background:var(--flag)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-family:var(--mono);font-size:11px;
        color:var(--ink-3);margin-top:14px;letter-spacing:.03em}
.legend span{display:flex;align-items:center;gap:5px}
.legend i{width:9px;height:9px;border-radius:3px;border:1px solid var(--line);display:block}
.empty{color:var(--ink-3);font-size:14px;padding:14px 2px}

body{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (max-width:600px){
  .stage{padding:18px 16px 26px}
  .stem{font-size:15px}
  .brand span{display:none}
  .opt{padding:11px 12px;gap:10px}
}
</style>
</head>
<body>
<header class="bar">
  <div class="bar-row">
    <div class="brand">
      <b>MLA-C01 문제풀이</b>
      <span id="brandsub">AWS ML Engineer · Associate</span>
    </div>
    <div class="tally" id="tally"></div>
  </div>
  <div class="bar-row">
    <button class="tool" id="btnGrid">문항 목록</button>
    <button class="tool" id="btnFilter">필터: 전체</button>
    <button class="tool" id="btnTrans" aria-pressed="true">문제 번역</button>
    <button class="tool" id="btnShuffle" aria-pressed="false">섞기</button>
    <button class="tool" id="btnReveal">해설 먼저 보기</button>
    <button class="tool" id="btnTheme">테마</button>
    <button class="tool" id="btnReset">기록 초기화</button>
  </div>
  <div class="track" id="track"><i class="f-ok" style="width:0"></i><i class="f-bad" style="width:0"></i></div>
</header>

<main id="main"><div class="stage" id="stage"></div></main>

<nav class="nav">
  <button class="nb" id="prev">← 이전</button>
  <span class="pos" id="pos"></span>
  <button class="nb" id="next">다음 →</button>
</nav>

<div class="sheet" id="sheet" hidden>
  <div class="panel" role="dialog" aria-modal="true" aria-label="문항 목록">
    <div class="panel-h">
      <b>문항 목록</b>
      <button class="tool" id="jumpUnseen">안 푼 문제로</button>
      <button class="tool" id="jumpWrong">틀린 문제로</button>
      <button class="tool" id="sheetClose">닫기</button>
    </div>
    <div class="panel-b">
      <div class="cells" id="cells"></div>
      <div class="legend">
        <span><i style="background:var(--surface)"></i>안 품</span>
        <span><i style="background:var(--ok-soft);border-color:var(--ok-line)"></i>정답</span>
        <span><i style="background:var(--bad-soft);border-color:var(--bad-line)"></i>오답</span>
        <span><i style="background:var(--flag)"></i>북마크</span>
      </div>
    </div>
  </div>
</div>

<script>
const Q = [{"n": 1, "t": "single", "q": "An ML engineer wants to run a training job on Amazon SageMaker AI. The training job will train a neural network by using multiple GPUs. The training dataset is stored in Parquet format. The ML engineer discovered that the Parquet dataset contains files too large to fit into the memory of the SageMaker AI training instances. Which solution will fix the memory problem?", "kq": "ML 엔지니어가 Amazon SageMaker AI에서 학습 작업을 실행하려고 합니다. 이 학습 작업은 여러 개의 GPU를 사용해 신경망을 학습시킵니다. 학습 데이터셋은 Parquet 형식으로 저장되어 있습니다. ML 엔지니어는 이 Parquet 데이터셋에 SageMaker AI 학습 인스턴스의 메모리에 담기에는 너무 큰 파일들이 포함되어 있다는 것을 발견했습니다. 메모리 문제를 해결할 수 있는 방법은 무엇입니까?", "o": [{"k": "A", "t": "Attach an Amazon Elastic Block Store (Amazon EBS) Provisioned IOPS SSD volume to the instance. Store the files in the EBS volume.", "kt": "인스턴스에 Amazon EBS Provisioned IOPS SSD 볼륨을 연결합니다. 파일을 해당 EBS 볼륨에 저장합니다."}, {"k": "B", "t": "Repartition the Parquet files by using Apache Spark on Amazon EMR. Use the repartitioned files for the training job.", "kt": "Amazon EMR에서 Apache Spark를 사용해 Parquet 파일을 다시 파티셔닝합니다. 재파티셔닝된 파일을 학습 작업에 사용합니다."}, {"k": "C", "t": "Change the instance type to Memory Optimized instances with sufficient memory for the training job.", "kt": "인스턴스 유형을 학습 작업에 충분한 메모리를 갖춘 메모리 최적화 인스턴스로 변경합니다."}, {"k": "D", "t": "Use the SageMaker AI distributed data parallelism (SMDDP) library with multiple instances to split the memory usage.", "kt": "SageMaker AI 분산 데이터 병렬 처리(SMDDP) 라이브러리를 여러 인스턴스와 함께 사용해 메모리 사용량을 분산합니다."}], "a": ["B"], "ko": "문제의 원인은 Parquet 파일의 크기가 너무 커서 SageMaker AI 학습 인스턴스의 메모리에 효율적으로 로드할 수 없다는 점입니다. 가장 효과적이고 확장 가능한 해결책은 데이터셋을 더 작은 Parquet 파일로 다시 파티셔닝하는 것입니다. AWS의 대규모 ML 학습 모범 사례에서는 단순히 메모리를 늘리는 것보다 데이터 레이아웃을 최적화할 것을 권장합니다. Amazon EMR에서 Apache Spark를 사용하면 ML 엔지니어가 Parquet 파일을 더 작은 청크로 재파티셔닝할 수 있으며, 이렇게 재구성된 파일은 SageMaker 학습 작업에서 효율적으로 스트리밍 및 처리될 수 있습니다. EBS 볼륨을 연결하는 A안은 저장 용량을 늘릴 뿐 메모리 제약 문제를 해결하지 못합니다. 메모리 최적화 인스턴스로 변경하는 C안은 비용을 증가시키며 장기적인 확장성 문제를 해결하지 못합니다. SMDDP를 사용하는 D안은 기울기와 연산을 분산하는 기능이지 데이터셋 파일 크기를 분산하거나 줄이는 기능이 아닙니다. 따라서 Parquet 파일을 재파티셔닝하는 것이 올바른 해결책입니다.", "en": "The issue is caused by oversized Parquet files that cannot be efficiently read into memory during training. The most effective and scalable solution is to repartition the dataset into smaller Parquet files. AWS best practices for large-scale ML training recommend optimizing data layout, not simply increasing memory. By using Apache Spark on Amazon EMR, the ML engineer can repartition the Parquet files into smaller chunks that can be streamed and processed efficiently by SageMaker training jobs. Attaching EBS volumes (Option A) increases storage capacity but does not solve in-memory constraints. Changing to memory-optimized instances (Option C) increases cost and does not address long-term scalability. SMDDP (Option D) distributes gradients and computation, not dataset file sizes. Therefore, repartitioning the Parquet files is the correct solution."}, {"n": 2, "t": "single", "q": "An ML engineer wants to use, prepare, and load data from Amazon S3 for analytics. The ML engineer must run an extract, transform, and load (ETL) job to discover the schema of the data and to store the metadata. Which solution will meet these requirements with the LEAST manual effort?", "kq": "ML 엔지니어가 분석을 위해 Amazon S3의 데이터를 사용·준비·로드하려고 합니다. ML 엔지니어는 데이터의 스키마를 검색하고 메타데이터를 저장하는 ETL(추출·변환·로드) 작업을 실행해야 합니다. 어떤 솔루션이 최소한의 수작업으로 이러한 요구 사항을 충족할까요?", "o": [{"k": "A", "t": "Use AWS Glue to run the ETL job. Use the job to discover the schema and to store the associated metadata in the AWS Glue Data Catalog.", "kt": "AWS Glue로 ETL 작업을 실행합니다. 이 작업으로 스키마를 검색하고 관련 메타데이터를 AWS Glue Data Catalog에 저장합니다."}, {"k": "B", "t": "Create an Amazon SageMaker Data Wrangler flow to run the ETL job. Use the job to discover the schema and to store the associated metadata in an S3 bucket.", "kt": "Amazon SageMaker Data Wrangler 플로우를 만들어 ETL 작업을 실행합니다. 이 작업으로 스키마를 검색하고 관련 메타데이터를 S3 버킷에 저장합니다."}, {"k": "C", "t": "Create an ETL pipeline by using Amazon Athena integrated with AWS Step Functions. Use the pipeline to run the ETL job to discover the schema and to store the associated metadata in an S3 bucket.", "kt": "Amazon Athena와 AWS Step Functions를 연동해 ETL 파이프라인을 만듭니다. 이 파이프라인으로 ETL 작업을 실행해 스키마를 검색하고 관련 메타데이터를 S3 버킷에 저장합니다."}, {"k": "D", "t": "Launch an Amazon EC2 instance that includes the scikit-learn library to run the ETL job. Use the job to discover the schema and to store the associated metadata in Amazon Redshift.", "kt": "scikit-learn 라이브러리가 포함된 Amazon EC2 인스턴스를 시작해 ETL 작업을 실행합니다. 이 작업으로 스키마를 검색하고 관련 메타데이터를 Amazon Redshift에 저장합니다."}], "a": ["A"], "ko": "A안이 정답입니다. AWS Glue는 스키마를 검색하고, ETL 작업을 실행하며, 관련 메타데이터를 AWS Glue Data Catalog에 저장하도록 설계된 AWS의 관리형 ETL 서비스이기 때문입니다. AWS 문서에 따르면 Glue 크롤러는 신규 또는 업데이트된 데이터 소스를 자동으로 검색하고 카탈로그화할 수 있으며, Data Catalog는 스키마 메타데이터를 자동으로 캡처하고 관리합니다. 이는 Amazon S3에 있는 데이터에 대해 ETL 작업을 실행하고, 스키마를 검색하며, 최소한의 수작업으로 메타데이터를 저장해야 한다는 요구 사항과 직접적으로 일치합니다. 또한 AWS Glue는 이 워크플로에 맞게 설계된 관리형 서비스이므로 운영 부담이 가장 적습니다. Glue Data Catalog는 지속적인 메타데이터 저장소 역할을 하며, 크롤러는 스키마 정보를 추론해 카탈로그에 자동으로 통합합니다. 따라서 ML 엔지니어가 별도의 스키마 추론 로직을 만들거나 메타데이터 저장소를 수동으로 관리할 필요가 없습니다. 다른 선택지는 적합하지 않습니다. SageMaker Data Wrangler는 주로 시각적 데이터 준비와 피처 엔지니어링을 위한 도구이지, 스키마를 메타데이터 카탈로그에 저장하는 관리형 ETL 및 카탈로그 워크플로를 수행하기 위한 서비스가 아닙니다. Athena와 Step Functions를 조합하는 방식은 더 많은 사용자 지정 오케스트레이션이 필요하며 Glue Data Catalog 워크플로를 자연스럽게 대체하지 못합니다. EC2 인스턴스를 사용하는 방식은 운영 부담이 가장 크고, 최소 수작업이라는 요구 사항에 맞지 않습니다. 따라서 ETL, 스키마 검색, 메타데이터 카탈로그화를 하나의 관리형 서비스로 제공하는 AWS Glue를 사용하는 A안이 가장 적절합니다.", "en": "Option A is correct because AWS Glue is the AWS-native managed ETL service built specifically to discover schema, run ETL jobs, and store metadata in the AWS Glue Data Catalog. AWS documentation states that Glue crawlers can automatically discover and catalog new or updated data sources, and that the Data Catalog automatically captures and manages schema metadata. This directly matches the requirement to run an ETL job on data in Amazon S3, discover the schema, and store the metadata with the least manual effort. AWS Glue is also the lowest-effort answer because the service is managed and purpose-built for this workflow. The Glue Data Catalog serves as a persistent metadata repository, and AWS documents that crawlers infer schema information and integrate it into the catalog automatically. That means the ML engineer does not need to build custom schema inference logic or manually maintain metadata storage. This is exactly the kind of manual work the question is trying to avoid. The other options are not as good. SageMaker Data Wrangler is primarily for visual data preparation and feature engineering, not for running a managed ETL-plus-catalog workflow with schema stored in a metadata catalog. Athena with Step Functions would require assembling more custom orchestration and still does not naturally replace the Glue Data Catalog workflow. Launching an EC2 instance introduces the highest operational overhead and does not align with the requirement for least manual effort. Therefore, the best verified AWS-docs answer is A, because AWS Glue combines ETL, schema discovery, and metadata cataloging in one managed service."}, {"n": 3, "t": "single", "q": "A company has a Retrieval Augmented Generation (RAG) application that uses a vector database to store embeddings of documents. The company must migrate the application to AWS and must implement a solution that provides semantic search of text files. The company has already migrated the text repository to an Amazon S3 bucket. Which solution will meet these requirements?", "kq": "어떤 회사가 문서 임베딩을 저장하기 위해 벡터 데이터베이스를 사용하는 RAG(검색 증강 생성) 애플리케이션을 운영하고 있습니다. 이 회사는 애플리케이션을 AWS로 마이그레이션해야 하며, 텍스트 파일에 대한 의미 기반 검색을 제공하는 솔루션을 구현해야 합니다. 텍스트 저장소는 이미 Amazon S3 버킷으로 마이그레이션을 완료했습니다. 어떤 솔루션이 이러한 요구 사항을 충족할까요?", "o": [{"k": "A", "t": "Use an AWS Batch job to process the files and generate embeddings. Use AWS Glue to store the embeddings. Use SQL queries to perform the semantic searches.", "kt": "AWS Batch 작업으로 파일을 처리해 임베딩을 생성합니다. 임베딩은 AWS Glue에 저장합니다. SQL 쿼리로 의미 기반 검색을 수행합니다."}, {"k": "B", "t": "Use a custom Amazon SageMaker notebook to run a custom script to generate embeddings. Use SageMaker Feature Store to store the embeddings. Use SQL queries to perform the semantic searches.", "kt": "사용자 지정 Amazon SageMaker 노트북에서 사용자 지정 스크립트를 실행해 임베딩을 생성합니다. 임베딩은 SageMaker Feature Store에 저장합니다. SQL 쿼리로 의미 기반 검색을 수행합니다."}, {"k": "C", "t": "Use the Amazon Kendra S3 connector to ingest the documents from the S3 bucket into Amazon Kendra. Query Amazon Kendra to perform the semantic searches.", "kt": "Amazon Kendra S3 커넥터를 사용해 S3 버킷의 문서를 Amazon Kendra로 수집합니다. Amazon Kendra에 쿼리해 의미 기반 검색을 수행합니다."}, {"k": "D", "t": "Use an Amazon Textract asynchronous job to ingest the documents from the S3 bucket. Query Amazon Textract to perform the semantic searches.", "kt": "Amazon Textract 비동기 작업으로 S3 버킷의 문서를 수집합니다. Amazon Textract에 쿼리해 의미 기반 검색을 수행합니다."}], "a": ["C"], "ko": "Amazon Kendra는 의미 기반 검색 사용 사례를 위해 설계된 AI 기반 검색 서비스입니다. Amazon Kendra S3 커넥터를 사용하면 Amazon S3 버킷의 문서를 Kendra로 수집할 수 있습니다. 문서가 수집되면 Kendra의 내장 기능을 통해 의미 기반 검색을 수행할 수 있으므로, 임베딩을 직접 생성하거나 벡터 데이터베이스를 별도로 관리할 필요가 없습니다. 이 방식은 효율적이고 운영 부담이 적으며, RAG 애플리케이션의 요구 사항을 충족합니다.", "en": "Amazon Kendra is an AI-powered search service designed for semantic search use cases. It allows ingestion of documents from an Amazon S3 bucket using the Amazon Kendra S3 connector. Once the documents are ingested, Kendra enables semantic searches with its built-in capabilities, removing the need to manually generate embeddings or manage a vector database. This approach is efficient, requires minimal operational effort, and meets the requirements for a Retrieval Augmented Generation (RAG) application."}, {"n": 4, "t": "single", "q": "A company has trained an ML model in Amazon SageMaker. The company needs to host the model to provide inferences in a production environment. The model must be highly available and must respond with minimum latency. The size of each request will be between 1 KB and 3 MB. The model will receive unpredictable bursts of requests during the day. The inferences must adapt proportionally to the changes in demand. How should the company deploy the model into production to meet these requirements?", "kq": "어떤 회사가 Amazon SageMaker에서 ML 모델을 학습시켰습니다. 이제 운영 환경에서 추론을 제공하기 위해 모델을 호스팅해야 합니다. 모델은 고가용성을 갖춰야 하고 지연 시간이 최소여야 합니다. 각 요청의 크기는 1KB에서 3MB 사이입니다. 모델은 하루 중 예측 불가능한 요청 폭증을 받게 됩니다. 추론 처리 능력은 수요 변화에 비례해 조정되어야 합니다. 요구 사항을 충족하려면 모델을 어떻게 운영 환경에 배포해야 합니까?", "o": [{"k": "A", "t": "Create a SageMaker real-time inference endpoint. Configure auto scaling. Configure the endpoint to present the existing model.", "kt": "SageMaker 실시간 추론 엔드포인트를 생성합니다. Auto Scaling을 구성합니다. 기존 모델을 제공하도록 엔드포인트를 구성합니다."}, {"k": "B", "t": "Deploy the model on an Amazon Elastic Container Service (Amazon ECS) cluster. Use ECS scheduled scaling that is based on the CPU of the ECS cluster.", "kt": "Amazon ECS 클러스터에 모델을 배포합니다. ECS 클러스터의 CPU를 기준으로 하는 ECS 예약 스케일링을 사용합니다."}, {"k": "C", "t": "Install SageMaker Operator on an Amazon Elastic Kubernetes Service (Amazon EKS) cluster. Deploy the model in Amazon EKS. Set horizontal pod auto scaling to scale replicas based on the memory metric.", "kt": "Amazon EKS 클러스터에 SageMaker Operator를 설치합니다. Amazon EKS에 모델을 배포합니다. 메모리 지표를 기준으로 복제본을 조정하도록 HPA(수평 파드 오토스케일링)를 설정합니다."}, {"k": "D", "t": "Use Spot Instances with a Spot Fleet behind an Application Load Balancer (ALB) for inferences. Use the ALBRequestCountPerTarget metric as the metric for auto scaling.", "kt": "추론을 위해 Application Load Balancer(ALB) 뒤에 Spot Fleet으로 스팟 인스턴스를 사용합니다. Auto Scaling 지표로 ALBRequestCountPerTarget을 사용합니다."}], "a": ["A"], "ko": "Amazon SageMaker 실시간 추론 엔드포인트는 운영 환경에서 낮은 지연 시간으로 예측을 제공하도록 설계되어 있습니다. 또한 예측 불가능한 요청 폭증을 처리할 수 있도록 내장 Auto Scaling을 제공하므로 고가용성과 빠른 응답성을 보장할 수 있습니다. 이 방식은 완전 관리형 서비스이므로 운영 복잡도를 줄이고, 요구 사항에 제시된 1KB~3MB 범위의 요청 크기에 최적화되어 있습니다.", "en": "Amazon SageMaker real-time inference endpoints are designed to provide low-latency predictions in production environments. They offer built-in auto scaling to handle unpredictable bursts of requests, ensuring high availability and responsiveness. This approach is fully managed, reduces operational complexity, and is optimized for the range of request sizes (1 KB to 3 MB) specified in the requirements."}, {"n": 5, "t": "match", "q": "An ML engineer is working on an ML model to predict the prices of similarly sized homes. The model will base predictions on several features The ML engineer will use the following feature engineering techniques to estimate the prices of the homes: Select the correct feature engineering techniques for the following list of features. Each feature engineering technique should be selected one time or not at all (Select three.)", "kq": "ML 엔지니어가 비슷한 크기의 주택 가격을 예측하는 ML 모델을 개발하고 있습니다. 모델은 여러 특성을 기반으로 예측합니다. ML 엔지니어는 주택 가격을 추정하기 위해 다음 특성 엔지니어링 기법들을 사용할 예정입니다. 아래 특성 목록에 맞는 특성 엔지니어링 기법을 선택하세요. 각 기법은 한 번만 선택하거나 선택하지 않습니다. (3개 선택)", "p": ["City (name)", "Type_year (type of home and year the home was built)", "Size of the building (square feet or square meters)"], "c": ["Feature splitting", "Logarithmic transformation", "One-hot encoding", "Standardized distribution"], "kp": ["City (도시 이름)", "Type_year (주택 유형과 건축 연도)", "Size of the building (건물 면적, 제곱피트 또는 제곱미터)"], "kc": ["Feature splitting (특성 분할)", "Logarithmic transformation (로그 변환)", "One-hot encoding (원-핫 인코딩)", "Standardized distribution (표준화)"], "a": [2, 0, 3], "ko": "도시 이름은 범주형 특성이므로 모델이 해석할 수 있는 숫자 형식으로 변환하기 위해 원-핫 인코딩을 사용합니다. Type_year는 주택 유형과 건축 연도라는 두 가지 정보를 하나의 열에 포함하고 있으므로, 이를 각각의 독립된 특성으로 분리하는 특성 분할이 적절합니다. 건물 크기는 연속형 수치 변수이므로 평균이 0이고 표준편차가 1이 되도록 표준화하면 다른 특성과의 스케일 차이로 인한 편향을 줄일 수 있습니다. 이러한 특성 엔지니어링을 적용하면 입력 데이터를 모델 학습에 적합한 형식으로 정리하고 예측 정확도를 높일 수 있습니다.", "en": "City (name): One-hot encoding Type_year (type of home and year the home was built): Feature splitting Size of the building (square feet or square meters): Standardized distribution City (name): One-hot encoding Why? The \" City \" is a categorical feature (non-numeric), so one-hot encoding is used to transform it into a numeric format. This encoding creates binary columns for each unique category (e.g., cities like \" New York \" or \" Los Angeles \" ), which the model can interpret. Type_year (type of home and year the home was built): Feature splitting Why? \" Type_year \" combines two pieces of information into one column, which could confuse the model. Feature splitting separates this column into two distinct features: \" Type of home \" and \" Year built, \" enabling the model to process each feature independently. Size of the building (square feet or square meters): Standardized distribution Why? Size is a continuous numerical variable, and standardization (scaling the feature to have a mean of 0 and a standard deviation of 1) ensures that the model treats it fairly compared to other features, avoiding bias from differences in feature scale. By applying these feature engineering techniques, the ML engineer can ensure that the input data is correctly formatted and optimized for the model to make accurate predictions."}, {"n": 6, "t": "single", "q": "A company regularly receives new training data from the vendor of an ML model. The vendor delivers cleaned and prepared data to the company's Amazon S3 bucket every 3-4 days. The company has an Amazon SageMaker pipeline to retrain the model. An ML engineer needs to implement a solution to run the pipeline when new data is uploaded to the S3 bucket. Which solution will meet these requirements with the LEAST operational effort?", "kq": "어떤 회사가 ML 모델 공급업체로부터 새 학습 데이터를 정기적으로 받고 있습니다. 공급업체는 3~4일마다 정제·준비된 데이터를 회사의 Amazon S3 버킷에 전달합니다. 회사에는 모델을 재학습시키는 Amazon SageMaker 파이프라인이 있습니다. ML 엔지니어는 새 데이터가 S3 버킷에 업로드될 때 파이프라인을 실행하는 솔루션을 구현해야 합니다. 어떤 솔루션이 최소한의 운영 노력으로 이러한 요구 사항을 충족할까요?", "o": [{"k": "A", "t": "Create an S3 Lifecycle rule to transfer the data to the SageMaker training instance and to initiate training.", "kt": "S3 Lifecycle 규칙을 만들어 데이터를 SageMaker 학습 인스턴스로 전송하고 학습을 시작합니다."}, {"k": "B", "t": "Create an AWS Lambda function that scans the S3 bucket. Program the Lambda function to initiate the pipeline when new data is uploaded.", "kt": "S3 버킷을 스캔하는 AWS Lambda 함수를 만듭니다. 새 데이터가 업로드되면 파이프라인을 시작하도록 Lambda 함수를 프로그래밍합니다."}, {"k": "C", "t": "Create an Amazon EventBridge rule that has an event pattern that matches the S3 upload. Configure the pipeline as the target of the rule.", "kt": "S3 업로드와 일치하는 이벤트 패턴을 가진 Amazon EventBridge 규칙을 만듭니다. 해당 규칙의 대상으로 파이프라인을 구성합니다."}, {"k": "D", "t": "Use Amazon Managed Workflows for Apache Airflow (Amazon MWAA) to orchestrate the pipeline when new data is uploaded.", "kt": "새 데이터가 업로드될 때 Amazon MWAA(Managed Workflows for Apache Airflow)로 파이프라인을 오케스트레이션합니다."}], "a": ["C"], "ko": "Amazon EventBridge에서 S3 업로드 이벤트와 일치하는 이벤트 패턴을 사용하는 방식은 자동화되고 운영 부담이 적은 해결책입니다. 새 데이터가 S3 버킷에 업로드되면 EventBridge 규칙이 SageMaker 파이프라인을 트리거합니다. 이 방식은 사용자 지정 스크립트나 별도의 오케스트레이션 도구가 필요 없으며, 기존 S3 및 SageMaker 구성과 자연스럽게 통합되므로 운영 오버헤드를 최소화합니다.", "en": "Using Amazon EventBridge with an event pattern that matches S3 upload events provides an automated, low- effort solution. When new data is uploaded to the S3 bucket, the EventBridge rule triggers the SageMaker pipeline. This approach minimizes operational overhead by eliminating the need for custom scripts or external orchestration tools while seamlessly integrating with the existing S3 and SageMaker setup."}, {"n": 7, "t": "single", "q": "A company uses an Amazon EMR cluster to run a data ingestion process for an ML model. An ML engineer notices that the processing time is increasing. Which solution will reduce the processing time MOST cost-effectively?", "kq": "어떤 회사가 ML 모델용 데이터 수집 프로세스를 실행하기 위해 Amazon EMR 클러스터를 사용합니다. ML 엔지니어는 처리 시간이 점점 늘어나고 있음을 확인했습니다. 어떤 솔루션이 처리 시간을 가장 비용 효율적으로 단축할까요?", "o": [{"k": "A", "t": "Use Spot Instances to increase the number of primary nodes.", "kt": "스팟 인스턴스를 사용해 프라이머리 노드 수를 늘립니다."}, {"k": "B", "t": "Use Spot Instances to increase the number of core nodes.", "kt": "스팟 인스턴스를 사용해 코어 노드 수를 늘립니다."}, {"k": "C", "t": "Use Spot Instances to increase the number of task nodes.", "kt": "스팟 인스턴스를 사용해 태스크 노드 수를 늘립니다."}, {"k": "D", "t": "Use On-Demand Instances to increase the number of core nodes.", "kt": "온디맨드 인스턴스를 사용해 코어 노드 수를 늘립니다."}], "a": ["C"], "ko": "Amazon EMR 클러스터는 프라이머리 노드, 코어 노드, 태스크 노드로 구성되며 각각의 역할이 다릅니다. 프라이머리 노드는 클러스터를 관리하고, 코어 노드는 데이터를 저장하면서 작업을 실행하며, 태스크 노드는 데이터를 저장하지 않고 작업만 실행합니다. 데이터 수집 및 변환처럼 컴퓨팅 집약적인 워크로드의 처리 시간을 줄이려면 태스크 노드를 확장하는 것이 적절합니다. 태스크 노드는 HDFS 데이터를 저장하지 않으므로 Spot Instance가 중단되더라도 데이터 손실 위험이 낮습니다. 따라서 Spot Instance를 사용해 태스크 노드 수를 늘리는 것이 가장 비용 효율적이며 AWS 권장 방식입니다.", "en": "Amazon EMR clusters consist of primary, core, and task nodes, each with a distinct role. The primary node manages the cluster, core nodes store data and run tasks, and task nodes only run tasks without storing data. AWS documentation recommends using task nodes for scaling compute capacity when workloads are compute-intensive, such as data ingestion and transformation pipelines. To reduce processing time cost-effectively, AWS strongly advises using Spot Instances for task nodes. Spot Instances provide the same compute capacity as On-Demand Instances but at a significantly reduced cost, often up to 90% lower. Because task nodes do not store HDFS data, they can be safely interrupted without risking data loss. Increasing the number of primary nodes is not supported by EMR and would not improve performance. Increasing core nodes affects both storage and compute and is more expensive, especially when using On- Demand Instances. Option D is therefore the least cost-effective. AWS EMR best practices explicitly state that scaling out with Spot task nodes is the preferred way to improve performance for transient, parallel workloads such as ETL, ingestion, and feature preparation. Therefore, Option C is the most cost-effective and AWS-recommended solution."}, {"n": 8, "t": "single", "q": "An ML engineer trained an ML model on Amazon SageMaker to detect automobile accidents from closed-circuit TV footage. The ML engineer used SageMaker Data Wrangler to create a training dataset of images of accidents and non-accidents. The model performed well during training and validation. However, the model is underperforming in production because of variations in the quality of the images from various cameras. Which solution will improve the model's accuracy in the LEAST amount of time?", "kq": "ML 엔지니어가 CCTV 영상에서 자동차 사고를 감지하는 ML 모델을 Amazon SageMaker에서 학습시켰습니다. ML 엔지니어는 SageMaker Data Wrangler를 사용해 사고 이미지와 비사고 이미지로 학습 데이터셋을 만들었습니다. 모델은 학습과 검증 단계에서는 좋은 성능을 보였습니다. 그러나 여러 카메라에서 들어오는 이미지 품질의 차이 때문에 운영 환경에서는 성능이 저하되고 있습니다. 어떤 솔루션이 가장 짧은 시간 안에 모델의 정확도를 향상시킬 수 있을까요?", "o": [{"k": "A", "t": "Collect more images from all the cameras. Use Data Wrangler to prepare a new training dataset.", "kt": "모든 카메라에서 더 많은 이미지를 수집합니다. Data Wrangler를 사용하여 새로운 학습 데이터 세트를 준비합니다."}, {"k": "B", "t": "Recreate the training dataset by using the Data Wrangler corrupt image transform. Specify the impulse noise option.", "kt": "Data Wrangler의 손상된 이미지 변환을 사용하여 학습 데이터 세트를 재생성합니다. 임펄스 노이즈 옵션을 지정합니다."}, {"k": "C", "t": "Recreate the training dataset by using the Data Wrangler enhance image contrast transform. Specify the Gamma contrast option.", "kt": "Data Wrangler의 이미지 대비 향상 변환을 사용하여 학습 데이터 세트를 재생성합니다. 감마 대비 옵션을 지정합니다."}, {"k": "D", "t": "Recreate the training dataset by using the Data Wrangler resize image transform. Crop all images to the same size.", "kt": "Data Wrangler의 이미지 크기 조정 변환을 사용하여 학습 데이터 세트를 재생성합니다. 모든 이미지를 같은 크기로 자릅니다."}], "a": ["B"], "ko": "이 모델은 여러 카메라에서 제공되는 이미지 품질 차이 때문에 운영 환경에서 성능이 저하되고 있습니다. SageMaker Data Wrangler의 corrupt image transform에서 impulse noise 옵션을 사용하면 실제 환경에서 발생할 수 있는 노이즈와 품질 변동을 학습 데이터에 시뮬레이션할 수 있습니다. 이를 통해 모델은 이미지 품질의 불일치에 더 강건해지고, 새로운 데이터를 수집하거나 처리하지 않고도 운영 환경에서의 정확도를 빠르게 개선할 수 있습니다.", "en": "The model is underperforming in production due to variations in image quality from different cameras. Using the corrupt image transform with the impulse noise option in SageMaker Data Wrangler simulates real-world noise and variations in the training dataset. This approach helps the model become more robust to inconsistencies in image quality, improving its accuracy in production without the need to collect and process new data, thereby saving time."}, {"n": 9, "t": "single", "q": "An ML engineer is tuning an image classification model that performs poorly on one of two classes. The poorly performing class represents an extremely small fraction of the training dataset. Which solution will improve the model's performance?", "kq": "ML 엔지니어가 두 클래스 중 하나에서 성능이 좋지 않은 이미지 분류 모델을 튜닝하고 있습니다. 성능이 나쁜 클래스는 학습 데이터셋에서 극히 작은 비중을 차지합니다. 모델 성능을 개선하는 방법은 무엇입니까?", "o": [{"k": "A", "t": "Optimize for accuracy. Use image augmentation on the less common images.", "kt": "정확도를 최적화합니다. 드문 클래스의 이미지에 이미지 증강을 적용합니다."}, {"k": "B", "t": "Optimize for F1 score. Use image augmentation on the less common images.", "kt": "F1 점수를 최적화합니다. 드문 클래스의 이미지에 이미지 증강을 적용합니다."}, {"k": "C", "t": "Optimize for accuracy. Use SMOTE to generate synthetic images.", "kt": "정확도를 최적화합니다. SMOTE를 사용해 합성 이미지를 생성합니다."}, {"k": "D", "t": "Optimize for F1 score. Use SMOTE to generate synthetic images.", "kt": "F1 점수를 최적화합니다. SMOTE를 사용해 합성 이미지를 생성합니다."}], "a": ["B"], "ko": "이 상황은 심각한 클래스 불균형 문제를 설명합니다. 이런 경우 정확도는 적절한 평가 지표가 아닐 수 있습니다. 모델이 다수 클래스만 예측해도 높은 정확도를 얻을 수 있기 때문입니다. 불균형 데이터셋에서는 F1 점수 또는 정밀도와 재현율을 사용하는 것이 권장됩니다. F1 점수는 거짓 양성과 거짓 음성을 함께 고려하므로 소수 클래스 성능을 평가하는 데 적합합니다. 이미지 데이터의 경우 회전, 반전, 자르기, 색상 변화와 같은 이미지 증강을 통해 소수 클래스 데이터를 보강하는 것이 적절합니다. SMOTE는 주로 표 형식 데이터에 적합하며 이미지 픽셀 데이터에는 적합하지 않습니다. 따라서 F1 점수를 최적화하고 소수 클래스 이미지에 이미지 증강을 적용하는 B안이 정답입니다.", "en": "This scenario describes a severely imbalanced classification problem. In such cases, accuracy is a misleading metric, because the model can achieve high accuracy by predicting only the majority class. AWS ML best practices recommend using F1 score (or precision/recall) when evaluating imbalanced datasets. The F1 score balances false positives and false negatives, making it ideal for assessing minority-class performance. For image data, image augmentation (rotations, flips, crops, color jitter) is the preferred technique to increase minority-class representation. SMOTE is designed for tabular data and is not suitable for image pixel data. Therefore, the correct solution is to optimize for F1 score and apply image augmentation. Thus, Option B is the correct and AWS-aligned answer."}, {"n": 10, "t": "single", "q": "An ML engineer is building a model to predict house and apartment prices. The model uses three features: Square Meters, Price, and Age of Building. The dataset has 10,000 data rows. The data includes data points for one large mansion and one extremely small apartment. The ML engineer must perform preprocessing on the dataset to ensure that the model produces accurate predictions for the typical house or apartment. Which solution will meet these requirements?", "kq": "ML 엔지니어가 주택과 아파트 가격을 예측하는 모델을 만들고 있습니다. 모델은 Square Meters(면적), Price(가격), Age of Building(건물 연식)이라는 세 가지 특성을 사용합니다. 데이터셋은 10,000행입니다. 데이터에는 아주 큰 저택 한 채와 극히 작은 아파트 한 채의 데이터 포인트가 포함되어 있습니다. ML 엔지니어는 모델이 일반적인 주택이나 아파트에 대해 정확한 예측을 하도록 데이터셋을 전처리해야 합니다. 어떤 솔루션이 이러한 요구 사항을 충족할까요?", "o": [{"k": "A", "t": "Remove the outliers and perform a log transformation on the Square Meters variable.", "kt": "이상치를 제거하고 Square Meters 변수에 로그 변환을 수행합니다."}, {"k": "B", "t": "Keep the outliers and perform normalization on the Square Meters variable.", "kt": "이상치를 유지하고 Square Meters 변수에 정규화를 수행합니다."}, {"k": "C", "t": "Remove the outliers and perform one-hot encoding on the Square Meters variable.", "kt": "이상치를 제거하고 Square Meters 변수에 원-핫 인코딩을 수행합니다."}, {"k": "D", "t": "Keep the outliers and perform one-hot encoding on the Square Meters variable.", "kt": "이상치를 유지하고 Square Meters 변수에 원-핫 인코딩을 수행합니다."}], "a": ["A"], "ko": "주택 가격 예측과 같은 회귀 문제에서는 극단값이 모델 학습을 크게 왜곡할 수 있습니다. 이 데이터셋에서 매우 큰 저택과 매우 작은 아파트는 면적 특성에서 명확한 이상치에 해당합니다. 이상치는 평균제곱오차와 같은 손실 함수에 과도한 영향을 주어 일반적인 주택이나 아파트에 대한 예측 성능을 저하시킬 수 있습니다. 따라서 이상치를 제거하면 모델이 대부분의 일반적인 데이터에 적용되는 패턴을 학습하는 데 집중할 수 있습니다. 이후 Square Meters 특성에 로그 변환을 적용하면 분포의 왜도를 줄이고 분산을 안정화할 수 있습니다. 정규화만으로는 이상치의 영향을 충분히 줄일 수 없으며, 원-핫 인코딩은 연속형 수치 변수인 면적에는 적합하지 않습니다. 따라서 이상치를 제거하고 로그 변환을 적용하는 A안이 가장 적절합니다.", "en": "In regression problems such as house price prediction, extreme values can significantly distort model learning. In this dataset, the presence of a large mansion and an extremely small apartment represents clear outliers in the Square Meters feature. According to AWS Machine Learning best practices, outliers can disproportionately influence loss functions (such as mean squared error), leading to poor predictions for the majority of typical data points. Removing these outliers helps the model focus on learning patterns that apply to the majority of houses and apartments, which aligns with the requirement to produce accurate predictions for typical properties. After removing outliers, applying a log transformation to the Square Meters feature further improves model performance by reducing skewness and stabilizing variance. Log transformations are commonly recommended in AWS and general ML documentation when numerical features span multiple orders of magnitude. Option B is incorrect because normalization alone does not address the undue influence of extreme outliers. Option C and D are incorrect because one-hot encoding is intended for categorical variables, not continuous numerical features such as square meters. Therefore, removing outliers and applying a log transformation is the most statistically sound preprocessing approach."}, {"n": 11, "t": "single", "q": "A financial company receives a high volume of real-time market data streams from an external provider. The streams consist of thousands of JSON records every second. The company needs to implement a scalable solution on AWS to identify anomalous data points. Which solution will meet these requirements with the LEAST operational overhead?", "kq": "어떤 금융 회사가 외부 공급자로부터 대량의 실시간 시장 데이터 스트림을 받습니다. 스트림은 초당 수천 건의 JSON 레코드로 구성됩니다. 이 회사는 비정상 데이터 포인트를 식별하기 위한 확장 가능한 솔루션을 AWS에 구현해야 합니다. 어떤 솔루션이 최소한의 운영 오버헤드로 이러한 요구 사항을 충족할까요?", "o": [{"k": "A", "t": "Ingest real-time data into Amazon Kinesis Data Streams. Use the built-in RANDOM_CUT_FOREST function in Amazon Managed Service for Apache Flink to process the data streams and to detect data anomalies.", "kt": "실시간 데이터를 Amazon Kinesis Data Streams로 수집합니다. Amazon Managed Service for Apache Flink의 내장 RANDOM_CUT_FOREST 함수를 사용해 데이터 스트림을 처리하고 이상치를 탐지합니다."}, {"k": "B", "t": "Ingest real-time data into Amazon Kinesis Data Streams. Deploy an Amazon SageMaker AI endpoint for real-time outlier detection. Create an AWS Lambda function to detect anomalies. Use the data streams to invoke the Lambda function.", "kt": "실시간 데이터를 Amazon Kinesis Data Streams로 수집합니다. 실시간 이상치 탐지를 위한 Amazon SageMaker AI 엔드포인트를 배포합니다. 이상치를 탐지하는 AWS Lambda 함수를 만듭니다. 데이터 스트림으로 Lambda 함수를 호출합니다."}, {"k": "C", "t": "Ingest real-time data into Apache Kafka on Amazon EC2 instances. Deploy an Amazon SageMaker AI endpoint for real-time outlier detection. Create an AWS Lambda function to detect anomalies. Use the data streams to invoke the Lambda function.", "kt": "실시간 데이터를 Amazon EC2 인스턴스의 Apache Kafka로 수집합니다. 실시간 이상치 탐지를 위한 Amazon SageMaker AI 엔드포인트를 배포합니다. 이상치를 탐지하는 AWS Lambda 함수를 만듭니다. 데이터 스트림으로 Lambda 함수를 호출합니다."}, {"k": "D", "t": "Send real-time data to an Amazon Simple Queue Service (Amazon SQS) FIFO queue. Create an AWS Lambda function to consume the queue messages. Program the Lambda function to start an AWS Glue extract, transform, and load (ETL) job for batch processing and anomaly detection.", "kt": "실시간 데이터를 Amazon SQS FIFO 큐로 보냅니다. 큐 메시지를 소비하는 AWS Lambda 함수를 만듭니다. 배치 처리와 이상치 탐지를 위해 AWS Glue ETL 작업을 시작하도록 Lambda 함수를 프로그래밍합니다."}], "a": ["A"], "ko": "핵심 요구 사항은 실시간 처리, 높은 처리량, 최소한의 운영 부담입니다. Amazon Kinesis Data Streams는 초당 수천 건의 이벤트를 낮은 지연 시간으로 수집하도록 설계되어 있습니다. 스트리밍 데이터의 이상 탐지를 위해 Amazon Managed Service for Apache Flink는 내장 Random Cut Forest(RCF) 함수를 제공합니다. RCF는 레이블이 지정된 학습 데이터 없이도 수치형 스트리밍 데이터에서 이상치를 탐지하는 비지도 학습 알고리즘입니다. 이 완전 관리형 조합은 SageMaker 엔드포인트, EC2 인스턴스 또는 사용자 지정 ML 파이프라인을 배포하고 관리할 필요를 없애 줍니다. B와 C는 불필요한 인프라 및 모델 관리 부담을 추가하며, D는 배치 처리 방식이므로 실시간 이상 탐지에 적합하지 않습니다. 따라서 Kinesis Data Streams와 Flink의 내장 Random Cut Forest를 사용하는 것이 가장 확장 가능하고 운영 부담이 적은 해결책입니다.", "en": "The key requirements are real-time processing, high throughput, and minimal operational overhead. Amazon Kinesis Data Streams is designed for ingesting thousands of events per second with low latency. For anomaly detection on streaming data, Amazon Managed Service for Apache Flink provides a built-in Random Cut Forest (RCF) function. RCF is an unsupervised anomaly detection algorithm that works well on numerical streaming data and does not require labeled training data. This fully managed combination eliminates the need to deploy or maintain SageMaker endpoints, EC2 instances, or custom ML pipelines. Options B and C introduce unnecessary infrastructure and model management overhead. Option D is batch-oriented and unsuitable for real-time anomaly detection. Therefore, using Kinesis Data Streams with Flink's built-in Random Cut Forest is the most scalable and low- overhead solution."}, {"n": 12, "t": "single", "q": "An ML engineer normalized training data by using min-max normalization in AWS Glue DataBrew. The ML engineer must normalize production inference data in the same way before passing the data to the model. Which solution will meet this requirement?", "kq": "ML 엔지니어가 AWS Glue DataBrew에서 min-max 정규화를 사용해 학습 데이터를 정규화했습니다. ML 엔지니어는 운영 환경의 추론 데이터를 모델에 전달하기 전에 같은 방식으로 정규화해야 합니다. 어떤 솔루션이 이 요구 사항을 충족할까요?", "o": [{"k": "A", "t": "Apply statistics from a well-known dataset to normalize the production samples.", "kt": "잘 알려진 데이터셋의 통계값을 적용해 운영 샘플을 정규화합니다."}, {"k": "B", "t": "Keep the min-max normalization statistics from the training set and use them to normalize the production samples.", "kt": "학습 세트에서 구한 min-max 정규화 통계값을 보관해 두고, 그 값으로 운영 샘플을 정규화합니다."}, {"k": "C", "t": "Calculate new min-max statistics from a batch of production samples and use them to normalize all production samples.", "kt": "운영 샘플 배치에서 새로운 min-max 통계값을 계산하고, 그 값으로 모든 운영 샘플을 정규화합니다."}, {"k": "D", "t": "Calculate new min-max statistics from each production sample and use them to normalize all production samples.", "kt": "각 운영 샘플마다 새로운 min-max 통계값을 계산하고, 그 값으로 모든 운영 샘플을 정규화합니다."}], "a": ["B"], "ko": "AWS ML 모범 사례에 따르면 학습 시 적용한 데이터 전처리는 추론 시에도 동일하게 적용해야 합니다. Min-max 정규화의 경우 학습 데이터셋에서 계산한 최소값과 최대값을 재사용해야 합니다. 운영 데이터에서 새로운 통계값을 계산해 정규화하면 모델이 학습한 특성 분포와 달라져 예측 정확도가 저하될 수 있습니다. AWS 문서에서도 추론 데이터에서 정규화 파라미터를 다시 계산하지 말 것을 명확히 권장합니다. A, C, D는 데이터 누수 또는 일관되지 않은 특성 스케일링을 유발할 수 있습니다. B는 학습과 추론 파이프라인 간 일관성을 보장하고 모델의 무결성을 유지합니다. 따라서 B가 정답입니다.", "en": "AWS ML best practices state that data preprocessing applied during training must be applied identically during inference. For min-max normalization, this requires reusing the minimum and maximum values calculated from the training dataset. If production data is normalized using different statistics, the feature distributions will differ from what the model learned, leading to degraded prediction accuracy. AWS documentation explicitly warns against recomputing normalization parameters on inference data. Options A, C, and D introduce data leakage or inconsistent feature scaling. Option B ensures consistency between training and inference pipelines and preserves model integrity. Therefore, Option B is the correct and AWS-aligned solution."}, {"n": 13, "t": "single", "q": "Case study An ML engineer is developing a fraud detection model on AWS. The training dataset includes transaction logs, customer profiles, and tables from an on-premises MySQL database. The transaction logs and customer profiles are stored in Amazon S3. The dataset has a class imbalance that affects the learning of the model's algorithm. Additionally, many of the features have interdependencies. The algorithm is not capturing all the desired underlying patterns in the data. Before the ML engineer trains the model, the ML engineer must resolve the issue of the imbalanced data. Which solution will meet this requirement with the LEAST operational effort?", "kq": "[사례 연구] ML 엔지니어가 AWS에서 사기 탐지 모델을 개발하고 있습니다. 학습 데이터셋에는 거래 로그, 고객 프로필, 그리고 온프레미스 MySQL 데이터베이스의 테이블들이 포함됩니다. 거래 로그와 고객 프로필은 Amazon S3에 저장되어 있습니다. 데이터셋에는 모델 알고리즘의 학습에 영향을 주는 클래스 불균형이 있습니다. 또한 많은 특성들이 서로 종속되어 있습니다. 알고리즘이 데이터에 내재된 패턴을 모두 포착하지 못하고 있습니다. ML 엔지니어는 모델을 학습시키기 전에 데이터 불균형 문제를 해결해야 합니다. 어떤 솔루션이 최소한의 운영 노력으로 이 요구 사항을 충족할까요?", "o": [{"k": "A", "t": "Use Amazon Athena to identify patterns that contribute to the imbalance. Adjust the dataset accordingly.", "kt": "Amazon Athena로 불균형에 기여하는 패턴을 식별합니다. 그에 따라 데이터셋을 조정합니다."}, {"k": "B", "t": "Use Amazon SageMaker Studio Classic built-in algorithms to process the imbalanced dataset.", "kt": "Amazon SageMaker Studio Classic의 내장 알고리즘을 사용해 불균형 데이터셋을 처리합니다."}, {"k": "C", "t": "Use AWS Glue DataBrew built-in features to oversample the minority class.", "kt": "AWS Glue DataBrew의 내장 기능을 사용해 소수 클래스를 오버샘플링합니다."}, {"k": "D", "t": "Use the Amazon SageMaker Data Wrangler balance data operation to oversample the minority class.", "kt": "Amazon SageMaker Data Wrangler의 데이터 균형 조정 작업을 사용해 소수 클래스를 오버샘플링합니다."}], "a": ["D"], "ko": "이 문제는 학습 데이터셋에 클래스 불균형이 있어 소수 클래스의 패턴을 모델이 충분히 학습하지 못하는 상황입니다. SageMaker Data Wrangler는 클래스 불균형을 해결하기 위한 Balance Data 작업을 제공하며, 여기에는 오버샘플링과 언더샘플링 기법이 포함됩니다. 소수 클래스를 오버샘플링하면 해당 클래스의 샘플을 복제하여 알고리즘이 보다 균형 잡힌 입력 데이터를 학습할 수 있습니다. 이 방식은 별도 스크립트나 외부 도구 없이 SageMaker 생태계 내에서 처리할 수 있어 운영 부담이 가장 적습니다. Athena는 불균형을 직접 해결하는 도구가 아니며, SageMaker Studio Classic 내장 알고리즘이나 Glue DataBrew보다 Data Wrangler의 Balance Data 기능이 이 요구 사항에 더 직접적으로 부합합니다. 따라서 D가 정답입니다.", "en": "Problem Description: The training dataset has a class imbalance, meaning one class (e.g., fraudulent transactions) has fewer samples compared to the majority class (e.g., non-fraudulent transactions). This imbalance affects the model's ability to learn patterns from the minority class. Why SageMaker Data Wrangler? SageMaker Data Wrangler provides a built-in operation called \" Balance Data, \" which includes oversampling and undersampling techniques to address class imbalances. Oversampling the minority class replicates samples of the minority class, ensuring the algorithm receives balanced inputs without significant additional operational overhead. Steps to Implement: Import the dataset into SageMaker Data Wrangler. Apply the \" Balance Data \" operation and configure it to oversample the minority class. Export the balanced dataset for training. Advantages: Ease of Use: Minimal configuration is required. Integrated Workflow: Works seamlessly with the SageMaker ecosystem for preprocessing and model training. Time Efficiency: Reduces manual effort compared to external tools or scripts."}, {"n": 14, "t": "multi", "q": "An ML engineer is training a simple neural network model. The ML engineer tracks the performance of the model over time on a validation dataset. The model's performance improves substantially at first and then degrades after a specific number of epochs. Which solutions will mitigate this problem? (Choose two.)", "kq": "ML 엔지니어가 단순한 신경망 모델을 학습시키고 있습니다. ML 엔지니어는 검증 데이터셋에서 모델 성능을 시간에 따라 추적하고 있습니다. 모델 성능은 처음에는 크게 향상되지만, 특정 에포크 수를 넘기면 오히려 저하됩니다. 이 문제를 완화할 수 있는 방법은 무엇입니까? (2개 선택)", "o": [{"k": "A", "t": "Enable early stopping on the model.", "kt": "모델에 조기 종료(early stopping)를 활성화합니다."}, {"k": "B", "t": "Increase dropout in the layers.", "kt": "레이어의 드롭아웃을 늘립니다."}, {"k": "C", "t": "Increase the number of layers.", "kt": "레이어 수를 늘립니다."}, {"k": "D", "t": "Increase the number of neurons.", "kt": "뉴런 수를 늘립니다."}, {"k": "E", "t": "Investigate and reduce the sources of model bias.", "kt": "모델 편향의 원인을 조사하고 줄입니다."}], "a": ["A", "B"], "ko": "검증 데이터셋에서 모델 성능이 처음에는 크게 향상되다가 특정 에포크 이후 저하되는 것은 과적합의 전형적인 징후입니다. 조기 종료는 검증 성능이 더 이상 개선되지 않을 때 학습을 중단하여 모델이 학습 데이터에 과도하게 맞춰지는 것을 방지합니다. Dropout은 학습 중 일부 뉴런을 무작위로 비활성화하는 정규화 기법으로, 모델이 특정 뉴런 조합에 지나치게 의존하지 않도록 하여 일반화 성능을 높입니다. 따라서 조기 종료를 활성화하고 Dropout을 증가시키는 A와 B가 이 문제를 완화하는 적절한 방법입니다.", "en": "Early stopping halts training once the performance on the validation dataset stops improving. This prevents the model from overfitting, which is likely the cause of performance degradation after a certain number of epochs. Dropout is a regularization technique that randomly deactivates neurons during training, reducing overfitting by forcing the model to generalize better. Increasing dropout can help mitigate the problem of performance degradation due to overfitting."}, {"n": 15, "t": "single", "q": "A company stores time-series data about user clicks in an Amazon S3 bucket. The raw data consists of millions of rows of user activity every day. ML engineers access the data to develop their ML models. The ML engineers need to generate daily reports and analyze click trends over the past 3 days by using Amazon Athena. The company must retain the data for 30 days before archiving the data. Which solution will provide the HIGHEST performance for data retrieval?", "kq": "어떤 회사가 사용자 클릭에 대한 시계열 데이터를 Amazon S3 버킷에 저장합니다. 원시 데이터는 매일 수백만 행의 사용자 활동으로 구성됩니다. ML 엔지니어들이 이 데이터에 접근해 ML 모델을 개발합니다. ML 엔지니어들은 Amazon Athena를 사용해 일일 보고서를 생성하고 지난 3일간의 클릭 추세를 분석해야 합니다. 회사는 데이터를 아카이브하기 전에 30일간 보관해야 합니다. 데이터 검색 성능이 가장 높은 방법은 무엇입니까?", "o": [{"k": "A", "t": "Keep all the time-series data without partitioning in the S3 bucket. Manually move data that is older than 30 days to separate S3 buckets.", "kt": "모든 시계열 데이터를 파티셔닝 없이 S3 버킷에 보관합니다. 30일이 지난 데이터는 수동으로 별도의 S3 버킷으로 옮깁니다."}, {"k": "B", "t": "Create AWS Lambda functions to copy the time-series data into separate S3 buckets. Apply S3 Lifecycle policies to archive data that is older than 30 days to S3 Glacier Flexible Retrieval.", "kt": "AWS Lambda 함수를 만들어 시계열 데이터를 별도의 S3 버킷으로 복사합니다. S3 Lifecycle 정책을 적용해 30일이 지난 데이터를 S3 Glacier Flexible Retrieval로 아카이브합니다."}, {"k": "C", "t": "Organize the time-series data into partitions by date prefix in the S3 bucket. Apply S3 Lifecycle policies to archive partitions that are older than 30 days to S3 Glacier Flexible Retrieval.", "kt": "S3 버킷에서 날짜 프리픽스로 시계열 데이터를 파티션으로 구성합니다. S3 Lifecycle 정책을 적용해 30일이 지난 파티션을 S3 Glacier Flexible Retrieval로 아카이브합니다."}, {"k": "D", "t": "Put each day's time-series data into its own S3 bucket. Use S3 Lifecycle policies to archive S3 buckets that hold data that is older than 30 days to S3 Glacier Flexible Retrieval.", "kt": "하루치 시계열 데이터를 각각 별도의 S3 버킷에 넣습니다. S3 Lifecycle 정책으로 30일이 지난 데이터를 담은 S3 버킷을 S3 Glacier Flexible Retrieval로 아카이브합니다."}], "a": ["C"], "ko": "S3 버킷의 시계열 데이터를 날짜 prefix 기준으로 파티셔닝하면 Amazon Athena가 쿼리 시 스캔해야 하는 데이터 양을 크게 줄일 수 있으므로 조회 성능이 향상됩니다. 이를 통해 ML 엔지니어는 최근 3일과 같은 특정 기간의 클릭 추세를 효율적으로 분석할 수 있습니다. 또한 30일이 지난 파티션에 S3 Lifecycle 정책을 적용해 S3 Glacier Flexible Retrieval로 아카이빙하면 최근 데이터에 대한 높은 조회 성능을 유지하면서도 비용 효율적인 보관 정책을 구현할 수 있습니다. 따라서 C가 가장 적절한 해결책입니다.", "en": "Partitioning the time-series data by date prefix in the S3 bucket significantly improves query performance in Amazon Athena by reducing the amount of data that needs to be scanned during queries. This allows the ML engineers to efficiently analyze trends over specific time periods, such as the past 3 days. Applying S3 Lifecycle policies to archive partitions older than 30 days to S3 Glacier Flexible Retrieval ensures cost- effective data retention and storage management while maintaining high performance for recent data retrieval."}, {"n": 16, "t": "single", "q": "A customer call center uses Amazon Transcribe to convert hundreds of audio recordings of conversations between customers and support agents to text files. The call center wants to use the text files to train an ML model. To comply with industry regulations, the call center must remove customer names, addresses, and phone numbers from the training text files. Which solution will meet these requirements with the LEAST development effort?", "kq": "어떤 고객 콜센터가 Amazon Transcribe를 사용해 고객과 상담원 간 대화 녹음 수백 건을 텍스트 파일로 변환합니다. 콜센터는 이 텍스트 파일로 ML 모델을 학습시키려고 합니다. 업계 규정을 준수하기 위해 콜센터는 학습용 텍스트 파일에서 고객 이름, 주소, 전화번호를 제거해야 합니다. 어떤 솔루션이 최소한의 개발 노력으로 이러한 요구 사항을 충족할까요?", "o": [{"k": "A", "t": "Use Amazon Bedrock Guardrails to process and redact personal information from the text files.", "kt": "Amazon Bedrock Guardrails를 사용해 텍스트 파일을 처리하고 개인정보를 마스킹합니다."}, {"k": "B", "t": "Use the AWS Glue Detect PII transform to remove personal information from the text files.", "kt": "AWS Glue의 Detect PII 변환을 사용해 텍스트 파일에서 개인정보를 제거합니다."}, {"k": "C", "t": "Store the text files in Amazon S3 buckets. Use S3 Object Lambda functions to redact personal information.", "kt": "텍스트 파일을 Amazon S3 버킷에 저장합니다. S3 Object Lambda 함수를 사용해 개인정보를 마스킹합니다."}, {"k": "D", "t": "Configure an Amazon SageMaker Data Wrangler custom transformation to remove personal information from the text files.", "kt": "Amazon SageMaker Data Wrangler 사용자 지정 변환을 구성해 텍스트 파일에서 개인정보를 제거합니다."}], "a": ["B"], "ko": "B안이 정답입니다. AWS Glue는 개인 식별 정보(PII)를 탐지, 마스킹 또는 제거할 수 있는 내장 Detect PII 변환 기능을 제공합니다. AWS 문서에 따르면 Detect PII 변환은 AWS에서 관리하는 사전 정의된 PII 엔터티 유형을 처리할 수 있으며, 전화번호와 주소 같은 민감한 정보를 제거하거나 마스킹하는 작업을 지원합니다. 문제에서 요구하는 고객 이름, 주소, 전화번호 제거와 직접적으로 일치하며, 최소 개발 노력이라는 조건에도 가장 부합합니다. Bedrock Guardrails는 이와 같은 대량 ETL 스타일의 학습 텍스트 파일 비식별 처리에 대한 표준 서비스가 아니며, S3 Object Lambda나 SageMaker Data Wrangler 사용자 지정 변환은 별도 코드 작성과 구현 부담이 더 큽니다. 따라서 AWS Glue Detect PII를 사용하는 B안이 가장 적절합니다.", "en": "Option B is correct because AWS Glue provides a built-in Detect PII transform that can detect, mask, or remove personally identifiable information with minimal custom development. AWS documentation says the Detect PII transform can process predefined AWS-managed PII entity types and supports actions such as removing or masking values. The examples in AWS docs explicitly mention sensitive entities such as phone numbers and addresses, which directly match the problem statement. The question specifically asks for the least development effort. That wording makes AWS Glue Detect PII the strongest answer because it is a native transformation capability rather than a custom code- heavy workflow. AWS also documents fine-grained sensitive data detection features that let you apply actions per entity type, improving usability and reducing the need to build custom parsing and redaction logic yourself. This is much easier than creating Lambda-based transformation code or custom text- cleaning logic inside another ML preprocessing tool. The other options are less suitable. Amazon Bedrock Guardrails is not the standard AWS service documented for bulk ETL-style redaction of training text files in this context. S3 Object Lambda would require more custom engineering to inspect and redact each object. SageMaker Data Wrangler custom transformation would also involve extra implementation work compared with using a purpose-built Glue transform. Because the call center already has text output and simply needs regulated fields like names, addresses, and phone numbers removed before training, the AWS-native low-effort solution is AWS Glue Detect PII. Therefore, the best verified answer is B."}, {"n": 17, "t": "single", "q": "A company collects customer data daily and stores it as compressed files in an Amazon S3 bucket partitioned by date. Each month, analysts process the data, check data quality, and upload results to Amazon QuickSight dashboards. An ML engineer needs to automatically check data quality before the data is sent to QuickSight, with the LEAST operational overhead. Which solution will meet these requirements?", "kq": "어떤 회사가 매일 고객 데이터를 수집해 날짜로 파티셔닝된 Amazon S3 버킷에 압축 파일로 저장합니다. 매달 분석가들이 데이터를 처리하고 데이터 품질을 점검한 뒤 결과를 Amazon QuickSight 대시보드에 업로드합니다. ML 엔지니어는 데이터가 QuickSight로 전달되기 전에 데이터 품질을 자동으로 점검해야 하며, 운영 부담은 최소여야 합니다. 어떤 솔루션이 이러한 요구 사항을 충족할까요?", "o": [{"k": "A", "t": "Run an AWS Glue crawler monthly and use AWS Glue Data Quality rules to check data quality.", "kt": "AWS Glue 크롤러를 매달 실행하고 AWS Glue Data Quality 규칙으로 데이터 품질을 점검합니다."}, {"k": "B", "t": "Run an AWS Glue crawler and create a custom AWS Glue job with PySpark to evaluate data quality.", "kt": "AWS Glue 크롤러를 실행하고 PySpark로 사용자 지정 AWS Glue 작업을 만들어 데이터 품질을 평가합니다."}, {"k": "C", "t": "Use AWS Lambda with Python scripts triggered by S3 uploads to evaluate data quality.", "kt": "S3 업로드로 트리거되는 Python 스크립트를 AWS Lambda에서 실행해 데이터 품질을 평가합니다."}, {"k": "D", "t": "Send S3 events to Amazon SQS and use Amazon CloudWatch Insights to evaluate data quality.", "kt": "S3 이벤트를 Amazon SQS로 보내고 Amazon CloudWatch Insights로 데이터 품질을 평가합니다."}], "a": ["A"], "ko": "AWS Glue Data Quality는 최소한의 설정으로 선언형 데이터 품질 검사를 수행할 수 있는 관리형 기능입니다. Glue 크롤러와 함께 사용하면 스키마를 자동으로 검색하고, 사용자 지정 코드 없이 품질 검증을 수행할 수 있습니다. A안은 이러한 목적에 맞게 설계된 AWS 기본 서비스를 사용하므로 운영 부담을 최소화합니다. B와 C는 사용자 지정 코드와 유지보수가 필요하며, D는 데이터 검증을 위한 서비스가 아닙니다. AWS 문서에서도 분석 파이프라인에서 확장 가능하고 자동화된 데이터 품질 검사를 위해 Glue Data Quality 규칙을 권장합니다. 따라서 A가 정답입니다.", "en": "AWS Glue Data Quality provides managed, declarative data quality checks with minimal configuration. Combined with Glue crawlers, it enables automatic schema discovery and quality validation without custom code. Option A uses native AWS services designed for this exact purpose, minimizing operational overhead. Options B and C require custom code and maintenance. Option D is not designed for data validation. AWS documentation explicitly recommends Glue Data Quality rules for scalable, automated data quality checks in analytics pipelines. Therefore, Option A is the correct and AWS-aligned solution."}, {"n": 18, "t": "single", "q": "Case Study A company is building a web-based AI application by using Amazon SageMaker. The application will provide the following capabilities and features: ML experimentation, training, a central model registry, model deployment, and model monitoring. The application must ensure secure and isolated use of training data during the ML lifecycle. The training data is stored in Amazon S3. The company is experimenting with consecutive training jobs. How can the company MINIMIZE infrastructure startup times for these jobs?", "kq": "[사례 연구] 어떤 회사가 Amazon SageMaker를 사용해 웹 기반 AI 애플리케이션을 만들고 있습니다. 이 애플리케이션은 ML 실험, 학습, 중앙 모델 레지스트리, 모델 배포, 모델 모니터링 기능을 제공할 예정입니다. 애플리케이션은 ML 수명 주기 동안 학습 데이터를 안전하고 격리된 방식으로 사용해야 합니다. 학습 데이터는 Amazon S3에 저장되어 있습니다. 회사는 연속적인 학습 작업을 실험하고 있습니다. 이 작업들의 인프라 시작 시간을 어떻게 최소화할 수 있습니까?", "o": [{"k": "A", "t": "Use Managed Spot Training.", "kt": "Managed Spot Training을 사용합니다."}, {"k": "B", "t": "Use SageMaker managed warm pools.", "kt": "SageMaker 관리형 웜 풀를 사용합니다."}, {"k": "C", "t": "Use SageMaker Training Compiler.", "kt": "SageMaker Training Compiler를 사용합니다."}, {"k": "D", "t": "Use the SageMaker distributed data parallelism (SMDDP) library.", "kt": "SageMaker 분산 데이터 병렬 처리(SMDDP) 라이브러리를 사용합니다."}], "a": ["B"], "ko": "Amazon SageMaker에서 연속적인 학습 작업을 실행할 때 각 작업마다 컴퓨팅 리소스를 새로 할당하고 설정하는 과정에서 시작 지연 시간이 발생할 수 있습니다. SageMaker Managed Warm Pools를 사용하면 이전 학습 작업에서 사용한 인프라를 일정 시간 유지했다가 동일하거나 유사한 구성의 후속 작업에서 재사용할 수 있습니다. 이를 통해 연속 학습 작업의 시작 시간을 크게 줄일 수 있습니다. Managed Spot Training은 비용 절감에는 도움이 되지만 시작 지연을 줄이는 기능은 아니며, Training Compiler는 학습 성능 최적화에 초점이 있고 인프라 시작 시간을 줄이지 않습니다. SMDDP는 분산 학습 효율을 높이는 기능이지 시작 시간 최적화 기능이 아닙니다. 따라서 SageMaker managed warm pools를 사용하는 B가 정답입니다.", "en": "When running consecutive training jobs in Amazon SageMaker, infrastructure provisioning can introduce latency, as each job typically requires the allocation and setup of compute resources. To minimize this startup time and enhance efficiency, Amazon SageMaker offers Managed Warm Pools. Key Features of Managed Warm Pools: Reduced Latency: Reusing existing infrastructure significantly reduces startup time for training jobs. Configurable Retention Period: Allows retention of resources after training jobs complete, defined by the KeepAlivePeriodInSeconds parameter. Automatic Matching: Subsequent jobs with matching configurations (e.g., instance type) can reuse retained infrastructure. Implementation Steps: Request Warm Pool Quota Increase: Increase the default resource quota for warm pools through AWS Service Quotas. Configure Training Jobs: Set KeepAlivePeriodInSeconds for the first training job to retain resources. Ensure subsequent jobs match the retained pool's configuration to enable reuse. Monitor Warm Pool Usage: Track warm pool status through the SageMaker console or API to confirm resource reuse. Considerations: Billing: Resources in warm pools are billable during the retention period. Matching Requirements: Jobs must have consistent configurations to use warm pools effectively. Alternative Options: Managed Spot Training: Reduces costs by using spare capacity but doesn't address startup latency. SageMaker Training Compiler: Optimizes training time but not infrastructure setup. SageMaker Distributed Data Parallelism Library: Enhances training efficiency but doesn't reduce setup time. By using Managed Warm Pools, the company can significantly reduce startup latency for consecutive training jobs, ensuring faster experimentation cycles with minimal operational overhead. AWS Documentation: Managed Warm Pools AWS Blog: Reduce ML Model Training Job Startup Time"}, {"n": 19, "t": "single", "q": "A construction company is using Amazon SageMaker AI to train specialized custom object detection models to identify road damage. The company uses images from multiple cameras. The images are stored as JPEG objects in an Amazon S3 bucket. The images need to be pre-processed by using computationally intensive computer vision techniques before the images can be used in the training job. The company needs to optimize data loading and pre-processing in the training job. The solution cannot affect model performance or increase compute or storage resources. Which solution will meet these requirements?", "kq": "한 건설 회사가 아마존 세이지메이커 AI를 사용하여 도로 손상을 식별하는 특수 맞춤형 객체 감지 모델을 학습시키고 있습니다. 이 회사는 여러 대의 카메라에서 촬영한 이미지를 사용하며, 이 이미지들은 아마존 S3 버킷에 JPEG 객체로 저장됩니다. 이미지를 학습 작업에 사용하기 전에 연산 집약적인 컴퓨터 비전 기술을 사용하여 전처리해야 합니다. 회사는 학습 작업에서 데이터 로딩 및 전처리를 최적화해야 합니다. 솔루션은 모델 성능에 영향을 미치거나 컴퓨팅 또는 스토리지 리소스를 증가시켜서는 안 됩니다. 어떤 솔루션이 이러한 요구 사항을 충족할까요?", "o": [{"k": "A", "t": "Use SageMaker AI file mode to load and process the images in batches.", "kt": "SageMaker AI 파일 모드를 사용하여 이미지를 일괄적으로 불러오고 처리합니다."}, {"k": "B", "t": "Reduce the batch size of the model and increase the number of pre-processing threads.", "kt": "모델의 배치 크기를 줄이고 전처리 스레드 수를 늘립니다."}, {"k": "C", "t": "Reduce the quality of the training images in the S3 bucket.", "kt": "S3 버킷에 있는 학습 이미지의 품질을 낮춥니다."}, {"k": "D", "t": "Convert the images into RecordIO format and use the lazy loading pattern.", "kt": "이미지를 RecordIO 형식으로 변환하고 지연 로딩 패턴을 사용합니다."}], "a": ["D"], "ko": "AWS 문서에서는 이미지 기반 학습 워크로드의 데이터 입력 파이프라인 최적화를 위해 RecordIO 형식과 lazy loading 패턴을 사용할 것을 권장합니다. RecordIO는 순차 읽기를 지원하는 바이너리 데이터 형식으로, S3에서 다수의 JPEG 이미지를 직접 읽을 때 발생할 수 있는 I/O 오버헤드를 줄이고 학습 중 처리량을 향상시킵니다. Lazy loading은 필요한 데이터만 메모리에 로드하므로 계산 집약적인 전처리 단계에서 CPU와 메모리 사용을 효율화합니다. File mode는 많은 수의 작은 S3 GET 요청으로 병목이 될 수 있고, 배치 크기 변경은 모델 수렴과 성능에 영향을 줄 수 있습니다. 이미지 품질을 낮추는 것은 모델 정확도를 저하시켜 요구 사항에 위배됩니다. 따라서 이미지를 RecordIO 형식으로 변환하고 lazy loading을 사용하는 D가 정답입니다.", "en": "AWS documentation recommends using RecordIO format with lazy loading to optimize data input pipelines for image-based training workloads. RecordIO is a binary data format that enables sequential reads, reducing I /O overhead and improving throughput during training. By converting JPEG images into RecordIO format, the training job can read data more efficiently from Amazon S3. Lazy loading ensures that only the required data is loaded into memory when needed, which optimizes CPU utilization during computationally intensive preprocessing steps. Option A (file mode) results in many small S3 GET requests, which can become a bottleneck for large image datasets. Option B changes training behavior and can negatively affect convergence and performance. Option C reduces image quality, which directly impacts model accuracy and violates the requirement. AWS SageMaker documentation explicitly highlights RecordIO and lazy loading as best practices for high- performance image training pipelines, especially when preprocessing is CPU-intensive. Therefore, Option D is the correct and AWS-aligned solution."}, {"n": 20, "t": "single", "q": "A company's ML engineer has deployed an ML model for sentiment analysis to an Amazon SageMaker endpoint. The ML engineer needs to explain to company stakeholders how the model makes predictions. Which solution will provide an explanation for the model's predictions?", "kq": "어떤 회사의 ML 엔지니어가 감정 분석용 ML 모델을 Amazon SageMaker 엔드포인트에 배포했습니다. ML 엔지니어는 모델이 어떻게 예측을 수행하는지 회사 이해관계자들에게 설명해야 합니다. 모델의 예측에 대한 설명을 제공하는 방법은 무엇입니까?", "o": [{"k": "A", "t": "Use SageMaker Model Monitor on the deployed model.", "kt": "배포된 모델에 SageMaker Model Monitor를 사용합니다."}, {"k": "B", "t": "Use SageMaker Clarify on the deployed model.", "kt": "배포된 모델에 SageMaker Clarify를 사용합니다."}, {"k": "C", "t": "Show the distribution of inferences from A/B testing in Amazon CloudWatch.", "kt": "Amazon CloudWatch에서 A/B 테스트 추론 결과의 분포를 확인합니다."}, {"k": "D", "t": "Add a shadow endpoint. Analyze prediction differences on samples.", "kt": "섀도 엔드포인트를 추가합니다. 샘플에 대한 예측 차이를 분석합니다."}], "a": ["B"], "ko": "SageMaker Clarify는 ML 모델의 설명 가능성을 제공하기 위해 설계된 서비스입니다. Clarify는 특성 중요도를 분석하고 입력 특성이 모델의 예측에 어떤 영향을 미치는지 설명할 수 있습니다. 배포된 SageMaker 모델에 Clarify를 사용하면 ML 엔지니어는 감성 분석 모델의 예측 근거를 이해하고, 이를 이해관계자에게 설명할 수 있는 인사이트를 생성할 수 있습니다. Model Monitor는 주로 모델 및 데이터 품질 모니터링에 사용되며, A/B 테스트 분포나 shadow endpoint 분석은 예측 결과 비교에는 도움이 될 수 있지만 모델이 왜 그런 예측을 했는지 설명하는 기능은 아닙니다. 따라서 SageMaker Clarify를 사용하는 B가 정답입니다.", "en": "SageMaker Clarify is designed to provide explainability for ML models. It can analyze feature importance and explain how input features influence the model's predictions. By using Clarify with the deployed SageMaker model, the ML engineer can generate insights and present them to stakeholders to explain the sentiment analysis predictions effectively."}, {"n": 21, "t": "single", "q": "An ML engineer is building a logistic regression model to predict customer churn for subscription services. The dataset contains two string variables: location and job_seniority_level. The location variable has 3 distinct values, and the job_seniority_level variable has over 10 distinct values. The ML engineer must perform preprocessing on the variables. Which solution will meet this requirement?", "kq": "ML 엔지니어가 구독 서비스의 고객 이탈을 예측하는 로지스틱 회귀 모델을 만들고 있습니다. 데이터셋에는 location과 job_seniority_level이라는 두 개의 문자열 변수가 있습니다. location 변수는 3개의 고유값을 가지며, job_seniority_level 변수는 10개가 넘는 고유값을 가집니다. ML 엔지니어는 이 변수들을 전처리해야 합니다. 어떤 솔루션이 이 요구 사항을 충족할까요?", "o": [{"k": "A", "t": "Apply tokenization to location. Apply ordinal encoding to job_seniority_level.", "kt": "location에는 토큰화를 적용하고, job_seniority_level에는 서수 인코딩(ordinal encoding)을 적용합니다."}, {"k": "B", "t": "Apply one-hot encoding to location. Apply ordinal encoding to job_seniority_level.", "kt": "location에는 원-핫 인코딩을 적용하고, job_seniority_level에는 서수 인코딩(ordinal encoding)을 적용합니다."}, {"k": "C", "t": "Apply binning to location. Apply standard scaling to job_seniority_level.", "kt": "location에는 비닝(binning)을 적용하고, job_seniority_level에는 표준 스케일링을 적용합니다."}, {"k": "D", "t": "Apply one-hot encoding to location. Apply standard scaling to job_seniority_level.", "kt": "location에는 원-핫 인코딩을 적용하고, job_seniority_level에는 표준 스케일링을 적용합니다."}], "a": ["B"], "ko": "로지스틱 회귀는 숫자형 입력 특성이 필요하며, 범주형 변수를 어떻게 인코딩하는지에 영향을 받습니다. location 특성은 고유값이 3개뿐이고 순서 관계가 없으므로 원-핫 인코딩이 적절합니다. 이렇게 하면 모델이 위치 간에 잘못된 숫자적 순서를 학습하는 것을 방지할 수 있습니다. job_seniority_level은 일반적으로 junior, mid-level, senior, lead와 같이 자연스러운 순서가 있는 범주형 변수이므로 순서형 인코딩이 적절합니다. 토큰화는 비정형 텍스트에 사용되며, 표준 스케일링은 연속형 숫자 변수에 사용하는 방식입니다. 따라서 location에는 원-핫 인코딩을, job_seniority_level에는 순서형 인코딩을 적용하는 B안이 정답입니다.", "en": "Logistic regression requires numeric input features and is sensitive to how categorical variables are encoded. AWS feature engineering best practices recommend one-hot encoding for low-cardinality categorical variables with no inherent order and ordinal encoding for categorical variables with a meaningful order. The location feature has only three distinct values and no ordinal relationship, making one-hot encoding the most appropriate method. This prevents the model from inferring a false numerical relationship between locations. The job_seniority_level feature typically has an inherent order (for example: junior, mid-level, senior, lead). Even with more than 10 categories, ordinal encoding preserves this natural hierarchy while keeping the feature dimensionality manageable. Tokenization is used for unstructured text, not structured categorical variables. Standard scaling applies only to continuous numeric features and is not suitable for categorical string variables. AWS documentation explicitly highlights using one-hot encoding for nominal features and ordinal encoding for ordered categorical features when preparing data for linear models such as logistic regression. Therefore, Option B is the correct and AWS-aligned solution."}, {"n": 22, "t": "single", "q": "A company wants to use Amazon SageMaker AI to host an ML model that runs on CPU for real-time predictions. The model has intermittent traffic during business hours and periods of no traffic after business hours. Which hosting option will serve inference requests in the MOST cost-effective manner?", "kq": "어떤 회사가 실시간 예측을 위해 CPU에서 실행되는 ML 모델을 Amazon SageMaker AI로 호스팅하려고 합니다. 이 모델은 업무 시간 중에는 간헐적인 트래픽이 있고, 업무 시간 이후에는 트래픽이 전혀 없는 기간이 있습니다. 가장 비용 효율적으로 추론 요청을 처리할 수 있는 호스팅 옵션은 무엇입니까?", "o": [{"k": "A", "t": "Deploy the model to a real-time endpoint with scheduled auto scaling.", "kt": "예약 Auto Scaling이 적용된 실시간 엔드포인트에 모델을 배포합니다."}, {"k": "B", "t": "Deploy the model to a SageMaker AI Serverless Inference endpoint with provisioned concurrency during business hours.", "kt": "업무 시간에 프로비저닝된 동시성을 적용한 SageMaker AI Serverless Inference 엔드포인트에 모델을 배포합니다."}, {"k": "C", "t": "Deploy the model to an asynchronous inference endpoint with auto scaling to zero.", "kt": "0까지 축소되는 Auto Scaling이 적용된 비동기 추론 엔드포인트에 모델을 배포합니다."}, {"k": "D", "t": "Deploy the model to a real-time endpoint and activate it only during business hours using AWS Lambda.", "kt": "실시간 엔드포인트에 모델을 배포하고 AWS Lambda를 사용해 업무 시간에만 활성화합니다."}], "a": ["B"], "ko": "AWS는 간헐적이거나 예측하기 어려운 트래픽을 가진 워크로드에 SageMaker Serverless Inference를 권장합니다. 서버리스 추론은 유휴 상태일 때 컴퓨팅 리소스를 0으로 자동 확장하므로 트래픽이 없는 시간대에는 비용이 발생하지 않습니다. 업무 시간 중 트래픽이 증가하는 경우에는 프로비저닝된 동시성을 사용해 낮은 지연 시간을 보장할 수 있습니다. 실시간 엔드포인트는 유휴 상태에서도 비용이 발생하고, 비동기 추론은 장시간 실행 작업에 더 적합합니다. 따라서 간헐적인 CPU 기반 실시간 추론 워크로드에는 B안이 가장 비용 효율적입니다.", "en": "AWS recommends SageMaker Serverless Inference for workloads with intermittent or unpredictable traffic. Serverless inference automatically scales compute resources to zero when idle, eliminating costs during periods with no traffic. For business-hour traffic spikes, provisioned concurrency ensures low-latency responses while still avoiding the cost of continuously running instances. This model is especially cost-effective for CPU- based inference workloads. Real-time endpoints incur costs even when idle, and asynchronous inference is designed for long- running jobs rather than low-latency predictions. AWS documentation explicitly states that Serverless Inference is the most cost-effective option for intermittent real-time workloads. Therefore, Option B is the correct choice."}, {"n": 23, "t": "single", "q": "An ML engineer needs to deploy a trained model based on a genetic algorithm. Predictions can take several minutes, and requests can include up to 100 MB of data. Which deployment solution will meet these requirements with the LEAST operational overhead?", "kq": "ML 엔지니어가 유전 알고리즘 기반으로 학습된 모델을 배포해야 합니다. 예측에는 몇 분이 걸릴 수 있고, 요청에는 최대 100MB의 데이터가 포함될 수 있습니다. 운영 부담이 가장 적은 배포 방법은 무엇입니까?", "o": [{"k": "A", "t": "Deploy on EC2 Auto Scaling behind an ALB.", "kt": "ALB 뒤에 EC2 Auto Scaling으로 배포합니다."}, {"k": "B", "t": "Deploy to a SageMaker AI real-time endpoint.", "kt": "SageMaker AI 실시간 엔드포인트에 배포합니다."}, {"k": "C", "t": "Deploy to a SageMaker AI Asynchronous Inference endpoint.", "kt": "SageMaker AI 비동기 추론(Asynchronous Inference) 엔드포인트에 배포합니다."}, {"k": "D", "t": "Deploy to Amazon ECS on EC2.", "kt": "EC2 기반 Amazon ECS에 배포합니다."}], "a": ["C"], "ko": "SageMaker Asynchronous Inference는 실행 시간이 길거나 입력 페이로드가 큰 추론 워크로드를 위해 설계되었습니다. 요청은 큐에 저장된 뒤 비동기적으로 처리되며 결과는 Amazon S3에 기록됩니다. 이 방식은 수 분이 걸리는 예측과 최대 100MB 수준의 대용량 요청을 처리하는 데 적합합니다. 실시간 엔드포인트는 페이로드 크기와 응답 시간 제한이 있고, EC2나 ECS 기반 배포는 인프라 관리 부담이 큽니다. 따라서 운영 부담이 가장 적은 적절한 배포 방식은 C안입니다.", "en": "SageMaker Asynchronous Inference is designed for long-running inference workloads and large payloads (up to 1 GB). Requests are queued, processed asynchronously, and results are written to Amazon S3. Real-time endpoints have payload and timeout limits. EC2 and ECS require infrastructure management, increasing operational overhead. AWS documentation explicitly recommends asynchronous inference for workloads with large inputs and long execution times. Therefore, Option C is the correct and most efficient solution."}, {"n": 24, "t": "single", "q": "An ML engineer is building an ML model in Amazon SageMaker AI. The ML engineer needs to load historical data directly from Amazon S3, Amazon Athena, and Snowflake into SageMaker AI. Which solution will meet this requirement?", "kq": "ML 엔지니어가 Amazon SageMaker AI에서 ML 모델을 만들고 있습니다. ML 엔지니어는 Amazon S3, Amazon Athena, Snowflake에서 과거 데이터를 SageMaker AI로 직접 로드해야 합니다. 어떤 솔루션이 이 요구 사항을 충족할까요?", "o": [{"k": "A", "t": "Use AWS Glue DataBrew to import the data into SageMaker AI.", "kt": "AWS Glue DataBrew를 사용해 데이터를 SageMaker AI로 가져옵니다."}, {"k": "B", "t": "Build a pipeline in SageMaker Pipelines to process the data. Use AWS DataSync to load the processed data into SageMaker AI.", "kt": "SageMaker Pipelines에서 파이프라인을 만들어 데이터를 처리합니다. AWS DataSync를 사용해 처리된 데이터를 SageMaker AI로 로드합니다."}, {
