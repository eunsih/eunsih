"k": "C", "t": "Create a feature store in SageMaker Feature Store. Use an Apache Spark connector to Feature Store to access the data.", "kt": "SageMaker Feature Store에 피처 스토어를 만듭니다. Feature Store용 Apache Spark 커넥터를 사용해 데이터에 접근합니다."}, {"k": "D", "t": "Use SageMaker Data Wrangler to query and import the data.", "kt": "SageMaker Data Wrangler를 사용해 데이터를 쿼리하고 가져옵니다."}], "a": ["D"], "ko": "SageMaker Data Wrangler는 SageMaker Studio에서 여러 데이터 소스의 데이터를 직접 가져오고 변환 및 분석할 수 있는 AWS 기본 도구입니다. Data Wrangler는 Amazon S3, Amazon Athena, Snowflake를 기본 데이터 소스로 지원하므로 별도의 사용자 지정 수집 코드를 작성하지 않고도 데이터를 조회하고 가져올 수 있습니다. Glue DataBrew는 일반적인 데이터 준비 도구이지만 SageMaker 학습 워크플로로 직접 데이터를 적재하는 목적에는 적합하지 않습니다. DataSync나 Feature Store를 사용하는 방식은 요구 사항보다 복잡합니다. 따라서 SageMaker Data Wrangler를 사용하는 D안이 정답입니다.", "en": "AWS provides Amazon SageMaker Data Wrangler as a native tool for importing, transforming, and analyzing data from multiple sources directly into SageMaker Studio. Data Wrangler supports Amazon S3, Amazon Athena, and Snowflake as built-in data sources through managed connectors. Using Data Wrangler, ML engineers can query data from Athena using SQL, load structured files from S3, and securely connect to Snowflake without writing custom ingestion code. This approach significantly reduces development effort and aligns with AWS best practices for rapid ML experimentation. Option A is incorrect because AWS Glue DataBrew is designed for data preparation but does not natively integrate with SageMaker training workflows. Option B introduces unnecessary complexity and is not intended for direct ML data loading. Option C focuses on feature storage, not raw historical data ingestion. Therefore, SageMaker Data Wrangler is the correct solution."}, {"n": 25, "t": "single", "q": "A government agency is conducting a national census to assess program needs by area and city. The census form collects approximately 500 responses from each citizen. The agency needs to analyze the data to extract meaningful insights. The agency wants to reduce the dimensions of the high-dimensional data to uncover hidden patterns. Which solution will meet these requirements?", "kq": "어떤 정부 기관이 지역과 도시별 프로그램 수요를 평가하기 위해 전국 인구 조사를 진행하고 있습니다. 조사 양식은 시민 한 명당 약 500개의 응답을 수집합니다. 기관은 이 데이터를 분석해 의미 있는 인사이트를 도출해야 합니다. 기관은 숨겨진 패턴을 찾아내기 위해 고차원 데이터의 차원을 줄이려고 합니다. 어떤 솔루션이 이러한 요구 사항을 충족할까요?", "o": [{"k": "A", "t": "Use the principal component analysis (PCA) algorithm in Amazon SageMaker AI.", "kt": "Amazon SageMaker AI의 주성분 분석(PCA) 알고리즘을 사용합니다."}, {"k": "B", "t": "Use the t-Distributed Stochastic Neighbor Embedding (t-SNE) algorithm in Amazon SageMaker AI.", "kt": "Amazon SageMaker AI의 t-SNE(t-Distributed Stochastic Neighbor Embedding) 알고리즘을 사용합니다."}, {"k": "C", "t": "Use the k-means algorithm in Amazon SageMaker AI.", "kt": "Amazon SageMaker AI의 k-means 알고리즘을 사용합니다."}, {"k": "D", "t": "Use the Random Cut Forest (RCF) algorithm in Amazon SageMaker AI.", "kt": "Amazon SageMaker AI의 Random Cut Forest(RCF) 알고리즘을 사용합니다."}], "a": ["A"], "ko": "이 문제의 핵심 요구 사항은 고차원 구조화 데이터의 차원을 줄여 숨겨진 패턴을 찾는 것입니다. 주성분 분석(PCA)은 이러한 목적에 맞게 설계된 선형 차원 축소 기법이며, Amazon SageMaker의 내장 알고리즘으로 제공됩니다. PCA는 원래 특성을 더 작은 수의 직교 성분으로 변환하면서 가능한 많은 분산을 보존합니다. t-SNE는 주로 2D 또는 3D 시각화에 사용되며 대규모 프로덕션 분석에는 적합하지 않습니다. k-means는 클러스터링 알고리즘이고, Random Cut Forest는 이상 탐지 알고리즘입니다. 따라서 PCA를 사용하는 A안이 정답입니다.", "en": "The primary requirement is dimensionality reduction on high-dimensional structured data to uncover hidden patterns. Principal Component Analysis (PCA) is a linear dimensionality reduction technique specifically designed for this purpose and is available as a built-in algorithm in Amazon SageMaker. PCA transforms the original features into a smaller set of orthogonal components that preserve the maximum possible variance. This makes PCA ideal for large tabular datasets such as census data, where hundreds of correlated variables are common. t-SNE (Option B) is mainly used for visualization in very low dimensions (2D or 3D) and does not scale well for large datasets or production analysis. k-means (Option C) is a clustering algorithm, not a dimensionality reduction method. Random Cut Forest (Option D) is used for anomaly detection. Therefore, PCA is the correct and AWS-recommended solution."}, {"n": 26, "t": "single", "q": "A company's dataset for prediction analytics contains duplicate records, missing data, and unusually extreme high or low values. The company needs a solution to resolve the data quality issues quickly. The solution must maintain data integrity and have the LEAST operational overhead. Which solution will meet these requirements?", "kq": "어떤 회사의 예측 분석용 데이터셋에 중복 레코드, 결측 데이터, 비정상적으로 크거나 작은 극단값이 포함되어 있습니다. 회사는 이 데이터 품질 문제를 빠르게 해결할 솔루션이 필요합니다. 솔루션은 데이터 무결성을 유지해야 하며 운영 부담이 최소여야 합니다. 어떤 솔루션이 이러한 요구 사항을 충족할까요?", "o": [{"k": "A", "t": "Use AWS Glue DataBrew to delete duplicate records, fill missing values with medians, and replace extreme values with values in a normal range.", "kt": "AWS Glue DataBrew를 사용해 중복 레코드를 삭제하고, 결측값은 중앙값으로 채우고, 극단값은 정상 범위의 값으로 대체합니다."}, {"k": "B", "t": "Configure an AWS Glue job to identify records with missing values and extreme measurements and delete them.", "kt": "결측값과 극단적인 측정값이 있는 레코드를 식별해 삭제하는 AWS Glue 작업을 구성합니다."}, {"k": "C", "t": "Create an Amazon EMR Spark job to replace missing values with zeros and merge duplicate records.", "kt": "결측값을 0으로 대체하고 중복 레코드를 병합하는 Amazon EMR Spark 작업을 만듭니다."}, {"k": "D", "t": "Use Amazon SageMaker Data Wrangler to delete duplicates, apply statistical modeling for missing values, and apply outlier detection algorithms.", "kt": "Amazon SageMaker Data Wrangler를 사용해 중복을 삭제하고, 결측값에는 통계적 모델링을 적용하고, 이상치 탐지 알고리즘을 적용합니다."}], "a": ["A"], "ko": "AWS Glue DataBrew는 코드 작성 없이 또는 최소한의 코드로 데이터 준비를 수행할 수 있도록 설계된 서비스이므로 중복 레코드, 결측값, 이상치와 같은 일반적인 데이터 품질 문제를 빠르게 해결하는 데 적합합니다. DataBrew는 중복 제거, 결측값 대체, 이상치 처리와 같은 내장 변환 기능을 제공하며, 인프라를 직접 관리할 필요가 없습니다. 중앙값으로 결측값을 채우고 극단값을 정상 범위로 조정하는 방식은 데이터 무결성을 유지하는 데 적절합니다. 반면 레코드를 삭제하거나 별도 Spark 작업을 구성하는 방식은 데이터 손실 또는 운영 복잡도를 증가시킵니다. 따라서 A안이 정답입니다.", "en": "AWS Glue DataBrew is designed specifically for no-code and low-code data preparation, making it the fastest and lowest-overhead solution for resolving common data quality issues. DataBrew provides built-in transformations for deduplication, missing value imputation, and outlier handling while preserving data integrity. Option A uses standard statistical techniques such as median imputation and value normalization, which are widely accepted and maintain the distribution of the data. DataBrew jobs are fully managed and do not require infrastructure setup or maintenance. Option B deletes records, which can lead to data loss and does not preserve integrity. Option C introduces unnecessary infrastructure complexity and uses poor data imputation practices. Option D provides advanced capabilities but requires more configuration and ML expertise, increasing operational overhead. AWS documentation clearly positions DataBrew as the preferred solution for quick, reliable data cleaning with minimal effort. Therefore, Option A is the correct answer."}, {"n": 27, "t": "single", "q": "A company has developed a computer vision model. The company needs to deploy the model into production on Amazon SageMaker AI. The company has not hosted a model on SageMaker AI previously. An ML engineer needs to implement a solution to track model versions. The solution also must provide recommendations about which Amazon EC2 instance types to use to host the model. Which solution will meet these requirements?", "kq": "어떤 회사가 컴퓨터 비전 모델을 개발했습니다. 회사는 이 모델을 Amazon SageMaker AI의 운영 환경에 배포해야 합니다. 회사는 이전에 SageMaker AI에서 모델을 호스팅한 경험이 없습니다. ML 엔지니어는 모델 버전을 추적하는 솔루션을 구현해야 합니다. 또한 솔루션은 모델 호스팅에 사용할 Amazon EC2 인스턴스 유형에 대한 권장 사항도 제공해야 합니다. 어떤 솔루션이 이러한 요구 사항을 충족할까요?", "o": [{"k": "A", "t": "Register the model in Amazon Elastic Container Registry (Amazon ECR). Use AWS Compute Optimizer for recommendations about instance types.", "kt": "모델을 Amazon ECR에 등록합니다. 인스턴스 유형 권장에는 AWS Compute Optimizer를 사용합니다."}, {"k": "B", "t": "Register the model in the SageMaker Model Registry. Use SageMaker Autopilot for recommendations about instance types.", "kt": "모델을 SageMaker Model Registry에 등록합니다. 인스턴스 유형 권장에는 SageMaker Autopilot을 사용합니다."}, {"k": "C", "t": "Register the model in the SageMaker Model Registry. Use SageMaker Inference Recommender for recommendations about instance types.", "kt": "모델을 SageMaker Model Registry에 등록합니다. 인스턴스 유형 권장에는 SageMaker Inference Recommender를 사용합니다."}, {"k": "D", "t": "Register the model in Amazon Elastic Container Registry (Amazon ECR). Use SageMaker Experiments for recommendations about instance types.", "kt": "모델을 Amazon ECR에 등록합니다. 인스턴스 유형 권장에는 SageMaker Experiments를 사용합니다."}], "a": ["C"], "ko": "이 문제는 모델 버전 추적과 배포 인스턴스 유형 추천이라는 두 가지 요구 사항을 포함합니다. SageMaker Model Registry는 모델 패키지와 버전을 등록하고 관리하기 위한 기능이며, ML 수명주기에서 모델 버전 추적에 적합합니다. SageMaker Inference Recommender는 모델과 워크로드에 적합한 인스턴스 유형과 엔드포인트 구성을 추천하기 위해 벤치마킹과 부하 테스트를 자동화합니다. Amazon ECR은 컨테이너 이미지를 저장하는 서비스이지 모델 버전 관리 도구가 아니며, SageMaker Autopilot은 모델 자동 생성에 사용됩니다. SageMaker Experiments는 실험 추적 기능이지 배포 인스턴스 추천 기능이 아닙니다. 따라서 C안이 정답입니다.", "en": "Option C is correct because the requirement has two separate parts: first, the company must track model versions; second, it needs recommendations for which instance types to use for hosting the model in SageMaker AI. AWS documentation identifies the SageMaker Model Registry as the SageMaker feature used to register and manage model packages and versions as part of the ML lifecycle. For hosting recommendations, AWS documentation says Amazon SageMaker Inference Recommender helps select the best instance type and configuration for ML models and workloads by automating benchmarking and load testing across SageMaker AI instances. The AWS Inference Recommender documentation is especially important here because it explicitly says you can use it after you register a model to the SageMaker Model Registry with model artifacts. It also states that Inference Recommender helps choose the best endpoint type and configuration and returns recommendations that include the instance type in the resulting endpoint configuration. That is an exact match to the question's requirement to recommend hosting instance types for a model that has not yet been hosted on SageMaker AI. The other options do not match AWS service purposes. Amazon ECR stores container images, not model versions. AWS Compute Optimizer is not the SageMaker-native service documented for inference benchmarking of ML models. SageMaker Autopilot is for automated model building, not inference instance recommendations. SageMaker Experiments tracks experiment metadata, trials, and runs, but it does not recommend deployment instance types. Therefore, the fully verified AWS- docs answer is C."}, {"n": 28, "t": "single", "q": "An ML engineer needs to process thousands of existing CSV objects and new CSV objects that are uploaded. The CSV objects are stored in a central Amazon S3 bucket and have the same number of columns. One of the columns is a transaction date. The ML engineer must query the data based on the transaction date. Which solution will meet these requirements with the LEAST operational overhead?", "kq": "ML 엔지니어가 기존의 수천 개 CSV 객체와 새로 업로드되는 CSV 객체를 처리해야 합니다. CSV 객체들은 중앙 Amazon S3 버킷에 저장되어 있고 컬럼 수가 동일합니다. 그중 한 컬럼은 거래 날짜입니다. ML 엔지니어는 거래 날짜를 기준으로 데이터를 쿼리해야 합니다. 어떤 솔루션이 최소한의 운영 오버헤드로 이러한 요구 사항을 충족할까요?", "o": [{"k": "A", "t": "Use an Amazon Athena CREATE TABLE AS SELECT (CTAS) statement to create a table based on the transaction date from data in the central S3 bucket. Query the objects from the table.", "kt": "Amazon Athena의 CTAS(CREATE TABLE AS SELECT) 문을 사용해 중앙 S3 버킷의 데이터에서 거래 날짜를 기준으로 테이블을 만듭니다. 그 테이블에서 객체를 쿼리합니다."}, {"k": "B", "t": "Create a new S3 bucket for processed data. Set up S3 replication from the central S3 bucket to the new S3 bucket. Use S3 Object Lambda to query the objects based on transaction date.", "kt": "처리된 데이터용 새 S3 버킷을 만듭니다. 중앙 S3 버킷에서 새 S3 버킷으로 S3 복제를 설정합니다. S3 Object Lambda를 사용해 거래 날짜를 기준으로 객체를 쿼리합니다."}, {"k": "C", "t": "Create a new S3 bucket for processed data. Use AWS Glue for Apache Spark to create a job to query the CSV objects based on transaction date. Configure the job to store the results in the new S3 bucket. Query the objects from the new S3 bucket.", "kt": "처리된 데이터용 새 S3 버킷을 만듭니다. AWS Glue for Apache Spark로 작업을 만들어 거래 날짜를 기준으로 CSV 객체를 쿼리합니다. 결과를 새 S3 버킷에 저장하도록 작업을 구성합니다. 새 S3 버킷에서 객체를 쿼리합니다."}, {"k": "D", "t": "Create a new S3 bucket for processed data. Use Amazon Data Firehose to transfer the data from the central S3 bucket to the new S3 bucket. Configure Firehose to run an AWS Lambda function to query the data based on transaction date.", "kt": "처리된 데이터용 새 S3 버킷을 만듭니다. Amazon Data Firehose를 사용해 중앙 S3 버킷에서 새 S3 버킷으로 데이터를 전송합니다. 거래 날짜를 기준으로 데이터를 쿼리하는 AWS Lambda 함수를 실행하도록 Firehose를 구성합니다."}], "a": ["A"], "ko": "이 시나리오에서는 Amazon S3에 저장된 기존 CSV 객체와 새로 업로드되는 CSV 객체를 거래일 기준으로 조회해야 하며, 운영 부담을 최소화해야 합니다. Amazon Athena는 S3 데이터를 표준 SQL로 직접 조회할 수 있는 서버리스 쿼리 서비스입니다. CTAS 문을 사용하면 거래일 기준으로 파티셔닝된 테이블을 생성할 수 있어 쿼리 성능을 높이고 필요한 데이터만 스캔해 비용을 줄일 수 있습니다. 별도 버킷, S3 Object Lambda, Glue Spark 작업, Firehose와 Lambda 조합은 불필요한 인프라와 운영 복잡도를 추가합니다. 따라서 Athena CTAS를 사용하는 A안이 가장 적절합니다.", "en": "Scenario: The ML engineer needs a low-overhead solution to query thousands of existing and new CSV objects stored in Amazon S3 based on a transaction date. Why Athena? Serverless: Amazon Athena is a serverless query service that allows direct querying of data stored in S3 using standard SQL, reducing operational overhead. Ease of Use: By using the CTAS statement, the engineer can create a table with optimized partitions based on the transaction date. Partitioning improves query performance and minimizes costs by scanning only relevant data. Low Operational Overhead: No need to manage or provision additional infrastructure. Athena integrates seamlessly with S3, and CTAS simplifies table creation and optimization. Steps to Implement: Organize Data in S3: Store CSV files in a bucket in a consistent format and directory structure if possible. Configure Athena: Use the AWS Management Console or Athena CLI to set up Athena to point to the S3 bucket. Run CTAS Statement: CREATE TABLE processed_data WITH (format ='PARQUET', external_location ='s3://processed-bucket/', partitioned_by = ARRAY['transaction_date']) AS SELECT * FROM input_data; This creates a new table with data partitioned by transaction date. Query the Data: Use standard SQL queries to fetch data based on the transaction date. References: Amazon Athena CTAS Documentation Partitioning Data in Athena"}, {"n": 29, "t": "single", "q": "A travel company wants to create an ML model to recommend the next airport destination for its users. The company has collected millions of data records about user location, recent search history on the company's website, and 2,000 available airports. The data has several categorical features with a target column that is expected to have a high-dimensional sparse matrix. The company needs to use Amazon SageMaker AI built-in algorithms for the model. An ML engineer converts the categorical features by using one-hot encoding. Which algorithm should the ML engineer implement to meet these requirements?", "kq": "어떤 여행사가 사용자에게 다음 공항 목적지를 추천하는 ML 모델을 만들려고 합니다. 회사는 사용자 위치, 회사 웹사이트에서의 최근 검색 기록, 그리고 이용 가능한 2,000개 공항에 관한 수백만 건의 데이터 레코드를 수집했습니다. 데이터에는 여러 범주형 특성이 있고, 대상(target) 컬럼은 고차원 희소 행렬이 될 것으로 예상됩니다. 회사는 이 모델에 Amazon SageMaker AI 내장 알고리즘을 사용해야 합니다. ML 엔지니어는 원-핫 인코딩으로 범주형 특성을 변환했습니다. 요구 사항을 충족하려면 어떤 알고리즘을 구현해야 합니까?", "o": [{"k": "A", "t": "Use the CatBoost algorithm to recommend the next airport destination.", "kt": "CatBoost 알고리즘을 사용해 다음 공항 목적지를 추천합니다."}, {"k": "B", "t": "Use the DeepAR forecasting algorithm to recommend the next airport destination.", "kt": "DeepAR 예측 알고리즘을 사용해 다음 공항 목적지를 추천합니다."}, {"k": "C", "t": "Use the Factorization Machines algorithm to recommend the next airport destination.", "kt": "Factorization Machines 알고리즘을 사용해 다음 공항 목적지를 추천합니다."}, {"k": "D", "t": "Use the k-means algorithm to cluster users into groups and map each group to the next airport destination.", "kt": "k-means 알고리즘으로 사용자를 그룹으로 클러스터링하고 각 그룹을 다음 공항 목적지에 매핑합니다."}], "a": ["C"], "ko": "이 문제는 수백만 건의 레코드, 다수의 범주형 변수, 원-핫 인코딩으로 생성된 고차원 희소 특성 공간을 가진 추천 시스템에 해당합니다. SageMaker Factorization Machines 알고리즘은 희소 데이터셋을 효율적으로 처리하고 범주형 특성 간 상호작용을 학습하는 데 적합합니다. 특히 사용자와 항목 간 관계를 예측하는 추천 문제에 잘 맞습니다. DeepAR는 시계열 예측 알고리즘이고, k-means는 비지도 클러스터링 알고리즘이며, CatBoost는 SageMaker 내장 알고리즘 요구 사항에 맞지 않습니다. 따라서 Factorization Machines를 사용하는 C안이 정답입니다.", "en": "This problem describes a recommendation system with millions of records, many categorical variables, and a high-dimensional sparse feature space created by one-hot encoding. AWS documentation explicitly recommends Amazon SageMaker Factorization Machines (FM) for such use cases. Factorization Machines are designed to handle sparse datasets efficiently and to model interactions between categorical features without explicitly enumerating all feature combinations. This capability makes FM particularly well-suited for recommendation problems such as predicting user-item interactions, including destination recommendations. With 2,000 possible airport destinations, the target space is large and sparse. One-hot encoding further increases sparsity. Factorization Machines address this challenge by learning latent factors that capture relationships between features, even when many feature combinations are rarely observed. Option A (CatBoost) is not an Amazon SageMaker built-in algorithm and therefore does not meet the requirement. Option B (DeepAR) is a time-series forecasting algorithm, not intended for recommendation or classification problems. Option D (k-means) is an unsupervised clustering algorithm and cannot directly predict a specific destination label. AWS documentation explicitly lists recommendation systems and click prediction as primary use cases for the SageMaker Factorization Machines algorithm. Therefore, Option C is the correct and AWS-verified choice."}, {"n": 30, "t": "single", "q": "An ML engineer is setting up a CI/CD pipeline for an ML workflow in Amazon SageMaker AI. The pipeline must automatically retrain, test, and deploy a model whenever new data is uploaded to an Amazon S3 bucket. New data files are approximately 10 GB in size. The ML engineer also needs to track model versions for auditing. Which solution will meet these requirements?", "kq": "ML 엔지니어가 Amazon SageMaker AI의 ML 워크플로를 위한 CI/CD 파이프라인을 구성하고 있습니다. 파이프라인은 새 데이터가 Amazon S3 버킷에 업로드될 때마다 모델을 자동으로 재학습, 테스트, 배포해야 합니다. 새 데이터 파일의 크기는 약 10GB입니다. ML 엔지니어는 감사를 위해 모델 버전도 추적해야 합니다. 어떤 솔루션이 이러한 요구 사항을 충족할까요?", "o": [{"k": "A", "t": "Use AWS CodePipeline, Amazon S3, and AWS CodeBuild to retrain and deploy the model automatically and track model versions.", "kt": "AWS CodePipeline, Amazon S3, AWS CodeBuild를 사용해 모델을 자동으로 재학습·배포하고 모델 버전을 추적합니다."}, {"k": "B", "t": "Use SageMaker Pipelines with the SageMaker Model Registry to orchestrate model training and version tracking.", "kt": "SageMaker Pipelines와 SageMaker Model Registry를 함께 사용해 모델 학습과 버전 추적을 오케스트레이션합니다."}, {"k": "C", "t": "Use AWS Lambda and Amazon EventBridge to retrain and deploy the model and track versions via logs.", "kt": "AWS Lambda와 Amazon EventBridge를 사용해 모델을 재학습·배포하고 로그로 버전을 추적합니다."}, {"k": "D", "t": "Manually retrain and deploy the model using SageMaker notebook instances and track versions with AWS CloudTrail.", "kt": "SageMaker 노트북 인스턴스로 모델을 수동으로 재학습·배포하고 AWS CloudTrail로 버전을 추적합니다."}], "a": ["B"], "ko": "SageMaker Pipelines는 ML 워크플로를 위한 AWS 기본 CI/CD 서비스로, 데이터 처리, 학습, 평가, 배포 단계를 자동화할 수 있습니다. 새 데이터가 S3에 업로드될 때 모델을 자동으로 재학습하고 테스트 및 배포하는 요구 사항에 적합합니다. 모델 버전 추적과 감사 요구 사항에는 SageMaker Model Registry가 사용되며, 모델 버전, 메타데이터, 승인 상태, 배포 이력을 관리할 수 있습니다. Lambda는 10GB 규모의 데이터 처리에 적합하지 않고, CodeBuild는 ML 모델 거버넌스 기능이 부족합니다. 수동 노트북 방식도 CI/CD 요구 사항을 충족하지 못합니다. 따라서 SageMaker Pipelines와 Model Registry를 함께 사용하는 B안이 정답입니다.", "en": "AWS documentation identifies SageMaker Pipelines as the native CI/CD service for ML workflows. Pipelines allow engineers to define automated steps for data processing, training, evaluation, and deployment, making them ideal for retraining models when new data arrives in Amazon S3. For version tracking and auditing, SageMaker Model Registry is explicitly designed to manage model versions, metadata, approval status, and deployment history. This satisfies regulatory and audit requirements without custom tooling. AWS Lambda is not suitable for handling large datasets (10 GB), and CodeBuild is not ML-aware and lacks built-in model governance. Manual notebook workflows do not meet CI/CD or automation requirements. AWS best practices strongly recommend SageMaker Pipelines combined with the Model Registry for scalable, auditable, and production-grade ML CI/CD pipelines. Therefore, Option B is the correct and AWS-verified solution."}, {"n": 31, "t": "single", "q": "Case Study A company is building a web-based AI application by using Amazon SageMaker. The application will provide the following capabilities and features: ML experimentation, training, a central model registry, model deployment, and model monitoring. The application must ensure secure and isolated use of training data during the ML lifecycle. The training data is stored in Amazon S3. The company must implement a manual approval-based workflow to ensure that only approved models can be deployed to production endpoints. Which solution will meet this requirement?", "kq": "[사례 연구] 어떤 회사가 Amazon SageMaker를 사용해 웹 기반 AI 애플리케이션을 만들고 있습니다. 이 애플리케이션은 ML 실험, 학습, 중앙 모델 레지스트리, 모델 배포, 모델 모니터링 기능을 제공할 예정입니다. 애플리케이션은 ML 수명 주기 동안 학습 데이터를 안전하고 격리된 방식으로 사용해야 합니다. 학습 데이터는 Amazon S3에 저장되어 있습니다. 회사는 승인된 모델만 운영 엔드포인트에 배포될 수 있도록 수동 승인 기반 워크플로를 구현해야 합니다. 어떤 솔루션이 이 요구 사항을 충족할까요?", "o": [{"k": "A", "t": "Use SageMaker Experiments to facilitate the approval process during model registration.", "kt": "SageMaker Experiments를 사용해 모델 등록 과정에서 승인 절차를 지원합니다."}, {"k": "B", "t": "Use SageMaker ML Lineage Tracking on the central model registry. Create tracking entities for the approval process.", "kt": "중앙 모델 레지스트리에 SageMaker ML Lineage Tracking을 사용합니다. 승인 절차를 위한 추적 엔터티를 만듭니다."}, {"k": "C", "t": "Use SageMaker Model Monitor to evaluate the performance of the model and to manage the approval.", "kt": "SageMaker Model Monitor를 사용해 모델 성능을 평가하고 승인을 관리합니다."}, {"k": "D", "t": "Use SageMaker Pipelines. When a model version is registered, use the AWS SDK to change the approval status to \" Approved. \"", "kt": "SageMaker Pipelines를 사용합니다. 모델 버전이 등록되면 AWS SDK로 승인 상태를 'Approved'로 변경합니다."}], "a": ["D"], "ko": "프로덕션 엔드포인트에는 승인된 모델만 배포되도록 하려면 SageMaker Pipelines와 SageMaker Model Registry를 함께 사용하는 것이 적절합니다. SageMaker Pipelines는 데이터 전처리, 학습, 평가, 모델 등록 및 배포 단계를 자동화할 수 있으며, Model Registry는 모델 버전과 승인 상태를 관리합니다. 모델을 등록할 때 승인 상태를 PendingManualApproval로 설정한 뒤, 지정된 승인자가 모델 성능을 검토하고 AWS SDK 또는 SageMaker Studio를 통해 Approved 상태로 변경할 수 있습니다. 이후 배포 단계는 승인된 모델만 대상으로 실행되도록 구성할 수 있습니다. SageMaker Experiments는 실험 추적 도구이고, Lineage Tracking은 계보 추적 기능이며, Model Monitor는 운영 중 모델 성능 모니터링에 사용되므로 수동 승인 기반 배포 워크플로의 핵심 기능을 제공하지 않습니다. 따라서 SageMaker Pipelines에서 모델 등록 후 AWS SDK로 승인 상태를 Approved로 변경하는 D안이 정답입니다.", "en": "To implement a manual approval-based workflow ensuring that only approved models are deployed to production endpoints, Amazon SageMaker provides integrated tools such as SageMaker Pipelines and the SageMaker Model Registry. SageMaker Pipelines is a robust service for building, automating, and managing end-to-end machine learning workflows. It facilitates the orchestration of various steps in the ML lifecycle, including data preprocessing, model training, evaluation, and deployment. By integrating with the SageMaker Model Registry, it enables seamless tracking and management of model versions and their approval statuses. Implementation Steps: Define the Pipeline: Create a SageMaker Pipeline encompassing steps for data preprocessing, model training, evaluation, and registration of the model in the Model Registry. Incorporate a Condition Step to assess model performance metrics. If the model meets predefined criteria, proceed to the next step; otherwise, halt the process. Register the Model: Utilize the RegisterModel step to add the trained model to the Model Registry. Set the ModelApprovalStatus parameter to PendingManualApproval during registration. This status indicates that the model awaits manual review before deployment. Manual Approval Process: Notify the designated approver upon model registration. This can be achieved by integrating Amazon EventBridge to monitor registration events and trigger notifications via AWS Lambda functions. The approver reviews the model's performance and, if satisfactory, updates the model's status to Approved using the AWS SDK or through the SageMaker Studio interface. Deploy the Approved Model: Configure the pipeline to automatically deploy models with an Approved status to the production endpoint. This can be managed by adding deployment steps conditioned on the model's approval status. Advantages of This Approach: Automated Workflow: SageMaker Pipelines streamline the ML workflow, reducing manual interventions and potential errors. Governance and Compliance: The manual approval step ensures that only thoroughly evaluated models are deployed, aligning with organizational standards. Scalability: The solution supports complex ML workflows, making it adaptable to various project requirements. By implementing this solution, the company can establish a controlled and efficient process for deploying models, ensuring that only approved versions reach production environments. References: Automate the machine learning model approval process with Amazon SageMaker Model Registry and Amazon SageMaker Pipelines Update the Approval Status of a Model - Amazon SageMaker"}, {"n": 32, "t": "single", "q": "A company uses a batching solution to process daily analytics. The company wants to provide near real-time updates, use open-source technology, and avoid managing or scaling infrastructure. Which solution will meet these requirements?", "kq": "어떤 회사가 일일 분석을 처리하기 위해 배치 처리 솔루션을 사용합니다. 회사는 준실시간 업데이트를 제공하고, 오픈소스 기술을 사용하며, 인프라를 직접 관리하거나 확장하지 않기를 원합니다. 어떤 솔루션이 이러한 요구 사항을 충족할까요?", "o": [{"k": "A", "t": "Create Amazon Managed Streaming for Apache Kafka (Amazon MSK) Serverless clusters.", "kt": "Amazon MSK(Managed Streaming for Apache Kafka) Serverless 클러스터를 만듭니다."}, {"k": "B", "t": "Create Amazon MSK Provisioned clusters.", "kt": "Amazon MSK Provisioned 클러스터를 만듭니다."}, {"k": "C", "t": "Create Amazon Kinesis Data Streams with Application Auto Scaling.", "kt": "Application Auto Scaling을 적용한 Amazon Kinesis Data Streams를 만듭니다."}, {"k": "D", "t": "Create self-hosted Apache Flink applications on Amazon EC2.", "kt": "Amazon EC2에 자체 호스팅 Apache Flink 애플리케이션을 만듭니다."}], "a": ["A"], "ko": "Amazon MSK Serverless는 Apache Kafka와 호환되는 완전 관리형 스트리밍 서비스로, 프로비저닝, 확장, 용량 관리를 자동으로 처리합니다. 문제의 요구 사항은 거의 실시간 업데이트, 오픈소스 기술 사용, 인프라 관리 및 확장 부담 최소화입니다. MSK Serverless는 Kafka 기능을 사용하면서도 클러스터 용량을 직접 관리하지 않아도 되므로 이 조건에 가장 적합합니다. MSK Provisioned는 용량 계획과 확장 관리가 필요하고, Kinesis Data Streams는 AWS 고유 서비스로 오픈소스 Kafka 기반 요구 사항과는 다릅니다. EC2에서 Apache Flink를 직접 운영하는 방식은 인프라 관리 부담이 큽니다. 따라서 MSK Serverless를 사용하는 A안이 정답입니다.", "en": "Amazon MSK Serverless provides a fully managed Apache Kafka-compatible service that automatically handles provisioning, scaling, and capacity management. AWS documentation states that MSK Serverless is designed for customers who want Kafka functionality without managing infrastructure. Option B requires capacity planning and scaling management. Option C uses proprietary technology rather than open source. Option D requires full infrastructure management. MSK Serverless delivers near real-time streaming with minimal operational overhead while maintaining compatibility with open-source Kafka tooling. Therefore, Option A is the correct solution."}, {"n": 33, "t": "single", "q": "A gaming company needs to deploy a natural language processing (NLP) model to moderate a chat forum in a game. The workload experiences heavy usage during evenings and weekends but minimal activity during other hours. Which solution will meet these requirements MOST cost-effectively?", "kq": "어떤 게임 회사가 게임 내 채팅 포럼을 관리(모더레이션)하기 위해 자연어 처리(NLP) 모델을 배포해야 합니다. 이 워크로드는 저녁과 주말에는 사용량이 많지만 그 외 시간에는 활동이 거의 없습니다. 어떤 솔루션이 가장 비용 효율적으로 이러한 요구 사항을 충족할까요?", "o": [{"k": "A", "t": "Use an Amazon SageMaker AI batch transform job with fixed capacity.", "kt": "고정 용량의 Amazon SageMaker AI 배치 변환(batch transform) 작업을 사용합니다."}, {"k": "B", "t": "Use Amazon SageMaker Serverless Inference.", "kt": "Amazon SageMaker Serverless Inference를 사용합니다."}, {"k": "C", "t": "Use a single Amazon EC2 GPU instance with reserved capacity.", "kt": "예약 용량을 적용한 단일 Amazon EC2 GPU 인스턴스를 사용합니다."}, {"k": "D", "t": "Use Amazon SageMaker Asynchronous Inference.", "kt": "Amazon SageMaker Asynchronous Inference를 사용합니다."}], "a": ["B"], "ko": "이 시나리오의 핵심 요구 사항은 시간대별로 크게 변하는 트래픽과 비용 효율성입니다. 저녁과 주말에는 사용량이 많고 그 외 시간에는 거의 사용되지 않으므로, 유휴 상태에서도 비용이 발생하는 고정 인프라는 비효율적입니다. Amazon SageMaker Serverless Inference는 요청이 들어올 때 자동으로 컴퓨팅 리소스를 프로비저닝하고 확장하며, 사용하지 않을 때는 리소스를 줄여 비용을 절감할 수 있습니다. 사용자는 추론에 사용된 컴퓨팅 시간에 대해서만 비용을 지불하므로 간헐적이거나 스파이크성 트래픽에 적합합니다. Batch Transform은 오프라인 배치 추론용이며 실시간 채팅 조정에는 적합하지 않고, 예약 GPU 인스턴스는 유휴 시간에도 비용이 발생합니다. Asynchronous Inference는 긴 처리 시간이나 대용량 페이로드에 적합하지만 서버리스 추론만큼 비용 효율적으로 0까지 확장되는 방식은 아닙니다. 따라서 SageMaker Serverless Inference를 사용하는 B안이 가장 비용 효율적입니다.", "en": "The key requirements in this scenario are variable traffic patterns and cost efficiency. The workload has unpredictable spikes during evenings and weekends, followed by long periods of low or no usage. According to AWS Machine Learning documentation, Amazon SageMaker Serverless Inference is specifically designed for such use cases. SageMaker Serverless Inference automatically provisions, scales, and shuts down compute resources based on incoming inference requests. Customers are billed only for the compute time used during inference, not for idle resources. This makes it highly cost-effective for workloads with intermittent or spiky traffic, such as real- time chat moderation in gaming environments. Option A is incorrect because batch transform jobs are intended for offline, large-scale inference and require fixed capacity during job execution. They are not suitable for real-time NLP moderation. Option C is also incorrect because reserving an EC2 GPU instance incurs continuous costs regardless of utilization. This would be inefficient given the long idle periods described in the scenario. Option D, SageMaker Asynchronous Inference, is designed for workloads with long processing times or large payloads and still requires endpoint provisioning. While it can handle traffic spikes, it does not scale down to zero in the same cost-efficient manner as Serverless Inference. Therefore, Amazon SageMaker Serverless Inference is the most cost-effective and operationally efficient solution for deploying an NLP moderation model with highly variable usage patterns."}, {"n": 34, "t": "single", "q": "A company is creating an ML model to identify defects in a product. The company has gathered a dataset and has stored the dataset in TIFF format in Amazon S3. The dataset contains 200 images in which the most common defects are visible. The dataset also contains 1,800 images in which there is no defect visible. An ML engineer trains the model and notices poor performance in some classes. The ML engineer identifies a class imbalance problem in the dataset. What should the ML engineer do to solve this problem?", "kq": "어떤 회사가 제품의 결함을 식별하는 ML 모델을 만들고 있습니다. 회사는 데이터셋을 수집해 TIFF 형식으로 Amazon S3에 저장했습니다. 데이터셋에는 가장 흔한 결함이 보이는 이미지 200장이 포함되어 있고, 결함이 보이지 않는 이미지 1,800장도 포함되어 있습니다. ML 엔지니어가 모델을 학습시킨 뒤 일부 클래스에서 성능이 낮은 것을 확인했습니다. ML 엔지니어는 데이터셋에 클래스 불균형 문제가 있다고 판단했습니다. 이 문제를 해결하려면 어떻게 해야 합니까?", "o": [{"k": "A", "t": "Use a few hundred images and Amazon Rekognition Custom Labels to train a new model.", "kt": "수백 장의 이미지와 Amazon Rekognition Custom Labels를 사용해 새 모델을 학습시킵니다."}, {"k": "B", "t": "Undersample the 200 images in which the most common defects are visible.", "kt": "가장 흔한 결함이 보이는 이미지 200장을 언더샘플링합니다."}, {"k": "C", "t": "Oversample the 200 images in which the most common defects are visible.", "kt": "가장 흔한 결함이 보이는 이미지 200장을 오버샘플링합니다."}, {"k": "D", "t": "Use all 2,000 images and Amazon Rekognition Custom Labels to train a new model.", "kt": "2,000장 전체와 Amazon Rekognition Custom Labels를 사용해 새 모델을 학습시킵니다."}], "a": ["C"], "ko": "클래스 불균형은 한 클래스의 데이터가 다른 클래스보다 훨씬 많을 때 발생하며, 이 경우 모델은 다수 클래스에 치우친 예측을 하게 됩니다. 이 문제에서는 결함이 없는 이미지가 1,800장이고 결함이 있는 이미지는 200장뿐이므로 결함 클래스가 소수 클래스입니다. AWS ML 모범 사례에서는 데이터 손실 없이 소수 클래스의 표현을 늘리기 위해 오버샘플링을 권장합니다. 결함 이미지 샘플을 복제하거나 데이터 증강을 적용하면 모델이 결함 관련 특징을 더 잘 학습할 수 있습니다. B안처럼 소수 클래스 이미지를 언더샘플링하면 불균형이 더 심해지고, A안은 데이터셋 크기를 불필요하게 줄입니다. D안은 전체 이미지를 사용하지만 클래스 불균형 자체를 해결하지 못합니다. 따라서 결함이 보이는 200장의 이미지를 오버샘플링하는 C안이 정답입니다.", "en": "Class imbalance occurs when one class significantly outnumbers another, causing models to bias predictions toward the majority class. In this case, images without defects (1,800) vastly outnumber images with defects (200). AWS ML best practices recommend oversampling the minority class to improve class representation without discarding valuable data. Oversampling techniques-such as duplicating minority samples or applying data augmentation-help the model better learn defect-related features. This approach preserves all available data and improves recall and precision for underrepresented defect classes. Option B is incorrect because undersampling the minority class would further worsen imbalance. Option A unnecessarily reduces dataset size. Option D does not address the imbalance problem. Thus, oversampling defect images is the correct solution."}, {"n": 35, "t": "single", "q": "A company is gathering audio, video, and text data in various languages. The company needs to use a large language model (LLM) to summarize the gathered data that is in Spanish. Which solution will meet these requirements in the LEAST amount of time?", "kq": "어떤 회사가 여러 언어로 된 오디오, 비디오, 텍스트 데이터를 수집하고 있습니다. 회사는 수집된 데이터 중 스페인어 데이터를 요약하기 위해 대규모 언어 모델(LLM)을 사용해야 합니다. 어떤 솔루션이 가장 짧은 시간 안에 이러한 요구 사항을 충족할까요?", "o": [{"k": "A", "t": "Train and deploy a model in Amazon SageMaker to convert the data into English text. Train and deploy an LLM in SageMaker to summarize the text.", "kt": "Amazon SageMaker에서 데이터를 영어 텍스트로 변환하는 모델을 학습시켜 배포합니다. SageMaker에서 텍스트를 요약하는 LLM을 학습시켜 배포합니다."}, {"k": "B", "t": "Use Amazon Transcribe and Amazon Translate to convert the data into English text. Use Amazon Bedrock with the Jurassic model to summarize the text.", "kt": "Amazon Transcribe와 Amazon Translate로 데이터를 영어 텍스트로 변환합니다. Amazon Bedrock의 Jurassic 모델로 텍스트를 요약합니다."}, {"k": "C", "t": "Use Amazon Rekognition and Amazon Translate to convert the data into English text. Use Amazon Bedrock with the Anthropic Claude model to summarize the text.", "kt": "Amazon Rekognition과 Amazon Translate로 데이터를 영어 텍스트로 변환합니다. Amazon Bedrock의 Anthropic Claude 모델로 텍스트를 요약합니다."}, {"k": "D", "t": "Use Amazon Comprehend and Amazon Translate to convert the data into English text. Use Amazon Bedrock with the Stable Diffusion model to summarize the text.", "kt": "Amazon Comprehend와 Amazon Translate로 데이터를 영어 텍스트로 변환합니다. Amazon Bedrock의 Stable Diffusion 모델로 텍스트를 요약합니다."}], "a": ["B"], "ko": "스페인어로 된 오디오, 비디오, 텍스트 데이터를 빠르게 요약하려면 기존의 관리형 AI 서비스를 조합하는 것이 가장 빠른 방법입니다. Amazon Transcribe는 스페인어 오디오를 텍스트로 변환하는 데 적합하며, Amazon Translate를 사용하면 필요한 경우 스페인어 텍스트를 영어로 번역할 수 있습니다. 이후 Amazon Bedrock의 Jurassic 모델과 같은 대규모 언어 모델을 사용해 텍스트 요약을 수행할 수 있습니다. 이 방식은 모델을 직접 학습하거나 배포할 필요가 없으므로 개발 시간이 짧고 운영 부담이 적습니다. SageMaker에서 모델을 직접 학습하는 A안은 시간이 오래 걸리며, Rekognition은 이미지와 비디오 분석용 서비스로 텍스트 요약 워크플로에 직접 적합하지 않습니다. Stable Diffusion은 이미지 생성 모델이므로 요약 작업에는 적합하지 않습니다. 따라서 Transcribe, Translate, Bedrock Jurassic 모델을 사용하는 B안이 정답입니다.", "en": "Amazon Transcribe is well-suited for converting audio data into text, including Spanish. Amazon Translate can efficiently translate Spanish text into English if needed. Amazon Bedrock, with the Jurassic model, is designed for tasks like text summarization and can handle large language models (LLMs) seamlessly. This combination provides a low-code, managed solution to process audio, video, and text data with minimal time and effort."}, {"n": 37, "t": "single", "q": "A company must install a custom script on any newly created Amazon SageMaker AI notebook instances. Which solution will meet this requirement with the LEAST operational overhead?", "kq": "어떤 회사가 새로 생성되는 모든 Amazon SageMaker AI 노트북 인스턴스에 사용자 지정 스크립트를 설치해야 합니다. 어떤 솔루션이 최소한의 운영 오버헤드로 이 요구 사항을 충족할까요?", "o": [{"k": "A", "t": "Create a lifecycle configuration script to install the custom script when a new SageMaker AI notebook is created. Attach the lifecycle configuration to every new SageMaker AI notebook as part of the creation steps.", "kt": "새 SageMaker AI 노트북이 생성될 때 사용자 지정 스크립트를 설치하는 수명 주기 구성 스크립트를 만듭니다. 생성 단계의 일부로 모든 새 SageMaker AI 노트북에 이 수명 주기 구성을 연결합니다."}, {"k": "B", "t": "Create a custom Amazon Elastic Container Registry (Amazon ECR) image that contains the custom script. Push the ECR image to a Docker registry. Attach the Docker image to a SageMaker Studio domain. Select the kernel to run as part of the SageMaker AI notebook.", "kt": "사용자 지정 스크립트가 포함된 사용자 지정 Amazon ECR 이미지를 만듭니다. ECR 이미지를 Docker 레지스트리에 푸시합니다. Docker 이미지를 SageMaker Studio 도메인에 연결합니다. SageMaker AI 노트북에서 실행할 커널로 선택합니다."}, {"k": "C", "t": "Create a custom package index repository. Use AWS CodeArtifact to manage the installation of the custom script. Set up AWS PrivateLink endpoints to connect CodeArtifact to the SageMaker AI instance. Install the script.", "kt": "사용자 지정 패키지 인덱스 리포지토리를 만듭니다. AWS CodeArtifact로 사용자 지정 스크립트 설치를 관리합니다. AWS PrivateLink 엔드포인트를 설정해 CodeArtifact를 SageMaker AI 인스턴스에 연결합니다. 스크립트를 설치합니다."}, {"k": "D", "t": "Store the custom script in Amazon S3. Create an AWS Lambda function to install the custom script on new SageMaker AI notebooks. Configure Amazon EventBridge to invoke the Lambda function when a new SageMaker AI notebook is initialized.", "kt": "사용자 지정 스크립트를 Amazon S3에 저장합니다. 새 SageMaker AI 노트북에 스크립트를 설치하는 AWS Lambda 함수를 만듭니다. 새 SageMaker AI 노트북이 초기화될 때 Lambda 함수를 호출하도록 Amazon EventBridge를 구성합니다."}], "a": ["A"], "ko": "새로 생성되는 SageMaker Notebook Instance에 사용자 지정 스크립트를 자동으로 설치하려면 Lifecycle Configuration을 사용하는 것이 가장 간단하고 운영 부담이 적은 방법입니다. Lifecycle Configuration은 노트북 인스턴스 생성 또는 시작 시 자동으로 실행되며, 필요한 스크립트, 패키지, 시스템 의존성을 설치할 수 있습니다. 이 방식은 SageMaker에서 기본적으로 지원되며, 별도 인프라나 이벤트 기반 오케스트레이션이 필요 없습니다. 또한 동일한 Lifecycle Configuration을 여러 노트북 인스턴스에 재사용할 수 있어 일관성을 유지할 수 있습니다. ECR 사용자 지정 이미지, CodeArtifact, Lambda와 EventBridge 조합은 모두 추가적인 구성과 관리 부담을 발생시킵니다. 따라서 SageMaker Notebook Lifecycle Configuration을 사용하는 A안이 정답입니다.", "en": "AWS recommends lifecycle configuration scripts as the simplest and most direct way to customize Amazon SageMaker Notebook Instances at creation time. Lifecycle configurations run automatically when a notebook instance is created or started, allowing scripts, packages, and system dependencies to be installed without manual intervention. This approach is fully supported, requires no additional infrastructure, and integrates directly with the notebook creation workflow. The script can be reused across notebooks, ensuring consistency. Options B, C, and D introduce unnecessary complexity, such as container management, private package repositories, or event-driven orchestration. Therefore, lifecycle configuration scripts provide the least operational overhead solution."}, {"n": 39, "t": "single", "q": "An ML engineer is evaluating several ML models and must choose one model to use in production. The cost of false negative predictions by the models is much higher than the cost of false positive predictions. Which metric finding should the ML engineer prioritize the MOST when choosing the model?", "kq": "ML 엔지니어가 여러 ML 모델을 평가하고 그중 하나를 운영 환경에 사용하기로 선택해야 합니다. 이 모델들의 거짓 음성(false negative) 예측 비용이 거짓 양성(false positive) 예측 비용보다 훨씬 큽니다. 모델을 선택할 때 가장 우선적으로 고려해야 할 지표 결과는 무엇입니까?", "o": [{"k": "A", "t": "Low precision", "kt": "낮은 정밀도(precision)"}, {"k": "B", "t": "High precision", "kt": "높은 정밀도(precision)"}, {"k": "C", "t": "Low recall", "kt": "낮은 재현율(recall)"}, {"k": "D", "t": "High recall", "kt": "높은 재현율(recall)"}], "a": ["D"], "ko": "재현율은 실제 양성 사례 중 모델이 양성으로 올바르게 예측한 비율을 의미합니다. 즉, 거짓 음성을 줄이는 데 중요한 지표입니다. 이 문제에서는 거짓 음성의 비용이 거짓 양성보다 훨씬 높다고 했으므로, 실제로 양성인 사례를 놓치지 않는 것이 가장 중요합니다. 따라서 모델 선택 시 높은 재현율을 우선적으로 고려해야 합니다. 정밀도는 예측한 양성 중 실제 양성의 비율을 나타내므로 거짓 양성 관리에 더 관련이 있습니다. 이 상황에서는 거짓 음성을 최소화하는 것이 핵심이므로 높은 재현율을 나타내는 D안이 정답입니다.", "en": "Recall measures the ability of a model to correctly identify all positive cases (true positives) out of all actual positives, minimizing false negatives. Since the cost of false negatives is much higher than false positives in this scenario, the ML engineer should prioritize models with high recall to reduce the likelihood of missing positive cases."}, {"n": 40, "t": "single", "q": "A company has an existing Amazon SageMaker AI model (v1) on a production endpoint. The company develops a new model version (v2) and needs to test v2 in production before substituting v2 for v1. The company needs to minimize the risk of v2 generating incorrect output in production and must prevent any disruption of production traffic during the change. Which solution will meet these requirements?", "kq": "어떤 회사가 운영 엔드포인트에 기존 Amazon SageMaker AI 모델(v1)을 운영하고 있습니다. 회사는 새 모델 버전(v2)을 개발했고, v1을 v2로 교체하기 전에 운영 환경에서 v2를 테스트해야 합니다. 회사는 v2가 운영 환경에서 잘못된 출력을 생성할 위험을 최소화해야 하며, 변경 중에 운영 트래픽이 중단되어서는 안 됩니다. 어떤 솔루션이 이러한 요구 사항을 충족할까요?", "o": [{"k": "A", "t": "Create a second production variant for v2. Assign 1% of the traffic to v2 and 99% to v1. Collect all output of v2 in Amazon S3. If v2 performs as expected, switch all traffic to v2.", "kt": "v2용 두 번째 프로덕션 변형을 만듭니다. 트래픽의 1%를 v2에, 99%를 v1에 할당합니다. v2의 모든 출력을 Amazon S3에 수집합니다. v2가 기대대로 동작하면 모든 트래픽을 v2로 전환합니다."}, {"k": "B", "t": "Create a second production variant for v2. Assign 10% of the traffic to v2 and 90% to v1. Collect all output of v2 in Amazon S3. If v2 performs as expected, switch all traffic to v2.", "kt": "v2용 두 번째 프로덕션 변형을 만듭니다. 트래픽의 10%를 v2에, 90%를 v1에 할당합니다. v2의 모든 출력을 Amazon S3에 수집합니다. v2가 기대대로 동작하면 모든 트래픽을 v2로 전환합니다."}, {"k": "C", "t": "Deploy v2 to a new endpoint. Turn on data capture for the production endpoint. Send 100% of the input data to v2.", "kt": "v2를 새 엔드포인트에 배포합니다. 운영 엔드포인트에서 데이터 캡처를 켭니다. 입력 데이터의 100%를 v2로 보냅니다."}, {"k": "D", "t": "Deploy v2 into a shadow variant that samples 100% of the inference requests. Collect all output in Amazon S3. If v2 performs as expected, promote v2 to production.", "kt": "추론 요청의 100%를 샘플링하는 섀도 변형(shadow variant)으로 v2를 배포합니다. 모든 출력을 Amazon S3에 수집합니다. v2가 기대대로 동작하면 v2를 운영으로 승격합니다."}], "a": ["D"], "ko": "운영 중인 v1 모델에 영향을 주지 않고 v2 모델을 실제 프로덕션 트래픽으로 검증하려면 SageMaker Shadow Testing을 사용하는 것이 가장 안전합니다. Shadow Variant는 실제 추론 요청의 복사본을 받아 v2 모델에 전달하지만, v2의 응답은 최종 사용자에게 반환되지 않습니다. 따라서 v2가 잘못된 출력을 생성하더라도 프로덕션 사용자에게 영향을 주지 않으며, 기존 v1 엔드포인트의 운영도 중단되지 않습니다. A와 B는 카나리 배포 방식으로 일부 실제 사용자가 v2의 응답을 받게 되므로 잘못된 출력 위험을 완전히 제거하지 못합니다. C는 v2에 100% 입력을 보내는 방식으로 위험이 큽니다. Shadow Variant는 실제 데이터를 사용해 새 모델을 검증하면서도 운영 리스크를 최소화하도록 설계된 방식입니다. 따라서 v2를 Shadow Variant로 배포하고 결과를 S3에 수집한 뒤 성능이 확인되면 프로덕션으로 승격하는 D안이 정답입니다.", "en": "AWS recommends SageMaker shadow testing as the safest way to validate a new model version using real production traffic without impacting production responses. A shadow variant receives a copy of inference requests but does not return predictions to end users. This completely eliminates the risk of exposing incorrect predictions. Options A and B are canary deployments. While useful, they still allow v2 to return responses to real users, which violates the requirement to prevent disruption. Option C sends 100% of traffic to v2 externally and is risky. Shadow variants are explicitly designed to minimize risk while using real data, making them the AWS best practice for pre-production validation. Therefore, Option D is correct."}, {"n": 41, "t": "single", "q": "An ML engineer is developing a neural network to run on new user data. The dataset has dozens of floating- point features. The dataset is stored as CSV objects in an Amazon S3 bucket. Most objects and columns are missing at least one value. All features are relatively uniform except for a small number of extreme outliers. The ML engineer wants to use Amazon SageMaker Data Wrangler to handle missing values before passing the dataset to the neural network. Which solution will provide the MOST complete data?", "kq": "ML 엔지니어가 새 사용자 데이터에서 실행할 신경망을 개발하고 있습니다. 데이터셋에는 수십 개의 부동소수점 특성이 있습니다. 데이터셋은 Amazon S3 버킷에 CSV 객체로 저장되어 있습니다. 대부분의 객체와 컬럼에는 값이 최소 하나씩 누락되어 있습니다. 소수의 극단적 이상치를 제외하면 모든 특성은 비교적 균일합니다. ML 엔지니어는 데이터셋을 신경망에 전달하기 전에 Amazon SageMaker Data Wrangler로 결측값을 처리하려고 합니다. 가장 완전한 데이터를 얻을 수 있는 방법은 무엇입니까?", "o": [{"k": "A", "t": "Drop samples that are missing values.", "kt": "결측값이 있는 샘플을 삭제합니다."}, {"k": "B", "t": "Impute missing values with the mean value.", "kt": "결측값을 평균값으로 대체합니다."}, {"k": "C", "t": "Impute missing values with the median value.", "kt": "결측값을 중앙값으로 대체합니다."}, {"k": "D", "t": "Drop columns that are missing values.", "kt": "결측값이 있는 컬럼을 삭제합니다."}], "a": ["C"], "ko": "주요 목표는 결측값과 극단적인 이상치를 적절히 처리하면서도 가능한 한 가장 완전한 데이터셋을 만드는 것입니다. 샘플을 삭제하는 A안이나 컬럼을 삭제하는 D안은 데이터의 완전성을 낮추고, 잠재적으로 유용한 정보를 제거할 수 있으므로 요구 사항에 맞지 않습니다. 따라서 결측값을 대체하는 방식이 올바른 접근입니다. 평균 대체와 중앙값 대체 중에서는, 특성에 이상치가 포함된 경우 AWS ML 모범 사례상 중앙값을 사용하는 것이 권장됩니다. 평균은 극단값의 영향을 크게 받아 왜곡될 수 있으며, 그 결과 일반적인 데이터 분포를 대표하지 못하는 값으로 결측값이 대체될 수 있습니다. 반면 중앙값은 이상치에 강건하므로 이러한 데이터셋에서 중심 경향을 나타내는 더 적절한 통계적 추정값입니다. Amazon SageMaker Data Wrangler는 중앙값 대체를 내장 변환 기능으로 지원하므로, 사용자 지정 코드 없이도 대규모 표 형식 데이터셋의 결측값을 일관되게 처리할 수 있습니다. 이 접근 방식은 모든 행과 열을 보존하면서 극단값으로 인한 왜곡을 최소화하며, 입력 분포에 민감한 신경망 학습에서 특히 중요합니다. 따라서 결측값을 중앙값으로 대체하는 방식이 학습을 위한 가장 완전하고 통계적으로 적절한 데이터셋을 제공하는 방법입니다.", "en": "The primary goal is to produce the most complete dataset while handling missing values and extreme outliers appropriately. Dropping samples (Option A) or columns (Option D) would reduce data completeness and potentially remove valuable information, which contradicts the requirement. Imputation is therefore the correct approach. Between mean and median imputation, AWS ML best practices recommend using the median when features contain outliers. The mean is sensitive to extreme values and can be skewed significantly, leading to imputed values that are not representative of the typical data distribution. In contrast, the median is robust to outliers, making it a better statistical estimator for central tendency in such datasets. Amazon SageMaker Data Wrangler supports median imputation as a built-in transformation, enabling ML engineers to handle missing values consistently across large tabular datasets without custom code. This approach preserves all rows and columns while minimizing distortion caused by extreme values, which is particularly important for neural networks that are sensitive to input distributions. Therefore, imputing missing values with the median value provides the most complete and statistically appropriate dataset for training."}, {"n": 42, "t": "single", "q": "An ML engineer has an Amazon Comprehend custom model in Account A in the us-east-1 Region. The ML engineer needs to copy the model to Account B in the same Region. Which solution will meet this requirement with the LEAST development effort?", "kq": "ML 엔지니어가 us-east-1 리전의 계정 A에 Amazon Comprehend 사용자 지정 모델을 보유하고 있습니다. ML 엔지니어는 같은 리전의 계정 B로 이 모델을 복사해야 합니다. 어떤 솔루션이 최소한의 개발 노력으로 이 요구 사항을 충족할까요?", "o": [{"k": "A", "t": "Use Amazon S3 to make a copy of the model. Transfer the copy to Account B.", "kt": "Amazon S3를 사용해 모델의 복사본을 만듭니다. 복사본을 계정 B로 전송합니다."}, {"k": "B", "t": "Create a resource-based IAM policy. Use the Amazon Comprehend ImportModel API operation to copy the model to Account B.", "kt": "리소스 기반 IAM 정책을 만듭니다. Amazon Comprehend의 ImportModel API 작업을 사용해 모델을 계정 B로 복사합니다."}, {"k": "C", "t": "Use AWS DataSync to replicate the model from Account A to Account B.", "kt": "AWS DataSync를 사용해 계정 A에서 계정 B로 모델을 복제합니다."}, {"k": "D", "t": "Create an AWS Site-to-Site VPN connection between Account A and Account B to transfer the model.", "kt": "계정 A와 계정 B 사이에 AWS Site-to-Site VPN 연결을 만들어 모델을 전송합니다."}], "a": ["B"], "ko": "Amazon Comprehend는 사용자 지정 모델을 AWS 계정 간에 복사할 수 있는 ImportModel API 작업을 제공합니다. Account A의 모델에 리소스 기반 IAM 정책을 생성하면 Account B에 해당 모델에 접근하고 가져올 수 있는 권한을 부여할 수 있습니다. 이 방식은 개발 노력이 가장 적으며, 사용자 지정 모델을 계정 간에 공유하기 위한 AWS 권장 방식입니다.", "en": "Amazon Comprehend provides the ImportModel API operation, which allows you to copy a custom model between AWS accounts. By creating a resource-based IAM policy on the model in Account A, you can grant Account B the necessary permissions to access and import the model. This approach requires minimal development effort and is the AWS-recommended method for sharing custom models across accounts."}, {"n": 43, "t": "single", "q": "A company is using Amazon SageMaker AI to develop a credit risk assessment model. During model validation, the company finds that the model achieves 82% accuracy on the validation data. However, the model achieved 99% accuracy on the training data. The company needs to address the model accuracy issue before deployment. Which solution will meet this requirement?", "kq": "어떤 회사가 Amazon SageMaker AI를 사용해 신용 위험 평가 모델을 개발하고 있습니다. 모델 검증 과정에서 회사는 모델이 검증 데이터에서 82%의 정확도를 달성했음을 확인했습니다. 그러나 학습 데이터에서는 99%의 정확도를 기록했습니다. 회사는 배포 전에 이 모델 정확도 문제를 해결해야 합니다. 어떤 솔루션이 이 요구 사항을 충족할까요?", "o": [{"k": "A", "t": "Add more dense layers to increase model complexity. Implement batch normalization. Use early stopping during training.", "kt": "dense 레이어를 추가해 모델 복잡도를 높입니다. 배치 정규화를 구현합니다. 학습 중 조기 종료를 사용합니다."}, {"k": "B", "t": "Implement dropout layers. Use L1 or L2 regularization. Perform k-fold cross-validation.", "kt": "드롭아웃 레이어를 구현합니다. L1 또는 L2 정규화를 사용합니다. k-fold 교차 검증을 수행합니다."}, {"k": "C", "t": "Use principal component analysis (PCA) to reduce the feature dimensionality. Decrease model layers. Implement cross-entropy loss functions.", "kt": "주성분 분석(PCA)으로 특성 차원을 줄입니다. 모델 레이어를 줄입니다. 교차 엔트로피 손실 함수를 구현합니다."}, {"k": "D", "t": "Augment the training dataset. Remove duplicate records from the training dataset. Implement stratified sampling.", "kt": "학습 데이터셋을 증강합니다. 학습 데이터셋에서 중복 레코드를 제거합니다. 층화 표본 추출(stratified sampling)을 구현합니다."}], "a": ["B"], "ko": "학습 정확도 99%와 검증 정확도 82% 사이의 큰 차이는 과적합의 전형적인 사례입니다. 모델이 학습 데이터에는 매우 잘 맞지만, 보지 못한 데이터에는 일반화하지 못하고 있다는 의미입니다. AWS ML 모범 사례에서는 과적합을 완화하기 위해 정규화 기법을 권장합니다. Dropout 계층은 학습 중 뉴런을 무작위로 비활성화하여 네트워크가 특정 경로에 과도하게 의존하지 않도록 합니다. L1 및 L2 정규화는 큰 가중치에 패널티를 부여해 모델 복잡도를 낮추고 일반화 성능을 향상합니다. k-겹 교차 검증은 여러 데이터 분할에서 학습과 검증을 반복해 더 견고한 평가를 제공합니다. A안은 모델 복잡도를 높여 과적합을 악화시킬 수 있고, C안은 일부 유효한 아이디어가 포함되어 있으나 손실 함수 변경 등 핵심 문제와 직접 관련이 적습니다. D안은 데이터 품질에 초점을 맞추지만 모델 분산 문제를 직접 해결하지 못합니다. 따라서 Dropout, 정규화, k-겹 교차 검증을 적용하는 B안이 올바른 해결책입니다.", "en": "The large gap between training accuracy (99%) and validation accuracy (82%) is a textbook case of overfitting. The model has learned patterns that fit the training data extremely well but do not generalize to unseen data. AWS ML best practices recommend regularization techniques to address overfitting. Dropout layers randomly deactivate neurons during training, preventing the network from relying too heavily on specific paths. L1 and L2 regularization penalize large weights, reducing model complexity and improving generalization. k-fold cross-validation provides a more robust evaluation by training and validating the model across multiple data splits. Option A increases complexity, which would worsen overfitting. Option C mixes valid ideas (dimensionality reduction) with unrelated changes (loss function choice) and is less targeted. Option D focuses on data quality but does not directly address model variance. Therefore, implementing dropout, regularization, and k-fold cross-validation is the correct solution."}, {"n": 44, "t": "single", "q": "A company needs to run a batch data-processing job on Amazon EC2 instances. The job will run during the weekend and will take 90 minutes to finish running. The processing can handle interruptions. The company will run the job every weekend for the next 6 months. Which EC2 instance purchasing option will meet these requirements MOST cost-effectively?", "kq": "어떤 회사가 Amazon EC2 인스턴스에서 배치 데이터 처리 작업을 실행해야 합니다. 이 작업은 주말에 실행되며 완료까지 90분이 걸립니다. 처리는 중단되어도 괜찮습니다. 회사는 앞으로 6개월간 매주 주말마다 이 작업을 실행할 예정입니다. 어떤 EC2 인스턴스 구매 옵션이 가장 비용 효율적으로 이러한 요구 사항을 충족할까요?", "o": [{"k": "A", "t": "Spot Instances", "kt": "스팟 인스턴스(Spot Instances)"}, {"k": "B", "t": "Reserved Instances", "kt": "예약 인스턴스(Reserved Instances)"}, {"k": "C", "t": "On-Demand Instances", "kt": "온디맨드 인스턴스(On-Demand Instances)"}, {"k": "D", "t": "Dedicated Instances", "kt": "전용 인스턴스(Dedicated Instances)"}], "a": ["A"], "ko": "이 시나리오에서는 회사가 향후 6개월 동안 매주 주말마다 90분 동안 배치 작업을 실행해야 하며, 작업은 중단을 허용할 수 있습니다. 비용 효율성이 중요하고 중단을 처리할 수 있는 워크로드이므로 Spot Instance가 가장 적합합니다. Spot Instance는 On-Demand Instance 대비 최대 90%까지 비용을 절감할 수 있어 배치 처리에 매우 비용 효율적입니다. 또한 작업이 중단을 허용하므로 Spot Instance의 중단 가능성이 큰 문제가 되지 않습니다. 필요 시 Auto Scaling 그룹이나 AWS Batch를 함께 사용해 인스턴스 중단 시 작업을 재시도하거나 완료할 수 있습니다. Reserved Instance는 지속적이고 예측 가능한 장기 워크로드에 적합하지만, 주 1회 실행되는 작업에는 비용 효율성이 낮습니다. On-Demand Instance는 더 비싸며, Dedicated Instance는 격리 및 규정 준수를 위한 옵션으로 비용이 높습니다. 따라서 A안인 Spot Instance가 가장 비용 효율적인 선택입니다.", "en": "Scenario: The company needs to run a batch job for 90 minutes every weekend over the next 6 months. The processing can handle interruptions, and cost-effectiveness is a priority. Why Spot Instances? Cost-Effective: Spot Instances provide up to 90% savings compared to On-Demand Instances, making them the most cost-effective option for batch processing. Interruption Tolerance: Since the processing can tolerate interruptions, Spot Instances are suitable for this workload. Batch-Friendly: Spot Instances can be requested for specific durations or automatically re-requested in case of interruptions. Steps to Implement: Create a Spot Instance Request: Use the EC2 console or CLI to request Spot Instances with desired instance type and duration. Use Auto Scaling: Configure Spot Instances with an Auto Scaling group to handle instance interruptions and ensure job completion. Run the Batch Job: Use tools like AWS Batch or custom scripts to manage the processing. Comparison with Other Options: Reserved Instances: Suitable for predictable, continuous workloads, but less cost-effective for a job that runs only once a week. On-Demand Instances: More expensive and unnecessary given the tolerance for interruptions. Dedicated Instances: Best for isolation and compliance but significantly more costly. References: Amazon EC2 Spot Instances Best Practices for Using Spot Instances AWS Batch for Spot Instances"}, {"n": 45, "t": "single", "q": "An ML engineer needs to run intensive model training jobs each month that can take 48-72 hours. The jobs can be interrupted and resumed. The engineer has a fixed budget and needs the most cost-effective compute option. Which solution will meet these requirements?", "kq": "ML 엔지니어가 매달 48~72시간이 걸리는 집약적인 모델 학습 작업을 실행해야 합니다. 이 작업은 중단 후 재개할 수 있습니다. 엔지니어는 예산이 고정되어 있어 가장 비용 효율적인 컴퓨팅 옵션이 필요합니다. 어떤 솔루션이 이러한 요구 사항을 충족할까요?", "o": [{"k": "A", "t": "Purchase Reserved Instances with partial upfront payment.", "kt": "부분 선결제 방식의 예약 인스턴스를 구매합니다."}, {"k": "B", "t": "Purchase On-Demand Instances.", "kt": "온디맨드 인스턴스를 구매합니다."}, {"k": "C", "t": "Purchase SageMaker AI Savings Plans.", "kt": "SageMaker AI Savings Plans를 구매합니다."}, {"k": "D", "t": "Purchase Spot Instances that use automated checkpoints.", "kt": "자동 체크포인트를 사용하는 스팟 인스턴스를 구매합니다."}], "a": ["D"], "ko": "Amazon EC2 Spot Instance는 사용되지 않는 컴퓨팅 용량을 최대 90% 할인된 가격으로 제공합니다. AWS 문서에서는 중단되어도 재개할 수 있는 장시간 ML 학습 작업과 같은 워크로드에 Spot Instance 사용을 강력히 권장합니다. 자동 체크포인트를 활성화하면 SageMaker가 모델 상태를 주기적으로 Amazon S3에 저장합니다. Spot Instance가 중단되더라도 학습은 이전 체크포인트부터 재개될 수 있어 진행 손실을 최소화할 수 있습니다. Reserved Instance와 Savings Plans는 장기 약정이 필요하며 간헐적인 워크로드에는 Spot Instance만큼 비용 효율적이지 않습니다. On-Demand Instance는 가장 비싼 옵션입니다. 따라서 자동 체크포인트를 사용하는 Spot Instance를 구매하는 D안이 가장 비용 효율적인 해결책입니다.", "en": "Amazon EC2 Spot Instances provide unused compute capacity at discounts of up to 90%. AWS documentation strongly recommends Spot Instances for interruptible workloads such as long-running ML training jobs that can resume from checkpoints. By enabling automatic checkpointing, SageMaker saves model state periodically to Amazon S3. If the Spot Instance is interrupted, training can resume with minimal loss of progress. Reserved Instances and Savings Plans require long-term commitment and are not as cost-effective for sporadic workloads. On-Demand Instances are the most expensive option. Therefore, Option D is the most cost-effective solution."}, {"n": 46, "t": "single", "q": "An ML engineer has trained a neural network by using stochastic gradient descent (SGD). The neural network performs poorly on the test set. The values for training loss and validation loss remain high and show an oscillating pattern. The values decrease for a few epochs and then increase for a few epochs before repeating the same cycle. What should the ML engineer do to improve the training process?", "kq": "ML 엔지니어가 확률적 경사 하강법(SGD)으로 신경망을 학습시켰습니다. 이 신경망은 테스트 세트에서 성능이 좋지 않습니다. 학습 손실과 검증 손실 값이 모두 높게 유지되며 진동하는 패턴을 보입니다. 값이 몇 에포크 동안 감소한 뒤 몇 에포크 동안 증가하고, 같은 주기를 반복합니다. 학습 과정을 개선하려면 어떻게 해야 합니까?", "o": [{"k": "A", "t": "Introduce early stopping.", "kt": "조기 종료(early stopping)를 도입합니다."}, {"k": "B", "t": "Increase the size of the test set.", "kt": "테스트 세트의 크기를 늘립니다."}, {"k": "C", "t": "Increase the learning rate.", "kt": "학습률(learning rate)을 높입니다."}, {"k": "D", "t": "Decrease the learning rate.", "kt": "학습률(learning rate)을 낮춥니다."}], "a": ["D"], "ko": "확률적 경사 하강법(SGD)으로 학습하는 동안 손실 값이 진동하는 패턴은 학습률이 너무 높다는 강한 신호입니다. 학습률이 지나치게 크면 옵티마이저가 가중치 업데이트 시 너무 큰 보폭으로 이동해 손실 함수의 최적 최솟값을 반복적으로 지나치게 됩니다. 그 결과 학습 손실과 검증 손실이 잠시 감소했다가 다시 증가하는 불안정한 수렴 패턴이 반복됩니다. AWS 머신러닝 문서와 일반적인 딥러닝 모범 사례에서는 학습 손실과 검증 손실이 모두 높고 안정적으로 감소하지 않고 변동할 때 학습률을 낮출 것을 권장합니다. 학습률을 낮추면 옵티마이저가 더 작고 정밀한 단계로 최솟값에 접근할 수 있어 수렴이 안정화되고 테스트 데이터에 대한 일반화 성능도 향상됩니다. 조기 종료는 주로 학습 손실은 감소하지만 검증 손실이 증가하는 과적합 상황에서 사용됩니다. 테스트셋 크기를 늘리는 것은 학습 과정의 수렴 동작에 영향을 주지 않습니다. 학습률을 높이면 진동과 불안정성이 더 심해질 수 있습니다. 따라서 SGD 학습을 안정화하고 모델 성능을 개선하려면 학습률을 낮추는 D안이 정답입니다.", "en": "An oscillating loss pattern during training with stochastic gradient descent (SGD) is a strong indicator that the learning rate is too high. When the learning rate is excessive, the optimizer takes overly large steps during gradient updates, causing the model to repeatedly overshoot the optimal minimum of the loss function. This results in unstable convergence behavior, where training and validation loss decrease briefly and then increase again in a repeating cycle. AWS Machine Learning documentation and general deep learning best practices recommend reducing the learning rate when training loss and validation loss both remain high and fluctuate rather than steadily decreasing. Lowering the learning rate allows the optimizer to take smaller, more precise steps toward the minimum, leading to smoother convergence and improved generalization on the test dataset. Option A, early stopping, is used primarily to prevent overfitting when validation loss increases while training loss continues to decrease. In this scenario, both losses remain high and unstable, indicating an optimization issue rather than overfitting. Option B is incorrect because increasing the test set size does not affect the training dynamics or convergence behavior of the model. Option C would worsen the problem, as increasing the learning rate would further amplify oscillations and instability. Therefore, decreasing the learning rate is the correct corrective action to stabilize SGD training and improve model performance."}, {"n": 47, "t": "single", "q": "An ML engineer wants to use Amazon SageMaker Data Wrangler to perform preprocessing on a dataset. The ML engineer wants to use the processed dataset to train a classification model. During preprocessing, the ML engineer notices that a text feature has a range of thousands of values that differ only by spelling errors. The ML engineer needs to apply an encoding method so that after preprocessing is complete, the text feature can be used to train the model. Which solution will meet these requirements?", "kq": "ML 엔지니어가 아마존 세이지메이커 데이터 랭글러를 사용하여 데이터 세트에 대한 전처리를 수행하려고 합니다. ML 엔지니어는 처리된 데이터 세트를 사용하여 분류 모델을 학습시키려고 합니다. 전처리 과정에서 ML 엔지니어는 철자 오류만 다를 뿐인 수천 개의 값을 가진 텍스트 특성이 있다는 것을 발견했습니다. ML 엔지니어는 전처리가 완료된 후 텍스트 특성을 모델 학습에 사용할 수 있도록 인코딩 방법을 적용해야 합니다. 어떤 솔루션이 이러한 요구 사항을 충족할까요?", "o": [{"k": "A", "t": "Perform ordinal encoding to represent categories of the feature.", "kt": "서수 인코딩을 수행하여 특성의 범주를 표현합니다."}, {"k": "B", "t": "Perform similarity encoding to represent categories of the feature.", "kt": "유사성 인코딩을 수행하여 특성의 범주를 표현합니다."}, {"k": "C", "t": "Perform one-hot encoding to represent categories of the feature.", "kt": "원-핫 인코딩을 수행하여 특성의 범주를 표현합니다."}, {"k": "D", "t": "Perform target encoding to represent categories of the feature.", "kt": "대상 인코딩을 수행하여 특성의 범주를 표현합니다."}], "a": ["B"], "ko": "이 텍스트 특성은 오탈자 차이만 있는 수천 개의 고유 범주 값을 포함하고 있으며, 이는 실제 데이터에서 흔히 발생하는 품질 문제입니다. 순서형 인코딩이나 원-핫 인코딩은 철자가 조금만 달라도 각 값을 완전히 별개의 범주로 처리하므로 일반화 성능이 떨어지고 차원이 매우 커질 수 있습니다. 유사도 인코딩은 문자열 유사성을 기반으로 범주를 표현하므로, 오탈자처럼 약간만 다른 값들을 유사한 숫자 표현으로 인코딩할 수 있습니다. Amazon SageMaker Data Wrangler는 이러한 노이즈가 있는 범주형 특성을 처리하기 위해 유사도 인코딩을 지원합니다. 타깃 인코딩은 타깃 레이블 분포에 의존하므로 신중하게 적용하지 않으면 타깃 누수가 발생할 수 있습니다. 따라서 유사도 인코딩을 사용하는 B안이 가장 적절하고 AWS 권장 방식에 부합합니다.", "en": "The text feature contains high-cardinality categorical values with minor spelling variations, which is a common real-world data quality issue. Traditional encoding techniques such as ordinal encoding (Option A) or one-hot encoding (Option C) would treat each misspelled value as a completely separate category, resulting in poor generalization and very high dimensionality. Similarity encoding addresses this problem by grouping or encoding categories based on string similarity. Categories that differ only slightly-such as spelling errors-are encoded with similar numerical representations. Amazon SageMaker Data Wrangler supports similarity encoding specifically for such noisy categorical features. Target encoding (Option D) depends on the target label distribution and risks target leakage if not carefully applied. Therefore, similarity encoding is the most appropriate and AWS-recommended solution."}, {"n": 48, "t": "single", "q": "A company is developing ML models by using PyTorch and TensorFlow estimators with Amazon SageMaker AI. An ML engineer configures the SageMaker AI estimator and now needs to initiate a training job that uses a training dataset. Which SageMaker AI SDK method can initiate the training job?", "kq": "어떤 회사가 Amazon SageMaker AI에서 PyTorch와 TensorFlow estimator를 사용해 ML 모델을 개발하고 있습니다. ML 엔지니어가 SageMaker AI estimator를 구성했고, 이제 학습 데이터셋을 사용하는 학습 작업을 시작해야 합니다. 학습 작업을 시작할 수 있는 SageMaker AI SDK 메서드는 무엇입니까?", "o": [{"k": "A", "t": "fit method", "kt": "fit 메서드"}, {"k": "B", "t": "create_model method", "kt": "create_model 메서드"}, {"k": "C", "t": "deploy method", "kt": "deploy 메서드"}, {"k": "D", "t": "predict method", "kt": "predict 메서드"}], "a": ["A"], "ko": "Amazon SageMaker Python SDK에서 estimator가 구성된 후 학습 작업을 시작하는 데 사용하는 메서드는 fit()입니다. AWS 문서에서는 PyTorch나 TensorFlow estimator와 같이 인스턴스 유형, 프레임워크 버전, 하이퍼파라미터가 정의된 후 fit() 메서드가 학습 프로세스를 시작한다고 명시합니다. fit() 메서드는 일반적으로 Amazon S3 URI와 같은 학습 데이터 위치를 입력으로 받아 SageMaker 관리형 인프라에서 학습 작업을 실행합니다. 이후 SageMaker는 필요한 컴퓨팅 리소스를 프로비저닝하고, 데이터를 준비하며, 학습 스크립트를 실행하고, 모델 아티팩트를 Amazon S3에 저장합니다. create_model()은 학습 후 모델 객체를 생성하는 데 사용되며, deploy()는 학습된 모델을 추론 엔드포인트에 배포하는 데 사용됩니다. predict()는 배포 이후 엔드포인트에서 예측을 요청할 때 사용됩니다. 따라서 학습 작업을 시작하는 올바른 SageMaker SDK 메서드는 fit()이며, A안이 정답입니다.", "en": "In the Amazon SageMaker Python SDK, the fit() method is used to start a training job after an estimator has been configured. AWS documentation explicitly states that once an estimator (such as PyTorch or TensorFlow) is defined with parameters like instance type, framework version, and hyperparameters, the fit() method is responsible for launching the training process. The fit() method accepts the training data location (commonly an Amazon S3 URI) and initiates the managed training job on SageMaker infrastructure. SageMaker then provisions the required compute resources, stages the data, executes the training script, and stores model artifacts in Amazon S3. The create_model() method is used after training to create a SageMaker model object from trained artifacts. The deploy() method deploys a trained model to an endpoint for inference. The predict() method is used only after deployment to request predictions from an endpoint. AWS documentation clearly separates these lifecycle steps and identifies fit() as the correct method to initiate training. Therefore, Option A is the correct and AWS-verified answer."}, {"n": 50, "t": "single", "q": "A company has developed a new ML model. The company requires online model validation on 10% of the traffic before the company fully releases the model in production. The company uses an Amazon SageMaker endpoint behind an Application Load Balancer (ALB) to serve the model. Which solution will set up the required online validation with the LEAST operational overhead?", "kq": "어떤 회사가 새 ML 모델을 개발했습니다. 회사는 모델을 운영 환경에 완전히 출시하기 전에 트래픽의 10%로 온라인 모델 검증을 수행해야 합니다. 회사는 모델을 제공하기 위해 Application Load Balancer(ALB) 뒤에 Amazon SageMaker 엔드포인트를 사용합니다. 운영 부담이 가장 적게 온라인 검증을 구성하는 방법은 무엇입니까?", "o": [{"k": "A", "t": "Use production variants to add the new model to the existing SageMaker endpoint. Set the variant weight to 0.1 for the new model. Monitor the number of invocations by using Amazon CloudWatch.", "kt": "프로덕션 변형을 사용해 기존 SageMaker 엔드포인트에 새 모델을 추가합니다. 새 모델의 변형 가중치를 0.1로 설정합니다. Amazon CloudWatch로 호출 수를 모니터링합니다."}, {"k": "B", "t": "Use production variants to add the new model to the existing SageMaker endpoint. Set the variant weight to 1 for the new model. Monitor the number of invocations by using Amazon CloudWatch.", "kt": "프로덕션 변형을 사용해 기존 SageMaker 엔드포인트에 새 모델을 추가합니다. 새 모델의 변형 가중치를 1로 설정합니다. Amazon CloudWatch로 호출 수를 모니터링합니다."}, {"k": "C", "t": "Create a new SageMaker endpoint. Use production variants to add the new model to the new endpoint. Monitor the number of invocations by using Amazon CloudWatch.", "kt": "새 SageMaker 엔드포인트를 만듭니다. 프로덕션 변형을 사용해 새 엔드포인트에 새 모델을 추가합니다. Amazon CloudWatch로 호출 수를 모니터링합니다."}, {"k": "D", "t": "Configure the ALB to route 10% of the traffic to the new model at the existing SageMaker endpoint.Monitor the number of invocations by using AWS CloudTrail.", "kt": "기존 SageMaker 엔드포인트의 새 모델로 트래픽의 10%를 라우팅하도록 ALB를 구성합니다. AWS CloudTrail로 호출 수를 모니터링합니다."}], "a": ["A"], "ko": "이 시나리오는 새 ML 모델을 프로덕션에 완전히 배포하기 전에 전체 트래픽의 10%로 온라인 검증을 수행해야 하는 상황입니다. Amazon SageMaker 엔드포인트는 프로덕션 변형을 지원하므로 하나의 엔드포인트에서 여러 모델을 실행하고 각 변형의 가중치를 조정해 들어오는 트래픽 비율을 제어할 수 있습니다. 기존 SageMaker 엔드포인트에 새 모델을 프로덕션 변형으로 추가하고 새 모델의 가중치를 0.1로 설정하면 트래픽의 10%만 새 모델로 전달되고 나머지 90%는 기존 모델로 유지됩니다. 또한 CloudWatch를 통해 InvocationCount, ModelLatency와 같은 지표를 모니터링할 수 있어 검증에 필요한 운영 가시성을 확보할 수 있습니다. B안은 새 모델에 전체 트래픽을 보내므로 요구 사항을 충족하지 않습니다. C안은 새 엔드포인트를 만들어야 하므로 라우팅과 모니터링의 운영 부담이 증가합니다. D안은 ALB 설정을 수동으로 구성해야 하며 SageMaker의 내장 프로덕션 변형 기능과 모니터링 이점을 활용하지 못합니다. 따라서 기존 SageMaker 엔드포인트에 새 모델을 프로덕션 변형으로 추가하고 가중치를 0.1로 설정하는 A안이 가장 운영 부담이 적은 해결책입니다.", "en": "Scenario: The company wants to perform online validation of a new ML model on 10% of the traffic before fully deploying the model in production. The setup must have minimal operational overhead. Why Use SageMaker Production Variants? Built-In Traffic Splitting: Amazon SageMaker endpoints support production variants, allowing multiple models to run on a single endpoint. You can direct a percentage of incoming traffic to each variant by adjusting the variant weights. Ease of Management: Using production variants eliminates the need for additional infrastructure like separate endpoints or custom ALB configurations. Monitoring with CloudWatch: SageMaker automatically integrates with CloudWatch, enabling real- time monitoring of model performance and invocation metrics. Steps to Implement: Deploy the New Model as a Production Variant: Update the existing SageMaker endpoint to include the new model as a production variant. This can be done via the SageMaker console, CLI, or SDK. Example SDK Code: import boto3 sm_client = boto3.client('sagemaker') response = sm_client.update_endpoint_weights_and_capacities(EndpointName='existing-endpoint-name', DesiredWeightsAndCapacities=[ {'VariantName':'current-model','DesiredWeight': 0.9}, {'VariantName':'new-model','DesiredWeight': 0.1} ]) Set the Variant Weight: Assign a weight of 0.1 to the new model and 0.9 to the existing model. This ensures 10% of traffic goes to the new model while the remaining 90% continues to use the current model. Monitor the Performance: Use Amazon CloudWatch metrics, such as InvocationCount and ModelLatency, to monitor the traffic and performance of each variant. Validate the Results: Analyze the performance of the new model based on metrics like accuracy, latency, and failure rates. Why Not the Other Options? Option B: Setting the weight to 1 directs all traffic to the new model, which does not meet the requirement of splitting traffic for validation. Option C: Creating a new endpoint introduces additional operational overhead for traffic routing and monitoring, which is unnecessary given SageMaker's built-in production variant capability. Option D: Configuring the ALB to route traffic requires manual setup and lacks SageMaker's seamless variant monitoring and traffic splitting features. Conclusion: Using production variants with a weight of 0.1 for the new model on the existing SageMaker endpoint provides the required traffic split for online validation with minimal operational overhead. References: Amazon SageMaker Endpoints SageMaker Production Variants Monitoring SageMaker Endpoints with CloudWatch"}, {"n": 53, "t": "single", "q": "A company uses an ML model to recommend videos to users. The model is deployed on Amazon SageMaker AI. The model performed well initially after deployment, but the model's performance has degraded over time. Which solution can the company use to identify model drift in the future?", "kq": "어떤 회사가 사용자에게 동영상을 추천하기 위해 ML 모델을 사용합니다. 이 모델은 Amazon SageMaker AI에 배포되어 있습니다. 배포 직후에는 모델 성능이 좋았지만 시간이 지나면서 성능이 저하되었습니다. 앞으로 모델 드리프트를 식별하기 위해 회사가 사용할 수 있는 방법은 무엇입니까?", "o": [{"k": "A", "t": "Create a monitoring job in SageMaker Model Monitor. Then create a baseline from the training dataset.", "kt": "SageMaker Model Monitor에서 모니터링 작업을 만듭니다. 그다음 학습 데이터셋으로 기준선(baseline)을 만듭니다."}, {"k": "B", "t": "Create a baseline from the training dataset. Then create a monitoring job in SageMaker Model Monitor.", "kt": "학습 데이터셋으로 기준선(baseline)을 만듭니다. 그다음 SageMaker Model Monitor에서 모니터링 작업을 만듭니다."}, {"k": "C", "t": "Create a baseline by using a built-in rule in SageMaker Clarify. Monitor the drift in Amazon CloudWatch.", "kt": "SageMaker Clarify의 내장 규칙으로 기준선을 만듭니다. Amazon CloudWatch에서 드리프트를 모니터링합니다."}, {"k": "D", "t": "Retrain the model on new data. Compare the retrained model's performance to the original model's performance.", "kt": "새 데이터로 모델을 재학습시킵니다. 재학습된 모델의 성능을 원래 모델의 성능과 비교합니다."}], "a": ["B"], "ko": "AWS는 배포된 모델의 데이터 드리프트와 모델 드리프트를 탐지하기 위해 Amazon SageMaker Model Monitor 사용을 권장합니다. Model Monitor는 먼저 학습 데이터셋에서 생성한 기준선과 실제 추론 데이터를 비교하는 방식으로 동작합니다. AWS 문서에서도 필요한 순서는 학습 데이터 통계를 사용해 기준선을 생성한 다음, 들어오는 데이터를 기준선과 비교하는 모니터링 일정을 생성하는 것이라고 명확히 설명합니다. A안은 이 순서를 반대로 제시하므로 적절하지 않습니다. C안은 SageMaker Clarify가 편향 및 설명 가능성에 초점을 두는 서비스이지 지속적인 드리프트 탐지 도구가 아니므로 부적절합니다. D안은 사후 대응 방식이며 지속적인 모니터링을 제공하지 않습니다. Model Monitor는 Amazon CloudWatch와 통합되어 자동 알림 및 후속 재학습 워크플로를 구성할 수 있습니다. 따라서 B안이 정답입니다.", "en": "AWS recommends Amazon SageMaker Model Monitor for detecting data drift and model drift in deployed models. Model Monitor works by comparing live inference data against a baseline, which must first be created from the training dataset. AWS documentation clearly specifies the required order: Create a baseline using training data statistics Create a monitoring schedule to compare incoming data against the baseline Option A reverses this order and is therefore incorrect. Option C is incorrect because SageMaker Clarify focuses on bias and explainability, not ongoing drift detection. Option D is reactive and does not provide continuous monitoring. Model Monitor integrates with Amazon CloudWatch, enabling automated alerts and downstream retraining workflows. This proactive approach allows companies to detect degradation early and maintain model quality. Therefore, Option B is the correct and AWS-verified answer."}, {"n": 54, "t": "single", "q": "A company uses Amazon Athena to query a dataset in Amazon S3. The dataset has a target variable that the company wants to predict. The company needs to use the dataset in a solution to determine if a model can predict the target variable. Which solution will provide this information with the LEAST development effort?", "kq": "어떤 회사가 Amazon Athena를 사용해 Amazon S3의 데이터셋을 쿼리합니다. 이 데이터셋에는 회사가 예측하려는 대상 변수가 있습니다. 회사는 모델이 이 대상 변수를 예측할 수 있는지 판단하기 위한 솔루션에 이 데이터셋을 사용해야 합니다. 개발 부담이 가장 적게 이 정보를 얻는 방법은 무엇입니까?", "o": [{"k": "A", "t": "Create a new model by using Amazon SageMaker Autopilot. Report the model's achieved performance.", "kt": "Amazon SageMaker Autopilot으로 새 모델을 만듭니다. 모델이 달성한 성능을 보고합니다."}, {"k": "B", "t": "Implement custom scripts to perform data pre-processing, multiple linear regression, and performance evaluation. Run the scripts on Amazon EC2 instances.", "kt": "데이터 전처리, 다중 선형 회귀, 성능 평가를 수행하는 사용자 지정 스크립트를 구현합니다. Amazon EC2 인스턴스에서 스크립트를 실행합니다."}, {"k": "C", "t": "Configure Amazon Macie to analyze the dataset and to create a model. Report the model's achieved performance.", "kt": "Amazon Macie가 데이터셋을 분석하고 모델을 만들도록 구성합니다. 모델이 달성한 성능을 보고합니다."}, {"k": "D", "t": "Select a model from Amazon Bedrock. Tune the model with the data. Report the model's achieved performance.", "kt": "Amazon Bedrock에서 모델을 선택합니다. 데이터로 모델을 튜닝합니다. 모델이 달성한 성능을 보고합니다."}], "a": ["A"], "ko": "요구 사항은 최소한의 개발 노력으로 대상 변수를 예측할 수 있는지 빠르게 판단하는 것입니다. Amazon SageMaker Autopilot은 이러한 목적에 맞게 설계된 서비스입니다. SageMaker Autopilot은 데이터 전처리, 특성 엔지니어링, 알고리즘 선택, 모델 학습 및 평가를 자동으로 처리합니다. 또한 여러 후보 모델을 생성하고 상세한 성능 지표를 제공하므로 사용자 지정 코드를 작성하지 않고도 예측 가능성을 빠르게 평가할 수 있습니다. B안은 상당한 수작업 개발이 필요합니다. C안의 Amazon Macie는 데이터 보안 및 분류 서비스이지 ML 모델링 서비스가 아닙니다. D안의 Amazon Bedrock 모델은 구조화된 표 형식 데이터 예측 작업에 적합하지 않습니다. 따라서 SageMaker Autopilot을 사용하는 A안이 가장 빠르고 개발 노력이 적은 해결책입니다.", "en": "The requirement is to quickly determine whether the target variable is predictable, with minimal development effort. Amazon SageMaker Autopilot is specifically designed for this purpose. SageMaker Autopilot automatically handles data preprocessing, feature engineering, algorithm selection, model training, and evaluation. It generates multiple candidate models and provides detailed performance metrics, allowing teams to quickly assess predictability without writing custom code. Option B requires significant manual development. Option C is incorrect because Amazon Macie is a data security and classification service, not an ML modeling service. Option D is unsuitable because Amazon Bedrock models are not intended for structured tabular prediction tasks. Therefore, SageMaker Autopilot provides the fastest and least effort solution."}, {"n": 55, "t": "multi", "q": "An ML engineer has developed a binary classification model outside of Amazon SageMaker. The ML engineer needs to make the model accessible to a SageMaker Canvas user for additional tuning. The model artifacts are stored in an Amazon S3 bucket. The ML engineer and the Canvas user are part of the same SageMaker domain. Which combination of requirements must be met so that the ML engineer can share the model with the Canvas user? (Choose two.)", "kq": "ML 엔지니어가 Amazon SageMaker 외부에서 이진 분류 모델을 개발했습니다. ML 엔지니어는 추가 튜닝을 위해 이 모델을 SageMaker Canvas 사용자가 접근할 수 있게 만들어야 합니다. 모델 아티팩트는 Amazon S3 버킷에 저장되어 있습니다. ML 엔지니어와 Canvas 사용자는 같은 SageMaker 도메인에 속해 있습니다. ML 엔지니어가 Canvas 사용자와 모델을 공유하려면 어떤 요구 사항들이 충족되어야 합니까? (2개 선택)", "o": [{"k": "A", "t": "The ML engineer and the Canvas user must be in separate SageMaker domains.", "kt": "ML 엔지니어와 Canvas 사용자가 서로 다른 SageMaker 도메인에 있어야 합니다."}, {"k": "B", "t": "The Canvas user must have permissions to access the S3 bucket where the model artifacts are stored.", "kt": "Canvas 사용자가 모델 아티팩트가 저장된 S3 버킷에 접근할 권한이 있어야 합니다."}, {"k": "C", "t": "The model must be registered in the SageMaker Model Registry.", "kt": "모델이 SageMaker Model Registry에 등록되어 있어야 합니다."}, {"k": "D", "t": "The ML engineer must host the model on AWS Marketplace.", "kt": "ML 엔지니어가 AWS Marketplace에 모델을 호스팅해야 합니다."}, {"k": "E", "t": "The ML engineer must deploy the model to a SageMaker endpoint.", "kt": "ML 엔지니어가 모델을 SageMaker 엔드포인트에 배포해야 합니다."}], "a": ["B", "C"], "ko": "SageMaker Canvas 사용자가 모델을 활용하려면 모델 아티팩트가 저장된 Amazon S3 버킷에 접근할 수 있는 권한이 필요합니다. 또한 모델을 SageMaker Model Registry에 등록하면 SageMaker 생태계 내에서 모델을 추적하고 관리할 수 있으며, Canvas 사용자가 추가 튜닝 및 배포 작업에 사용할 수 있습니다. 이 조합은 적절한 접근 제어와 SageMaker 내 통합 관리를 모두 제공하므로 Canvas 사용자가 모델을 사용할 수 있게 합니다. 따라서 B와 C가 정답입니다.", "en": "The SageMaker Canvas user needs permissions to access the Amazon S3 bucket where the model artifacts are stored to retrieve the model for use in Canvas. Registering the model in the SageMaker Model Registry allows the model to be tracked and managed within the SageMaker ecosystem. This makes it accessible for tuning and deployment through SageMaker Canvas. This combination ensures proper access control and integration within SageMaker, enabling the Canvas user to work with the model."}, {"n": 56, "t": "single", "q": "An ML engineer is developing a classification model. The ML engineer needs to use custom libraries in processing jobs, training jobs, and pipelines in Amazon SageMaker AI. Which solution will provide this functionality with the LEAST implementation effort?", "kq": "ML 엔지니어가 분류 모델을 개발하고 있습니다. ML 엔지니어는 Amazon SageMaker AI의 처리 작업, 학습 작업, 파이프라인에서 사용자 지정 라이브러리를 사용해야 합니다. 구현 부담이 가장 적게 이 기능을 제공하는 방법은 무엇입니까?", "o": [{"k": "A", "t": "Manually install the libraries in the SageMaker AI containers.", "kt": "SageMaker AI 컨테이너에 라이브러리를 수동으로 설치합니다."}, {"k": "B", "t": "Build a custom Docker container that includes the required libraries. Host the container in Amazon Elastic Container Registry (Amazon ECR). Use the ECR image in the SageMaker AI jobs and pipelines.", "kt": "필요한 라이브러리가 포함된 사용자 지정 Docker 컨테이너를 빌드합니다. 컨테이너를 Amazon ECR에 호스팅합니다. SageMaker AI 작업과 파이프라인에서 해당 ECR 이미지를 사용합니다."}, {"k": "C", "t": "Use a SageMaker AI notebook instance and install libraries at startup.", "kt": "SageMaker AI 노트북 인스턴스를 사용하고 시작 시 라이브러리를 설치합니다."}, {"k": "D", "t": "Run code externally on Amazon EC2 and import results into SageMaker AI.", "kt": "Amazon EC2에서 외부로 코드를 실행하고 결과를 SageMaker AI로 가져옵니다."}], "a": ["B"], "ko": "AWS 문서는 처리 작업, 학습 작업, 파이프라인 전반에서 사용자 지정 종속성을 일관되게 사용해야 하는 ML 워크로드에는 사용자 지정 Docker 컨테이너 사용을 권장합니다. 필요한 라이브러리를 모두 포함한 하나의 Docker 이미지를 만들고 이를 Amazon ECR에 저장하면 모든 SageMaker 작업이 동일한 런타임 환경을 사용할 수 있습니다. 이 방식은 반복적인 라이브러리 설치를 제거하고 환경 차이로 인한 문제를 방지합니다. 관리형 컨테이너에 수동으로 라이브러리를 설치하는 방식은 오류가 발생하기 쉽고 재사용성이 낮습니다. 노트북 인스턴스는 운영 작업과 파이프라인 실행 환경으로 적합하지 않으며, EC2에서 외부로 코드를 실행하는 방식은 SageMaker 워크플로를 벗어나 운영 복잡도를 증가시킵니다. 따라서 사용자 지정 컨테이너를 사용하는 B안이 가장 적은 구현 노력으로 요구 사항을 충족합니다.", "en": "AWS documentation strongly recommends using custom Docker containers when ML workloads require consistent access to custom dependencies across processing jobs, training jobs, and pipelines. By building a single Docker image that contains all required libraries and hosting it in Amazon ECR, the ML engineer ensures that every SageMaker job use
