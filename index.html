nnot meet real-time latency requirements and where payload sizes exceed real-time limits. SageMaker asynchronous inference integrates natively with Amazon SNS to send notifications when inference completes or fails, which directly satisfies the user notification requirement. Batch transform jobs are intended for offline, scheduled processing of large datasets and do not provide built- in user notification mechanisms. Amazon EFS is not required because SageMaker natively integrates with S3 for inference input and output. AWS explicitly documents asynchronous inference as the preferred solution for large image inference with completion notifications. Therefore, Option B is the correct and AWS-verified answer."}, {"n": 118, "t": "single", "q": "A company has significantly increased the amount of data that is stored as .csv files in an Amazon S3 bucket. Data transformation scripts and queries are now taking much longer than they used to take. An ML engineer must implement a solution to optimize the data for query performance. Which solution will meet this requirement with the LEAST operational overhead?", "kq": "어떤 회사가 Amazon S3 버킷에 .csv 파일로 저장하는 데이터 양을 크게 늘렸습니다. 이제 데이터 변환 스크립트와 쿼리가 이전보다 훨씬 오래 걸립니다. ML 엔지니어는 쿼리 성능을 위해 데이터를 최적화하는 솔루션을 구현해야 합니다. 어떤 솔루션이 최소한의 운영 오버헤드로 이 요구 사항을 충족할까요?", "o": [{"k": "A", "t": "Configure an AWS Lambda function to split the .csv files into smaller objects in the S3 bucket.", "kt": ".csv 파일을 S3 버킷 내에서 더 작은 객체로 분할하는 AWS Lambda 함수를 구성합니다."}, {"k": "B", "t": "Configure an AWS Glue job to drop columns that have string type values and to save the results to the S3 bucket.", "kt": "문자열 타입 값을 가진 컬럼을 삭제하고 결과를 S3 버킷에 저장하는 AWS Glue 작업을 구성합니다."}, {"k": "C", "t": "Configure an AWS Glue extract, transform, and load (ETL) job to convert the .csv files to Apache Parquet format.", "kt": ".csv 파일을 Apache Parquet 형식으로 변환하는 AWS Glue ETL 작업을 구성합니다."}, {"k": "D", "t": "Configure an Amazon EMR cluster to process the data that is in the S3 bucket.", "kt": "S3 버킷의 데이터를 처리하는 Amazon EMR 클러스터를 구성합니다."}], "a": ["C"], "ko": "AWS 문서는 Amazon S3에 저장된 대규모 데이터셋의 분석 쿼리 성능을 최적화하기 위해 컬럼 기반 저장 형식을 사용할 것을 강력히 권장합니다. Apache Parquet는 컬럼 기반, 압축 가능, 분할 가능한 파일 형식으로, CSV와 같은 행 기반 형식에 비해 쿼리 속도를 크게 개선하고 I/O를 줄입니다. AWS Glue를 사용해 CSV 파일을 Parquet 형식으로 변환하면 완전 관리형 서버리스 방식으로 더 빠른 쿼리 실행을 구현할 수 있습니다. Glue는 S3, Amazon Athena, Amazon Redshift Spectrum과 기본적으로 통합됩니다. CSV 파일을 더 작은 객체로 나누는 A안은 여전히 비효율적인 행 기반 형식을 유지하므로 쿼리 효율을 근본적으로 개선하지 못합니다. B안은 데이터 크기를 줄일 수는 있지만 CSV 형식의 근본적인 비효율성을 해결하지 못하며 중요한 데이터를 제거할 위험이 있습니다. D안은 EMR 클러스터 프로비저닝, 확장, 유지관리가 필요해 운영 부담이 큽니다. 따라서 AWS Glue ETL로 CSV를 Apache Parquet로 변환하는 C안이 가장 효율적이고 운영 부담이 적은 해결책입니다.", "en": "AWS documentation strongly recommends using columnar storage formats to optimize analytical query performance on large datasets stored in Amazon S3. Apache Parquet is a columnar, compressed, and splittable file format that significantly improves query speed and reduces I/O compared to row-based formats such as CSV. By using AWS Glue to convert CSV files into Parquet format, the company can achieve faster query execution with minimal operational overhead. Glue is fully managed, serverless, and integrates natively with S3, Amazon Athena, and Amazon Redshift Spectrum. Option A does not improve query efficiency; splitting files still leaves the data in an inefficient row- based format. Option B may reduce data size but does not address the fundamental inefficiency of CSV for analytics. Option D introduces significant operational overhead because Amazon EMR requires cluster provisioning, scaling, and maintenance. Therefore, converting CSV files to Apache Parquet using AWS Glue ETL is the most efficient and low- maintenance solution."}, {"n": 119, "t": "single", "q": "An ML engineer is analyzing potential biases in a customer dataset before training an ML model. The dataset contains customer age (numeric), product reviews (text), and purchase outcomes (categorical). Which statistical metrics should the ML engineer use to identify potential biases in the dataset before model training?", "kq": "ML 엔지니어가 ML 모델을 학습시키기 전에 고객 데이터셋의 잠재적 편향을 분석하고 있습니다. 데이터셋에는 고객 연령(수치형), 제품 리뷰(텍스트), 구매 결과(범주형)가 포함되어 있습니다. 모델 학습 전에 데이터셋의 잠재적 편향을 식별하려면 어떤 통계 지표를 사용해야 합니까?", "o": [{"k": "A", "t": "Calculate the statistical mean and standard deviation of customer age distribution. Count word frequencies in product reviews.", "kt": "고객 연령 분포의 통계적 평균과 표준편차를 계산합니다. 제품 리뷰의 단어 빈도를 셉니다."}, {"k": "B", "t": "Calculate the class imbalance metric of purchase outcomes. Use product reviews to check sentiment distribution to capture bias.", "kt": "구매 결과의 클래스 불균형 지표를 계산합니다. 편향을 포착하기 위해 제품 리뷰로 감정 분포를 확인합니다."}, {"k": "C", "t": "Calculate the class imbalance metric of purchase outcomes and the difference in proportions of labels (DPL) across customer age groups.", "kt": "구매 결과의 클래스 불균형 지표와 고객 연령 그룹 간 레이블 비율 차이(DPL)를 계산합니다."}, {"k": "D", "t": "Calculate the correlation coefficient between customer age and purchase outcomes. Calculate unique word counts in product reviews.", "kt": "고객 연령과 구매 결과 간 상관계수를 계산합니다. 제품 리뷰의 고유 단어 수를 계산합니다."}], "a": ["C"], "ko": "편향 탐지는 책임 있는 머신러닝에서 중요한 단계이며, 특히 Amazon SageMaker Clarify 문서에서 강조됩니다. 나이와 같은 민감하거나 영향력 있는 속성이 포함된 구조화 데이터셋을 분석할 때, AWS는 모델 학습 전에 레이블 분포의 공정성과 그룹별 결과 차이를 평가할 것을 권장합니다. 클래스 불균형 지표는 구매 여부와 같은 특정 결과가 과도하게 많거나 적게 나타나는지 확인하는 데 도움이 됩니다. 심각한 불균형은 모델이 다수 클래스에 치우치도록 만들어 편향된 예측을 유발할 수 있습니다. Difference in Proportions of Labels(DPL)는 SageMaker Clarify에서 지원하는 공정성 지표로, 나이 그룹과 같은 서로 다른 그룹 간에 결과 레이블이 불균형하게 분포되어 있는지 측정합니다. DPL은 그룹 간 긍정 결과 비율을 비교하므로 범주형 레이블에서 인구통계학적 편향을 식별하는 데 효과적입니다. A와 D는 기술통계나 상관관계 분석에 초점을 두며 데이터 이해에는 유용하지만 편향이나 공정성을 직접 측정하지는 않습니다. B는 일부 불균형을 다루지만 리뷰 감성 분석만으로는 결과와 연결된 인구통계학적 편향을 정량화할 수 없습니다. 따라서 클래스 불균형과 DPL을 함께 사용하는 C안이 가장 적절합니다.", "en": "Bias detection is a critical step in responsible machine learning and is emphasized in AWS documentation, particularly in Amazon SageMaker Clarify. When analyzing structured datasets that include sensitive or influential attributes such as age, AWS recommends evaluating label distribution fairness and group-based outcome differences before training a model. The class imbalance metric helps identify whether certain outcomes (for example, purchase vs. no purchase) are overrepresented or underrepresented. Severe imbalance can cause models to favor majority classes, leading to biased predictions. AWS explicitly highlights class imbalance as a key issue to assess during data exploration. The Difference in Proportions of Labels (DPL) is a fairness metric supported by SageMaker Clarify that measures whether outcome labels are disproportionately distributed across different groups, such as age ranges. DPL compares the proportion of favorable outcomes between groups, making it especially effective for identifying demographic bias in categorical labels. Options A and D focus on descriptive statistics or correlations, which are useful for data understanding but do not directly measure bias or fairness. Option B partially addresses imbalance and sentiment but sentiment analysis of reviews alone does not quantify demographic bias tied to outcomes. AWS documentation strongly recommends using group fairness metrics, including DPL, alongside class imbalance checks to identify bias before training. These metrics provide actionable insights into whether a dataset may lead to unfair or skewed model behavior. Therefore, Option C is the most appropriate and AWS-aligned choice."}, {"n": 120, "t": "single", "q": "An ML engineer needs to implement a solution to host a trained ML model. The rate of requests to the model will be inconsistent throughout the day. The ML engineer needs a scalable solution that minimizes costs when the model is not in use. The solution also must maintain the model's capacity to respond to requests during times of peak usage. Which solution will meet these requirements?", "kq": "ML 엔지니어가 학습된 ML 모델을 호스팅하는 솔루션을 구현해야 합니다. 모델에 대한 요청 속도는 하루 중 일정하지 않습니다. ML 엔지니어는 모델을 사용하지 않을 때 비용을 최소화하는 확장 가능한 솔루션이 필요합니다. 또한 솔루션은 사용량이 최대일 때 요청에 응답할 수 있는 모델의 처리 능력을 유지해야 합니다. 어떤 솔루션이 이러한 요구 사항을 충족할까요?", "o": [{"k": "A", "t": "Create AWS Lambda functions that have fixed concurrency to host the model. Configure the Lambda functions to automatically scale based on the number of requests to the model.", "kt": "고정 동시성을 가진 AWS Lambda 함수를 만들어 모델을 호스팅합니다. 모델에 대한 요청 수에 따라 자동으로 확장되도록 Lambda 함수를 구성합니다."}, {"k": "B", "t": "Deploy the model on an Amazon Elastic Container Service (Amazon ECS) cluster that uses AWS Fargate. Set a static number of tasks to handle requests during times of peak usage.", "kt": "AWS Fargate를 사용하는 Amazon ECS 클러스터에 모델을 배포합니다. 사용량이 최대일 때의 요청을 처리할 수 있도록 고정된 태스크 수를 설정합니다."}, {"k": "C", "t": "Deploy the model to an Amazon SageMaker endpoint. Deploy multiple copies of the model to the endpoint. Create an Application Load Balancer to route traffic between the different copies of the model at the endpoint.", "kt": "모델을 Amazon SageMaker 엔드포인트에 배포합니다. 엔드포인트에 모델 복사본을 여러 개 배포합니다. Application Load Balancer를 만들어 엔드포인트의 여러 모델 복사본 간 트래픽을 라우팅합니다."}, {"k": "D", "t": "Deploy the model to an Amazon SageMaker endpoint. Create SageMaker endpoint auto scaling policies that are based on Amazon CloudWatch metrics to adjust the number of instances dynamically.", "kt": "모델을 Amazon SageMaker 엔드포인트에 배포합니다. Amazon CloudWatch 지표를 기반으로 인스턴스 수를 동적으로 조정하는 SageMaker 엔드포인트 Auto Scaling 정책을 만듭니다."}], "a": ["D"], "ko": "이 요구 사항은 하루 동안 요청량이 일정하지 않고, 사용하지 않을 때 비용을 최소화하면서도 피크 사용 시간에는 요청에 응답할 수 있는 확장성을 유지해야 하는 상황입니다. SageMaker 엔드포인트에 Auto Scaling 정책을 구성하면 Amazon CloudWatch 지표를 기반으로 인스턴스 수를 동적으로 조정할 수 있습니다. 트래픽이 증가하면 인스턴스가 자동으로 확장되어 처리 용량을 확보하고, 트래픽이 감소하면 인스턴스 수를 줄여 비용을 절감할 수 있습니다. Lambda의 고정 동시성은 모델 호스팅에 적합하지 않고, ECS에서 정적 태스크 수를 유지하는 방식은 유휴 시간에도 비용이 발생합니다. 여러 모델 복사본을 Application Load Balancer로 라우팅하는 C안은 SageMaker의 기본 자동 확장 기능을 활용하지 못하고 운영 복잡성을 증가시킵니다. 따라서 CloudWatch 지표 기반의 SageMaker 엔드포인트 자동 확장 정책을 사용하는 D안이 가장 적절합니다.", "en": ""}, {"n": 121, "t": "single", "q": "An ML engineer needs to use data with Amazon SageMaker Canvas to train an ML model. The data is stored in Amazon S3 and is complex in structure. The ML engineer must use a file format that minimizes processing time for the data. Which file format will meet these requirements?", "kq": "ML 엔지니어가 Amazon SageMaker Canvas로 ML 모델을 학습시키기 위해 데이터를 사용해야 합니다. 데이터는 Amazon S3에 저장되어 있고 구조가 복잡합니다. ML 엔지니어는 데이터 처리 시간을 최소화하는 파일 형식을 사용해야 합니다. 요구 사항을 충족하는 파일 형식은 무엇입니까?", "o": [{"k": "A", "t": "CSV files compressed with Snappy", "kt": "Snappy로 압축된 CSV 파일"}, {"k": "B", "t": "JSON objects in JSONL format", "kt": "JSONL 형식의 JSON 객체"}, {"k": "C", "t": "JSON files compressed with gzip", "kt": "gzip으로 압축된 JSON 파일"}, {"k": "D", "t": "Apache Parquet files", "kt": "Apache Parquet 파일"}], "a": ["D"], "ko": "Apache Parquet는 복잡하고 대규모 데이터셋에 최적화된 컬럼 기반 저장 파일 형식입니다. 필요한 컬럼만 읽을 수 있어 I/O를 줄이고 데이터 처리 속도를 높입니다. 따라서 SageMaker Canvas에서 ML 모델 학습을 위해 처리 시간을 최소화해야 하는 경우에 적합합니다. 또한 Parquet는 Amazon S3와 호환되며 데이터 분석 및 ML 워크플로에서 널리 지원됩니다.", "en": "Apache Parquet is a columnar storage file format optimized for complex and large datasets. It provides efficient reading and processing by accessing only the required columns, which reduces I/O and speeds up data handling. This makes it ideal for use with Amazon SageMaker Canvas, where minimizing processing time is important for training ML models. Parquet is also compatible with S3 and widely supported in data analytics and ML workflows."}, {"n": 122, "t": "match", "q": "A company has built more than 50 models and deployed the models on Amazon SageMaker Al as real-time inference endpoints. The company needs to reduce the costs of the SageMaker Al inference endpoints. The company used the same ML framework to build the models. The company's customers require low-latency access to the models. Select and order the correct steps from the following list to reduce the cost of inference and keep latency low. Select each step one time or not at all. (Select and order FIVE.)", "kq": "어떤 회사가 50개가 넘는 모델을 만들어 Amazon SageMaker AI의 실시간 추론 엔드포인트로 배포했습니다. 회사는 SageMaker AI 추론 엔드포인트의 비용을 줄여야 합니다. 회사는 동일한 ML 프레임워크로 모델들을 만들었습니다. 회사의 고객들은 모델에 대한 낮은 지연 시간 접근을 요구합니다. 추론 비용을 줄이면서 낮은 지연 시간을 유지하기 위해 아래 목록에서 올바른 단계를 선택해 순서대로 배치하세요. 각 단계는 한 번만 선택하거나 선택하지 않습니다. (5개 선택 및 순서 배치)", "p": ["Step 1", "Step 2", "Step 3", "Step 4", "Step 5"], "c": ["Create an endpoint configuration that references a multi-model container.", "Create a SageMaker AI model with multi-model endpoints enabled.", "Deploy a real-time inference endpoint by using the endpoint configuration.", "Deploy a serverless inference endpoint configuration by using the endpoint configuration.", "Spread the existing models to multiple different Amazon S3 bucket paths.", "Upload the existing models to the same Amazon S3 bucket path.", "Update the models to use the new endpoint ID. Pass the model IDs to the new endpoint."], "kp": ["1단계", "2단계", "3단계", "4단계", "5단계"], "kc": ["다중 모델 컨테이너를 참조하는 엔드포인트 구성을 만든다.", "다중 모델 엔드포인트가 활성화된 SageMaker AI 모델을 만든다.", "해당 엔드포인트 구성을 사용해 실시간 추론 엔드포인트를 배포한다.", "해당 엔드포인트 구성을 사용해 서버리스 추론 엔드포인트 구성을 배포한다.", "기존 모델들을 서로 다른 여러 Amazon S3 버킷 경로로 분산한다.", "기존 모델들을 동일한 Amazon S3 버킷 경로에 업로드한다.", "모델이 새 엔드포인트 ID를 사용하도록 업데이트한다. 모델 ID를 새 엔드포인트에 전달한다."], "a": [5, 1, 0, 2, 6], "ko": "1단계는 기존 모델을 동일한 Amazon S3 버킷 경로에 업로드하는 것입니다. 다중 모델 엔드포인트는 SageMaker가 필요할 때 모델을 동적으로 로드할 수 있도록 모든 모델이 하나의 S3 prefix 아래에 저장되어 있어야 합니다. 2단계는 다중 모델 엔드포인트가 활성화된 SageMaker AI 모델을 생성하는 것입니다. 이는 XGBoost, PyTorch, TensorFlow와 같이 MME 호환 컨테이너를 사용하는 SageMaker 모델 리소스를 생성하는 과정입니다. 3단계는 다중 모델 컨테이너를 참조하는 엔드포인트 구성을 생성하는 것입니다. 이 구성에는 인스턴스 유형, 초기 인스턴스 수, 다중 모델 컨테이너 참조가 포함됩니다. 4단계는 해당 엔드포인트 구성을 사용해 실시간 추론 엔드포인트를 배포하는 것입니다. 고객이 낮은 지연 시간을 요구하므로 실시간 엔드포인트가 필요합니다. 5단계는 모델들이 새 엔드포인트 ID를 사용하도록 업데이트하고, 요청 시 모델 ID를 새 엔드포인트에 전달하는 것입니다. 각 추론 요청은 모델 ID를 지정하므로 SageMaker가 S3에서 어떤 모델을 로드해야 하는지 알 수 있습니다.", "en": "Step 1 Upload the existing models to the same Amazon S3 bucket path. Multi-model endpoints require all models to be stored under a single S3 prefix so SageMaker can dynamically load them on demand. Step 2 Create a SageMaker AI model with multi-model endpoints enabled. This creates a SageMaker model resource that uses a multi-model-capable container (for example, XGBoost, PyTorch, or TensorFlow MME-compatible containers).Step 3 Create an endpoint configuration that references a multi-model container. The endpoint configuration defines: Instance type Initial instance count The multi-model container reference Step 4 Deploy a real-time inference endpoint by using the endpoint configuration. Real-time endpoints ensure low-latency inference, which is a strict customer requirement. Step 5 Update the models to use the new endpoint ID. Pass the model IDs to the new endpoint. Each inference request specifies a model ID so SageMaker knows which model to load from S3."}, {"n": 123, "t": "match", "q": "A company wants to host an ML model on Amazon SageMaker. An ML engineer is configuring a continuous integration and continuous delivery (Cl/CD) pipeline in AWS CodePipeline to deploy the model. The pipeline must run automatically when new training data for the model is uploaded to an Amazon S3 bucket. Select and order the pipeline's correct steps from the following list. Each step should be selected one time or not at all. (Select and order three.)", "kq": "어떤 회사가 Amazon SageMaker에 ML 모델을 호스팅하려고 합니다. ML 엔지니어가 모델을 배포하기 위해 AWS CodePipeline에서 CI/CD 파이프라인을 구성하고 있습니다. 파이프라인은 모델용 새 학습 데이터가 Amazon S3 버킷에 업로드되면 자동으로 실행되어야 합니다. 아래 목록에서 파이프라인의 올바른 단계를 선택해 순서대로 배치하세요. 각 단계는 한 번만 선택하거나 선택하지 않습니다. (3개 선택 및 순서 배치)", "p": ["Step 1", "Step 2", "Step 3"], "c": ["An S3 event notification invokes the pipeline when new data is uploaded.", "An S3 Lifecycle rule invokes the pipeline when new data is uploaded.", "SageMaker retrains the model by using the data in the S3 bucket.", "The pipeline deploys the model to a SageMaker endpoint.", "The pipeline deploys the model to SageMaker Model Registry."], "kp": ["1단계", "2단계", "3단계"], "kc": ["새 데이터가 업로드되면 S3 이벤트 알림이 파이프라인을 호출한다.", "새 데이터가 업로드되면 S3 Lifecycle 규칙이 파이프라인을 호출한다.", "SageMaker가 S3 버킷의 데이터를 사용해 모델을 재학습시킨다.", "파이프라인이 모델을 SageMaker 엔드포인트에 배포한다.", "파이프라인이 모델을 SageMaker Model Registry에 배포한다."], "a": [0, 2, 3], "ko": "올바른 순서는 다음과 같습니다. 1단계는 새 데이터가 업로드될 때 S3 이벤트 알림이 파이프라인을 호출하는 것입니다. CI/CD 파이프라인은 새 학습 데이터가 Amazon S3에 업로드될 때 자동으로 시작되어야 하며, S3 이벤트 알림은 Lambda 등 AWS 서비스로 이벤트를 전달해 CodePipeline을 트리거할 수 있습니다. 2단계는 SageMaker가 S3 버킷의 데이터를 사용해 모델을 재학습하는 것입니다. 업로드된 데이터는 최신 정보를 모델에 반영하고 성능을 유지하기 위해 사용됩니다. 3단계는 파이프라인이 재학습된 모델을 SageMaker 엔드포인트에 배포하는 것입니다. 이를 통해 업데이트된 모델을 실시간 추론에 사용할 수 있습니다. 이 구성은 SageMaker에서 모델을 지속적으로 재학습하고 배포하는 자동화되고 확장 가능한 CI/CD 파이프라인을 제공합니다.", "en": "Step 1: An S3 event notification invokes the pipeline when new data is uploaded. Step 2: SageMaker retrains the model by using the data in the S3 bucket. Step 3: The pipeline deploys the model to a SageMaker endpoint. Step 1: An S3 Event Notification Invokes the Pipeline When New Data is Uploaded Why? The CI/CD pipeline should be triggered automatically whenever new training data is uploaded to Amazon S3. S3 event notifications can be configured to send events to AWS services like Lambda, which can then invoke AWS CodePipeline. How? Configure the S3 bucket to send event notifications (e.g., s3:ObjectCreated:*) to AWS Lambda, which in turn triggers the CodePipeline. Step 2: SageMaker Retrains the Model by Using the Data in the S3 Bucket Why? The uploaded data is used to retrain the ML model to incorporate new information and maintain performance. This step is critical to updating the model with fresh data. How? Define a SageMaker training step in the CI/CD pipeline, which reads the training data from the S3 bucket and retrains the model. Step 3: The Pipeline Deploys the Model to a SageMaker Endpoint Why? Once retrained, the updated model must be deployed to a SageMaker endpoint to make it available for real-time inference. How? Add a deployment step in the CI/CD pipeline, which automates the creation or update of the SageMaker endpoint with the retrained model. Order Summary: An S3 event notification invokes the pipeline when new data is uploaded. SageMaker retrains the model by using the data in the S3 bucket. The pipeline deploys the model to a SageMaker endpoint. This configuration ensures an automated, efficient, and scalable CI/CD pipeline for continuous retraining and deployment of the ML model in Amazon SageMaker."}, {"n": 124, "t": "single", "q": "An ML engineer is using an Amazon SageMaker AI shadow test to evaluate a new model that is hosted on a SageMaker AI endpoint. The shadow test requires significant GPU resources for high performance. The production variant currently runs on a less powerful instance type. The ML engineer needs to configure the shadow test to use a higher performance instance type for a shadow variant. The solution must not affect the instance type of the production variant. Which solution will meet these requirements?", "kq": "ML 엔지니어가 SageMaker AI 엔드포인트에 호스팅된 새 모델을 평가하기 위해 Amazon SageMaker AI 섀도 테스트를 사용하고 있습니다. 이 섀도 테스트는 높은 성능을 위해 상당한 GPU 리소스를 필요로 합니다. 현재 프로덕션 변형은 성능이 낮은 인스턴스 유형에서 실행되고 있습니다. ML 엔지니어는 섀도 변형에 더 높은 성능의 인스턴스 유형을 사용하도록 섀도 테스트를 구성해야 합니다. 단, 프로덕션 변형의 인스턴스 유형에는 영향을 주어서는 안 됩니다. 어떤 솔루션이 이러한 요구 사항을 충족할까요?", "o": [{"k": "A", "t": "Modify the existing ProductionVariant configuration in the endpoint to include a ShadowProductionVariants list. Specify the larger instance type for the shadow variant.", "kt": "엔드포인트의 기존 ProductionVariant 구성을 수정해 ShadowProductionVariants 목록을 포함시킵니다. 섀도 변형에 더 큰 인스턴스 유형을 지정합니다."}, {"k": "B", "t": "Create a new endpoint configuration with two ProductionVariant definitions. Configure one definition for the existing production variant and one definition for the shadow variant with the larger instance type. Use the UpdateEndpoint action to apply the new configuration.", "kt": "두 개의 ProductionVariant 정의가 있는 새 엔드포인트 구성을 만듭니다. 하나는 기존 프로덕션 변형용으로, 다른 하나는 더 큰 인스턴스 유형의 섀도 변형용으로 구성합니다. UpdateEndpoint 작업으로 새 구성을 적용합니다."}, {"k": "C", "t": "Create a separate SageMaker AI endpoint for the shadow variant that uses the larger instance type. Create an AWS Lambda function that routes a portion of the traffic to the shadow endpoint. Assign the Lambda function to the original endpoint.", "kt": "더 큰 인스턴스 유형을 사용하는 섀도 변형용 별도 SageMaker AI 엔드포인트를 만듭니다. 트래픽의 일부를 섀도 엔드포인트로 라우팅하는 AWS Lambda 함수를 만듭니다. 그 Lambda 함수를 원래 엔드포인트에 할당합니다."}, {"k": "D", "t": "Use the CreateEndpointConfig action to define a new configuration. Specify the existing production variant in the configuration and add a separate ShadowProductionVariants list. Specify the larger instance type for the shadow variant. Use the CreateEndpoint action and pass the new configuration to the endpoint.", "kt": "CreateEndpointConfig 작업으로 새 구성을 정의합니다. 구성에 기존 프로덕션 변형을 지정하고 별도의 ShadowProductionVariants 목록을 추가합니다. 섀도 변형에 더 큰 인스턴스 유형을 지정합니다. CreateEndpoint 작업을 사용해 새 구성을 엔드포인트에 전달합니다."}], "a": ["D"], "ko": "Amazon SageMaker AI 섀도 테스트는 운영 추론 응답에 영향을 주지 않으면서 라이브 운영 트래픽의 복사본을 섀도 변형으로 보내 새 모델 버전을 평가할 수 있게 합니다. AWS 문서에 따르면 섀도 변형은 프로덕션 변형과 별도로 구성되며, 더 높은 성능의 GPU 인스턴스와 같이 서로 다른 인스턴스 유형을 사용할 수 있습니다. 올바른 접근 방식은 CreateEndpointConfig API를 사용해 새 엔드포인트 구성을 만드는 것입니다. 이 구성에는 기존 프로덕션 변형과 별도의 ShadowProductionVariants 목록이 포함됩니다. 섀도 변형에는 더 큰 인스턴스 유형을 지정할 수 있으며, 프로덕션 변형은 변경하지 않을 수 있습니다. 그런 다음 CreateEndpoint 작업으로 새 구성을 배포합니다. A안은 프로덕션 변형 구성에 섀도 변형을 직접 추가할 수 없으므로 부적절합니다. B안은 섀도 변형을 일반 프로덕션 변형으로 정의하는 방식이므로 트래픽 라우팅과 운영 동작에 영향을 줄 수 있습니다. C안은 SageMaker의 내장 섀도 테스트 기능을 사용하지 않아 불필요하게 복잡합니다. 따라서 D안이 AWS 권장 해결책입니다.", "en": "Amazon SageMaker AI shadow testing enables ML engineers to evaluate new model versions by sending a copy of live production traffic to a shadow variant without affecting production inference responses. AWS documentation specifies that shadow variants are configured separately from production variants and can use different instance types, including higher-performance GPU instances. The correct approach is to create a new endpoint configuration using the CreateEndpointConfig API. This configuration includes the existing production variant and a separate ShadowProductionVariants list. The shadow variant can be assigned a larger instance type to meet GPU performance requirements while leaving the production variant unchanged. After creating the configuration, the engineer deploys it using the CreateEndpoint action. Option A is incorrect because production variant configurations cannot be directly modified to include shadow variants. Option B is incorrect because shadow variants are not defined as standard production variants; defining two production variants would route traffic differently and could affect production behavior. Option C introduces unnecessary complexity and deviates from SageMaker's built-in shadow testing functionality. AWS explicitly documents that shadow variants are designed to isolate testing resources, support different instance types, and ensure zero impact on production inference. Therefore, Option D is the correct and AWS- recommended solution."}, {"n": 125, "t": "single", "q": "A company is using Amazon SageMaker and millions of files to train an ML model. Each file is several megabytes in size. The files are stored in an Amazon S3 bucket. The company needs to improve training performance. Which solution will meet these requirements in the LEAST amount of time?", "kq": "어떤 회사가 ML 모델을 학습시키기 위해 Amazon SageMaker와 수백만 개의 파일을 사용하고 있습니다. 각 파일의 크기는 수 메가바이트입니다. 파일들은 Amazon S3 버킷에 저장되어 있습니다. 회사는 학습 성능을 개선해야 합니다. 어떤 솔루션이 가장 짧은 시간 안에 이러한 요구 사항을 충족할까요?", "o": [{"k": "A", "t": "Transfer the data to a new S3 bucket that provides S3 Express One Zone storage. Adjust the training job to use the new S3 bucket.", "kt": "데이터를 S3 Express One Zone 스토리지를 제공하는 새 S3 버킷으로 전송합니다. 새 S3 버킷을 사용하도록 학습 작업을 조정합니다."}, {"k": "B", "t": "Create an Amazon FSx for Lustre file system. Link the file system to the existing S3 bucket. Adjust the training job to read from the file system.", "kt": "Amazon FSx for Lustre 파일 시스템을 만듭니다. 파일 시스템을 기존 S3 버킷에 연결합니다. 파일 시스템에서 읽도록 학습 작업을 조정합니다."}, {"k": "C", "t": "Create an Amazon Elastic File System (Amazon EFS) file system. Transfer the existing data to the file system. Adjust the training job to read from the file system.", "kt": "Amazon EFS 파일 시스템을 만듭니다. 기존 데이터를 파일 시스템으로 전송합니다. 파일 시스템에서 읽도록 학습 작업을 조정합니다."}, {"k": "D", "t": "Create an Amazon ElastiCache (Redis OSS) cluster. Link the Redis OSS cluster to the existing S3 bucket. Stream the data from the Redis OSS cluster directly to the training job.", "kt": "Amazon ElastiCache(Redis OSS) 클러스터를 만듭니다. Redis OSS 클러스터를 기존 S3 버킷에 연결합니다. Redis OSS 클러스터에서 학습 작업으로 데이터를 직접 스트리밍합니다."}], "a": ["B"], "ko": "Amazon FSx for Lustre는 ML 학습과 같은 고성능 워크로드를 위해 설계되었습니다. 기존 S3 버킷과 직접 연결하고 자주 접근하는 파일을 로컬에 캐시함으로써 빠르고 낮은 지연 시간의 데이터 접근을 제공합니다. 수백만 개의 파일을 S3에서 직접 읽는 것보다 학습 성능을 크게 향상할 수 있습니다. 또한 학습 작업을 크게 변경하지 않아도 되고 데이터를 별도로 전송하거나 재구성할 필요가 없어, 가장 빠르고 효율적인 해결책입니다.", "en": "Amazon FSx for Lustre is designed for high-performance workloads like ML training. It provides fast, low- latency access to data by linking directly to the existing S3 bucket and caching frequently accessed files locally. This significantly improves training performance compared to directly accessing millions of files from S3. It requires minimal changes to the training job and avoids the overhead of transferring or restructuring data, making it the fastest and most efficient solution."}, {"n": 126, "t": "match", "q": "An ML engineer is building a generative AI application on Amazon Bedrock by using large language models (LLMs). Select the correct generative AI term from the following list for each description. Each term should be selected one time or not at all. (Select three.)", "kq": "ML 엔지니어가 대규모 언어 모델(LLM)을 사용해 Amazon Bedrock에서 생성형 AI 애플리케이션을 만들고 있습니다. 아래 목록에서 각 설명에 맞는 생성형 AI 용어를 선택하세요. 각 용어는 한 번만 선택하거나 선택하지 않습니다. (3개 선택)", "p": ["Text representation of basic units of data processed by LLMs", "High-dimensional vectors that contain the semantic meaning of text", "Enrichment of information from additional data sources to improve a generated response"], "c": ["Embedding", "Retrieval Augmented Generation (RAG)", "Temperature", "Token"], "kp": ["LLM이 처리하는 데이터의 기본 단위에 대한 텍스트 표현", "텍스트의 의미를 담고 있는 고차원 벡터", "생성된 응답을 개선하기 위해 추가 데이터 소스에서 정보를 보강하는 것"], "kc": ["Embedding (임베딩)", "Retrieval Augmented Generation (RAG, 검색 증강 생성)", "Temperature (온도)", "Token (토큰)"], "a": [3, 0, 1], "ko": "LLM이 처리하는 데이터의 기본 단위에 대한 텍스트 표현은 Token입니다. 토큰은 LLM이 입력과 출력을 처리하는 가장 작은 텍스트 단위로, 단어 또는 단어의 일부일 수 있습니다. 텍스트의 의미를 담고 있는 고차원 벡터는 Embedding입니다. 임베딩은 단어, 문장, 문단의 의미와 관계를 벡터 형태로 표현하여 유사도 검색, 클러스터링, 의미 이해 작업에 활용됩니다. 추가 데이터 소스의 정보를 검색해 생성 응답의 품질을 높이는 방식은 Retrieval Augmented Generation(RAG)입니다. RAG는 지식베이스나 문서 저장소에서 관련 정보를 검색하여 LLM 응답을 사실 기반으로 보강하고 환각을 줄이는 데 도움이 됩니다.", "en": "Text representation of basic units of data processed by LLMs: Token High-dimensional vectors that contain the semantic meaning of text: Embedding Enrichment of information from additional data sources to improve a generated response: Retrieval Augmented Generation (RAG) Comprehensive Detailed Explanation Token: Description: A token represents the smallest unit of text (e.g., a word or part of a word) that an LLM processes. For example, \" running \" might be split into two tokens: \" run \" and \" ing. \" Why? Tokens are the fundamental building blocks for LLM input and output processing, ensuring that the model can understand and generate text efficiently. Embedding: Description: High-dimensional vectors that encode the semantic meaning of text. These vectors are representations of words, sentences, or even paragraphs in a way that reflects their relationships and meaning. Why? Embeddings are essential for enabling similarity search, clustering, or any task requiring semantic understanding. They allow the model to \" understand \" text contextually. Retrieval Augmented Generation (RAG): Description: A technique where information is enriched or retrieved from external data sources (e.g., knowledge bases or document stores) to improve the accuracy and relevance of a model's generated responses. Why? RAG enhances the generative capabilities of LLMs by grounding their responses in factual and up-to- date information, reducing hallucinations in generated text. By matching these terms to their respective descriptions, the ML engineer can effectively leverage these concepts to build robust and contextually aware generative AI applications on Amazon Bedrock."}, {"n": 127, "t": "single", "q": "An ML engineer wants to deploy a workflow that processes streaming IoT sensor data and periodically retrains ML models. The most recent model versions must be deployed to production. Which service will meet these requirements?", "kq": "ML 엔지니어가 스트리밍 IoT 센서 데이터를 처리하고 주기적으로 ML 모델을 재학습시키는 워크플로를 배포하려고 합니다. 최신 모델 버전이 운영 환경에 배포되어야 합니다. 요구 사항을 충족하는 서비스는 무엇입니까?", "o": [{"k": "A", "t": "Amazon SageMaker Pipelines", "kt": "Amazon SageMaker Pipelines"}, {"k": "B", "t": "Amazon Managed Workflows for Apache Airflow (MWAA)", "kt": "Amazon Managed Workflows for Apache Airflow (MWAA)"}, {"k": "C", "t": "AWS Lambda", "kt": "AWS Lambda"}, {"k": "D", "t": "Apache Spark", "kt": "Apache Spark"}], "a": ["A"], "ko": "Amazon SageMaker Pipelines는 데이터 수집, 학습, 평가, 배포를 포함한 엔드 투 엔드 ML 워크플로 오케스트레이션을 위해 설계된 서비스입니다. 자동화, 버전 관리, 최신 모델 버전의 배포를 지원합니다. MWAA는 일반 워크플로 오케스트레이션에는 적합하지만 ML 네이티브 기능이 부족합니다. Lambda는 장시간 실행되는 ML 학습을 처리하기 어렵고, Spark는 데이터 처리는 가능하지만 ML 수명주기 관리를 담당하지 않습니다. 따라서 A안이 AWS 네이티브 정답입니다.", "en": "Amazon SageMaker Pipelines is purpose-built for orchestrating end-to-end ML workflows, including data ingestion, training, evaluation, and deployment. It supports automation, versioning, and deployment of the latest model versions. MWAA orchestrates general workflows but lacks ML-native features. Lambda cannot handle long- running ML training. Spark processes data but does not manage ML lifecycle. Therefore, Option A is the correct AWS-native solution."}, {"n": 128, "t": "single", "q": "A company uses Amazon SageMaker for its ML workloads. The company's ML engineer receives a 50 MB Apache Parquet data file to build a fraud detection model. The file includes several correlated columns that are not required. What should the ML engineer do to drop the unnecessary columns in the file with the LEAST effort?", "kq": "어떤 회사가 ML 워크로드에 Amazon SageMaker를 사용합니다. 회사의 ML 엔지니어가 사기 탐지 모델을 만들기 위해 50MB 크기의 Apache Parquet 데이터 파일을 받았습니다. 이 파일에는 필요하지 않은 상관관계가 높은 컬럼이 여러 개 포함되어 있습니다. 가장 적은 노력으로 파일의 불필요한 컬럼을 제거하려면 어떻게 해야 합니까?", "o": [{"k": "A", "t": "Download the file to a local workstation. Perform one-hot encoding by using a custom Python script.", "kt": "파일을 로컬 워크스테이션으로 다운로드합니다. 사용자 지정 Python 스크립트로 원-핫 인코딩을 수행합니다."}, {"k": "B", "t": "Create an Apache Spark job that uses a custom processing script on Amazon EMR.", "kt": "Amazon EMR에서 사용자 지정 처리 스크립트를 사용하는 Apache Spark 작업을 만듭니다."}, {"k": "C", "t": "Create a SageMaker processing job by calling the SageMaker Python SDK.", "kt": "SageMaker Python SDK를 호출해 SageMaker 처리 작업을 만듭니다."}, {"k": "D", "t": "Create a data flow in SageMaker Data Wrangler. Configure a transform step.", "kt": "SageMaker Data Wrangler에서 데이터 플로우를 만듭니다. 변환 단계를 구성합니다."}], "a": ["D"], "ko": "SageMaker Data Wrangler는 불필요한 컬럼 제거를 포함해 데이터 준비와 변환을 수행할 수 있는 노코드/로우코드 인터페이스를 제공합니다. 데이터 플로우를 만들고 변환 단계를 구성하면 ML 엔지니어가 Parquet 파일에서 상관관계가 높거나 필요 없는 컬럼을 최소한의 노력으로 쉽게 제거할 수 있습니다. 이 방식은 사용자 지정 코드 작성이나 추가 인프라 관리가 필요 없다는 장점이 있습니다.", "en": "SageMaker Data Wrangler provides a no-code/low-code interface for preparing and transforming data, including dropping unnecessary columns. By creating a data flow and configuring a transform step, the ML engineer can easily remove correlated or unneeded columns from the Parquet file with minimal effort. This approach avoids the need for custom coding or managing additional infrastructure."}, {"n": 129, "t": "multi", "q": "A company is developing an application that reads animal descriptions from user prompts and generates images based on the information in the prompts. The application reads a message from an Amazon Simple Queue Service (Amazon SQS) queue. Then the application uses Amazon Titan Image Generator on Amazon Bedrock to generate an image based on the information in the message. Finally, the application removes the message from SQS queue. Which IAM permissions should the company assign to the application's IAM role? (Select TWO.)", "kq": "어떤 회사가 사용자 프롬프트에서 동물 설명을 읽고 그 정보를 기반으로 이미지를 생성하는 애플리케이션을 개발하고 있습니다. 애플리케이션은 Amazon SQS 큐에서 메시지를 읽습니다. 그다음 Amazon Bedrock의 Amazon Titan Image Generator를 사용해 메시지의 정보를 기반으로 이미지를 생성합니다. 마지막으로 애플리케이션은 SQS 큐에서 메시지를 삭제합니다. 회사가 애플리케이션의 IAM 역할에 부여해야 할 IAM 권한은 무엇입니까? (2개 선택)", "o": [{"k": "A", "t": "Allow the bedrock:InvokeModel action for the Amazon Titan Image Generator resource.", "kt": "Amazon Titan Image Generator 리소스에 대해 bedrock:InvokeModel 작업을 허용합니다."}, {"k": "B", "t": "Allow the bedrock:Get* action for the Amazon Titan Image Generator resource.", "kt": "Amazon Titan Image Generator 리소스에 대해 bedrock:Get* 작업을 허용합니다."}, {"k": "C", "t": "Allow the sqs:ReceiveMessage action and the sqs:DeleteMessage action for the SQS queue resource.", "kt": "SQS 큐 리소스에 대해 sqs:ReceiveMessage 작업과 sqs:DeleteMessage 작업을 허용합니다."}, {"k": "D", "t": "Allow the sqs:GetQueueAttributes action and the sqs:DeleteMessage action for the SQS queue resource.", "kt": "SQS 큐 리소스에 대해 sqs:GetQueueAttributes 작업과 sqs:DeleteMessage 작업을 허용합니다."}, {"k": "E", "t": "Allow the sagemaker:PutRecord* action for the Amazon Titan Image Generator resource.", "kt": "Amazon Titan Image Generator 리소스에 대해 sagemaker:PutRecord* 작업을 허용합니다."}], "a": ["A", "C"], "ko": "이미지를 생성하려면 애플리케이션이 Amazon Bedrock에서 호스팅되는 기반 모델을 호출할 수 있어야 합니다. Amazon Titan Image Generator를 호출하려면 bedrock:InvokeModel 권한이 필요합니다. bedrock:Get*와 같은 읽기 전용 권한은 추론 실행을 허용하지 않으므로 충분하지 않습니다. 또한 애플리케이션은 Amazon SQS와 상호작용해야 합니다. 메시지를 처리하려면 큐에서 메시지를 받을 수 있는 sqs:ReceiveMessage 권한과 처리 완료 후 메시지를 삭제할 수 있는 sqs:DeleteMessage 권한이 필요합니다. sqs:GetQueueAttributes만으로는 메시지를 소비할 수 없습니다. SageMaker 권한은 Bedrock과 별도의 서비스이므로 관련이 없습니다. 따라서 모델 호출 권한과 SQS 메시지 수신/삭제 권한이 필요합니다.", "en": "To generate images, the application must invoke a foundation model hosted on Amazon Bedrock. Invoking the Amazon Titan Image Generator requires the bedrock:InvokeModel permission. Read- only permissions such as bedrock:Get* do not allow inference execution and are insufficient. The application also interacts with Amazon Simple Queue Service. To process messages, the application must be able to receive messages from the queue and delete them after successful processing. These actions require sqs:ReceiveMessage and sqs:DeleteMessage. sqs:GetQueueAttributes alone does not allow message consumption. SageMaker permissions are unrelated because Bedrock is a separate service. Therefore, permissions to invoke the model and receive/delete SQS messages are required."}, {"n": 131, "t": "single", "q": "A company uses a hybrid cloud environment. A model that is deployed on premises uses data in Amazon S3 to provide customers with a live conversational engine. The model is using sensitive data. An ML engineer needs to implement a solution to identify and remove the sensitive data. Which solution will meet these requirements with the LEAST operational overhead?", "kq": "어떤 회사가 하이브리드 클라우드 환경을 사용합니다. 온프레미스에 배포된 모델이 Amazon S3의 데이터를 사용해 고객에게 실시간 대화 엔진을 제공합니다. 이 모델은 민감한 데이터를 사용하고 있습니다. ML 엔지니어는 민감한 데이터를 식별하고 제거하는 솔루션을 구현해야 합니다. 어떤 솔루션이 최소한의 운영 오버헤드로 이러한 요구 사항을 충족할까요?", "o": [{"k": "A", "t": "Deploy the model on Amazon SageMaker. Create a set of AWS Lambda functions to identify and remove the sensitive data.", "kt": "모델을 Amazon SageMaker에 배포합니다. 민감한 데이터를 식별하고 제거하는 AWS Lambda 함수 세트를 만듭니다."}, {"k": "B", "t": "Deploy the model on an Amazon Elastic Container Service (Amazon ECS) cluster that uses AWS Fargate. Create an AWS Batch job to identify and remove the sensitive data.", "kt": "AWS Fargate를 사용하는 Amazon ECS 클러스터에 모델을 배포합니다. 민감한 데이터를 식별하고 제거하는 AWS Batch 작업을 만듭니다."}, {"k": "C", "t": "Use Amazon Macie to identify the sensitive data. Create a set of AWS Lambda functions to remove the sensitive data.", "kt": "Amazon Macie를 사용해 민감한 데이터를 식별합니다. 민감한 데이터를 제거하는 AWS Lambda 함수 세트를 만듭니다."}, {"k": "D", "t": "Use Amazon Comprehend to identify the sensitive data. Launch Amazon EC2 instances to remove the sensitive data.", "kt": "Amazon Comprehend를 사용해 민감한 데이터를 식별합니다. Amazon EC2 인스턴스를 시작해 민감한 데이터를 제거합니다."}], "a": ["C"], "ko": "Amazon Macie는 머신러닝을 사용하여 Amazon S3의 민감 데이터를 검색하고 분류하는 완전 관리형 데이터 보안 및 개인정보 보호 서비스입니다. Macie는 운영 부담을 최소화하면서 민감 데이터를 식별하도록 설계되어 있습니다. 민감 데이터가 식별되면 AWS Lambda 함수를 사용해 해당 데이터를 제거하거나 마스킹하는 과정을 자동화할 수 있으며, 하이브리드 클라우드 환경과도 효율적으로 통합할 수 있습니다. 이 방식은 개발 노력이 가장 적고, 민감 데이터를 효과적으로 처리해야 한다는 요구 사항에 부합합니다.", "en": "Amazon Macie is a fully managed data security and privacy service that uses machine learning to discover and classify sensitive data in Amazon S3. It is purpose-built to identify sensitive data with minimal operational overhead. After identifying the sensitive data, you can use AWS Lambda functions to automate the process of removing or redacting the sensitive data, ensuring efficiency and integration with the hybrid cloud environment. This solution requires the least development effort and aligns with the requirement to handle sensitive data effectively."}, {"n": 132, "t": "single", "q": "A company has trained an ML model that is packaged in a container. The company will integrate the model with an existing Python web application. The company needs to host the model on AWS by using Kubernetes. The company does not want to manage the control plane and must provision the resources in a repeatable manner. The infrastructure must be provisioned by using Python. Which solution will meet these requirements?", "kq": "어떤 회사가 컨테이너로 패키징된 ML 모델을 학습시켰습니다. 회사는 이 모델을 기존 Python 웹 애플리케이션과 통합할 예정입니다. 회사는 Kubernetes를 사용해 AWS에 모델을 호스팅해야 합니다. 회사는 컨트롤 플레인을 직접 관리하고 싶지 않으며, 반복 가능한 방식으로 리소스를 프로비저닝해야 합니다. 인프라는 Python으로 프로비저닝되어야 합니다. 어떤 솔루션이 이러한 요구 사항을 충족할까요?", "o": [{"k": "A", "t": "Use AWS CloudFormation to provision Amazon EC2 instances in multiple Availability Zones. Set up a Kubernetes cluster. Host the model container on the Kubernetes cluster.", "kt": "AWS CloudFormation으로 여러 가용 영역에 Amazon EC2 인스턴스를 프로비저닝합니다. Kubernetes 클러스터를 구성합니다. Kubernetes 클러스터에 모델 컨테이너를 호스팅합니다."}, {"k": "B", "t": "Use the AWS CLI to provision an Amazon Elastic Kubernetes Service (Amazon EKS) cluster. Store the image in an Amazon Elastic Container Registry (Amazon ECR) repository. Host the model container on the EKS cluster.", "kt": "AWS CLI로 Amazon EKS 클러스터를 프로비저닝합니다. 이미지를 Amazon ECR 리포지토리에 저장합니다. EKS 클러스터에 모델 컨테이너를 호스팅합니다."}, {"k": "C", "t": "Use the AWS Cloud Development Kit (AWS CDK) to provision an Amazon Elastic Kubernetes Service (Amazon EKS) cluster. Store the image in an Amazon Elastic Container Registry (Amazon ECR) repository. Host the model container on the EKS cluster.", "kt": "AWS CDK(Cloud Development Kit)로 Amazon EKS 클러스터를 프로비저닝합니다. 이미지를 Amazon ECR 리포지토리에 저장합니다. EKS 클러스터에 모델 컨테이너를 호스팅합니다."}, {"k": "D", "t": "Use AWS CloudFormation to provision an Amazon Elastic Kubernetes Service (Amazon EKS) cluster.Store the image in an Amazon Elastic Container Registry (Amazon ECR) repository. Host the model container on the EKS cluster.", "kt": "AWS CloudFormation으로 Amazon EKS 클러스터를 프로비저닝합니다. 이미지를 Amazon ECR 리포지토리에 저장합니다. EKS 클러스터에 모델 컨테이너를 호스팅합니다."}], "a": ["C"], "ko": "C안이 정답입니다. 회사는 Kubernetes 기반 호스팅이 필요하고, 컨트롤 플레인을 직접 관리하고 싶지 않으며, 반복 가능한 방식으로 인프라를 프로비저닝해야 하고, Python을 사용해야 합니다. Amazon EKS는 AWS의 관리형 Kubernetes 서비스이므로 Kubernetes 컨트롤 플레인을 직접 관리하지 않아도 되는 요구 사항을 충족합니다. 또한 AWS CDK는 Python을 지원하는 인프라 코드 도구이며, 클라우드 인프라를 Python 코드로 정의하고 반복 가능하게 배포할 수 있습니다. AWS CDK의 EKS 구성 요소를 사용하면 EKS 클러스터와 관련 Kubernetes 리소스를 코드로 정의할 수 있습니다. 모델이 이미 컨테이너로 패키징되어 있으므로 이미지를 Amazon ECR에 저장한 뒤 EKS 클러스터에 배포하는 방식이 AWS의 일반적인 컨테이너 워크플로에 부합합니다. A안은 EC2에서 Kubernetes 클러스터를 직접 구성해야 하므로 컨트롤 플레인 관리 회피 요구 사항에 맞지 않습니다. B안은 AWS CLI를 사용하므로 Python 기반 인프라 프로비저닝 요구 사항을 충족하지 못합니다. D안은 CloudFormation을 사용해 반복 가능한 인프라를 제공할 수는 있지만, Python을 사용해야 한다는 조건을 직접 충족하지 못합니다. 따라서 AWS CDK로 EKS 클러스터를 프로비저닝하고 ECR 이미지를 배포하는 C안이 가장 적절합니다.", "en": "Option C is correct because the company needs Kubernetes hosting, does not want to manage the control plane, wants repeatable infrastructure provisioning, and requires that provisioning be done by using Python. Amazon EKS is AWS's managed Kubernetes service, so it satisfies the requirement to avoid managing the Kubernetes control plane directly. The AWS CDK documentation also confirms that Python is a fully supported client language for defining infrastructure as code. AWS CDK is the best fit because it lets engineers define cloud infrastructure programmatically in Python and deploy it in a repeatable way. The AWS CDK EKS construct library specifically supports defining Amazon EKS clusters and related Kubernetes resources. This makes it a strong match for infrastructure that must be reproducible and expressed in code rather than provisioned manually. Since the model is already packaged in a container, storing the image in Amazon ECR and then deploying it to Amazon EKS follows the normal AWS container workflow. The other options are less suitable. Option A requires setting up and managing a Kubernetes cluster on EC2, which violates the requirement to avoid control-plane management. Option B uses the AWS CLI, but the question specifically requires infrastructure provisioning by using Python, not command- line provisioning. Option D uses CloudFormation, which is repeatable infrastructure as code, but the question explicitly says the infrastructure must be provisioned by using Python. AWS CDK uniquely satisfies both the IaC and Python requirements while using managed Kubernetes with EKS. Therefore, the best verified AWS-docs answer is C."}, {"n": 133, "t": "single", "q": "A company is using Amazon SageMaker AI to build an ML model to predict customer behavior. The company needs to explain the bias in the model to an auditor. The explanation must focus on demographic data of the customers. Which solution will meet these requirements?", "kq": "어떤 회사가 고객 행동을 예측하는 ML 모델을 만들기 위해 Amazon SageMaker AI를 사용하고 있습니다. 회사는 감사인에게 모델의 편향을 설명해야 합니다. 설명은 고객의 인구통계 데이터에 초점을 맞춰야 합니다. 어떤 솔루션이 이러한 요구 사항을 충족할까요?", "o": [{"k": "A", "t": "Use SageMaker Clarify to generate a bias report. Send the report to the auditor.", "kt": "SageMaker Clarify로 편향 보고서를 생성합니다. 보고서를 감사인에게 보냅니다."}, {"k": "B", "t": "Use AWS Glue DataBrew to create a job to detect drift in the model's data quality. Send the job output to the auditor.", "kt": "AWS Glue DataBrew로 모델의 데이터 품질 드리프트를 감지하는 작업을 만듭니다. 작업 출력을 감사인에게 보냅니다."}, {"k": "C", "t": "Use Amazon QuickSight integration with SageMaker AI to generate a bias report. Send the report to the auditor.", "kt": "SageMaker AI와 Amazon QuickSight 통합을 사용해 편향 보고서를 생성합니다. 보고서를 감사인에게 보냅니다."}, {"k": "D", "t": "Use Amazon CloudWatch metrics from the SageMaker AI namespace to create a bias dashboard. Share the dashboard with the auditor.", "kt": "SageMaker AI 네임스페이스의 Amazon CloudWatch 지표로 편향 대시보드를 만듭니다. 대시보드를 감사인과 공유합니다."}], "a": ["A"], "ko": "AWS 문서에서는 Amazon SageMaker Clarify를 ML 모델의 편향을 탐지, 측정, 설명하기 위한 주요 서비스로 설명합니다. 특히 나이, 성별, 위치와 같은 인구통계학적 속성이나 민감 속성 전반의 편향 분석에 적합합니다. Clarify는 학습 전, 학습 후, 추론 중 편향을 분석할 수 있으므로 감사 및 규정 준수 요구 사항에 적합합니다. SageMaker Clarify는 긍정 비율 차이, disparate impact, 조건부 인구통계학적 차이와 같은 공정성 지표를 사용해 편향 보고서를 생성하며, 이 보고서는 외부 감사자에게 전달하기에 적합합니다. AWS Glue DataBrew는 데이터 준비와 품질에 초점을 두며 편향 탐지 서비스가 아닙니다. Amazon QuickSight는 ML 공정성 지표를 제공하지 않으며, Amazon CloudWatch는 운영 지표를 수집할 뿐 인구통계학적 편향 지표를 제공하지 않습니다. 따라서 SageMaker Clarify로 편향 보고서를 생성하는 A안이 정답입니다.", "en": "AWS documentation identifies Amazon SageMaker Clarify as the primary service for detecting, measuring, and explaining bias in ML models, particularly across demographic and sensitive attributes such as age, gender, and location. Clarify can analyze bias before training, after training, and during inference, making it suitable for audit and compliance requirements. SageMaker Clarify generates bias reports using established fairness metrics such as difference in positive proportions, disparate impact, and conditional demographic disparity. These reports are exportable and auditor-friendly, directly meeting the requirement to explain bias to an external party. AWS Glue DataBrew focuses on data preparation and quality, not bias detection. Amazon QuickSight does not provide ML fairness metrics. Amazon CloudWatch captures operational metrics, not demographic bias indicators. AWS best practices explicitly recommend SageMaker Clarify for model transparency, fairness evaluation, and regulatory reporting. Therefore, Option A is the correct and AWS-verified solution."}, {"n": 135, "t": "single", "q": "A company uses an Amazon SageMaker AI model for real-time inference with auto scaling enabled. During peak usage, new instances launch before existing instances are fully ready, causing inefficiencies and delays. Which solution will optimize the scaling process without affecting response times?", "kq": "어떤 회사가 Auto Scaling이 활성화된 Amazon SageMaker AI 모델을 실시간 추론에 사용합니다. 사용량이 최대일 때 기존 인스턴스가 완전히 준비되기 전에 새 인스턴스가 시작되어 비효율과 지연이 발생합니다. 응답 시간에 영향을 주지 않으면서 스케일링 프로세스를 최적화하는 방법은 무엇입니까?", "o": [{"k": "A", "t": "Change to a multi-model endpoint configuration.", "kt": "다중 모델 엔드포인트 구성으로 변경합니다."}, {"k": "B", "t": "Integrate Amazon API Gateway and AWS Lambda to manage invocations.", "kt": "Amazon API Gateway와 AWS Lambda를 통합해 호출을 관리합니다."}, {"k": "C", "t": "Decrease the scale-in cooldown period and increase the maximum instance count.", "kt": "스케일인 쿨다운 기간을 줄이고 최대 인스턴스 수를 늘립니다."}, {"k": "D", "t": "Increase the cooldown period after scale-out activities.", "kt": "스케일아웃 활동 후 쿨다운 기간을 늘립니다."}], "a": ["D"], "ko": "Amazon SageMaker Auto Scaling은 스케일링 활동이 얼마나 자주 발생할 수 있는지를 제어하기 위해 쿨다운 기간을 사용합니다. 스케일아웃이 너무 빠르게 발생하면 새 인스턴스가 완전히 초기화되기 전에 트래픽을 받을 수 있어 비효율과 지연이 발생할 수 있습니다. AWS 문서에서는 새로 시작된 인스턴스가 초기화되고 정상 상태가 될 충분한 시간을 갖도록 스케일아웃 이후의 쿨다운 기간을 늘릴 것을 권장합니다. 이렇게 하면 트래픽 급증 시에도 응답 시간을 해치지 않고 안정적인 성능을 유지할 수 있습니다. 다중 모델 엔드포인트는 모델 호스팅 효율성 문제를 다루는 것이지 스케일링 타이밍 문제를 해결하지 않습니다. API Gateway와 Lambda는 불필요한 지연과 복잡성을 추가합니다. 스케일인 쿨다운을 줄이는 것은 스케일아웃 문제를 해결하지 못합니다. 따라서 스케일아웃 활동 후 쿨다운 기간을 늘리는 D안이 정답입니다.", "en": "Amazon SageMaker auto scaling uses cooldown periods to control how frequently scaling activities occur. When scale-out happens too quickly, new instances may receive traffic before they are fully initialized, leading to inefficiencies and latency. AWS documentation recommends increasing the scale-out cooldown period to give newly launched instances sufficient time to initialize and become healthy before additional scaling events occur. This ensures stable performance during traffic spikes without impacting response times. Multi-model endpoints address model hosting efficiency, not scaling timing. API Gateway and Lambda add unnecessary latency and complexity. Decreasing scale-in cooldown does not address scale-out issues. Therefore, Option D is the correct and AWS-aligned solution."}, {"n": 136, "t": "single", "q": "A company has a custom extract, transform, and load (ETL) process that runs on premises. The ETL process is written in the R language and runs for an average of 6 hours. The company wants to migrate the process to run on AWS. Which solution will meet these requirements?", "kq": "어떤 회사가 온프레미스에서 실행되는 사용자 지정 ETL 프로세스를 보유하고 있습니다. 이 ETL 프로세스는 R 언어로 작성되었고 평균 6시간 동안 실행됩니다. 회사는 이 프로세스를 AWS에서 실행되도록 마이그레이션하려고 합니다. 어떤 솔루션이 이러한 요구 사항을 충족할까요?", "o": [{"k": "A", "t": "Use an AWS Lambda function created from a container image to run the ETL jobs.", "kt": "컨테이너 이미지로 생성한 AWS Lambda 함수로 ETL 작업을 실행합니다."}, {"k": "B", "t": "Use Amazon SageMaker AI processing jobs with a custom Docker image stored in Amazon Elastic Container Registry (Amazon ECR).", "kt": "Amazon ECR에 저장된 사용자 지정 Docker 이미지와 함께 Amazon SageMaker AI 처리 작업을 사용합니다."}, {"k": "C", "t": "Use Amazon SageMaker AI script mode to build a Docker image. Run the ETL jobs by using SageMaker Notebook Jobs.", "kt": "Amazon SageMaker AI 스크립트 모드로 Docker 이미지를 빌드합니다. SageMaker Notebook Jobs로 ETL 작업을 실행합니다."}, {"k": "D", "t": "Use AWS Glue to prepare and run the ETL jobs.", "kt": "AWS Glue로 ETL 작업을 준비하고 실행합니다."}], "a": ["B"], "ko": "이 ETL 프로세스는 평균 6시간 동안 실행되는 장시간 작업이며 R 언어로 작성되어 있다는 두 가지 핵심 특성이 있습니다. AWS Lambda는 최대 실행 시간이 15분이므로 적합하지 않습니다. AWS Glue는 주로 Spark 기반 ETL을 지원하며, 사용자 지정 R 기반 워크로드를 기본적으로 지원하는 데 적합하지 않습니다. AWS 문서에서는 장시간 실행되는 사용자 지정 데이터 처리 워크로드에 Amazon SageMaker Processing Jobs를 사용할 것을 권장합니다. Processing Job은 사용자 지정 Docker 컨테이너에서 임의의 코드를 실행할 수 있으므로, 온프레미스에서 R로 작성된 ETL 작업을 AWS로 이전하기에 적합합니다. R 런타임과 필요한 라이브러리가 포함된 사용자 지정 Docker 이미지를 만들고 Amazon ECR에 저장하면, 코드를 다시 작성하지 않고도 관리형 인프라에서 ETL 작업을 실행할 수 있습니다. SageMaker script mode는 ETL이 아니라 학습 작업에 적합합니다. 따라서 사용자 지정 컨테이너를 사용하는 SageMaker Processing Jobs가 정답입니다.", "en": "The ETL process has two critical characteristics: it is long-running (6 hours) and written in R. AWS Lambda is unsuitable because it has a maximum execution time of 15 minutes. AWS Glue primarily supports Spark- based ETL and does not natively support custom R-based workloads. AWS documentation recommends using Amazon SageMaker Processing Jobs for long-running, custom data processing workloads. Processing jobs allow users to run arbitrary code in custom Docker containers, making them ideal for migrating on-premises ETL jobs written in R. By building a custom Docker image that includes the R runtime and required libraries and storing it in Amazon ECR, the company can run the ETL job at scale on managed infrastructure without rewriting the code. SageMaker script mode is intended for training, not ETL. Therefore, SageMaker processing jobs with a custom container are the correct solution."}, {"n": 138, "t": "single", "q": "A company uses the Amazon SageMaker AI Object2Vec algorithm to train an ML model. The model performs well on training data but underperforms after deployment. The company wants to avoid overfitting the model and maintain the model's ability to generalize. Which solution will meet these requirements?", "kq": "어떤 회사가 ML 모델을 학습시키기 위해 Amazon SageMaker AI Object2Vec 알고리즘을 사용합니다. 모델은 학습 데이터에서는 좋은 성능을 보이지만 배포 후에는 성능이 낮습니다. 회사는 모델의 과적합을 피하고 일반화 능력을 유지하려고 합니다. 어떤 솔루션이 이러한 요구 사항을 충족할까요?", "o": [{"k": "A", "t": "Decrease the early_stopping_patience hyperparameter.", "kt": "early_stopping_patience 하이퍼파라미터를 줄입니다."}, {"k": "B", "t": "Increase the mini_batch_size hyperparameter.", "kt": "mini_batch_size 하이퍼파라미터를 늘립니다."}, {"k": "C", "t": "Decrease the dropout rate.", "kt": "드롭아웃 비율을 줄입니다."}, {"k": "D", "t": "Increase the number of epochs.", "kt": "에포크 수를 늘립니다."}], "a": ["A"], "ko": "학습 데이터에서는 성능이 좋지만 배포 후 성능이 저하되는 현상은 전형적인 과적합의 징후입니다. Amazon SageMaker Object2Vec 관련 AWS 문서는 모델이 학습 데이터의 노이즈를 학습하지 않도록 방지하기 위한 핵심 정규화 기법으로 조기 종료를 강조합니다. early_stopping_patience 하이퍼파라미터는 검증 손실이 더 이상 개선되지 않은 뒤 학습을 몇 에포크 더 지속할지를 제어합니다. 이 값을 줄이면 학습이 더 일찍 중단되어 모델이 학습 데이터에 과도하게 맞춰질 가능성을 줄일 수 있습니다. 배치 크기를 늘리는 B안은 학습 효율에는 영향을 줄 수 있지만 과적합을 직접 해결하지는 않습니다. Dropout 비율을 낮추는 C안은 정규화 효과를 줄여 오히려 과적합 위험을 높입니다. 에포크 수를 늘리는 D안은 과적합을 더 악화시킬 수 있습니다. 따라서 early_stopping_patience 값을 줄이는 A안이 정답입니다.", "en": "The described behavior-strong performance on training data but poor performance in production-is a classic sign of overfitting. AWS documentation for Amazon SageMaker Object2Vec highlights early stopping as a key regularization technique to prevent models from learning noise in the training data. The early_stopping_patience hyperparameter controls how many additional epochs the training job will run after the validation loss stops improving. Decreasing this value causes training to stop earlier, reducing the chance that the model overfits to the training dataset. Option B increases batch size, which may improve training efficiency but does not directly address overfitting. Option C decreases the dropout rate, which actually increases overfitting risk, since dropout is a regularization mechanism. Option D increases epochs, which further worsens overfitting. AWS best practices emphasize early stopping combined with validation metrics as one of the most effective ways to maintain generalization performance in neural embedding models such as Object2Vec. Therefore, Option A is the correct and AWS-aligned solution."}, {"n": 139, "t": "single", "q": "A company is developing an ML model to predict customer satisfaction. The company needs to use survey feedback and the past satisfaction level of customers to predict the future satisfaction level of customers. The dataset includes a column named Feedback that contains long text responses. The dataset also includes a column named Satisfaction Level that contains three distinct values for past customer satisfaction: High, Medium, and Low. The company must apply encoding methods to transform the data in each column. Which solution will meet these requirements?", "kq": "어떤 회사가 고객 만족도를 예측하는 ML 모델을 개발하고 있습니다. 회사는 설문 피드백과 고객의 과거 만족도 수준을 사용해 향후 만족도 수준을 예측해야 합니다. 데이터셋에는 긴 텍스트 응답이 들어 있는 Feedback 컬럼이 있습니다. 또한 과거 고객 만족도를 나타내는 High, Medium, Low 세 가지 값을 가진 Satisfaction Level 컬럼도 있습니다. 회사는 각 컬럼의 데이터를 변환하기 위해 인코딩 방법을 적용해야 합니다. 어떤 솔루션이 이러한 요구 사항을 충족할까요?", "o": [{"k": "A", "t": "Apply one-hot encoding to the Feedback column and the Satisfaction Level column.", "kt": "Feedback 컬럼과 Satisfaction Level 컬럼에 모두 원-핫 인코딩을 적용합니다."}, {"k": "B", "t": "Apply one-hot encoding to the Feedback column. Apply ordinal encoding to the Satisfaction Level column.", "kt": "Feedback 컬럼에 원-핫 인코딩을 적용합니다. Satisfaction Level 컬럼에 서수 인코딩(ordinal encoding)을 적용합니다."}, {"k": "C", "t": "Apply label encoding to the Feedback column. Apply binary encoding to the Satisfaction Level column.", "kt": "Feedback 컬럼에 레이블 인코딩을 적용합니다. Satisfaction Level 컬럼에 이진 인코딩(binary encoding)을 적용합니다."}, {"k": "D", "t": "Apply tokenization to the Feedback column. Apply ordinal encoding to the Satisfaction Level column.", "kt": "Feedback 컬럼에 토큰화를 적용합니다. Satisfaction Level 컬럼에 서수 인코딩(ordinal encoding)을 적용합니다."}], "a": ["D"], "ko": "서로 다른 데이터 유형에는 서로 다른 인코딩 전략이 필요합니다. Feedback 컬럼은 긴 비정형 텍스트 응답을 포함합니다. AWS ML 문서에 따르면 텍스트 데이터는 임베딩이나 Bag-of-Words와 같은 벡터화 기법을 적용하기 전에 먼저 토큰으로 변환되어야 합니다. 따라서 텍스트 특성에는 토큰화가 올바른 전처리 단계입니다. Satisfaction Level 컬럼은 범주형 데이터이지만 Low, Medium, High처럼 자연스러운 순서가 있습니다. AWS 모범 사례에서는 이러한 순서형 범주형 변수에 순서형 인코딩을 권장합니다. 원-핫 인코딩은 자유 형식 텍스트에 적합하지 않고 지나치게 많은 특성을 만들 수 있습니다. 라벨 인코딩을 긴 텍스트에 적용하는 것도 부적절하며, 바이너리 인코딩은 세 개의 순서형 값에는 적합하지 않습니다. 따라서 Feedback 컬럼에는 토큰화를, Satisfaction Level 컬럼에는 순서형 인코딩을 적용하는 D안이 정답입니다.", "en": "Different data types require different encoding strategies. The Feedback column contains long, unstructured text responses. According to AWS ML documentation, text data must first be converted into tokens before it can be vectorized using techniques such as embeddings or bag-of-words. Tokenization is the correct preprocessing step for textual features. The Satisfaction Level column is categorical but has a natural ordering (Low < Medium < High). AWS best practices recommend ordinal encoding for such ordered categorical variables because it preserves the inherent ranking information. Option A is incorrect because one-hot encoding is not suitable for free-form text and would create an unmanageable number of features. Option B has the same issue for the Feedback column. Option C incorrectly applies label encoding to text and binary encoding to a three-class ordinal variable. Therefore, tokenization for text data and ordinal encoding for satisfaction levels is the correct solution."}, {"n": 141, "t": "single", "q": "A company has historical data that shows whether customers needed long-term support from company staff. The company needs to develop an ML model to predict whether new customers will require long- term support. Which modeling approach should the company use to meet this requirement?", "kq": "어떤 회사가 고객이 회사 직원의 장기 지원을 필요로 했는지를 보여주는 과거 데이터를 보유하고 있습니다. 회사는 신규 고객이 장기 지원을 필요로 할지 예측하는 ML 모델을 개발해야 합니다. 이 요구 사항을 충족하려면 어떤 모델링 방식을 사용해야 합니까?", "o": [{"k": "A", "t": "Anomaly detection", "kt": "이상 탐지(Anomaly detection)"}, {"k": "B", "t": "Linear regression", "kt": "선형 회귀(Linear regression)"}, {"k": "C", "t": "Logistic regression", "kt": "로지스틱 회귀(Logistic regression)"}, {"k": "D", "t": "Semantic segmentation", "kt": "의미 분할(Semantic segmentation)"}], "a": ["C"], "ko": "로지스틱 회귀는 이 요구 사항에 적합한 모델링 방식입니다. 고객이 장기 지원을 필요로 하는지 여부처럼 결과가 “예” 또는 “아니요”로 나뉘는 이진 분류 문제를 해결하도록 설계되어 있기 때문입니다. 로지스틱 회귀는 특정 클래스에 속할 확률을 계산하며, 이처럼 결과가 범주형인 예측 작업에 널리 사용됩니다.", "en": "Logistic regression is a suitable modeling approach for this requirement because it is designed for binary classification problems, such as predicting whether a customer will require long-term support (\" yes \" or \" no \" ). It calculates the probability of a particular class and is widely used for tasks like this where the outcome is categorical."}, {"n": 142, "t": "single", "q": "A company wants to use large language models (LLMs) that are supported by Amazon Bedrock to develop a chat interface for the company's internal technical documentation. The company stores the documentation as dozens of text files that are several megabytes in total size. The company updates the text files often. Which solution will meet these requirements MOST cost-effectively?", "kq": "어떤 회사가 사내 기술 문서를 위한 채팅 인터페이스를 개발하기 위해 Amazon Bedrock이 지원하는 대규모 언어 모델(LLM)을 사용하려고 합니다. 회사는 이 문서를 수십 개의 텍스트 파일로 저장하고 있으며 전체 크기는 수 메가바이트입니다. 회사는 이 텍스트 파일을 자주 업데이트합니다. 어떤 솔루션이 가장 비용 효율적으로 이러한 요구 사항을 충족할까요?", "o": [{"k": "A", "t": "Create a new LLM on Amazon Bedrock. Train the new LLM on the original dataset and the company documentation. Make the new model available in Bedrock for calls from the chat interface.", "kt": "Amazon Bedrock에서 새 LLM을 만듭니다. 원본 데이터셋과 회사 문서로 새 LLM을 학습시킵니다. 채팅 인터페이스에서 호출할 수 있도록 Bedrock에서 새 모델을 사용 가능하게 합니다."}, {"k": "B", "t": "Integrate the company documentation with Amazon Bedrock guardrails. Invoke the guardrails for all Amazon Bedrock calls from the chat interface.", "kt": "회사 문서를 Amazon Bedrock guardrails와 통합합니다. 채팅 인터페이스의 모든 Amazon Bedrock 호출에 대해 guardrails를 호출합니다."}, {"k": "C", "t": "Use all the text files to fine tune a model in Amazon Bedrock. Use the fine-tuned model to process user prompts.", "kt": "모든 텍스트 파일을 사용해 Amazon Bedrock에서 모델을 파인튜닝합니다. 파인튜닝된 모델로 사용자 프롬프트를 처리합니다."}, {"k": "D", "t": "Upload all the text files to an Amazon Bedrock knowledge base. Use the knowledge base to provide context when the chat interface makes calls to Amazon Bedrock.", "kt": "모든 텍스트 파일을 Amazon Bedrock 지식 기반(knowledge base)에 업로드합니다. 채팅 인터페이스가 Amazon Bedrock을 호출할 때 지식 기반으로 맥락을 제공합니다."}], "a": ["D"], "ko": "D안이 정답입니다. Amazon Bedrock Knowledge Bases는 기반 모델을 다시 학습하거나 반복적으로 파인튜닝하지 않고도 사내 문서를 기반으로 질문에 답해야 하는 애플리케이션을 위해 설계되었습니다. AWS 문서에 따르면 Amazon Bedrock Knowledge Bases를 사용하면 지식 기반에서 검색된 문맥으로 애플리케이션을 보강할 수 있으며, 이는 기본 제공 RAG 솔루션을 제공합니다. 또한 지식 기반을 추가하면 사설 데이터를 사용하기 위해 모델을 계속 학습시킬 필요가 없어 비용 효율성이 높아집니다. 이 문제의 문서는 총 수 MB 수준의 텍스트 파일이며 자주 업데이트되므로, 문서가 변경될 때마다 새 모델을 만들거나 파인튜닝하는 방식보다 검색 기반 방식이 더 경제적이고 운영상 단순합니다. Bedrock Knowledge Bases는 데이터 소스를 추가하고 수집 작업을 실행해 콘텐츠를 처리 및 인덱싱하는 방식을 지원하므로, 자주 갱신되는 내부 기술 문서를 채팅 인터페이스에서 활용하는 요구 사항과 잘 맞습니다. 새 LLM을 만드는 것은 지나치게 과도하고, Guardrails는 모델 동작 및 정책 제어용이지 문서 검색 계층이 아닙니다. 자주 변경되는 텍스트 파일로 모델을 파인튜닝하는 방식은 검색 증강 방식보다 비용이 높고 유연성이 낮습니다. 따라서 텍스트 파일을 Amazon Bedrock 지식 기반에 업로드하고 추론 시 문맥으로 사용하는 D안이 가장 비용 효율적인 해결책입니다.", "en": "Option D is correct because Amazon Bedrock Knowledge Bases are designed for applications that need to answer questions using private documents without retraining or repeatedly fine-tuning a foundation model. AWS documentation states that with Amazon Bedrock Knowledge Bases, you can build applications enriched by context retrieved from a knowledge base, and that this provides an out-of-the-box RAG solution. AWS also explicitly says that adding a knowledge base increases cost-effectiveness by removing the need to continually train your model to use your private data. That matches this use case very closely. The question also says the documentation consists of text files that are only several megabytes total and are updated often. A retrieval-based approach is more economical and operationally simpler than creating a new model or repeatedly fine-tuning one whenever the documents change. AWS documentation for Bedrock knowledge bases describes adding data sources and running ingestion jobs to process and index the content, which is exactly the pattern needed for frequently updated internal documentation used by a chat interface. The other options are not as cost-effective. Creating a new LLM is far beyond the need here. Guardrails help control model behavior and policy enforcement, but they do not serve as a document retrieval layer for internal documentation. Fine-tuning a model on frequently changing text files is usually more expensive and less flexible than using retrieval augmentation. For a modest-sized, frequently updated documentation corpus, the AWS-native and most cost-effective solution is to load the files into an Amazon Bedrock knowledge base and use it to provide context at inference time. Therefore, the best verified answer is D."}, {"n": 143, "t": "single", "q": "An ML engineer is training an ML model to identify medical patients for disease screening. The tabular dataset for training contains 50,000 patient records: 1,000 with the disease and 49,000 without the disease. The ML engineer splits the dataset into a training dataset, a validation dataset, and a test dataset. What should the ML engineer do to transform the data and make the data suitable for training?", "kq": "ML 엔지니어가 질병 선별 대상 환자를 식별하는 ML 모델을 학습시키고 있습니다. 학습용 표 형식 데이터셋에는 50,000건의 환자 레코드가 있으며, 그중 1,000건은 질병이 있고 49,000건은 질병이 없습니다. ML 엔지니어는 데이터셋을 학습용, 검증용, 테스트용으로 분할했습니다. 데이터를 변환해 학습에 적합하게 만들려면 어떻게 해야 합니까?", "o": [{"k": "A", "t": "Apply principal component analysis (PCA) to oversample the minority class in the training dataset.", "kt": "주성분 분석(PCA)을 적용해 학습 데이터셋의 소수 클래스를 오버샘플링합니다."}, {"k": "B", "t": "Apply Synthetic Minority Oversampling Technique (SMOTE) to generate new synthetic samples of the minority class in the training dataset.", "kt": "SMOTE(Synthetic Minority Oversampling Technique)를 적용해 학습 데이터셋의 소수 클래스에 대한 새로운 합성 샘플을 생성합니다."}, {"k": "C", "t": "Randomly oversample the majority class in the validation dataset.", "kt": "검증 데이터셋의 다수 클래스를 무작위로 오버샘플링합니다."}, {"k": "D", "t": "Apply k-means clustering to undersample the minority class in the test dataset.", "kt": "k-means 클러스터링을 적용해 테스트 데이터셋의 소수 클래스를 언더샘플링합니다."}], "a": ["B"], "ko": "이 데이터셋은 질병이 있는 환자 기록이 전체의 2%에 불과하므로 심각한 클래스 불균형을 보입니다. AWS ML 모범 사례에서는 검증 및 테스트 데이터셋은 실제 데이터 분포를 대표하도록 유지하고, 클래스 불균형 보정은 학습 데이터셋에만 적용할 것을 권장합니다. SMOTE는 기존 소수 클래스 샘플 사이를 보간하여 새로운 합성 소수 클래스 샘플을 생성합니다. 이를 통해 데이터를 버리지 않고도 모델이 질병 관련 패턴을 더 잘 학습할 수 있습니다. PCA는 차원 축소 기법이지 오버샘플링 기법이 아니며, 다수 클래스를 오버샘플링하면 불균형이 더 심해집니다. 테스트 데이터셋을 변경하면 평가 결과의 신뢰성이 떨어집니다. 따라서 학습 데이터셋에 SMOTE를 적용하는 B안이 올바른 접근입니다.", "en": "This dataset shows severe class imbalance, with only 2% of records representing patients with the disease. AWS ML best practices recommend correcting imbalance only in the training dataset, while keeping validation and test sets representative of real-world distributions. Synthetic Minority Oversampling Technique (SMOTE) generates synthetic samples of the minority class by interpolating between existing minority examples. This improves the model's ability to learn disease-related patterns without discarding data. PCA is a dimensionality reduction method, not an oversampling technique. Oversampling the majority class worsens imbalance. Altering the test dataset would invalidate evaluation results. Therefore, applying SMOTE to the training dataset is the correct approach."}, {"n": 144, "t": "single", "q": "A company uses ML models to predict whether transactions are fraudulent. The company needs to identify as many fraudulent transactions as possible. Which evaluation metric should the company use to evaluate the models to meet this requirement?", "kq": "어떤 회사가 거래가 사기인지 예측하기 위해 ML 모델을 사용합니다. 회사는 가능한 한 많은 사기 거래를 식별해야 합니다. 이 요구 사항을 충족하기 위해 모델을 평가할 때 사용해야 할 평가 지표는 무엇입니까?", "o": [{"k": "A", "t": "F1 score", "kt": "F1 점수"}, {"k": "B", "t": "Area Under the ROC Curve (AUC)", "kt": "ROC 곡선 아래 면적(AUC)"}, {"k": "C", "t": "Precision", "kt": "정밀도(Precision)"}, {"k": "D", "t": "Recall", "kt": "재현율(Recall)"}], "a": ["D"], "ko": "D안이 정답입니다. 회사의 핵심 목표는 가능한 한 많은 사기 거래를 식별하는 것입니다. AWS 문서에서 재현율은 TP / (TP + FN)으로 정의되며, 실제 양성 사례를 모델이 얼마나 잘 찾아내는지를 측정합니다. 사기 탐지에서는 “양성” 클래스가 사기 거래이므로, 재현율을 최대화한다는 것은 놓치는 사기 거래를 최소화한다는 의미입니다. 이 문제는 가장 선택적인 모델이나 전체적으로 균형 잡힌 모델을 요구하는 것이 아니라, 가능한 한 많은 사기 거래를 잡아내는 것이 목표입니다. 정밀도는 예측한 사기 거래 중 실제 사기 비율을 중시하므로 거짓 양성 비용이 매우 클 때 중요합니다. F1 점수는 정밀도와 재현율의 균형을 보지만, 이 문제는 균형보다 사기 거래 탐지 수를 우선합니다. AUC는 전체적인 분류 성능을 평가하는 데 유용하지만, 놓친 사기 거래를 최소화하는 직접적인 지표는 아닙니다. 따라서 실제 양성을 놓치는 비용이 중요한 경우 재현율이 가장 적절한 평가 지표입니다.", "en": "Option D is correct because the company's primary goal is to identify as many fraudulent transactions as possible. In AWS documentation, recall is defined as TP / (TP + FN), where TP is true positives and FN is false negatives. Recall measures how well a model finds all actual positive cases. In a fraud- detection setting, the \"positive\" class is the fraudulent transaction, so maximizing recall means minimizing missed fraud cases. AWS documentation also explains the business tradeoff clearly: a use case that needs to correctly predict as many positive examples as possible should prioritize high recall, even if that means accepting some additional false positives and therefore only moderate precision. That matches this question exactly, because the requirement is not to be most selective or most balanced overall; it is specifically to catch the largest possible number of fraudulent transactions. The other metrics are less aligned to the stated goal. Precision focuses on how many predicted fraud cases are actually fraud, which is most important when false positives are very costly. F1 score balances precision and recall, but the question does not ask for balance; it asks for finding as many fraudulent transactions as possible. AUC is useful for overall ranking and threshold-independent model discrimination, but it is not the most direct metric for optimizing missed-fraud detection in this scenario. Based on AWS metric definitions, when the cost of missing true positives is the main concern, recall is the best evaluation metric. Therefore, the best verified answer is D."}, {"n": 145, "t": "single", "q": "An ML engineer is collecting data to train a classification ML model by using Amazon SageMaker AI. The target column can have two possible values: Class A or Class B. The ML engineer wants to ensure that the number of samples for both Class A and Class B are balanced, without losing any existing training data. The ML engineer must test the balance of the training data. Which solution will meet this requirement?", "kq": "ML 엔지니어가 Amazon SageMaker AI로 분류 ML 모델을 학습시키기 위해 데이터를 수집하고 있습니다. 대상 컬럼은 Class A 또는 Class B 두 가지 값을 가질 수 있습니다. ML 엔지니어는 기존 학습 데이터를 잃지 않으면서 Class A와 Class B의 샘플 수가 균형을 이루도록 해야 합니다. ML 엔지니어는 학습 데이터의 균형을 테스트해야 합니다. 어떤 솔루션이 이 요구 사항을 충족할까요?", "o": [{"k": "A", "t": "Use SageMaker Clarify to check for class imbalance (CI). If the value is equal to 0, then use random undersampling in SageMaker Data Wrangler to balance the classes.", "kt": "SageMaker Clarify로 클래스 불균형(CI)을 확인합니다. 값이 0이면 SageMaker Data Wrangler에서 무작위 언더샘플링으로 클래스 균형을 맞춥니다."}, {"k": "B", "t": "Use SageMaker Clarify to check for class imbalance (CI). If the value is greater than 0, then use synthetic minority oversampling technique (SMOTE) in SageMaker Data Wrangler to balance the classes.", "kt": "SageMaker Clarify로 클래스 불균형(CI)을 확인합니다. 값이 0보다 크면 SageMaker Data Wrangler에서 SMOTE로 클래스 균형을 맞춥니다."}, {"k": "C", "t": "Use SageMaker JumpStart to generate a class imbalance (CI) report. If the value is greater than 0, then use random undersampling in SageMaker Studio to balance the classes.", "kt": "SageMaker JumpStart로 클래스 불균형(CI) 보고서를 생성합니다. 값이 0보다 크면 SageMaker Studio에서 무작위 언더샘플링으로 클래스 균형을 맞춥니다."}, {"k": "D", "t": "Use SageMaker JumpStart to generate a class imbalance (CI) report. If the value is equal to 0, then use synthetic minority oversampling technique (SMOTE) in SageMaker Studio to balance the classes.", "kt": "SageMaker JumpStart로 클래스 불균형(CI) 보고서를 생성합니다. 값이 0이면 SageMaker Studio에서 SMOTE로 클래스 균형을 맞춥니다."}], "a": ["B"], "ko": "이 요구 사항에는 두 가지 핵심 조건이 있습니다. 클래스 불균형을 탐지해야 하고, 기존 학습 데이터를 잃지 않으면서 클래스를 균형 있게 만들어야 합니다. AWS는 학습 전 편향 탐지 도구로 Amazon SageMaker Clarify를 제공하며, 여기에는 클래스 불균형(CI) 측정이 포함됩니다. CI는 클래스 간 레이블 분포 차이를 측정하며, CI 값이 0보다 크면 불균형이 있음을 의미합니다. 불균형이 확인되면 데이터를 버리지 않고 균형을 맞춰야 하므로 랜덤 언더샘플링은 다수 클래스 샘플을 제거하게 되어 요구 사항에 맞지 않습니다. 대신 오버샘플링이 필요합니다. SMOTE는 소수 클래스에 대한 합성 샘플을 생성하여 모든 원본 데이터를 보존하면서 클래스 균형을 개선합니다. Amazon SageMaker Data Wrangler는 SMOTE를 기본 지원하므로 이 전처리 작업에 적합한 AWS 관리형 도구입니다. JumpStart는 사전 학습 모델과 솔루션을 위한 서비스이지 편향 탐지 보고서 생성용이 아니며, CI = 0은 불균형이 없음을 의미합니다. 따라서 SageMaker Clarify로 불균형을 탐지하고 Data Wrangler의 SMOTE로 보정하는 B안이 정답입니다.", "en": "The requirement has two key constraints: detect class imbalance and balance classes without losing any existing data. AWS provides Amazon SageMaker Clarify as the native tool to detect pre-training bias, including class imbalance (CI). CI measures differences in label distributions between classes, and a CI value greater than 0 indicates imbalance. Once imbalance is detected, the engineer must rebalance the dataset without discarding data. Random undersampling would remove samples from the majority class, violating the requirement. Instead, oversampling is required. SMOTE (Synthetic Minority Oversampling Technique) creates synthetic samples for the minority class, preserving all original data while improving class balance. Amazon SageMaker Data Wrangler natively supports SMOTE, making it the correct AWS-managed tool for this preprocessing task. Options C and D are incorrect because SageMaker JumpStart is used for pretrained models and solutions, not for bias detection reporting. Option A is incorrect because it uses undersampling and misinterprets CI = 0 (which actually indicates no imbalance). Therefore, detecting imbalance with SageMaker Clarify and correcting it using SMOTE in Data Wrangler is the correct solution."}, {"n": 146, "t": "multi", "q": "An ML engineer is training an XGBoost regression model in Amazon SageMaker AI. The ML engineer conducts several rounds of hyperparameter tuning with random grid search. After these rounds of tuning, the error rate on the test hold-out dataset is much larger than the error rate on the training dataset. The ML engineer needs to make changes before running the hyperparameter grid search again. Which changes will improve the model's performance? (Select TWO.)", "kq": "ML 엔지니어가 Amazon SageMaker AI에서 XGBoost 회귀 모델을 학습시키고 있습니다. ML 엔지니어는 무작위 그리드 탐색으로 여러 차례 하이퍼파라미터 튜닝을 수행했습니다. 이 튜닝 이후 테스트 홀드아웃 데이터셋의 오류율이 학습 데이터셋의 오류율보다 훨씬 큽니다. ML 엔지니어는 하이퍼파라미터 그리드 탐색을 다시 실행하기 전에 변경을 적용해야 합니다. 모델 성능을 개선할 변경은 무엇입니까? (2개 선택)", "o": [{"k": "A", "t": "Increase the model complexity by increasing the number of features in the dataset.", "kt": "데이터셋의 특성 수를 늘려 모델 복잡도를 높입니다."}, {"k": "B", "t": "Decrease the model complexity by reducing the number of features in the dataset.", "kt": "데이터셋의 특성 수를 줄여 모델 복잡도를 낮춥니다."}, {"k": "C", "t": "Decrease the model complexity by reducing the number of samples in the dataset.", "kt": "데이터셋의 샘플 수를 줄여 모델 복잡도를 낮춥니다."}, {"k": "D", "t": "Increase the value of the L2 regularization parameter.", "kt": "L2 정규화 파라미터 값을 높입니다."}, {"k": "E", "t": "Decrease the value of the L2 regularization parameter.", "kt": "L2 정규화 파라미터 값을 낮춥니다."}], "a": ["B", "D"], "ko": "이 시나리오는 XGBoost 모델이 학습 데이터에서는 잘 동작하지만 테스트 홀드아웃 데이터에서는 성능이 낮은 전형적인 과적합 문제를 설명합니다. AWS 머신러닝 및 XGBoost 문서에 따르면 과적합은 모델이 너무 복잡하여 일반화 가능한 관계가 아니라 학습 데이터에 특화된 노이즈와 패턴을 학습할 때 발생합니다. 과적합을 해결하는 효과적인 방법 중 하나는 모델 복잡도를 줄이는 것입니다. B안처럼 특성 수를 줄이면 가설 공간이 단순해지고 허위 상관관계에 과도하게 맞춰질 위험이 낮아집니다. 또 다른 방법은 정규화를 강화하는 것입니다. D안처럼 L2 정규화 파라미터, 즉 XGBoost의 lambda 값을 높이면 큰 가중치에 패널티를 부여하여 지나치게 복잡한 트리를 억제합니다. AWS 문서에서도 L2 정규화가 모델 파라미터를 부드럽게 만들고 분산을 줄여 일반화 성능을 개선하는 데 도움이 된다고 설명합니다. A안은 복잡도를 높여 과적합을 악화시킬 수 있고, C안처럼 학습 샘플 수를 줄이면 일반적으로 과적합 위험이 커집니다. E안은 정규화 강도를 낮추므로 테스트 성능을 더 악화시킬 수 있습니다. 따라서 특성 복잡도를 줄이고 L2 정규화를 강화하는 B와 D가 올바른 변경 사항입니다.", "en": "The scenario describes a classic overfitting problem: the XGBoost model performs well on the training dataset but poorly on the test hold-out dataset. According to AWS Machine Learning and XGBoost documentation, overfitting occurs when a model is too complex and learns noise and patterns specific to the training data rather than generalizable relationships. One effective way to address overfitting is to reduce model complexity. Option B, reducing the number of features, simplifies the hypothesis space and lowers the risk of fitting spurious correlations. Feature reduction is a recommended best practice when the model shows a large generalization gap between training and test error. Another effective method is to increase regularization. Option D, increasing the L2 regularization parameter (lambda in XGBoost), penalizes large weights and discourages overly complex trees. AWS documentation explicitly notes that L2 regularization helps improve generalization by smoothing model parameters and reducing variance. Option A would worsen overfitting by increasing complexity. Option C is incorrect because reducing the number of training samples generally increases overfitting risk. Option E would decrease regularization strength and further degrade test performance. Therefore, reducing feature complexity and increasing L2 regularization are the correct changes."}, {"n": 147, "t": "single", "q": "A company wants to reduce the cost of its containerized ML applications. The applications use ML models that run on Amazon EC2 instances, AWS Lambda functions, and an Amazon Elastic Container Service (Amazon ECS) cluster. The EC2 workloads and ECS workloads use Amazon Elastic Block Store (Amazon EBS) volumes to save predictions and artifacts. An ML engineer must identify resources that are being used inefficiently. The ML engineer also must generate recommendations to reduce the cost of these resources. Which solution will meet these requirements with the LEAST development effort?", "kq": "어떤 회사가 컨테이너화된 ML 애플리케이션의 비용을 줄이려고 합니다. 이 애플리케이션들은 Amazon EC2 인스턴스, AWS Lambda 함수, Amazon ECS 클러스터에서 실행되는 ML 모델을 사용합니다. EC2 워크로드와 ECS 워크로드는 예측 결과와 아티팩트를 저장하기 위해 Amazon EBS 볼륨을 사용합니다. ML 엔지니어는 비효율적으로 사용되고 있는 리소스를 식별해야 합니다. 또한 이 리소스의 비용을 줄이기 위한 권장 사항을 생성해야 합니다. 어떤 솔루션이 최소한의 개발 노력으로 이러한 요구 사항을 충족할까요?", "o": [{"k": "A", "t": "Create code to evaluate each instance's memory and compute usage.", "kt": "각 인스턴스의 메모리와 컴퓨팅 사용량을 평가하는 코드를 작성합니다."}, {"k": "B", "t": "Add cost allocation tags to the resources. Activate the tags in AWS Billing and Cost Management.", "kt": "리소스에 비용 할당 태그를 추가합니다. AWS Billing and Cost Management에서 해당 태그를 활성화합니다."}, {"k": "C", "t": "Check AWS CloudTrail event history for the creation of the resources.", "kt": "리소스 생성에 대한 AWS CloudTrail 이벤트 기록을 확인합니다."}, {"k": "D", "t": "Run AWS Compute Optimizer.", "kt": "AWS Compute Optimizer를 실행합니다."}], "a": ["D"], "ko": "AWS Compute Optimizer는 Amazon EC2 인스턴스, ECS 서비스, Lambda 함수, Amazon EBS 볼륨의 리소스 사용량을 분석합니다. 또한 인스턴스 크기 조정, Spot Instance 활용, 볼륨 유형 변경 등 리소스 사용률을 최적화하고 비용을 줄이기 위한 실행 가능한 권장 사항을 제공합니다. Compute Optimizer는 과거 사용량 데이터를 기반으로 자동으로 인사이트와 권장 사항을 생성하는 관리형 서비스이므로, 별도 코드를 작성하는 것보다 개발 노력이 가장 적습니다.", "en": "AWS Compute Optimizer analyzes the resource usage of Amazon EC2 instances, ECS services, Lambda functions, and Amazon EBS volumes. It provides actionable recommendations to optimize resource utilization and reduce costs, such as resizing instances, moving workloads to Spot Instances, or changing volume types. This solution requires the least development effort because Compute Optimizer is a managed service that automatically generates insights and recommendations based on historical usage data."}, {"n": 148, "t": "match", "q": "An ML engineer must choose the appropriate Amazon SageMaker algorithm to solve specific AI problems. Select the correct SageMaker built-in algorithm from the following list for each use case. Each algorithm should be selected one time.", "kq": "ML 엔지니어가 특정 AI 문제를 해결하기 위해 적절한 Amazon SageMaker 알고리즘을 선택해야 합니다. 아래 목록에서 각 사용 사례에 맞는 SageMaker 내장 알고리즘을 선택하세요. 각 알고리즘은 한 번만 선택합니다.", "p": ["Summarize the text of a research paper.", "Scan every pixel of an image to help self-driving cars identify objects in their path.", "Identify abnormal data points in a dataset."], "c": ["Random Cut Forest (RCF) algorithm", "Semantic segmentation algorithm", "Sequence-to-Sequence (seq2seq) algorithm"], "kp": ["연구 논문의 텍스트를 요약한다.", "자율주행차가 경로상의 객체를 식별할 수 있도록 이미지의 모든 픽셀을 스캔한다.", "데이터셋에서 비정상 데이터 포인트를 식별한다."], "kc": ["Random Cut Forest (RCF) 알고리즘", "Semantic segmentation (의미 분할) 알고리즘", "Sequence-to-Sequence (seq2seq) 알고리즘"], "a": [2, 1, 0], "ko": "첫 번째 사용 사례인 연구 논문 텍스트 요약에는 Sequence-to-Sequence(seq2seq) 알고리즘이 적합합니다. seq2seq 모델은 텍스트 요약, 번역, 패러프레이징과 같은 자연어 생성 작업을 위해 설계되어 있으며, AWS 문서에서도 SageMaker seq2seq 알고리즘의 주요 사용 사례로 텍스트 요약을 명시하고 있습니다. 두 번째 사용 사례인 자율주행차가 경로상의 객체를 식별할 수 있도록 이미지의 모든 픽셀을 스캔하는 작업에는 Semantic Segmentation 알고리즘이 적합합니다. Semantic Segmentation은 이미지의 각 픽셀에 클래스 레이블을 할당하는 픽셀 단위 분류를 수행하므로, 자율주행, 도로 장면 이해, 객체 경계 탐지에 적합합니다. 세 번째 사용 사례인 데이터셋에서 비정상 데이터 포인트를 식별하는 작업에는 Random Cut Forest(RCF) 알고리즘이 적합합니다. RCF는 비지도 이상 탐지 알고리즘으로, 숫자형 데이터셋에서 이상치, 비정상 패턴, 특이 데이터를 식별하도록 설계되어 있어 사기 탐지, 모니터링, 이상 데이터 탐지에 적합합니다.", "en": "Use case 1:Summarize the text of a research paper → Sequence-to-Sequence (seq2seq) algorithm Why: Seq2seq models are designed for natural language generation tasks such as text summarization, translation, and paraphrasing. AWS documentation explicitly lists text summarization as a primary use case for the SageMaker seq2seq algorithm. Use case 2: Scan every pixel of an image to help self-driving cars identify objects in their path → Semantic segmentation algorithm Why: Semantic segmentation performs pixel-level classification, assigning a class label to every pixel in an image. This is exactly what is required for applications such as autonomous driving, road scene understanding, and object boundary detection. Use case 3: Identify abnormal data points in a dataset → Random Cut Forest (RCF) algorithm Why: Random Cut Forest is an unsupervised anomaly detection algorithm. AWS SageMaker RCF is purpose- built to identify outliers, unusual patterns, and anomalies in numerical datasets, making it ideal for fraud detection, monitoring, and abnormal data point detection."}, {"n": 149, "t": "single", "q": "A company is using an Amazon S3 bucket to collect data that will be used for ML workflows. The company needs to use AWS Glue DataBrew to clean and normalize the data. Which solution will meet these requirements?", "kq": "어떤 회사가 ML 워크플로에 사용할 데이터를 수집하기 위해 Amazon S3 버킷을 사용하고 있습니다. 회사는 AWS Glue DataBrew를 사용해 데이터를 정제하고 정규화해야 합니다. 어떤 솔루션이 이러한 요구 사항을 충족할까요?", "o": [{"k": "A", "t": "Create a DataBrew dataset by using the S3 path. Clean and normalize the data by using a DataBrew profile job.", "kt": "S3 경로를 사용해 DataBrew 데이터셋을 만듭니다. DataBrew 프로파일 작업(profile job)으로 데이터를 정제하고 정규화합니다."}, {"k": "B", "t": "Create a DataBrew dataset by using the S3 path. Clean and normalize the data by using a DataBrew recipe job.", "kt": "S3 경로를 사용해 DataBrew 데이터셋을 만듭니다. DataBrew 레시피 작업(recipe job)으로 데이터를 정제하고 정규화합니다."}, {"k": "C", "t": "Create a DataBrew dataset by using a JDBC driver to connect to the S3 bucket. Use a profile job.", "kt": "JDBC 드라이버로 S3 버킷에 연결해 DataBrew 데이터셋을 만듭니다. 프로파일 작업을 사용합니다."}, {"k": "D", "t": "Create a DataBrew dataset by using a JDBC driver to connect to the S3 bucket. Use a recipe job.", "kt": "JDBC 드라이버로 S3 버킷에 연결해 DataBrew 데이터셋을 만듭니다. 레시피 작업을 사용합니다."}], "a": ["B"], "ko": "AWS Glue DataBrew는 Amazon S3 경로를 직접 데이터 소스로 사용하는 데이터셋 생성을 지원합니다. 데이터를 정리하고 정규화하려면 AWS 문서에서 DataBrew recipe 사용을 명시하고 있으며, recipe는 표준화, 중복 제거, 형식 변환과 같은 변환 단계를 정의합니다. Profile job은 데이터 분석과 통계 생성을 위한 작업일 뿐 실제 변환을 수행하지 않습니다. Recipe job은 정의된 변환을 데이터에 적용하고 결과를 Amazon S3에 기록합니다. JDBC 연결은 관계형 데이터베이스에 사용하는 방식이며 S3 버킷에 연결하기 위한 방법이 아닙니다. 따라서 올바른 워크플로는 S3 경로에서 DataBrew 데이터셋을 만들고, recip
