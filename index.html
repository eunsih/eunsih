s the same runtime environment. This approach eliminates the need for repetitive installation steps and avoids environment drift. Manually installing libraries in managed containers is error-prone and not reusable across jobs. Notebook instances are not designed to host production jobs and pipelines. Running code externally breaks the SageMaker workflow and increases operational complexity. Using a custom container is a one-time setup that provides maximum reuse with minimal ongoing effort, making it the least implementation effort option in the long run. Therefore, Option B is the correct and AWS-recommended answer."}, {"n": 57, "t": "single", "q": "A retail company is analyzing customer purchase data to develop personalized product recommendations. The company wants to use Amazon SageMaker Clarify to assess fairness metrics across different customer groups to avoid potential bias in the recommendation system. The recommendation system needs to identify if certain customer segments are underrepresented in the training data. The company needs to choose a pre-training bias metric in SageMaker Clarify. Which metric meets these requirements?", "kq": "어떤 소매 회사가 개인화된 제품 추천을 개발하기 위해 고객 구매 데이터를 분석하고 있습니다. 회사는 추천 시스템에서 잠재적 편향을 피하기 위해 Amazon SageMaker Clarify로 고객 그룹별 공정성 지표를 평가하려고 합니다. 추천 시스템은 특정 고객 세그먼트가 학습 데이터에서 과소 대표되어 있는지 식별해야 합니다. 회사는 SageMaker Clarify의 사전 학습(pre-training) 편향 지표를 선택해야 합니다. 요구 사항을 충족하는 지표는 무엇입니까?", "o": [{"k": "A", "t": "Prediction distribution skew", "kt": "예측 분포 왜도(Prediction distribution skew)"}, {"k": "B", "t": "Feature attribution bias", "kt": "특성 기여도 편향(Feature attribution bias)"}, {"k": "C", "t": "Class imbalance ratio", "kt": "클래스 불균형 비율(Class imbalance ratio)"}, {"k": "D", "t": "Model performance gap", "kt": "모델 성능 격차(Model performance gap)"}], "a": ["C"], "ko": "정답은 C인 클래스 불균형 비율입니다. Amazon SageMaker Clarify는 ML 모델의 공정성을 확인하기 위해 학습 전 및 학습 후 편향 탐지 기능을 제공합니다. 학습 전 편향 지표는 모델을 학습하기 전에 학습 데이터셋을 분석하여 특정 그룹이나 특성이 과소 대표되어 있는지 확인하는 데 사용됩니다. 클래스 불균형 비율은 데이터셋에서 서로 다른 클래스나 민감 속성이 얼마나 균등하게 표현되어 있는지를 측정합니다. 불균형이 크면 특정 고객 세그먼트가 과소 대표되어 모델 배포 시 편향된 예측으로 이어질 수 있습니다. A안의 예측 분포 왜도, B안의 특성 기여 편향, D안의 모델 성능 격차는 주로 학습 후 지표입니다. 따라서 학습 전 단계에서 고객 세그먼트의 과소 대표 여부를 탐지하기 위해서는 클래스 불균형 비율을 사용하는 C안이 적절합니다.", "en": "The correct answer is C. Class imbalance ratio. Amazon SageMaker Clarify provides both pre-training and post-training bias detection capabilities to help data scientists ensure fairness in ML models. Pre-training bias metrics specifically analyze the training dataset to detect underrepresentation of certain groups or features before a model is trained. The class imbalance ratio measures how evenly different classes or sensitive attributes are represented in the dataset. A high imbalance indicates that a particular segment of customers (e.g., certain age groups, genders, or ethnicities) may be underrepresented, which could lead to biased predictions when the model is deployed. Feature attribution bias (Option B) and prediction distribution skew (Option A) are post-training metrics. Feature attribution bias evaluates whether the model relies disproportionately on certain features for predictions, while prediction distribution skew examines whether the model's outputs are skewed for specific groups. Model performance gap (Option D) is also a post-training measure, focusing on differences in accuracy or other performance metrics between groups. By using the class imbalance ratio during pre-training analysis, the company can identify and mitigate underrepresentation before training the model. Actions may include resampling the dataset, weighting underrepresented classes, or applying synthetic data augmentation to ensure that the model is trained on a balanced, fair dataset. This aligns with AWS best practices for ML solution monitoring, maintenance, and security, particularly for responsible AI and fairness assessment. In summary, the class imbalance ratio allows proactive bias detection at the dataset level, preventing unfair recommendations and ensuring equitable treatment across all customer segments in the recommendation system."}, {"n": 58, "t": "single", "q": "An ML engineer is setting up an Amazon SageMaker AI pipeline for an ML model. The pipeline must automatically initiate a re-training job if any data drift is detected. How should the ML engineer set up the pipeline to meet this requirement?", "kq": "ML 엔지니어가 ML 모델용 Amazon SageMaker AI 파이프라인을 구성하고 있습니다. 파이프라인은 데이터 드리프트가 감지되면 자동으로 재학습 작업을 시작해야 합니다. 이 요구 사항을 충족하려면 파이프라인을 어떻게 구성해야 합니까?", "o": [{"k": "A", "t": "Use an AWS Glue crawler and an AWS Glue extract, transform, and load (ETL) job to detect data drift. Use AWS Glue triggers to automate the re-training job.", "kt": "AWS Glue 크롤러와 AWS Glue ETL 작업으로 데이터 드리프트를 감지합니다. AWS Glue 트리거로 재학습 작업을 자동화합니다."}, {"k": "B", "t": "Use Amazon Managed Service for Apache Flink to detect data drift. Use an AWS Lambda function to automate the re-training job.", "kt": "Amazon Managed Service for Apache Flink로 데이터 드리프트를 감지합니다. AWS Lambda 함수로 재학습 작업을 자동화합니다."}, {"k": "C", "t": "Use SageMaker Model Monitor to detect data drift. Use an AWS Lambda function to automate the re- training job.", "kt": "SageMaker Model Monitor로 데이터 드리프트를 감지합니다. AWS Lambda 함수로 재학습 작업을 자동화합니다."}, {"k": "D", "t": "Use Amazon Quick Suite (previously known as Amazon QuickSight) anomaly detection to detect data drift. Use an AWS Step Functions workflow to automate the re-training job.", "kt": "Amazon Quick Suite(이전 Amazon QuickSight)의 이상 탐지로 데이터 드리프트를 감지합니다. AWS Step Functions 워크플로로 재학습 작업을 자동화합니다."}], "a": ["C"], "ko": "정답은 C입니다. SageMaker Model Monitor를 사용해 데이터 드리프트를 탐지하고, AWS Lambda 함수를 사용해 재학습 작업을 자동화하는 방식입니다. Amazon SageMaker Model Monitor는 ML 파이프라인에서 데이터 드리프트를 자동으로 탐지하기 위한 AWS 권장 솔루션입니다. 데이터 드리프트는 입력 특성의 통계적 속성이 시간이 지나면서 변해 모델 정확도가 저하될 수 있는 상황을 의미합니다. Model Monitor는 들어오는 데이터를 지속적으로 분석하고 학습 데이터 기준선과 비교해 편차를 식별합니다. 드리프트가 탐지되면 Lambda 또는 EventBridge를 통해 자동 워크플로를 트리거할 수 있으며, Lambda 함수는 업데이트된 데이터셋으로 SageMaker 학습 작업을 시작할 수 있습니다. Glue는 ETL용 서비스이고, Flink는 스트리밍 처리용이며, QuickSight 이상 탐지는 BI 시각화에 초점을 둔 기능이므로 ML 모델 재학습 자동화 요구 사항과 직접적으로 맞지 않습니다. 따라서 Model Monitor와 Lambda를 결합하는 C안이 정답입니다.", "en": "The correct answer is C. Use SageMaker Model Monitor to detect data drift. Use an AWS Lambda function to automate the re-training job. Amazon SageMaker Model Monitor is the AWS-recommended solution for automatically detecting data drift in ML pipelines. Data drift occurs when the statistical properties of input features change over time, potentially reducing model accuracy. Model Monitor continuously analyzes incoming data and compares it to the baseline training dataset to identify deviations. It can track both feature distributions and prediction quality metrics. Once Model Monitor detects data drift, it can trigger automated workflows using AWS Lambda or Amazon EventBridge. An AWS Lambda function can initiate a SageMaker training job to re-train the model using updated datasets, ensuring the ML model remains accurate and reliable. This setup fully automates the response to drift events, meeting the requirement of automatically initiating re- training. Option A (AWS Glue) is designed for ETL processes but does not natively detect ML-specific data drift. Option B (Amazon Managed Service for Apache Flink) can process streaming data but does not provide native drift detection for ML pipelines. Option D (Amazon QuickSight anomaly detection) focuses on business intelligence and visual anomaly detection, not automated re-training workflows for ML models. By integrating SageMaker Model Monitor with Lambda, the ML engineer can maintain model performance proactively, implement automated re-training, and align with AWS best practices for ML solution monitoring, maintenance, and security. This approach ensures continuous validation of model inputs and outputs, reduces operational overhead, and prevents degradation in production ML performance due to unseen data changes."}, {"n": 59, "t": "single", "q": "An ML engineer needs to create data ingestion pipelines and ML model deployment pipelines on AWS. All the raw data is stored in Amazon S3 buckets. Which solution will meet these requirements?", "kq": "ML 엔지니어가 AWS에서 데이터 수집 파이프라인과 ML 모델 배포 파이프라인을 만들어야 합니다. 모든 원시 데이터는 Amazon S3 버킷에 저장되어 있습니다. 어떤 솔루션이 이러한 요구 사항을 충족할까요?", "o": [{"k": "A", "t": "Use Amazon Data Firehose to create the data ingestion pipelines. Use Amazon SageMaker Studio Classic to create the model deployment pipelines.", "kt": "Amazon Data Firehose로 데이터 수집 파이프라인을 만듭니다. Amazon SageMaker Studio Classic으로 모델 배포 파이프라인을 만듭니다."}, {"k": "B", "t": "Use AWS Glue to create the data ingestion pipelines. Use Amazon SageMaker Studio Classic to create the model deployment pipelines.", "kt": "AWS Glue로 데이터 수집 파이프라인을 만듭니다. Amazon SageMaker Studio Classic으로 모델 배포 파이프라인을 만듭니다."}, {"k": "C", "t": "Use Amazon Redshift ML to create the data ingestion pipelines. Use Amazon SageMaker Studio Classic to create the model deployment pipelines.", "kt": "Amazon Redshift ML로 데이터 수집 파이프라인을 만듭니다. Amazon SageMaker Studio Classic으로 모델 배포 파이프라인을 만듭니다."}, {"k": "D", "t": "Use Amazon Athena to create the data ingestion pipelines. Use an Amazon SageMaker notebook to create the model deployment pipelines.", "kt": "Amazon Athena로 데이터 수집 파이프라인을 만듭니다. Amazon SageMaker 노트북으로 모델 배포 파이프라인을 만듭니다."}], "a": ["B"], "ko": "AWS Glue는 서버리스 데이터 통합 서비스로, 원시 데이터가 Amazon S3에 저장되어 있을 때 데이터 수집 파이프라인을 만드는 데 적합합니다. Glue는 데이터를 정리하고 변환하며 카탈로그화하여 이후 ML 작업에서 사용할 수 있도록 합니다. Amazon SageMaker Studio Classic은 ML 모델을 구축, 학습, 배포하기 위한 통합 환경을 제공하며, 효율적인 모델 배포 파이프라인을 구성할 수 있는 도구와 기능을 포함합니다. 이 조합은 데이터 수집과 ML 모델 배포를 원활하게 통합하면서 운영 부담을 최소화합니다. 따라서 B안이 정답입니다.", "en": "AWS Glue is a serverless data integration service that is well-suited for creating data ingestion pipelines, especially when raw data is stored in Amazon S3. It can clean, transform, and catalog data, making it accessible for downstream ML tasks. Amazon SageMaker Studio Classic provides a comprehensive environment for building, training, and deploying ML models. It includes built-in tools and capabilities to create efficient model deployment pipelines with minimal setup. This combination ensures seamless integration of data ingestion and ML model deployment with minimal operational overhead."}, {"n": 60, "t": "single", "q": "An ML engineer needs to use AWS services to identify and extract meaningful unique keywords from documents. Which solution will meet these requirements with the LEAST operational overhead?", "kq": "ML 엔지니어가 AWS 서비스를 사용해 문서에서 의미 있는 고유 키워드를 식별하고 추출해야 합니다. 어떤 솔루션이 최소한의 운영 오버헤드로 이러한 요구 사항을 충족할까요?", "o": [{"k": "A", "t": "Use the Natural Language Toolkit (NLTK) library on Amazon EC2 instances for text pre-processing. Use the Latent Dirichlet Allocation (LDA) algorithm to identify and extract relevant keywords.", "kt": "Amazon EC2 인스턴스에서 NLTK 라이브러리로 텍스트를 전처리합니다. LDA(Latent Dirichlet Allocation) 알고리즘으로 관련 키워드를 식별하고 추출합니다."}, {"k": "B", "t": "Use Amazon SageMaker and the BlazingText algorithm. Apply custom pre-processing steps for stemming and removal of stop words. Calculate term frequency-inverse document frequency (TF-IDF) scores to identify and extract relevant keywords.", "kt": "Amazon SageMaker와 BlazingText 알고리즘을 사용합니다. 어간 추출과 불용어 제거를 위한 사용자 지정 전처리 단계를 적용합니다. TF-IDF 점수를 계산해 관련 키워드를 식별하고 추출합니다."}, {"k": "C", "t": "Store the documents in an Amazon S3 bucket. Create AWS Lambda functions to process the documents and to run Python scripts for stemming and removal of stop words. Use bigram and trigram techniques to identify and extract relevant keywords.", "kt": "문서를 Amazon S3 버킷에 저장합니다. 문서를 처리하고 어간 추출·불용어 제거용 Python 스크립트를 실행하는 AWS Lambda 함수를 만듭니다. bigram과 trigram 기법으로 관련 키워드를 식별하고 추출합니다."}, {"k": "D", "t": "Use Amazon Comprehend custom entity recognition and key phrase extraction to identify and extract relevant keywords.", "kt": "Amazon Comprehend의 사용자 지정 엔터티 인식과 핵심 문구 추출을 사용해 관련 키워드를 식별하고 추출합니다."}], "a": ["D"], "ko": "Amazon Comprehend는 문서에서 핵심 문구를 추출하고 의미 있는 키워드를 식별할 수 있는 사전 구축 기능을 제공합니다. 별도의 수동 전처리, 어간 추출, 불용어 제거가 필요 없으며, 사용자 지정 모델 개발이나 인프라 관리도 요구하지 않습니다. 따라서 문서에서 의미 있는 고유 키워드를 추출해야 하는 작업에 대해 가장 효율적이고 운영 부담이 적은 솔루션입니다. D안이 정답입니다.", "en": "Amazon Comprehend provides pre-built functionality for key phrase extraction and can identify meaningful keywords from documents with minimal setup or operational overhead. It eliminates the need for manual preprocessing, stemming, or stop-word removal and does not require custom model development or infrastructure management. This makes it the most efficient and low-maintenance solution for the task."}, {"n": 61, "t": "match", "q": "An airline company deploys ML models to one dozen Amazon SageMaker Al inference endpoints. The inference endpoints must be able to handle different types of workloads in a cost- effective way. Select the correct inference option from the following list to handle each type of workload. Select each inference option one time. (Select FOUR.)", "kq": "어떤 항공사가 12개의 Amazon SageMaker AI 추론 엔드포인트에 ML 모델을 배포합니다. 이 추론 엔드포인트들은 다양한 유형의 워크로드를 비용 효율적으로 처리할 수 있어야 합니다. 아래 목록에서 각 워크로드 유형에 맞는 추론 옵션을 선택하세요. 각 추론 옵션은 한 번만 선택합니다. (4개 선택)", "p": ["Provide flight departure, arrival, and delay information, and provide updates for low-latency workloads", "Advertise holiday travel promotional deals to millions of users in multiple markets before holiday seasons for spiky workloads", "Generate quarterly and annual flight reports and insights for trend analysis of large datasets", "Generate online image and audio stories for passengers to watch or listen to while waiting at an airport"], "c": ["Asynchronous inference", "Batch inference", "Real-time inference", "Serverless inference"], "kp": ["항공편 출발·도착·지연 정보를 제공하고 낮은 지연 시간이 필요한 워크로드에 업데이트를 제공한다", "휴가 시즌 전에 여러 시장의 수백만 사용자에게 휴가 여행 프로모션을 광고한다 (급증형 워크로드)", "대규모 데이터셋의 추세 분석을 위해 분기별·연간 항공편 보고서와 인사이트를 생성한다", "공항에서 대기하는 승객이 보거나 들을 수 있는 온라인 이미지·오디오 스토리를 생성한다"], "kc": ["Asynchronous inference (비동기 추론)", "Batch inference (배치 추론)", "Real-time inference (실시간 추론)", "Serverless inference (서버리스 추론)"], "a": [2, 3, 1, 0], "ko": "올바른 매핑은 지연 시간 요구 사항, 트래픽 패턴, 페이로드 크기, 처리 시간, 지속적인 엔드포인트 필요 여부에 따라 결정됩니다. 항공편 출발, 도착, 지연 정보와 같은 낮은 지연 시간이 필요한 사용자 대면 업무에는 실시간 추론이 적합합니다. 휴가철 프로모션처럼 계절성·스파이크성 트래픽이 발생하는 업무에는 사용량이 없을 때 비용을 줄일 수 있는 서버리스 추론이 적합합니다. 분기 및 연간 항공편 보고서처럼 대규모 데이터를 오프라인으로 분석하고 상시 엔드포인트가 필요 없는 업무에는 배치 추론이 적합합니다. 공항 대기 중 승객에게 제공할 이미지 및 오디오 스토리 생성처럼 페이로드가 크거나 처리 시간이 길 수 있는 요청에는 비동기 추론이 적합합니다.", "en": "* Provide flight departure, arrival, and delay information, and provide updates for low-latency workloads → Real-time inference * Advertise holiday travel promotional deals to millions of users in multiple markets before holiday seasons for spiky workloads → Serverless inference * Generate quarterly and annual flight reports and insights for trend analysis of large datasets → Batch inference * Generate online image and audio stories for passengers to watch or listen to while waiting at an airport → Asynchronous inference * The correct mapping depends on latency requirement, traffic pattern, payload size, processing duration, and whether the workload needs a persistent endpoint. * Real-time inference is the right choice for flight departure, arrival, and delay updates because this is an online user-facing workload that requires low latency. AWS states that SageMaker real-time inference is ideal for online inference workloads with low-latency or high-throughput requirements and uses a persistent fully managed endpoint. That fits flight status information because passengers and airline systems expect immediate responses. * Serverless inference is the best choice for holiday promotional deals because this traffic is spiky, seasonal, and unpredictable. AWS describes SageMaker Serverless Inference as suitable for intermittent or unpredictable traffic patterns. It is cost-effective because SageMaker manages the infrastructure and scales down when there are no requests, so the company does not pay for idle endpoint capacity. * Batch inference is correct for quarterly and annual flight reports because this workload analyzes large datasets offline and does not need an always-running endpoint. AWS says SageMaker batch transform is used to get inferences from large datasets and when a persistent endpoint is not required. Reports and trend analysis are scheduled, non-real-time analytics workloads, so batch inference is the most cost- effective option. * Asynchronous inference is the right choice for generating online image and audio stories. These requests can have larger payloads and longer processing times than normal low-latency API calls. AWS states that SageMaker Asynchronous Inference queues incoming requests and is ideal for large payloads, long processing times, and near-real-time latency requirements. Image and audio generation can take seconds or minutes, so asynchronous inference is more appropriate than real- time inference."}, {"n": 62, "t": "single", "q": "A company has trained and deployed an ML model by using Amazon SageMaker. The company needs to implement a solution to record and monitor all the API call events for the SageMaker endpoint. The solution also must provide a notification when the number of API call events breaches a threshold. Use SageMaker Debugger to track the inferences and to report metrics. Create a custom rule to provide a notification when the threshold is breached. Which solution will meet these requirements?", "kq": "어떤 회사가 Amazon SageMaker를 사용해 ML 모델을 학습시키고 배포했습니다. 회사는 SageMaker 엔드포인트의 모든 API 호출 이벤트를 기록하고 모니터링하는 솔루션을 구현해야 합니다. 또한 API 호출 이벤트 수가 임계값을 초과하면 알림을 제공해야 합니다. 어떤 솔루션이 이러한 요구 사항을 충족할까요?", "o": [{"k": "A", "t": "Use SageMaker Debugger to track the inferences and to report metrics. Create a custom rule to provide a notification when the threshold is breached.", "kt": "SageMaker Debugger로 추론을 추적하고 지표를 보고합니다. 임계값 초과 시 알림을 제공하는 사용자 지정 규칙을 만듭니다."}, {"k": "B", "t": "Use SageMaker Debugger to track the inferences and to report metrics. Use the tensor_variance built-in rule to provide a notification when the threshold is breached.", "kt": "SageMaker Debugger로 추론을 추적하고 지표를 보고합니다. tensor_variance 내장 규칙을 사용해 임계값 초과 시 알림을 제공합니다."}, {"k": "C", "t": "Log all the endpoint invocation API events by using AWS CloudTrail. Use an Amazon CloudWatch dashboard for monitoring. Set up a CloudWatch alarm to provide notification when the threshold is breached.", "kt": "AWS CloudTrail로 모든 엔드포인트 호출 API 이벤트를 기록합니다. 모니터링에는 Amazon CloudWatch 대시보드를 사용합니다. 임계값 초과 시 알림을 제공하는 CloudWatch 알람을 설정합니다."}, {"k": "D", "t": "Add the Invocations metric to an Amazon CloudWatch dashboard for monitoring. Set up a CloudWatch alarm to provide notification when the threshold is breached.", "kt": "모니터링을 위해 Invocations 지표를 Amazon CloudWatch 대시보드에 추가합니다. 임계값 초과 시 알림을 제공하는 CloudWatch 알람을 설정합니다."}], "a": ["D"], "ko": "Amazon SageMaker는 엔드포인트에 대한 API 호출 수를 나타내는 Invocations 지표를 Amazon CloudWatch에 자동으로 기록합니다. 이 지표를 CloudWatch 대시보드에 추가하면 엔드포인트 활동을 실시간으로 모니터링할 수 있습니다. 또한 CloudWatch 경보를 설정하면 API 호출 수가 정의된 임계값을 초과할 때 알림을 보낼 수 있으므로, 모니터링과 알림 요구 사항을 효율적으로 충족할 수 있습니다.", "en": "Amazon SageMaker automatically tracks the Invocations metric, which represents the number of API calls made to the endpoint, in Amazon CloudWatch. By adding this metric to a CloudWatch dashboard, you can monitor the endpoint's activity in real-time. Setting up a CloudWatch alarm allows the system to send notifications whenever the API call events exceed the defined threshold, meeting both the monitoring and notification requirements efficiently."}, {"n": 63, "t": "single", "q": "Case Study A company is building a web-based AI application by using Amazon SageMaker. The application will provide the following capabilities and features: ML experimentation, training, a central model registry, model deployment, and model monitoring. The application must ensure secure and isolated use of training data during the ML lifecycle. The training data is stored in Amazon S3. The company needs to run an on-demand workflow to monitor bias drift for models that are deployed to real- time endpoints from the application. Which action will meet this requirement?", "kq": "[사례 연구] 어떤 회사가 Amazon SageMaker를 사용해 웹 기반 AI 애플리케이션을 만들고 있습니다. 이 애플리케이션은 ML 실험, 학습, 중앙 모델 레지스트리, 모델 배포, 모델 모니터링 기능을 제공할 예정입니다. 애플리케이션은 ML 수명 주기 동안 학습 데이터를 안전하고 격리된 방식으로 사용해야 합니다. 학습 데이터는 Amazon S3에 저장되어 있습니다. 회사는 애플리케이션에서 실시간 엔드포인트로 배포된 모델의 편향 드리프트를 모니터링하기 위해 온디맨드 워크플로를 실행해야 합니다. 어떤 조치가 이 요구 사항을 충족할까요?", "o": [{"k": "A", "t": "Configure the application to invoke an AWS Lambda function that runs a SageMaker Clarify job.", "kt": "SageMaker Clarify 작업을 실행하는 AWS Lambda 함수를 호출하도록 애플리케이션을 구성합니다."}, {"k": "B", "t": "Invoke an AWS Lambda function to pull the sagemaker-model-monitor-analyzer built-in SageMaker image.", "kt": "AWS Lambda 함수를 호출해 sagemaker-model-monitor-analyzer 내장 SageMaker 이미지를 가져옵니다."}, {"k": "C", "t": "Use AWS Glue Data Quality to monitor bias.", "kt": "AWS Glue Data Quality를 사용해 편향을 모니터링합니다."}, {"k": "D", "t": "Use SageMaker notebooks to compare the bias.", "kt": "SageMaker 노트북을 사용해 편향을 비교합니다."}], "a": ["A"], "ko": "배포된 머신러닝 모델에서 편향 드리프트를 모니터링하는 것은 시간이 지나도 모델의 공정성과 정확성을 유지하기 위해 중요합니다. Amazon SageMaker Clarify는 학습 중뿐 아니라 배포 후에도 편향을 탐지하는 도구를 제공합니다. 실시간 엔드포인트에 배포된 모델의 편향 드리프트를 온디맨드로 모니터링하려면, 애플리케이션이 AWS Lambda 함수를 호출하고 해당 Lambda 함수가 SageMaker Clarify 작업을 실행하도록 구성하는 방식이 적절합니다. 먼저 엔드포인트의 데이터 캡처를 활성화해 입력 데이터와 예측 결과를 수집하고, Lambda 함수가 이 데이터를 기반으로 Clarify 작업을 시작해 편향 지표를 평가합니다. 이 방식은 자동화, 비용 효율성, 유연성을 제공하며 수동 개입 없이 편향 모니터링을 수행할 수 있습니다. 따라서 A안이 정답입니다.", "en": "Monitoring bias drift in deployed machine learning models is crucial to ensure fairness and accuracy over time. Amazon SageMaker Clarify provides tools to detect bias in ML models, both during training and after deployment. To monitor bias drift for models deployed to real-time endpoints, an effective approach involves orchestrating SageMaker Clarify jobs using AWS Lambda functions. Implementation Steps: Set Up Data Capture: Enable data capture on the SageMaker endpoint to record input data and model predictions. This captured data serves as the basis for bias analysis. Develop a Lambda Function: Create an AWS Lambda function configured to initiate a SageMaker Clarify job. This function will process the captured data to assess bias metrics. Schedule or Trigger the Lambda Function: Configure the Lambda function to run on-demand or at scheduled intervals using Amazon CloudWatch Events or EventBridge. This setup allows for regular bias monitoring as per the application's requirements. Analyze and Respond to Results: After each Clarify job completes, review the generated bias reports. If bias drift is detected, take appropriate actions, such as retraining the model or adjusting data preprocessing steps. Advantages of This Approach: Automation: Utilizing AWS Lambda for orchestrating Clarify jobs enables automated and scalable bias monitoring without manual intervention. Cost-Effectiveness: AWS Lambda's serverless nature ensures that you only pay for the compute time consumed during the execution of the function, optimizing resource usage. Flexibility: The solution can be tailored to specific monitoring needs, allowing for adjustments in monitoring frequency and analysis parameters. By implementing this solution, the company can effectively monitor bias drift in real-time, ensuring that the AI application maintains fairness and accuracy throughout its lifecycle. References: Bias drift for models in production - Amazon SageMaker Schedule Bias Drift Monitoring Jobs - Amazon SageMaker"}, {"n": 64, "t": "single", "q": "An ML engineering team is spread across multiple locations. When the lead ML engineer opens an Amazon SageMaker AI notebook, the ML engineer does not see the latest merged notebook made by other team members from a Git repository. The lead ML engineer must see the latest SageMaker AI notebook updates. Which solution will meet this requirement?", "kq": "어떤 ML 엔지니어링 팀이 여러 지역에 분산되어 있습니다. 리드 ML 엔지니어가 Amazon SageMaker AI 노트북을 열었을 때, 다른 팀원들이 Git 리포지토리에서 병합한 최신 노트북이 보이지 않습니다. 리드 ML 엔지니어는 최신 SageMaker AI 노트북 업데이트를 봐야 합니다. 어떤 솔루션이 이 요구 사항을 충족할까요?", "o": [{"k": "A", "t": "Run the !git pull origin master command.", "kt": "!git pull origin master 명령을 실행합니다."}, {"k": "B", "t": "Run the !git commit command.", "kt": "!git commit 명령을 실행합니다."}, {"k": "C", "t": "Run the !git push origin master command.", "kt": "!git push origin master 명령을 실행합니다."}, {"k": "D", "t": "Run the !git branch command.", "kt": "!git branch 명령을 실행합니다."}], "a": ["A"], "ko": "A안이 정답입니다. 문제는 리드 ML 엔지니어의 로컬 SageMaker 노트북 환경에 공유 Git 저장소에 병합된 최신 변경 사항이 아직 반영되지 않았다는 것입니다. Git에서 원격 저장소의 변경 사항을 가져와 로컬 브랜치에 병합하는 명령은 git pull입니다. SageMaker 노트북 협업 문서에서도 다른 사용자가 커밋한 노트북을 가져오려면 프로젝트 저장소에서 pull을 수행해야 한다고 설명합니다. git commit은 로컬 변경 사항을 기록하는 명령이고, git push는 로컬 변경 사항을 원격 저장소로 업로드하는 명령이며, git branch는 브랜치 조회 또는 관리를 위한 명령입니다. 따라서 다른 팀원이 병합한 최신 노트북을 확인하려면 !git pull origin master를 실행하는 A안이 정답입니다.", "en": "Option A is correct because the issue is that the lead ML engineer's local notebook environment does not yet contain the latest merged changes from the shared Git repository. In Git, the operation used to fetch remote updates and merge them into the local branch is git pull. AWS documentation for SageMaker notebook collaboration explains that Git repositories can be associated with SageMaker notebook instances so distributed teams can share notebooks and collaborate in a source-control environment. AWS documentation is even more explicit in the SageMaker Git operations guide: to fetch notebooks committed by other users, you should do a pull from the project repository. That is exactly the situation described in the question. Other team members have already merged their notebook changes into the repository, and the lead engineer needs the latest notebook updates in the local SageMaker notebook environment. Therefore, running !git pull origin master is the correct command among the available choices. The other options do not solve the problem. git commit records local changes in the user's own repository history; it does not download new remote content. git push origin master uploads local commits to the remote repository; it is used when you want to send your own changes outward, not retrieve teammates' updates. git branch only lists or manages branches and does not synchronize notebook content. Because the requirement is to see the latest merged notebook made by others, the necessary operation is a pull from the remote repository. So the best verified answer is A."}, {"n": 65, "t": "single", "q": "A company is using an ML model to classify motion in videos. The data is stored in MP4 format in Amazon S3. When the company created the model, the company needed 4 months to label all the video frames. The company needs to retrain the model with an existing training workflow in Amazon SageMaker AI. An ML engineer must implement a solution that decreases the labeling time. Which solution will meet these requirements?", "kq": "어떤 회사가 동영상 속 움직임을 분류하기 위해 ML 모델을 사용합니다. 데이터는 MP4 형식으로 Amazon S3에 저장되어 있습니다. 회사가 이 모델을 처음 만들 때 모든 비디오 프레임에 레이블을 붙이는 데 4개월이 걸렸습니다. 회사는 Amazon SageMaker AI의 기존 학습 워크플로로 모델을 재학습시켜야 합니다. ML 엔지니어는 레이블링 시간을 줄이는 솔루션을 구현해야 합니다. 어떤 솔루션이 이러한 요구 사항을 충족할까요?", "o": [{"k": "A", "t": "Use SageMaker Ground Truth to annotate the video frames.", "kt": "SageMaker Ground Truth를 사용해 비디오 프레임에 주석을 붙입니다."}, {"k": "B", "t": "Use SageMaker JumpStart to use pre-trained computer vision models to develop a labeling model.", "kt": "SageMaker JumpStart를 사용해 사전 학습된 컴퓨터 비전 모델로 레이블링 모델을 개발합니다."}, {"k": "C", "t": "Use SageMaker Data Wrangler to create a data workflow. Use the workflow to optimize the labeling process.", "kt": "SageMaker Data Wrangler로 데이터 워크플로를 만듭니다. 이 워크플로로 레이블링 프로세스를 최적화합니다."}, {"k": "D", "t": "Use the labeling interface of Amazon Augmented AI (Amazon A2I) with Amazon Rekognition to label the video frames.", "kt": "Amazon Augmented AI(Amazon A2I)의 레이블링 인터페이스를 Amazon Rekognition과 함께 사용해 비디오 프레임에 레이블을 붙입니다."}], "a": ["A"], "ko": "A안이 정답입니다. Amazon SageMaker Ground Truth는 머신러닝용 라벨링 데이터셋을 구축하기 위해 설계된 AWS 서비스이며, 비디오 분류와 비디오 프레임 라벨링 사용 사례를 지원합니다. Ground Truth는 Amazon S3에 저장된 MP4 비디오 파일을 사용해 비디오 프레임을 추출하고 라벨링 작업을 수행할 수 있습니다. 또한 자동 데이터 라벨링과 액티브 러닝 기능을 통해 모든 프레임을 수동으로 라벨링하는 부담을 줄여 라벨링 시간과 비용을 절감할 수 있습니다. JumpStart는 사전 학습 모델과 템플릿 제공에 초점이 있고, Data Wrangler는 데이터 준비 및 변환 도구이며, A2I와 Rekognition 조합은 대규모 비디오 프레임 학습 데이터셋 라벨링의 주 서비스로 적합하지 않습니다. 따라서 SageMaker Ground Truth를 사용하는 A안이 정답입니다.", "en": "Option A is correct because Amazon SageMaker Ground Truth is the AWS service specifically designed to build labeled datasets for machine learning, including video classification and video frame labeling use cases. AWS documentation states that Ground Truth can take video files in MP4 format stored in Amazon S3, automatically connect to that data, and extract video frames for labeling. This directly matches the scenario in the question, where the source data is MP4 in S3 and the company needs to relabel or expand training data for retraining an existing SageMaker workflow. Ground Truth is also the best choice because AWS documents explain that it can reduce labeling time and cost through automated data labeling (active learning) for supported built-in task types. Instead of relying only on manual human labeling for every item, Ground Truth can use ML-assisted labeling to lower the total amount of human work needed, which is exactly what the company wants after previously spending four months labeling frames. The other options do not fit as well. JumpStart provides pretrained models and solution templates, but AWS documentation does not position it as the service for running a video-frame labeling operation. Data Wrangler is for data preparation, transformation, and feature engineering, not human labeling of video frames. Amazon A2I with Rekognition is mainly documented for human review workflows such as Rekognition moderation outputs, not as the primary service for large-scale MP4 video-frame annotation used to create training datasets."}, {"n": 66, "t": "single", "q": "A company has implemented a data ingestion pipeline for sales transactions from its ecommerce website. The company uses Amazon Data Firehose to ingest data into Amazon OpenSearch Service. The buffer interval of the Firehose stream is set for 60 seconds. An OpenSearch linear model generates real-time sales forecasts based on the data and presents the data in an OpenSearch dashboard. The company needs to optimize the data ingestion pipeline to support sub-second latency for the real-time dashboard. Which change to the architecture will meet these requirements?", "kq": "어떤 회사가 자사 이커머스 웹사이트의 판매 거래를 위한 데이터 수집 파이프라인을 구현했습니다. 회사는 Amazon Data Firehose를 사용해 데이터를 Amazon OpenSearch Service로 수집합니다. Firehose 스트림의 버퍼 간격은 60초로 설정되어 있습니다. OpenSearch 선형 모델이 이 데이터를 기반으로 실시간 판매 예측을 생성하고 OpenSearch 대시보드에 표시합니다. 회사는 실시간 대시보드를 위해 1초 미만의 지연 시간을 지원하도록 데이터 수집 파이프라인을 최적화해야 합니다. 요구 사항을 충족하는 아키텍처 변경은 무엇입니까?", "o": [{"k": "A", "t": "Use zero buffering in the Firehose stream. Tune the batch size that is used in the PutRecordBatch operation.", "kt": "Firehose 스트림에서 버퍼링을 0으로 설정합니다. PutRecordBatch 작업에 사용되는 배치 크기를 조정합니다."}, {"k": "B", "t": "Replace the Firehose stream with an AWS DataSync task. Configure the task with enhanced fan- out consumers.", "kt": "Firehose 스트림을 AWS DataSync 작업으로 대체합니다. 향상된 팬아웃 소비자로 작업을 구성합니다."}, {"k": "C", "t": "Increase the buffer interval of the Firehose stream from 60 seconds to 120 seconds.", "kt": "Firehose 스트림의 버퍼 간격을 60초에서 120초로 늘립니다."}, {"k": "D", "t": "Replace the Firehose stream with an Amazon Simple Queue Service (Amazon SQS) queue.", "kt": "Firehose 스트림을 Amazon SQS 큐로 대체합니다."}], "a": ["A"], "ko": "이 시나리오의 핵심 요구 사항은 Amazon OpenSearch Service 기반 실시간 대시보드에서 서브초 수준의 지연 시간을 달성하는 것입니다. 현재 Amazon Data Firehose는 시간 또는 크기 기준으로 데이터를 버퍼링한 뒤 대상에 전달하므로, 60초 버퍼 간격은 실시간 요구 사항에 맞지 않는 지연을 발생시킵니다. 낮은 지연 시간이 필요한 경우 Firehose의 버퍼링을 줄이거나 제거하는 것이 적절합니다. 버퍼 간격을 0초로 설정하면 Firehose가 레코드를 수신하는 즉시 전달하도록 할 수 있으며, PutRecordBatch의 배치 크기를 조정하면 전달 지연을 최소화하면서 효율적으로 데이터를 수집할 수 있습니다. DataSync는 배치성 데이터 전송용이고, 버퍼 간격을 늘리는 C안은 지연 시간을 악화시키며, SQS는 OpenSearch로의 서브초 인덱싱에 최적화된 스트리밍 수집 서비스가 아닙니다. 따라서 A안이 정답입니다.", "en": "The primary requirement in this scenario is achieving sub-second latency for a real-time analytics dashboard powered by Amazon OpenSearch Service. The current architecture uses Amazon Data Firehose, which buffers incoming records based on time or size before delivering them to the destination. A buffer interval of 60 seconds introduces unavoidable latency, making it unsuitable for near-real-time or sub-second use cases. According to AWS documentation, reducing or eliminating buffering in Firehose is the correct approach when low-latency ingestion is required. Setting the Firehose buffer interval to zero seconds forces Firehose to deliver records as soon as they are received. Additionally, tuning the PutRecordBatch batch size allows efficient ingestion while minimizing delivery delay. This configuration is explicitly recommended for latency- sensitive analytics pipelines. Option B is incorrect because AWS DataSync is designed for batch-oriented data transfers between storage systems, not real-time streaming. Enhanced fan-out consumers are a feature of Amazon Kinesis Data Streams, not DataSync, making this option invalid. Option C directly contradicts the requirement. Increasing the buffer interval from 60 seconds to 120 seconds would further increase latency and degrade real-time performance. Option D is also incorrect because Amazon SQS is a message queueing service, not a streaming ingestion service optimized for indexing data into OpenSearch with minimal latency. Using SQS would add additional processing layers and would not inherently provide sub-second ingestion into OpenSearch. Therefore, using zero buffering in the Firehose stream and tuning the PutRecordBatch batch size is the only change that aligns with AWS best practices for achieving sub-second latency in real-time analytics pipelines."}, {"n": 68, "t": "single", "q": "An ML engineer is using Amazon Quick Suite (previously known as Amazon QuickSight) anomaly detection to detect very high or very low machine operating temperatures compared to normal. The ML engineer sets the Severity parameter to Low and above. The ML engineer sets the Direction parameter to All. What effect will the ML engineer observe in the anomaly detection results if the ML engineer changes the Direction parameter to Lower than expected?", "kq": "ML 엔지니어가 Amazon Quick Suite(이전 Amazon QuickSight)의 이상 탐지를 사용해 정상 대비 지나치게 높거나 낮은 기계 작동 온도를 탐지하고 있습니다. ML 엔지니어는 Severity 파라미터를 'Low and above'로, Direction 파라미터를 'All'로 설정했습니다. ML 엔지니어가 Direction 파라미터를 'Lower than expected'로 변경하면 이상 탐지 결과에 어떤 영향이 나타납니까?", "o": [{"k": "A", "t": "Increased anomaly identification frequency and increased recall", "kt": "이상 탐지 빈도 증가, 재현율 증가"}, {"k": "B", "t": "Decreased anomaly identification frequency and decreased recall", "kt": "이상 탐지 빈도 감소, 재현율 감소"}, {"k": "C", "t": "Increased anomaly identification frequency and decreased recall", "kt": "이상 탐지 빈도 증가, 재현율 감소"}, {"k": "D", "t": "Decreased anomaly identification frequency and increased recall", "kt": "이상 탐지 빈도 감소, 재현율 증가"}], "a": ["B"], "ko": "Amazon QuickSight 이상 탐지에서 Direction 파라미터는 예상 기준선에서 어떤 방향의 편차를 이상으로 표시할지 제어합니다. Direction이 All로 설정되면 예상보다 높은 값과 낮은 값을 모두 탐지하므로 더 많은 이상이 식별되고 재현율도 높아집니다. 반면 Direction을 Lower than expected로 변경하면 예상보다 높은 이상은 제외되고 비정상적으로 낮은 값만 보고됩니다. 탐지 범위가 좁아지므로 전체 이상 식별 빈도가 감소하고, 전체 실제 이상 중 탐지되는 비율도 줄어 재현율이 낮아집니다. 따라서 Direction을 All에서 Lower than expected로 변경하면 이상 식별 빈도와 재현율이 모두 감소하므로 B안이 정답입니다.", "en": "In Amazon QuickSight anomaly detection, the Direction parameter controls which deviations from the expected baseline are flagged as anomalies. When Direction is set to All, QuickSight detects both higher-than- expected and lower-than-expected values. This results in a larger set of detected anomalies, increasing recall. When the Direction parameter is changed to Lower than expected, the anomaly detection algorithm filters out all higher-than-expected anomalies and only reports unusually low values. Because the scope of detection is narrowed, the total number of detected anomalies decreases. As a result, fewer true anomalies are identified overall, which reduces recall. Since fewer data points are evaluated as potential anomalies, the frequency of anomaly identification also decreases. This behavior is consistent with AWS documentation, which explains that directional filtering limits detection to a subset of deviations and therefore reduces overall anomaly counts. Therefore, changing the Direction from All to Lower than expected leads to decreased anomaly identification frequency and decreased recall."}, {"n": 70, "t": "single", "q": "A bank needs to use Amazon SageMaker AI to create an ML model to determine which customers qualify for a new product. The bank must use algorithms that SageMaker AI directly supports. The model must be explainable to the bank's regulators. Which modeling approach will meet these requirements?", "kq": "어떤 은행이 신규 상품 자격이 있는 고객을 판별하는 ML 모델을 만들기 위해 Amazon SageMaker AI를 사용해야 합니다. 은행은 SageMaker AI가 직접 지원하는 알고리즘을 사용해야 합니다. 또한 모델은 은행의 규제 기관에 설명 가능해야 합니다. 요구 사항을 충족하는 모델링 방식은 무엇입니까?", "o": [{"k": "A", "t": "Train the model by using the Object2Vec algorithm.", "kt": "Object2Vec 알고리즘으로 모델을 학습시킵니다."}, {"k": "B", "t": "Train the model by using the linear learner algorithm.", "kt": "선형 학습기(Linear Learner) 알고리즘으로 모델을 학습시킵니다."}, {"k": "C", "t": "Train a neural network.", "kt": "신경망을 학습시킵니다."}, {"k": "D", "t": "Train the model by using the k-means algorithm.", "kt": "k-means 알고리즘으로 모델을 학습시킵니다."}], "a": ["B"], "ko": "B안이 정답입니다. 은행은 SageMaker가 직접 지원하는 알고리즘을 사용해야 하며, 규제기관에 설명 가능한 모델이 필요합니다. Amazon SageMaker Linear Learner 알고리즘은 분류와 회귀 문제를 지원하는 내장 알고리즘입니다. 고객이 신규 상품 자격을 갖추었는지 판단하는 문제는 분류 문제에 해당하므로 Linear Learner가 적합합니다. 또한 선형 모델은 입력 특성이 결과에 미치는 영향을 계수 등을 통해 비교적 쉽게 설명할 수 있어 규제 검토에 유리합니다. Object2Vec은 임베딩과 유사도 학습에 더 적합하고, 신경망은 기술적으로 가능하더라도 설명 가능성이 낮으며, k-means는 비지도 클러스터링 알고리즘으로 자격 여부 예측에 적합하지 않습니다. 따라서 SageMaker 내장 알고리즘이면서 설명 가능성이 높은 Linear Learner를 사용하는 B안이 정답입니다.", "en": "Option B is correct because the bank needs a SageMaker-supported algorithm and the resulting model must be explainable for regulators. AWS documentation states that the Amazon SageMaker AI linear learner algorithm is a built-in algorithm that provides a solution for classification and regression problems. Since determining whether customers qualify for a new product is a classification-style decision problem, linear learner fits the business requirement directly. The explainability requirement strongly favors a simpler and more interpretable model family. AWS Prescriptive Guidance on model interpretability states that simple models are considered more interpretable because the effects of input features on the output are easier to understand. It specifically gives linear regression as an example where the magnitudes of coefficients provide a clear global feature-importance signal. While the question does not explicitly mention SageMaker Clarify, AWS documentation also says SageMaker offers explainability features to help interpret predictions, which complements inherently interpretable model types such as linear models. The other options are weaker fits. Object2Vec is mainly for learning embeddings and similarity relationships rather than a straightforward explainable eligibility model. A neural network may work technically, but it is generally less interpretable for regulatory review. k-means is an unsupervised clustering algorithm and is not suitable for predicting whether a customer qualifies for a product. Because the bank wants a directly supported SageMaker algorithm and a model that is easier to explain to regulators, the best AWS-aligned answer is B, linear learner."}, {"n": 71, "t": "single", "q": "A company is building a deep learning model on Amazon SageMaker. The company uses a large amount of data as the training dataset. The company needs to optimize the model's hyperparameters to minimize the loss function on the validation dataset. Which hyperparameter tuning strategy will accomplish this goal with the LEAST computation time?", "kq": "어떤 회사가 Amazon SageMaker에서 딥러닝 모델을 만들고 있습니다. 회사는 대량의 데이터를 학습 데이터셋으로 사용합니다. 회사는 검증 데이터셋의 손실 함수를 최소화하도록 모델의 하이퍼파라미터를 최적화해야 합니다. 연산 시간이 가장 적게 드는 하이퍼파라미터 튜닝 전략은 무엇입니까?", "o": [{"k": "A", "t": "Hyperband", "kt": "Hyperband"}, {"k": "B", "t": "Grid search", "kt": "그리드 탐색(Grid search)"}, {"k": "C", "t": "Bayesian optimization", "kt": "베이지안 최적화(Bayesian optimization)"}, {"k": "D", "t": "Random search", "kt": "무작위 탐색(Random search)"}], "a": ["A"], "ko": "Hyperband는 유망한 하이퍼파라미터 조합에는 더 많은 리소스를 할당하고 성능이 낮은 조합은 조기에 종료함으로써 계산 시간을 최소화하도록 설계된 하이퍼파라미터 튜닝 전략입니다. 탐색과 활용의 균형을 효율적으로 맞추기 때문에, 학습 비용이 큰 대규모 데이터셋과 딥러닝 모델에 특히 적합합니다.", "en": "Hyperband is a hyperparameter tuning strategy designed to minimize computation time by adaptively allocating resources to promising configurations and terminating underperforming ones early. It efficiently balances exploration and exploitation, making it ideal for large datasets and deep learning models where training can be computationally expensive."}, {"n": 72, "t": "single", "q": "An ML engineer needs to use AWS CloudFormation to create an ML model that an Amazon SageMaker endpoint will host. Which resource should the ML engineer declare in the CloudFormation template to meet this requirement?", "kq": "ML 엔지니어가 AWS CloudFormation을 사용해 Amazon SageMaker 엔드포인트가 호스팅할 ML 모델을 생성해야 합니다. 이 요구 사항을 충족하려면 CloudFormation 템플릿에 어떤 리소스를 선언해야 합니까?", "o": [{"k": "A", "t": "AWS::SageMaker::Model", "kt": "AWS::SageMaker::Model"}, {"k": "B", "t": "AWS::SageMaker::Endpoint", "kt": "AWS::SageMaker::Endpoint"}, {"k": "C", "t": "AWS::SageMaker::NotebookInstance", "kt": "AWS::SageMaker::NotebookInstance"}, {"k": "D", "t": "AWS::SageMaker::Pipeline", "kt": "AWS::SageMaker::Pipeline"}], "a": ["A"], "ko": "AWS CloudFormation의 AWS::SageMaker::Model 리소스는 Amazon SageMaker에서 ML 모델을 생성하는 데 사용됩니다. 이 모델은 이후 AWS::SageMaker::Endpoint 리소스를 사용하여 엔드포인트에 호스팅할 수 있습니다. Model 리소스는 호스팅에 사용할 컨테이너 또는 알고리즘과 모델 아티팩트가 저장된 Amazon S3 위치를 정의합니다.", "en": "The AWS::SageMaker::Model resource in AWS CloudFormation is used to create an ML model in Amazon SageMaker. This model can then be hosted on an endpoint by using the AWS::SageMaker::Endpoint resource. The model resource defines the container or algorithm to use for hosting and the S3 location of the model artifacts."}, {"n": 73, "t": "single", "q": "A company needs to ingest data from data sources into Amazon SageMaker Data Wrangler. The data sources are Amazon S3, Amazon Redshift, and Snowflake. The ingested data must always be up to date with the latest changes in the source systems. Which solution will meet these requirements?", "kq": "어떤 회사가 데이터 소스에서 Amazon SageMaker Data Wrangler로 데이터를 수집해야 합니다. 데이터 소스는 Amazon S3, Amazon Redshift, Snowflake입니다. 수집된 데이터는 항상 원천 시스템의 최신 변경 사항을 반영해야 합니다. 어떤 솔루션이 이러한 요구 사항을 충족할까요?", "o": [{"k": "A", "t": "Use direct connections to import data from the data sources into Data Wrangler.", "kt": "직접 연결(direct connections)을 사용해 데이터 소스에서 Data Wrangler로 데이터를 가져옵니다."}, {"k": "B", "t": "Use cataloged connections to import data from the data sources into Data Wrangler.", "kt": "카탈로그 연결(cataloged connections)을 사용해 데이터 소스에서 Data Wrangler로 데이터를 가져옵니다."}, {"k": "C", "t": "Use AWS Glue to extract data from the data sources. Use AWS Glue also to import the data directly into Data Wrangler.", "kt": "AWS Glue로 데이터 소스에서 데이터를 추출합니다. AWS Glue로 데이터를 Data Wrangler에 직접 가져오기도 합니다."}, {"k": "D", "t": "Use AWS Lambda to extract data from the data sources. Use Lambda also to import the data directly into Data Wrangler.", "kt": "AWS Lambda로 데이터 소스에서 데이터를 추출합니다. Lambda로 데이터를 Data Wrangler에 직접 가져오기도 합니다."}], "a": ["A"], "ko": "[정답 수정: 덤프 표기는 B였으나 AWS 공식 문서 기준 A] Data Wrangler는 직접(Direct) 연결을 통해 항상 원본의 최신 데이터에 접근합니다. 카탈로그(Cataloged) 연결은 데이터 전송의 결과물이므로 최신 데이터가 아닐 수 있습니다. 따라서 \"항상 최신 변경 사항 반영\" 조건에는 직접 연결이 맞습니다.", "en": null}, {"n": 74, "t": "single", "q": "A company needs an AWS solution that will automatically create versions of ML models as the models are created. Which solution will meet this requirement?", "kq": "어떤 회사가 ML 모델이 생성될 때 모델의 버전을 자동으로 만들어 주는 AWS 솔루션이 필요합니다. 어떤 솔루션이 이 요구 사항을 충족할까요?", "o": [{"k": "A", "t": "Amazon Elastic Container Registry (Amazon ECR)", "kt": "Amazon Elastic Container Registry (Amazon ECR)"}, {"k": "B", "t": "Model packages from Amazon SageMaker Marketplace", "kt": "Amazon SageMaker Marketplace의 모델 패키지"}, {"k": "C", "t": "Amazon SageMaker ML Lineage Tracking", "kt": "Amazon SageMaker ML Lineage Tracking"}, {"k": "D", "t": "Amazon SageMaker Model Registry", "kt": "Amazon SageMaker Model Registry"}], "a": ["D"], "ko": "Amazon SageMaker Model Registry는 모델을 카탈로그화하고, 모델 버전을 관리하며, 모델 그룹으로 구성하기 위해 특별히 설계된 AWS 기능이므로 D안이 정답입니다. AWS 문서에 따르면 Model Group을 생성한 후 학습한 각 모델을 등록하면 Model Registry가 해당 모델을 새 모델 버전으로 Model Group에 추가합니다. 이는 ML 모델이 생성될 때 자동으로 버전을 생성해야 한다는 요구 사항과 직접적으로 일치합니다. 또한 ML 파이프라인의 각 실행마다 모델 버전을 생성하고 해당 그룹에 등록하는 표준 워크플로도 지원합니다. Amazon ECR은 컨테이너 이미지를 저장하는 서비스이지 모델 버전 이력을 관리하지 않습니다. SageMaker Marketplace의 모델 패키지는 사전 구축 또는 타사 솔루션을 검색하거나 구독하기 위한 것이며, 조직이 학습한 모델을 자동으로 버전 관리하는 기능이 아닙니다. SageMaker ML Lineage Tracking은 아티팩트, 데이터셋, 처리 단계를 추적하는 데 도움이 되지만 실제 모델 버전 관리 기능은 Model Registry가 제공합니다. 따라서 새 모델이 생성될 때 버전 기록과 승인 상태, 배포 준비 상태, 메타데이터를 중앙에서 관리하는 SageMaker Model Registry가 정답입니다.", "en": "Option D is correct because Amazon SageMaker Model Registry is the AWS feature specifically designed to catalog models, manage model versions, and organize them into model groups. AWS documentation states that you can create a Model Group and then register each model you train, and the Model Registry adds it to the Model Group as a new model version. That directly matches the requirement to automatically create versions of ML models as models are created. The AWS docs also describe a standard workflow in which you first create a Model Group, then create an ML pipeline, and for each run of the ML pipeline, create a model version that is registered in that group. This means Model Registry supports exactly the kind of lifecycle management and version tracking needed in an MLOps workflow where new model artifacts are produced over time and need consistent governance. The other options do not meet the requirement. Amazon ECR stores container images, not model version history. SageMaker Marketplace model packages are for discovering or subscribing to third- party or prebuilt solutions, not for automatically versioning your organization's trained models. SageMaker ML Lineage Tracking helps trace artifacts, datasets, and processing steps for reproducibility, but AWS documentation distinguishes lineage from the actual model version management capability provided by Model Registry. Model Registry is the AWS-native feature for keeping versioned records of trained models and managing approval status, deployment readiness, and metadata in a centralized way. Therefore, the fully verified AWS-docs answer is D, because SageMaker Model Registry is the service purpose-built to create and manage model versions as new models are produced."}, {"n": 75, "t": "match", "q": "A company stores historical data in .csv files in Amazon S3. Only some of the rows and columns in the .csv files are populated. The columns are not labeled. An ML engineer needs to prepare and store the data so that the company can use the data to train ML models. Select and order the correct steps from the following list to perform this task. Each step should be selected one time or not at all. (Select and order three.)", "kq": "어떤 회사가 과거 데이터를 .csv 파일로 Amazon S3에 저장하고 있습니다. .csv 파일의 일부 행과 컬럼만 값이 채워져 있습니다. 컬럼에는 이름(레이블)이 없습니다. ML 엔지니어는 회사가 이 데이터로 ML 모델을 학습시킬 수 있도록 데이터를 준비해 저장해야 합니다. 아래 목록에서 이 작업을 수행할 올바른 단계를 선택해 순서대로 배치하세요. 각 단계는 한 번만 선택하거나 선택하지 않습니다. (3개 선택 및 순서 배치)", "p": ["Step 1", "Step 2", "Step 3"], "c": ["Create an Amazon SageMaker batch transform job for data cleaning and feature engineering.", "Store the resulting data back in Amazon S3.", "Use Amazon Athena to infer the schemas and available columns.", "Use AWS Glue crawlers to infer the schemas and available columns.", "Use AWS Glue DataBrew for data cleaning and feature engineering."], "kp": ["1단계", "2단계", "3단계"], "kc": ["데이터 정제와 특성 엔지니어링을 위해 Amazon SageMaker 배치 변환 작업을 만든다.", "결과 데이터를 다시 Amazon S3에 저장한다.", "Amazon Athena를 사용해 스키마와 사용 가능한 컬럼을 추론한다.", "AWS Glue 크롤러를 사용해 스키마와 사용 가능한 컬럼을 추론한다.", "데이터 정제와 특성 엔지니어링을 위해 AWS Glue DataBrew를 사용한다."], "a": [3, 4, 1], "ko": "1단계는 AWS Glue 크롤러를 사용해 스키마와 사용 가능한 컬럼을 추론하는 것입니다. 데이터가 컬럼명이 없는 CSV 파일로 Amazon S3에 저장되어 있으므로 Glue 크롤러가 원시 데이터를 스캔하여 사용 가능한 컬럼, 데이터 형식, 누락되거나 불완전한 항목을 포함한 스키마를 자동으로 추론할 수 있습니다. 2단계는 AWS Glue DataBrew를 사용해 데이터 정리와 특성 엔지니어링을 수행하는 것입니다. DataBrew는 결측값 처리, 컬럼명 지정, 파생 특성 생성 등 다양한 정리 및 변환 작업을 시각적으로 수행할 수 있는 데이터 준비 도구입니다. 3단계는 정리 및 준비가 완료된 데이터를 다시 Amazon S3에 저장하는 것입니다. 이렇게 하면 준비된 데이터가 ML 모델 학습 워크플로에서 바로 사용할 수 있는 형태로 저장됩니다. 따라서 올바른 순서는 Glue 크롤러로 스키마를 추론하고, Glue DataBrew로 데이터 정리와 특성 엔지니어링을 수행한 뒤, 결과 데이터를 Amazon S3에 저장하는 것입니다.", "en": "Step 1: Use AWS Glue crawlers to infer the schemas and available columns. Step 2: Use AWS Glue DataBrew for data cleaning and feature engineering. Step 3: Store the resulting data back in Amazon S3. Step 1: Use AWS Glue Crawlers to Infer Schemas and Available Columns Why? The data is stored in .csv files with unlabeled columns, and Glue Crawlers can scan the raw data in Amazon S3 to automatically infer the schema, including available columns, data types, and any missing or incomplete entries. How? Configure AWS Glue Crawlers to point to the S3 bucket containing the .csv files, and run the crawler to extract metadata. The crawler creates a schema in the AWS Glue Data Catalog, which can then be used for subsequent transformations. Step 2: Use AWS Glue DataBrew for Data Cleaning and Feature Engineering Why? Glue DataBrew is a visual data preparation tool that allows for comprehensive cleaning and transformation of data. It supports imputation of missing values, renaming columns, feature engineering, and more without requiring extensive coding. How? Use Glue DataBrew to connect to the inferred schema from Step 1 and perform data cleaning and feature engineering tasks like filling in missing rows/columns, renaming unlabeled columns, and creating derived features. Step 3: Store the Resulting Data Back in Amazon S3 Why? After cleaning and preparing the data, it needs to be saved back to Amazon S3 so that it can be used for training machine learning models. How? Configure Glue DataBrew to export the cleaned data to a specific S3 bucket location. This ensures the processed data is readily accessible for ML workflows. Order Summary: Use AWS Glue crawlers to infer schemas and available columns. Use AWS Glue DataBrew for data cleaning and feature engineering. Store the resulting data back in Amazon S3. This workflow ensures that the data is prepared efficiently for ML model training while leveraging AWS services for automation and scalability."}, {"n": 76, "t": "single", "q": "A company wants to migrate ML models from an on-premises environment to Amazon SageMaker AI. The models are based on the PyTorch algorithm. The company needs to reuse its existing custom scripts as much as possible. Which SageMaker AI feature should the company use?", "kq": "어떤 회사가 온프레미스 환경의 ML 모델을 Amazon SageMaker AI로 마이그레이션하려고 합니다. 모델은 PyTorch 알고리즘 기반입니다. 회사는 기존 사용자 지정 스크립트를 가능한 한 많이 재사용해야 합니다. 회사가 사용해야 할 SageMaker AI 기능은 무엇입니까?", "o": [{"k": "A", "t": "SageMaker AI built-in algorithms", "kt": "SageMaker AI 내장 알고리즘"}, {"k": "B", "t": "SageMaker Canvas", "kt": "SageMaker Canvas"}, {"k": "C", "t": "SageMaker JumpStart", "kt": "SageMaker JumpStart"}, {"k": "D", "t": "SageMaker AI script mode", "kt": "SageMaker AI 스크립트 모드"}], "a": ["D"], "ko": "SageMaker script mode는 PyTorch나 TensorFlow 같은 프레임워크로 작성된 기존 학습 스크립트를 최소한의 변경만으로 SageMaker에서 실행할 수 있게 해줍니다. AWS 문서에서도 script mode가 기존 ML 워크로드의 마이그레이션을 지원하도록 설계되었다고 설명합니다. 사용자는 사용자 지정 학습 스크립트를 제공하고, SageMaker는 인프라 프로비저닝, 분산 학습, 로깅, 모델 아티팩트 저장을 처리합니다. 따라서 기존 코드베이스를 다시 작성하지 않고 재사용하려는 회사에 적합합니다. 내장 알고리즘은 AWS 제공 구현을 사용해야 하고, SageMaker Canvas는 노코드 도구이며, JumpStart는 사전 학습 모델과 템플릿 제공에 중점을 둡니다. 따라서 D안이 AWS 권장 정답입니다.", "en": "SageMaker script mode allows ML engineers to bring existing training scripts written for frameworks such as PyTorch and TensorFlow directly into SageMaker with minimal changes. AWS documentation explicitly states that script mode is designed to support migration of existing ML workloads. With script mode, the user provides a custom training script, and SageMaker handles infrastructure provisioning, distributed training, logging, and model artifact storage. This makes script mode ideal for companies that want to reuse established codebases without rewriting them. Built-in algorithms require adopting AWS-provided implementations. SageMaker Canvas is a no-code tool, and JumpStart provides pretrained models and templates but does not focus on custom script reuse. Therefore, Option D is the correct and AWS-recommended choice."}, {"n": 77, "t": "single", "q": "An ML engineer is developing a fraud detection model by using the Amazon SageMaker XGBoost algorithm. The model classifies transactions as either fraudulent or legitimate. During testing, the model excels at identifying fraud in the training dataset. However, the model is inefficient at identifying fraud in new and unseen transactions. What should the ML engineer do to improve the fraud detection for new transactions?", "kq": "ML 엔지니어가 Amazon SageMaker XGBoost 알고리즘으로 사기 탐지 모델을 개발하고 있습니다. 이 모델은 거래를 사기 또는 정상으로 분류합니다. 테스트 중에 모델은 학습 데이터셋의 사기를 아주 잘 식별했습니다. 그러나 새롭고 본 적 없는 거래에 대해서는 사기를 제대로 식별하지 못합니다. 새 거래에 대한 사기 탐지를 개선하려면 어떻게 해야 합니까?", "o": [{"k": "A", "t": "Increase the learning rate.", "kt": "학습률을 높입니다."}, {"k": "B", "t": "Remove some irrelevant features from the training dataset.", "kt": "학습 데이터셋에서 관련 없는 특성 일부를 제거합니다."}, {"k": "C", "t": "Increase the value of the max_depth hyperparameter.", "kt": "max_depth 하이퍼파라미터 값을 높입니다."}, {"k": "D", "t": "Decrease the value of the max_depth hyperparameter.", "kt": "max_depth 하이퍼파라미터 값을 낮춥니다."}], "a": ["D"], "ko": "XGBoost에서 max_depth 값이 크면 모델이 학습 데이터에 지나치게 맞춰지는 과적합이 발생할 수 있습니다. 이 경우 모델은 학습 데이터는 잘 맞추지만 새롭고 보지 못한 데이터에는 일반화하지 못합니다. max_depth 값을 낮추면 모델 복잡도가 줄어들어 과적합이 완화되고, 새로운 거래에서 사기를 탐지하는 능력이 향상됩니다. 이 조정은 모델이 학습 데이터의 세부 사항을 외우기보다 일반적인 패턴에 집중하도록 도와줍니다.", "en": "A high max_depth value in XGBoost can lead to overfitting, where the model learns the training dataset too well but fails to generalize to new and unseen data. By decreasing the max_depth, the model becomes less complex, reducing overfitting and improving its ability to detect fraud in new transactions. This adjustment helps the model focus on general patterns rather than memorizing specific details in the training data."}, {"n": 78, "t": "single", "q": "An ML engineer has a custom container that performs k-fold cross-validation and logs an average F1 score during training. The ML engineer wants Amazon SageMaker AI Automatic Model Tuning (AMT) to select hyperparameters that maximize the average F1 score. How should the ML engineer integrate the custom metric into SageMaker AI AMT?", "kq": "ML 엔지니어가 k-fold 교차 검증을 수행하고 학습 중 평균 F1 점수를 기록하는 사용자 지정 컨테이너를 보유하고 있습니다. ML 엔지니어는 Amazon SageMaker AI 자동 모델 튜닝(AMT)이 평균 F1 점수를 최대화하는 하이퍼파라미터를 선택하도록 하려고 합니다. 사용자 지정 지표를 SageMaker AI AMT에 어떻게 통합해야 합니까?", "o": [{"k": "A", "t": "Define the average F1 score in the TrainingInputMode parameter.", "kt": "TrainingInputMode 파라미터에 평균 F1 점수를 정의합니다."}, {"k": "B", "t": "Define a metric definition in the tuning job that uses a regular expression to capture the average F1 score from the training logs.", "kt": "학습 로그에서 평균 F1 점수를 추출하는 정규 표현식을 사용하는 지표 정의(metric definition)를 튜닝 작업에 정의합니다."}, {"k": "C", "t": "Publish the average F1 score as a custom Amazon CloudWatch metric.", "kt": "평균 F1 점수를 사용자 지정 Amazon CloudWatch 지표로 게시합니다."}, {"k": "D", "t": "Write the F1 score to a JSON file in Amazon S3 and reference it in ObjectiveMetricName.", "kt": "F1 점수를 Amazon S3의 JSON 파일에 기록하고 ObjectiveMetricName에서 이를 참조합니다."}], "a": ["B"], "ko": "Amazon SageMaker Automatic Model Tuning은 학습 로그에서 목적 지표를 직접 추출합니다. 사용자 지정 컨테이너를 사용하는 경우, AWS는 표준 출력에서 원하는 지표 값을 파싱할 수 있도록 정규식을 지정하는 metric definition을 정의해야 한다고 요구합니다. 튜닝 작업의 ObjectiveMetricName은 이 정규식으로 캡처되는 지표 이름과 일치해야 합니다. 이는 사용자 지정 지표를 SageMaker AMT와 통합하는 유일하게 지원되는 방식입니다. TrainingInputMode는 지표를 정의하지 않으며, CloudWatch 지표는 튜닝 목적 지표로 사용할 수 없습니다. 또한 AMT는 S3 아티팩트의 지표 파일을 직접 읽지 않습니다. 따라서 정규식 기반 metric definition을 사용하는 B안이 올바른 AWS 검증 솔루션입니다.", "en": "Amazon SageMaker Automatic Model Tuning extracts objective metrics directly from training logs. For custom containers, AWS requires the ML engineer to define a metric definition that specifies a regular expression to parse the desired metric value from standard output. The ObjectiveMetricName in the tuning job must match the metric captured by the regex. This is the only supported method for integrating custom metrics with SageMaker AMT. TrainingInputMode does not define metrics. CloudWatch metrics cannot be used as tuning objectives. AMT cannot read metrics from S3 artifacts. AWS documentation explicitly states that regex-based metric definitions are required for custom metrics in hyperparameter tuning jobs. Therefore, Option B is the correct and AWS-verified solution."}, {"n": 79, "t": "match", "q": "A company has multiple models that are hosted on Amazon SageMaker Al. The models need to be re-trained. The requirements for each model are different, so the company needs to choose different deployment strategies to transfer all requests to a new model. Select the correct strategy from the following list for each requirement. Select each strategy one time. (Select THREE.)", "kq": "어떤 회사가 Amazon SageMaker AI에 여러 모델을 호스팅하고 있습니다. 이 모델들은 재학습이 필요합니다. 각 모델의 요구 사항이 다르기 때문에 회사는 모든 요청을 새 모델로 전환하기 위해 서로 다른 배포 전략을 선택해야 합니다. 아래 목록에서 각 요구 사항에 맞는 전략을 선택하세요. 각 전략은 한 번만 선택합니다. (3개 선택)", "p": ["Simultaneous calls to the endpoint must reach models with the same configuration.", "The new model must receive only a fraction of the requests for validation before receiving all the traffic.", "Traffic to the new model must increase gradually to ensure that pipelines that rely on the endpoint do not fail because of changes in latency."], "c": ["Canary traffic shifting", "Linear traffic shifting guardrail", "All at once traffic shifting"], "kp": ["엔드포인트에 대한 동시 호출이 동일한 구성의 모델에 도달해야 한다.", "새 모델이 모든 트래픽을 받기 전에 검증을 위해 일부 요청만 받아야 한다.", "엔드포인트에 의존하는 파이프라인이 지연 시간 변화로 실패하지 않도록 새 모델로의 트래픽이 점진적으로 증가해야 한다."], "kc": ["Canary traffic shifting (카나리 트래픽 전환)", "Linear traffic shifting guardrail (선형 트래픽 전환 가드레일)", "All at once traffic shifting (한 번에 전체 전환)"], "a": [2, 0, 1], "ko": "1번 요구 사항처럼 엔드포인트에 대한 동시 호출이 동일한 구성의 모델에 도달해야 한다면, 한 번에 전체 트래픽을 전환하는 All at once traffic shifting이 적합합니다. 전환 후 모든 요청이 새 모델 구성으로만 전달되므로 구성 일관성을 보장할 수 있습니다. 2번 요구 사항처럼 새 모델이 전체 트래픽을 받기 전에 일부 요청만 받아 검증되어야 한다면 Canary traffic shifting이 적합합니다. 이는 먼저 작은 비율의 트래픽을 새 모델로 보내 성능과 정확성을 확인한 뒤 전체 트래픽으로 확대할 수 있게 합니다. 3번 요구 사항처럼 엔드포인트에 의존하는 파이프라인이 지연 시간 변화로 실패하지 않도록 새 모델로 가는 트래픽을 점진적으로 늘려야 한다면 Linear traffic shifting guardrail이 적합합니다. 이 방식은 일정한 간격으로 트래픽을 단계적으로 증가시키고, CloudWatch 경보와 같은 가드레일을 통해 지연 시간이나 오류가 임계값을 초과하면 자동으로 롤백할 수 있습니다.", "en": "1 → Simultaneous calls to the endpoint must reach models with the same configuration Correct strategy: All at once traffic shifting Why: \"All at once\" replaces the old model with the new model immediately. After the switch, all concurrent requests hit only the new model configuration, guaranteeing configuration consistency across simultaneous calls. 2 → The new model must receive only a fraction of the requests for validation before receiving all the traffic Correct strategy: Canary traffic shifting Why: Canary deployments route a small percentage of traffic (for example, 5% or 10%) to the new model first. This allows validation of correctness and performance before shifting 100% of traffic. 3 → Traffic to the new model must increase gradually to ensure that pipelines that rely on the endpoint do not fail because of changes in latency Correct strategy: Linear traffic shifting guardrailWhy: Linear traffic shifting gradually increases traffic in equal increments over time and includes guardrails (such as CloudWatch alarms) to automatically roll back if latency or errors exceed thresholds."}, {"n": 80, "t": "single", "q": "A company has AWS Glue data processing jobs that are orchestrated by an AWS Glue workflow. The AWS Glue jobs can run on a schedule or can be launched manually. The company is developing pipelines in Amazon SageMaker Pipelines for ML model development. The pipelines will use the output of the AWS Glue jobs during the data processing phase of model development. An ML engineer needs to implement a solution that integrates the AWS Glue jobs with the pipelines. Which solution will meet these requirements with the LEAST operational overhead?", "kq": "어떤 회사가 AWS Glue 워크플로로 오케스트레이션되는 AWS Glue 데이터 처리 작업들을 보유하고 있습니다. 이 AWS Glue 작업들은 일정에 따라 실행되거나 수동으로 시작될 수 있습니다. 회사는 ML 모델 개발을 위해 Amazon SageMaker Pipelines에서 파이프라인을 개발하고 있습니다. 이 파이프라인들은 모델 개발의 데이터 처리 단계에서 AWS Glue 작업의 출력을 사용할 예정입니다. ML 엔지니어는 AWS Glue 작업을 파이프라인과 통합하는 솔루션을 구현해야 합니다. 어떤 솔루션이 최소한의 운영 오버헤드로 이러한 요구 사항을 충족할까요?", "o": [{"k": "A", "t": "Use AWS Step Functions for orchestration of the pipelines and the AWS Glue jobs.", "kt": "파이프라인과 AWS Glue 작업의 오케스트레이션에 AWS Step Functions를 사용합니다."}, {"k": "B", "t": "Use processing steps in SageMaker Pipelines. Configure inputs that point to the Amazon Resource Names (ARNs) of the AWS Glue jobs.", "kt": "SageMaker Pipelines의 처리 단계(processing step)를 사용합니다. AWS Glue 작업의 ARN을 가리키는 입력을 구성합니다."}, {"k": "C", "t": "Use Callback steps in SageMaker Pipelines to start the AWS Glue workflow and to stop the pipelines until the AWS Glue jobs finish running.", "kt": "SageMaker Pipelines의 Callback 단계를 사용해 AWS Glue 워크플로를 시작하고, AWS Glue 작업이 끝날 때까지 파이프라인을 대기시킵니다."}, {"k": "D", "t": "Use Amazon EventBridge to invoke the pipelines and the AWS Glue jobs in the desired order.", "kt": "Amazon EventBridge를 사용해 원하는 순서로 파이프라인과 AWS Glue 작업을 호출합니다."}], "a": ["C"], "ko": "Amazon SageMaker Pipelines의 Callback step은 AWS Glue 작업과 같은 외부 프로세스를 파이프라인 워크플로에 통합할 수 있게 합니다. Callback step을 사용하면 SageMaker 파이프라인이 AWS Glue 워크플로를 트리거하고, Glue 작업이 완료될 때까지 파이프라인 실행을 일시 중지할 수 있습니다. 이 방식은 추가 오케스트레이션 도구나 복잡한 구성을 요구하지 않고, 파이프라인 실행 흐름을 Glue 작업 완료와 직접 연결하므로 운영 부담을 최소화하면서 원활한 통합을 제공합니다.", "en": "Callback steps in Amazon SageMaker Pipelines allow you to integrate external processes, such as AWS Glue jobs, into the pipeline workflow. By using a Callback step, the SageMaker pipeline can trigger the AWS Glue workflow and pause execution until the Glue jobs complete. This approach provides seamless integration with minimal operational overhead, as it directly ties the pipeline's execution flow to the completion of the AWS Glue jobs without requiring additional orchestration tools or complex setups."}, {"n": 81, "t": "single", "q": "A company has an ML model that is deployed to an Amazon SageMaker AI endpoint for real- time inference. The company needs to deploy a new model. The company must compare the new model's performance to the currently deployed model's performance before shifting all traffic to the new model. Which solution will meet these requirements with the LEAST operational effort?", "kq": "어떤 회사가 실시간 추론을 위해 Amazon SageMaker AI 엔드포인트에 ML 모델을 배포해 두었습니다. 회사는 새 모델을 배포해야 합니다. 회사는 모든 트래픽을 새 모델로 전환하기 전에 새 모델의 성능을 현재 배포된 모델의 성능과 비교해야 합니다. 어떤 솔루션이 최소한의 운영 노력으로 이러한 요구 사항을 충족할까요?", "o": [{"k": "A", "t": "Deploy the new model to a separate endpoint. Manually split traffic between the two endpoints.", "kt": "새 모델을 별도의 엔드포인트에 배포합니다. 두 엔드포인트 간 트래픽을 수동으로 분배합니다."}, {"k": "B", "t": "Deploy the new model to a separate endpoint. Use Amazon CloudFront to distribute traffic between the two endpoints.", "kt": "새 모델을 별도의 엔드포인트에 배포합니다. Amazon CloudFront로 두 엔드포인트 간 트래픽을 분배합니다."}, {"k": "C", "t": "Deploy the new model as a shadow variant on the same endpoint as the current model. Route a portion of live traffic to the shadow model for evaluation.", "kt": "새 모델을 현재 모델과 같은 엔드포인트의 섀도 변형(shadow variant)으로 배포합니다. 평가를 위해 실제 트래픽의 일부를 섀도 모델로 라우팅합니다."}, {"k": "D", "t": "Use AWS Lambda functions with custom logic to route traffic between the current model and the new model.", "kt": "사용자 지정 로직이 포함된 AWS Lambda 함수로 현재 모델과 새 모델 사이의 트래픽을 라우팅합니다."}], "a": ["C"], "ko": "AWS는 운영 부담을 최소화하면서 새 모델을 운영 모델과 비교 평가하기 위해 섀도 테스트를 권장합니다. 하나의 SageMaker 엔드포인트에서 프로덕션 변형을 사용하면 별도의 엔드포인트를 관리하지 않고도 여러 모델로 트래픽을 라우팅할 수 있습니다. 섀도 변형을 사용하면 새 모델은 실제 운영 트래픽의 복사본을 받지만 운영 응답에는 영향을 주지 않습니다. 지연 시간, 정확도, 오류율과 같은 성능 지표는 Amazon CloudWatch 지표를 통해 현재 모델과 직접 비교할 수 있습니다. 이 방식은 Amazon SageMaker 엔드포인트에서 기본적으로 지원됩니다. A, B, D안은 추가 엔드포인트, 트래픽 라우팅 인프라 또는 사용자 지정 코드가 필요해 불필요한 복잡성을 유발합니다. 따라서 새 모델을 동일한 엔드포인트의 섀도 변형으로 배포하는 것이 가장 효율적인 해결책입니다.", "en": "AWS recommends shadow testing to evaluate a new model against a production model with minimal operational overhead. Using production variants on a single SageMaker endpoint allows traffic to be routed to multiple models without managing additional endpoints. With a shadow variant, the new model receives a copy of live traffic but does not affect production responses. Performance metrics such as latency, accuracy, and error rates can be compared directly against the current model using Amazon CloudWatch metrics. This approach is natively supported by Amazon SageMaker Endpoints. Options A, B, and D introduce unnecessary complexity by requiring additional endpoints, traffic routing infrastructure, or custom code. Therefore, deploying the new model as a shadow variant on the same endpoint is the most efficient solution."}, {"n": 82, "t": "single", "q": "An ML engineer needs to use an Amazon EMR cluster to process large volumes of data in batches. Any data loss is unacceptable. Which instance purchasing option will meet these requirements MOST cost-effectively?", "kq": "ML 엔지니어가 Amazon EMR 클러스터를 사용해 대량의 데이터를 배치로 처리해야 합니다. 데이터 손실은 절대 허용되지 않습니다. 어떤 인스턴스 구매 옵션이 가장 비용 효율적으로 이러한 요구 사항을 충족할까요?", "o": [{"k": "A", "t": "Run the primary node, core nodes, and task nodes on On-Demand Instances.", "kt": "프라이머리 노드, 코어 노드, 태스크 노드를 모두 온디맨드 인스턴스로 실행합니다."}, {"k": "B", "t": "Run the primary node, core nodes, and task nodes on Spot Instances.", "kt": "프라이머리 노드, 코어 노드, 태스크 노드를 모두 스팟 인스턴스로 실행합니다."}, {"k": "C", "t": "Run the primary node on an On-Demand Instance. Run the core nodes and task nodes on Spot Instances.", "kt": "프라이머리 노드는 온디맨드 인스턴스로 실행합니다. 코어 노드와 태스크 노드는 스팟 인스턴스로 실행합니다."}, {"k": "D", "t": "Run the primary node and core nodes on On-Demand Instances. Run the task nodes on Spot Instances.", "kt": "프라이머리 노드와 코어 노드는 온디맨드 인스턴스로 실행합니다. 태스크 노드는 스팟 인스턴스로 실행합니다."}], "a": ["D"], "ko": "Amazon EMR에서 프라이머리 노드와 코어 노드는 HDFS 데이터 저장과 처리 등 클러스터의 핵심 기능을 담당합니다. 이러한 노드를 On-Demand Instance에서 실행하면 Spot Instance 중단으로 인한 데이터 손실 위험을 방지하고 높은 가용성을 보장할 수 있습니다. 반면 태스크 노드는 추가 처리 작업을 수행하지만 데이터를 저장하지 않으므로 Spot Instance를 사용해도 클러스터의 복원력이나 데이터 무결성을 크게 해치지 않으면서 비용을 절감할 수 있습니다. 따라서 프라이머리 노드와 코어 노드는 On-Demand Instance로, 태스크 노드는 Spot Instance로 구성하는 방식이 비용 효율성과 안정성의 균형을 가장 잘 충족합니다.", "en": "For Amazon EMR, the primary node and core nodes handle the critical functions of the cluster, including data storage (HDFS) and processing. Running them on On-Demand Instances ensures high availability and prevents data loss, as Spot Instances can be interrupted. The task nodes, which handle additional processing but do not store data, can use Spot Instances to reduce costs without compromising the cluster's resilience or data integrity. This configuration balances cost- effectiveness and reliability."}, {"n": 83, "t": "single", "q": "A company wants to improve its customer retention ML model. The current model has 85% accuracy and a new model shows 87% accuracy in testing. The company wants to validate the new model's performance in production. Which solution will meet these requirements?", "kq": "어떤 회사가 고객 유지 ML 모델을 개선하려고 합니다. 현재 모델은 85%의 정확도를 보이고, 새 모델은 테스트에서 87%의 정확도를 보입니다. 회사는 운영 환경에서 새 모델의 성능을 검증하려고 합니다. 어떤 솔루션이 이러한 요구 사항을 충족할까요?", "o": [{"k": "A", "t": "Deploy the new model for 4 weeks across all production traffic. Monitor performance metrics and validate improvements.", "kt": "새 모델을 4주간 모든 운영 트래픽에 배포합니다. 성능 지표를 모니터링하고 개선을 검증합니다."}, {"k": "B", "t": "Run A/B testing on both models for 4 weeks. Route 20% of traffic to the new model. Monitor customer retention rates across both variants.", "kt": "두 모델에 대해 4주간 A/B 테스트를 실행합니다. 트래픽의 20%를 새 모델로 라우팅합니다. 두 변형의 고객 유지율을 모니터링합니다."}, {"k": "C", "t": "Run both models in parallel for 4 weeks. Analyze offline predictions weekly by using historical customer data analysis.", "kt": "두 모델을 4주간 병렬로 실행합니다. 과거 고객 데이터 분석을 통해 오프라인 예측을 매주 분석합니다."}, {"k": "D", "t": "Implement alternating deployments for 4 weeks between the current model and the new model. Track performance metrics for comparison.", "kt": "4주간 현재 모델과 새 모델을 번갈아 배포합니다. 비교를 위해 성능 지표를 추적합니다."}], "a": ["B"], "ko": "AWS ML 모범 사례에서는 운영 환경에서 모델 개선 효과를 검증할 때 위험을 최소화하기 위해 A/B 테스트를 권장합니다. 실제 트래픽의 일부, 예를 들어 20%만 새 모델로 보내고 대부분의 트래픽은 기존 모델에 유지하면 동일한 데이터 분포에서 두 모델의 실제 성능을 직접 비교할 수 있습니다. 이 방식은 오프라인 정확도만 보는 것이 아니라 고객 유지율과 같은 비즈니스 지표를 통계적으로 의미 있게 비교할 수 있게 합니다. 또한 새 모델이 운영 환경에서 기대보다 낮은 성능을 보일 경우 부정적인 영향을 제한할 수 있습니다. A안처럼 새 모델을 전체 트래픽에 배포하는 것은 불필요한 위험을 초래합니다. C안의 오프라인 분석은 실제 사용자 행동을 반영하지 못하며, D안의 교대 배포는 시간대 영향과 같은 혼란 요인을 유발할 수 있습니다. 따라서 A/B 테스트가 올바른 해결책입니다.", "en": "AWS ML best practices recommend A/B testing to validate model improvements in production while minimizing risk. By routing a controlled portion of live traffic (for example, 20%) to the new model and keeping the majority of traffic on the existing model, the company can directly compare real- world performance using the same data distribution. This approach allows statistically meaningful comparison of business metrics such as customer retention, rather than relying solely on offline accuracy. It also limits potential negative impact if the new model underperforms in production. Deploying the new model to 100% of traffic (Option A) introduces unnecessary risk. Offline analysis (Option C) does not reflect live user behavior. Alternating deployments (Option D) introduces confounding factors such as time-based effects. Therefore, A/B testing is the correct solution."}, {"n": 84, "t": "single", "q": "A company wants to share data with a vendor in real time to improve the performance of the vendor's ML models. The vendor needs to ingest the data in a stream. The vendor will use only some of the columns from the streamed data. Which solution will meet these requirements?", "kq": "어떤 회사가 공급업체의 ML 모델 성능을 개선하기 위해 공급업체와 실시간으로 데이터를 공유하려고 합니다. 공급업체는 데이터를 스트림으로 수집해야 합니다. 공급업체는 스트리밍된 데이터의 일부 컬럼만 사용할 예정입니다. 어떤 솔루션이 이러한 요구 사항을 충족할까요?", "o": [{"k": "A", "t": "Use AWS Data Exchange to stream the data to an Amazon S3 bucket. Use an Amazon Athena CREATE TABLE AS SELECT (CTAS) query to define relevant columns.", "kt": "AWS Data Exchange를 사용해 데이터를 Amazon S3 버킷으로 스트리밍합니다. Amazon Athena의 CTAS(CREATE TABLE AS SELECT) 쿼리로 관련 컬럼을 정의합니다."}, {"k": "B", "t": "Use Amazon Kinesis Data Streams to ingest the data. Use Amazon Managed Service for Apache Flink as a consumer to extract relevant columns.", "kt": "Amazon Kinesis Data Streams로 데이터를 수집합니다. Amazon Managed Service for Apache Flink를 소비자로 사용해 관련 컬럼을 추출합니다."}, {"k": "C", "t": "Create an Amazon S3 bucket. Configure the S3 bucket policy to allow the vendor to upload data to the S3 bucket. Configure the S3 bucket policy to control which columns are shared.", "kt": "Amazon S3 버킷을 만듭니다. 공급업체가 S3 버킷에 데이터를 업로드할 수 있도록 S3 버킷 정책을 구성합니다. 어떤 컬럼을 공유할지 제어하도록 S3 버킷 정책을 구성합니다."}, {"k": "D", "t": "Use AWS Lake Formation to ingest the data. Use the column-level filtering feature in Lake Formation to extract relevant columns.", "kt": "AWS Lake Formation으로 데이터를 수집합니다. Lake Formation의 컬럼 수준 필터링 기능으로 관련 컬럼을 추출합니다."}], "a": ["B"], "ko": "요구 사항은 벤더와 데이터를 공유하기 전에 실시간 스트리밍 수집과 컬럼 수준 변환을 수행하는 것입니다. Amazon Kinesis Data Streams는 낮은 지연 시간의 실시간 데이터 수집과 전달을 위해 설계되었습니다. 스트림에서 필요한 컬럼만 추출하려면 Amazon Managed Service for Apache Flink를 스트림 소비자로 사용하는 것이 권장됩니다. Flink는 스트리밍 데이터에 대해 필터링, 컬럼 선택, 보강과 같은 실시간 변환을 수행한 뒤 downstream 시스템으로 전달할 수 있습니다. A와 D는 배치 지향 방식이므로 실시간 스트리밍 요구 사항에 적합하지 않습니다. C는 S3 버킷 정책으로 컬럼 수준 접근 제어를 강제할 수 없기 때문에 부적절합니다. 따라서 Kinesis Data Streams와 Apache Flink 조합이 모든 요구 사항을 충족합니다.", "en": "The requirement specifies real-time streaming ingestion and column-level transformation before sharing data with a vendor. Amazon Kinesis Data Streams is designed for low-latency, real-time data ingestion and delivery. To extract only required columns from the stream, AWS recommends using Amazon Managed Service for Apache Flink as a stream consumer. Flink enables real-time transformations such as filtering, projection, and enrichment on streaming data before delivering it downstream. Option A and D are batch-oriented and not suitable for real-time streaming. Option C is incorrect because S3 bucket policies cannot enforce column-level access controls. Therefore, Kinesis Data Streams combined with Apache Flink meets all requirements."}, {"n": 85, "t": "single", "q": "A company has a conversational AI assistant that sends requests through Amazon Bedrock to an Anthropic Claude large language model (LLM). Users report that when they ask similar questions multiple times, they sometimes receive different answers. An ML engineer needs to improve the responses to be more consistent and less random. Which solution will meet these requirements?", "kq": "어떤 회사가 Amazon Bedrock을 통해 Anthropic Claude 대규모 언어 모델(LLM)로 요청을 보내는 대화형 AI 어시스턴트를 운영하고 있습니다. 사용자들은 비슷한 질문을 여러 번 했을 때 때때로 서로 다른 답변을 받는다고 보고합니다. ML 엔지니어는 응답을 더 일관되고 덜 무작위적으로 개선해야 합니다. 어떤 솔루션이 이러한 요구 사항을 충족할까요?", "o": [{"k": "A", "t": "Increase the temperature parameter and the top_k parameter.", "kt": "temperature 파라미터와 top_k 파라미터를 모두 높입니다."}, {"k": "B", "t": "Increase the temperature parameter. Decrease the top_k parameter.", "kt": "temperature 파라미터를 높이고 top_k 파라미터를 낮춥니다."}, {"k": "C", "t": "Decrease the temperature parameter. Increase the top_k parameter.", "kt": "temperature 파라미터를 낮추고 top_k 파라미터를 높입니다."}, {"k": "D", "t": "Decrease the temperature parameter and the top_k parameter.", "kt": "temperature 파라미터와 top_k 파라미터를 모두 낮춥니다."}], "a": ["D"], "ko": "temperature 파라미터는 모델 응답의 무작위성을 제어합니다. temperature 값을 낮추면 모델은 더 결정적이고 일관된 답변을 생성합니다. top_k 파라미터는 다음 단어를 생성할 때 고려할 토큰 수를 제한합니다. top_k 값을 낮추면 모델이 선택할 수 있는 후보가 더 제한되어 응답이 더 예측 가능해집니다. 따라서 두 파라미터를 모두 낮추면 비슷한 질문에 대한 응답의 변동성이 줄어들고, 더 집중적이고 일관된 답변을 얻을 수 있습니다.", "en": "The temperature parameter controls the randomness in the model's responses. Lowering the temperature makes the model produce more deterministic and consistent answers. The top_k parameter limits the number of tokens considered for generating the next word. Reducing top_k further constrains the model's options, ensuring more predictable responses. By decreasing both parameters, the responses become more focused and consistent, reducing variability in similar queries."}, {"n": 86, "t": "single", "q": "A company has an ML model in Amazon SageMaker AI. An ML engineer needs to implement a monitoring solution to automatically detect changes in the input data distribution of model features. Which solution will meet this requirement with the LEAST operational overhead?", "kq": "어떤 회사가 Amazon SageMaker AI에 ML 모델을 보유하고 있습니다. ML 엔지니어는 모델 특성의 입력 데이터 분포 변화를 자동으로 감지하는 모니터링 솔루션을 구현해야 합니다. 어떤 솔루션이 최소한의 운영 오버헤드로 이 요구 사항을 충족할까요?", "o": [{"k": "A", "t": "Configure SageMaker Model Monitor. Establish a data quality baseline. Ensure that the emit_metrics option is enabled in the baseline constraints file. Configure an Amazon CloudWatch alarm to notify the company about changes in specific metrics that are related to data quality.", "kt": "SageMaker Model Monitor를 구성합니다. 데이터 품질 기준선을 설정합니다. 기준선 제약 파일에서 emit_metrics 옵션이 활성화되어 있는지 확인합니다. 데이터 품질과 관련된 특정 지표의 변화를 회사에 알리도록 Amazon CloudWatch 알람을 구성합니다."}, {"k": "B", "t": "Configure SageMaker Model Monitor. Establish a model quality baseline. Ensure that the comparison_method option is set to Robust in the baseline constraints file. Configure an Amazon CloudWatch alarm to notify the company about changes in model quality metrics.", "kt": "SageMaker Model Monitor를 구성합니다. 모델 품질 기준선을 설정합니다. 기준선 제약 파일에서 comparison_method 옵션을 Robust로 설정합니다. 모델 품질 지표 변화를 회사에 알리도록 Amazon CloudWatch 알람을 구성합니다."}, {"k": "C", "t": "Use SageMaker Debugger with custom rules to track shifts in feature distributions. Configure Amazon CloudWatch alarms to notify the company when the rules detect significant changes.", "kt": "사용자 지정 규칙이 적용된 SageMaker Debugger로 특성 분포의 변화를 추적합니다. 규칙이 유의미한 변화를 감지하면 회사에 알리도록 Amazon CloudWatch 알람을 구성합니다."}, {"k": "D", "t": "Use Amazon CloudWatch to directly observe the SageMaker AI endpoint's performance metrics.Manually analyze the CloudWatch logs for indicators of data drift or shifts in feature distribution.", "kt": "Amazon CloudWatch로 SageMaker AI 엔드포인트의 성능 지표를 직접 관찰합니다. 데이터 드리프트나 특성 분포 변화의 징후를 찾기 위해 CloudWatch 로그를 수동으로 분석합니다."}], "a": ["A"], "ko": "A안이 정답입니다. 요구 사항은 모델 특성의 입력 데이터 분포 변화를 탐지하는 것이며, 이는 데이터 품질 또는 데이터 드리프트 모니터링 문제입니다. AWS 문서에 따르면 Amazon SageMaker Model Monitor는 규칙을 사용해 데이터 드리프트를 탐지하고, 드리프트가 발생하면 알림을 제공할 수 있습니다. 일반적인 절차는 데이터 캡처를 활성화하고, 학습 데이터로 기준선을 생성한 뒤, 수신되는 추론 데이터를 해당 기준선과 비교하는 모니터링 작업을 실행하는 것입니다. 이는 특성 분포 변화를 자동으로 탐지해야 한다는 요구 사항과 직접적으로 일치합니다. 또한 Model Monitor는 지표를 Amazon CloudWatch로 내보낼 수 있으며, CloudWatch 경보를 통해 데이터 품질이 허용 임계값을 벗어날 때 팀에 알림을 보낼 수 있습니다. B안은 예측 성능과 정답 레이블을 기반으로 하는 모델 품질 모니터링에 더 가깝고, 입력 특성 분포 변화 탐지와는 다릅니다. C안의 SageMaker Debugger는 주로 학습 중 디버깅과 사용자 지정 규칙 분석에 사용되며, 운영 중 데이터 드리프트 관리형 모니터링 도구가 아닙니다. D안은 수동 로그 분석에 의존하므로 운영 부담이 크고 특성 분포 드리프트 탐지를 직접 해결하지 못합니다. 따라서 A안이 가장 적절합니다.", "en": "Option A is correct because the requirement is to detect changes in the input data distribution of model features, which is a data quality / data drift monitoring problem. AWS documentation states that Amazon SageMaker Model Monitor uses rules to detect data drift and alerts you when it happens. The documented workflow is to enable data capture, create a baseline from training data, and then run monitoring jobs that compare incoming inference data against that baseline. That directly matches the need to automatically detect changes in feature distributions. AWS also documents that Model Monitor can emit metrics to Amazon CloudWatch, and those metrics can be used with CloudWatch alarms to notify teams when data quality drifts beyond acceptable thresholds. That makes Option A the lowest-operational-overhead solution because it uses SageMaker's built-in monitoring capability plus managed alerting, rather than requiring custom drift logic. The inclusion of emit_metrics and CloudWatch alarming is consistent with the SageMaker monitoring pattern for automated notification. The other options are weaker. Option B is for model quality monitoring, which focuses on prediction performance against ground truth, not shifts in the input feature distribution. Option C uses SageMaker Debugger, which is aimed at training-time debugging and custom rule analysis rather than managed production data drift monitoring. Option D relies on manual log analysis and endpoint performance metrics, which does not directly solve feature-distribution drift detection and adds more operational effort. Therefore, the best AWS-documented answer is A."}, {"n": 87, "t": "single", "q": "An ML engineer is using AWS CodeDeploy to deploy new container versions for inference on Amazon ECS. The deployment must shift 10% of traffic initially, and the remaining 90% must shift within 10-15 minutes. Which deployment configuration meets these requirements?", "kq": "ML 엔지니어가 AWS CodeDeploy를 사용해 Amazon ECS에서 추론용 새 컨테이너 버전을 배포하고 있습니다. 배포는 처음에 트래픽의 10%를 전환해야 하고, 나머지 90%는 10~15분 내에 전환되어야 합니다. 요구 사항을 충족하는 배포 구성은 무엇입니까?", "o": [{"k": "A", "t": "CodeDeployDefault.LambdaLinear10PercentEvery10Minutes", "kt": "CodeD
