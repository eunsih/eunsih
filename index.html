ent Dirichlet Allocation(LDA)은 레이블이 없는 문서 말뭉치에서 잠재 주제를 발견하도록 설계된 확률적 생성 모델입니다. AWS는 Amazon SageMaker의 내장 알고리즘으로 LDA를 제공하므로 이 요구 사항에 적합합니다. LDA는 문서를 여러 주제의 혼합으로, 각 주제를 단어의 혼합으로 모델링하여 대규모 문서에서 해석 가능한 주제를 찾을 수 있게 합니다. BlazingText는 단어 임베딩과 지도형 텍스트 분류에 적합하고, Sequence-to-Sequence는 번역이나 요약에 사용되며, Object2Vec은 임베딩을 생성하지만 별도 클러스터링 없이는 주제 발견을 직접 수행하지 않습니다. 따라서 LDA를 사용하는 D안이 정답입니다.", "en": "The task described is unsupervised topic modeling, where topics are unknown in advance. Latent Dirichlet Allocation (LDA) is a probabilistic generative model specifically designed to discover latent topics from a corpus of documents without labeled data. AWS provides LDA as a built-in algorithm in Amazon SageMaker, making it well suited for this requirement. LDA models documents as mixtures of topics and topics as mixtures of words, enabling interpretable topic discovery at scale. This aligns precisely with the need to organize documents into topics when the topics are not predefined. BlazingText is optimized for word embeddings and supervised text classification, not topic modeling. Sequence-to-sequence models are used for translation or summarization. Object2Vec creates embeddings but does not itself perform topic discovery without additional clustering steps. Therefore, LDA is the correct and purpose-built solution."}, {"n": 219, "t": "single", "q": "An ML engineer needs to use Amazon SageMaker to fine-tune a large language model (LLM) for text summarization. The ML engineer must follow a low-code no-code (LCNC) approach. Which solution will meet these requirements?", "kq": "ML 엔지니어가 텍스트 요약을 위해 Amazon SageMaker로 대규모 언어 모델(LLM)을 파인튜닝해야 합니다. ML 엔지니어는 로우코드·노코드(LCNC) 방식을 따라야 합니다. 어떤 솔루션이 이러한 요구 사항을 충족할까요?", "o": [{"k": "A", "t": "Use SageMaker Studio to fine-tune an LLM that is deployed on Amazon EC2 instances.", "kt": "SageMaker Studio를 사용해 Amazon EC2 인스턴스에 배포된 LLM을 파인튜닝합니다."}, {"k": "B", "t": "Use SageMaker Autopilot to fine-tune an LLM that is deployed by a custom API endpoint.", "kt": "SageMaker Autopilot을 사용해 사용자 지정 API 엔드포인트로 배포된 LLM을 파인튜닝합니다."}, {"k": "C", "t": "Use SageMaker Autopilot to fine-tune an LLM that is deployed on Amazon EC2 instances.", "kt": "SageMaker Autopilot을 사용해 Amazon EC2 인스턴스에 배포된 LLM을 파인튜닝합니다."}, {"k": "D", "t": "Use SageMaker Autopilot to fine-tune an LLM that is deployed by SageMaker JumpStart.", "kt": "SageMaker Autopilot을 사용해 SageMaker JumpStart로 배포된 LLM을 파인튜닝합니다."}], "a": ["D"], "ko": "SageMaker JumpStart는 대규모 언어 모델을 포함한 사전 학습 모델에 접근할 수 있게 하며, 로우코드/노코드 방식으로 쉽게 배포하고 미세 조정할 수 있습니다. SageMaker Autopilot과 JumpStart를 함께 사용하면 모델 최적화와 미세 조정 과정이 자동화되어 광범위한 코딩 없이 LLM을 텍스트 요약 작업에 맞게 조정할 수 있습니다. 따라서 LCNC 접근 방식이 필요한 경우 SageMaker JumpStart로 배포된 LLM을 SageMaker Autopilot으로 미세 조정하는 D안이 요구 사항에 가장 적합합니다.", "en": "SageMaker JumpStart provides access to pre-trained models, including large language models (LLMs), which can be easily deployed and fine-tuned with a low-code/no-code (LCNC) approach. Using SageMaker Autopilot with JumpStart simplifies the fine-tuning process by automating model optimization and reducing the need for extensive coding, making it the ideal solution for this requirement."}, {"n": 220, "t": "single", "q": "An ML engineer is using Amazon SageMaker Canvas to build a custom ML model from an imported dataset. The model must make continuous numeric predictions based on 10 years of data. Which metric should the ML engineer use to evaluate the model's performance?", "kq": "ML 엔지니어가 가져온 데이터셋으로 사용자 지정 ML 모델을 만들기 위해 Amazon SageMaker Canvas를 사용하고 있습니다. 이 모델은 10년간의 데이터를 기반으로 연속적인 수치 예측을 수행해야 합니다. 모델 성능을 평가할 때 사용해야 할 지표는 무엇입니까?", "o": [{"k": "A", "t": "Accuracy", "kt": "정확도(Accuracy)"}, {"k": "B", "t": "InferenceLatency", "kt": "InferenceLatency"}, {"k": "C", "t": "Area Under the ROC Curve (AUC)", "kt": "ROC 곡선 아래 면적(AUC)"}, {"k": "D", "t": "Root Mean Square Error (RMSE)", "kt": "평균 제곱근 오차(RMSE)"}], "a": ["D"], "ko": "이 문제는 목표 변수가 연속적인 숫자 값인 회귀 문제입니다. AWS 문서에 따르면 정확도와 AUC 같은 분류 지표는 회귀 모델에 적합하지 않습니다. Root Mean Square Error(RMSE)는 예측값과 실제값 차이의 제곱 평균에 제곱근을 취한 지표입니다. RMSE는 큰 예측 오류에 더 큰 패널티를 부여하므로, 큰 오차가 비용이 크거나 바람직하지 않은 경우에 특히 유용합니다. SageMaker Canvas는 회귀 모델을 만들 때 RMSE와 MAE 같은 회귀 지표를 자동으로 선택합니다. InferenceLatency는 시스템 성능 지표이지 모델 정확도 지표가 아닙니다. 따라서 연속형 숫자 예측 모델의 성능 평가에는 RMSE가 적절하며 D안이 정답입니다.", "en": "This is a regression problem, where the target variable is continuous and numeric. AWS documentation clearly states that classification metrics such as accuracy and AUC are not appropriate for regression models. Root Mean Square Error (RMSE) measures the square root of the average squared differences between predicted and actual values. RMSE penalizes larger errors more heavily, making it especially useful when large prediction errors are costly or undesirable. SageMaker Canvas automatically selects regression metrics such as RMSE and MAE when building regression models. RMSE is widely used for time-based and numeric prediction problems, especially when evaluating long historical datasets. Inference latency measures system performance, not model accuracy. Therefore, Option D is the correct and AWS-verified answer."}, {"n": 222, "t": "match", "q": "A company needs to update the model definition of an existing Amazon SageMaker Al endpoint. Select and order the correct steps from the following list to update the model definition settings with the LEAST interruption of inferences. Select each step one time or not at all. (Select and order THREE.)", "kq": "어떤 회사가 기존 Amazon SageMaker AI 엔드포인트의 모델 정의를 업데이트해야 합니다. 추론 중단을 최소화하면서 모델 정의 설정을 업데이트할 올바른 단계를 아래 목록에서 선택해 순서대로 배치하세요. 각 단계는 한 번만 선택하거나 선택하지 않습니다. (3개 선택 및 순서 배치)", "p": ["Step 1", "Step 2", "Step 3"], "c": ["Create a new endpoint configuration that uses the new model definition.", "Create a new model definition with updated settings by using the CreateModel action in the SageMaker AI API.", "Delete the endpoint that needs to be updated and recreate the endpoint with the new endpoint configuration.", "Delete the IAM role and permissions for the ExecutionRoleArn parameter.", "Update the endpoint with the new endpoint configuration."], "kp": ["1단계", "2단계", "3단계"], "kc": ["새 모델 정의를 사용하는 새 엔드포인트 구성을 만든다.", "SageMaker AI API의 CreateModel 작업을 사용해 업데이트된 설정이 포함된 새 모델 정의를 만든다.", "업데이트가 필요한 엔드포인트를 삭제하고 새 엔드포인트 구성으로 엔드포인트를 다시 만든다.", "ExecutionRoleArn 파라미터에 대한 IAM 역할과 권한을 삭제한다.", "새 엔드포인트 구성으로 엔드포인트를 업데이트한다."], "a": [1, 0, 4], "ko": "1단계는 SageMaker AI API의 CreateModel 작업을 사용해 업데이트된 설정이 포함된 새 모델 정의를 생성하는 것입니다. 2단계는 새 모델 정의를 사용하는 새 엔드포인트 구성을 생성하는 것입니다. 3단계는 새 엔드포인트 구성으로 기존 엔드포인트를 업데이트하는 것입니다. 추론 중단을 최소화하려면 기존 엔드포인트를 삭제하고 다시 생성해서는 안 됩니다. SageMaker 엔드포인트 업데이트는 새 EndpointConfig를 사용하도록 설계되어 있으며, AWS 문서에서도 엔드포인트를 업데이트하려면 새 엔드포인트 구성을 만든 다음 기존 엔드포인트에 UpdateEndpoint를 호출해야 한다고 설명합니다. 업데이트 중 엔드포인트 상태는 Updating으로 변경되었다가 다시 InService 상태로 돌아갑니다.", "en": "Step 1: Create a new model definition with updated settings by using the CreateModel action in the SageMaker AI API. Step 2: Create a new endpoint configuration that uses the new model definition. Step 3: Update the endpoint with the new endpoint configuration. Do not delete and recreate the endpoint. That causes unnecessary inference interruption. SageMaker endpoint updates are designed to use a new EndpointConfig; AWS explicitly states that to update an endpoint, you must create a new endpoint configuration, then call UpdateEndpoint on the existing endpoint. During the update, SageMaker changes the endpoint to Updating and then back to InService."}, {"n": 223, "t": "single", "q": "A company that has hundreds of data scientists is using Amazon SageMaker to create ML models. The models are in model groups in the SageMaker Model Registry. The data scientists are grouped into three categories: computer vision, natural language processing (NLP), and speech recognition. An ML engineer needs to implement a solution to organize the existing models into these groups to improve model discoverability at scale. The solution must not affect the integrity of the model artifacts and their existing groupings. Which solution will meet these requirements?", "kq": "수백 명의 데이터 사이언티스트가 있는 어떤 회사가 ML 모델을 만들기 위해 Amazon SageMaker를 사용합니다. 모델들은 SageMaker Model Registry의 모델 그룹에 있습니다. 데이터 사이언티스트들은 컴퓨터 비전, 자연어 처리(NLP), 음성 인식의 세 가지 범주로 나뉩니다. ML 엔지니어는 대규모 환경에서 모델 검색 가능성을 높이기 위해 기존 모델들을 이 그룹으로 정리하는 솔루션을 구현해야 합니다. 단, 솔루션은 모델 아티팩트의 무결성과 기존 그룹화에 영향을 주어서는 안 됩니다. 어떤 솔루션이 이러한 요구 사항을 충족할까요?", "o": [{"k": "A", "t": "Create a custom tag for each of the three categories. Add the tags to the model packages in the SageMaker Model Registry.", "kt": "세 범주 각각에 대해 사용자 지정 태그를 만듭니다. SageMaker Model Registry의 모델 패키지에 해당 태그를 추가합니다."}, {"k": "B", "t": "Create a model group for each category. Move the existing models into these category model groups.", "kt": "각 범주마다 모델 그룹을 만듭니다. 기존 모델들을 이 범주별 모델 그룹으로 이동합니다."}, {"k": "C", "t": "Use SageMaker ML Lineage Tracking to automatically identify and tag which model groups should contain the models.", "kt": "SageMaker ML Lineage Tracking을 사용해 어떤 모델 그룹에 모델이 포함되어야 하는지 자동으로 식별하고 태그를 지정합니다."}, {"k": "D", "t": "Create a Model Registry collection for each of the three categories. Move the existing model groups into the collections.", "kt": "세 범주 각각에 대해 Model Registry 컬렉션을 만듭니다. 기존 모델 그룹을 해당 컬렉션으로 이동합니다."}], "a": ["D"], "ko": "[정답 수정: 덤프 표기는 A였으나 AWS 공식 문서 기준 D] SageMaker Model Registry 컬렉션(Collections)은 관련 모델 그룹을 NLP, CV, 음성 인식 같은 카테고리로 묶고 계층 구조로 정리해 대규모 환경에서 검색성을 높이는 기능입니다. 컬렉션 작업은 모델 그룹의 무결성과 S3/ECR의 아티팩트를 변경하지 않으므로 문제 조건과 정확히 일치합니다.", "en": null}, {"n": 224, "t": "single", "q": "A healthcare analytics company wants to segment patients into groups that have similar risk factors to develop personalized treatment plans. The company has a dataset that includes patient health records, medication history, and lifestyle changes. The company must identify the appropriate algorithm to determine the number of groups by using hyperparameters. Which solution will meet these requirements?", "kq": "어떤 헬스케어 분석 회사가 개인화된 치료 계획을 개발하기 위해 유사한 위험 요인을 가진 환자들을 그룹으로 세분화하려고 합니다. 회사에는 환자 건강 기록, 투약 이력, 생활 습관 변화가 포함된 데이터셋이 있습니다. 회사는 하이퍼파라미터를 사용해 그룹 수를 결정할 적절한 알고리즘을 식별해야 합니다. 어떤 솔루션이 이러한 요구 사항을 충족할까요?", "o": [{"k": "A", "t": "Use the Amazon SageMaker AI XGBoost algorithm. Set max_depth to control tree complexity for risk groups.", "kt": "Amazon SageMaker AI XGBoost 알고리즘을 사용합니다. 위험 그룹의 트리 복잡도를 제어하기 위해 max_depth를 설정합니다."}, {"k": "B", "t": "Use the Amazon SageMaker k-means clustering algorithm. Set k to specify the number of clusters.", "kt": "Amazon SageMaker k-means 클러스터링 알고리즘을 사용합니다. 클러스터 수를 지정하기 위해 k를 설정합니다."}, {"k": "C", "t": "Use the Amazon SageMaker AI DeepAR algorithm. Set epochs to determine the number of training iterations for risk groups.", "kt": "Amazon SageMaker AI DeepAR 알고리즘을 사용합니다. 위험 그룹의 학습 반복 횟수를 결정하기 위해 epochs를 설정합니다."}, {"k": "D", "t": "Use the Amazon SageMaker AI Random Cut Forest (RCF) algorithm. Set a contamination hyperparameter for risk anomaly detection.", "kt": "Amazon SageMaker AI Random Cut Forest(RCF) 알고리즘을 사용합니다. 위험 이상 탐지를 위해 contamination 하이퍼파라미터를 설정합니다."}], "a": ["B"], "ko": "설명된 문제는 환자 세분화 사용 사례이며, 이는 비지도 학습의 전형적인 예입니다. 목표는 사전 정의된 레이블 없이 유사한 특성을 가진 환자를 그룹화하는 것입니다. AWS 문서에서는 Amazon SageMaker k-means가 클러스터링과 세분화 작업을 위해 설계되었다고 설명합니다. SageMaker k-means 알고리즘은 특성 유사성을 기준으로 데이터 포인트를 클러스터로 그룹화하며, 사용자가 k 하이퍼파라미터를 통해 클러스터 수를 지정해야 합니다. 이는 하이퍼파라미터를 사용해 그룹 수를 결정해야 한다는 요구 사항과 직접적으로 일치합니다. XGBoost는 분류 및 회귀에 사용되는 지도 학습 알고리즘이고, max_depth는 그룹 수가 아니라 트리 복잡도를 제어합니다. DeepAR는 시계열 예측용 알고리즘이며, Random Cut Forest는 이상 탐지용 알고리즘입니다. 따라서 데이터 포인트를 지정된 수의 클러스터로 나누는 것이 목표라면 k-means를 사용하는 B안이 AWS 문서상 검증된 정답입니다.", "en": "The problem described is a patient segmentation use case, which is a classic example of unsupervised learning. The objective is to group patients with similar characteristics without predefined labels. AWS documentation clearly states that Amazon SageMaker k-means is designed specifically for clustering and segmentation tasks. The SageMaker k-means algorithm groups data points into clusters based on feature similarity and requires the user to define the number of clusters using the k hyperparameter. This directly satisfies the requirement to \"determine the number of groups by using hyperparameters.\" AWS recommends k-means for applications such as customer segmentation, risk grouping, and pattern discovery in healthcare data. Option A (XGBoost) is a supervised learning algorithm used for classification and regression. The max_depth hyperparameter controls tree complexity, not the number of groups, making it unsuitable for this task. Option C (DeepAR) is a time-series forecasting algorithm optimized for predicting future values, not clustering patients. Option D (Random Cut Forest) is an anomaly detection algorithm. While useful for identifying outliers or unusual patient behavior, it does not perform clustering or group segmentation. AWS SageMaker documentation explicitly identifies k-means as the correct choice when the goal is to partition data into a predefined number of clusters using a tunable hyperparameter. Therefore, Option B is the correct and AWS-verified answer."}, {"n": 225, "t": "match", "q": "A company has deployed a model to predict the churn rate for its games by using Amazon SageMaker Studio. After the model is deployed, the company must monitor the model performance for data drift and inspect the report. Select and order the correct steps from the following list to model monitor actions. Select each step one time. (Select and order THREE.)", "kq": "어떤 회사가 Amazon SageMaker Studio를 사용해 자사 게임의 이탈률을 예측하는 모델을 배포했습니다. 모델 배포 후 회사는 데이터 드리프트에 대한 모델 성능을 모니터링하고 보고서를 확인해야 합니다. 모델 모니터링 작업을 수행할 올바른 단계를 아래 목록에서 선택해 순서대로 배치하세요. 각 단계는 한 번만 선택합니다. (3개 선택 및 순서 배치)", "p": ["Step 1", "Step 2", "Step 3"], "c": ["Check the analysis results on the SageMaker Studio console.", "Create a Shapley Additive Explanations (SHAP) baseline for the model by using Amazon SageMaker Clarify.", "Schedule an hourly model explainability monitor."], "kp": ["1단계", "2단계", "3단계"], "kc": ["SageMaker Studio 콘솔에서 분석 결과를 확인한다.", "Amazon SageMaker Clarify를 사용해 모델의 SHAP(Shapley Additive Explanations) 기준선을 만든다.", "시간별 모델 설명 가능성 모니터를 예약한다."], "a": [1, 2, 0], "ko": "1단계는 Amazon SageMaker Clarify를 사용해 모델의 SHAP 기준선을 생성하는 것입니다. 모니터링을 수행하려면 먼저 SageMaker Clarify가 설명 가능성 기준 구성을 만들어야 합니다. 이 기준선은 학습 데이터 또는 기준 데이터에서 특성 중요도에 대한 기준 SHAP 값을 캡처하며, Model Monitor는 이후 추론 결과와 비교해 특성 기여도 드리프트를 탐지합니다. 2단계는 모델 설명 가능성 모니터를 시간별로 예약하는 것입니다. 기준선이 생성된 후에는 설명 가능성 모니터링 일정이 구성되어야 하며, 모니터는 추론 데이터를 주기적으로 분석하고 SHAP 기준선과 비교하여 특성 기여도의 드리프트나 이상을 보여주는 보고서를 생성합니다. 3단계는 SageMaker Studio 콘솔에서 분석 결과를 확인하는 것입니다. 모니터링 작업이 실행되면 SageMaker는 분석 결과를 Amazon S3에 저장하고 SageMaker Studio 콘솔에서 지표, 위반 사항, 시각적 보고서를 확인할 수 있게 합니다. 모니터는 기준선 없이는 실행될 수 없고, 결과는 모니터가 실행된 이후에야 검토할 수 있으므로 이 순서가 필요합니다.", "en": "Step 1: Create a Shapley Additive Explanations (SHAP) baseline for the model by using Amazon SageMaker Clarify. Step 2: Schedule an hourly model explainability monitor. Step 3: Check the analysis results on the SageMaker Studio console. When monitoring a deployed model for data drift and explainability, AWS prescribes a specific workflow using SageMaker Clarify and SageMaker Model Monitor: Create a SHAP baseline (Step 1)Before any monitoring can occur, SageMaker Clarify must establish a baseline explainability configuration. This baseline captures the reference SHAP values for feature importance using training or baseline data. Model Monitor uses this baseline to compare future inferences and detect drift in feature attributions. Schedule the model explainability monitor (Step 2)After the baseline is created, an explainability monitoring schedule must be configured (hourly in this case). The monitor periodically analyzes inference data, compares it against the SHAP baseline, and generates reports that highlight drift or anomalies in feature contributions. Inspect results in SageMaker Studio (Step 3)Once monitoring jobs run, SageMaker stores the analysis results in Amazon S3 and surfaces them in the SageMaker Studio console, where engineers can review metrics, violations, and visual reports. This sequence is mandatory because: A monitor cannot run without a baseline Results cannot be reviewed until the monitor executes"}, {"n": 226, "t": "single", "q": "A travel company has trained hundreds of geographic data models to answer customer questions by using Amazon SageMaker AI. Each model uses its own inferencing endpoint, which has become an operational challenge for the company. The company wants to consolidate the models' inferencing endpoints to reduce operational overhead. Which solution will meet these requirements?", "kq": "어떤 여행사가 Amazon SageMaker AI를 사용해 고객 질문에 답하기 위한 수백 개의 지리 데이터 모델을 학습시켰습니다. 각 모델이 자체 추론 엔드포인트를 사용하고 있어 회사에 운영상의 어려움이 되고 있습니다. 회사는 운영 부담을 줄이기 위해 모델들의 추론 엔드포인트를 통합하려고 합니다. 어떤 솔루션이 이러한 요구 사항을 충족할까요?", "o": [{"k": "A", "t": "Use SageMaker AI multi-model endpoints. Deploy a single endpoint.", "kt": "SageMaker AI 다중 모델 엔드포인트를 사용합니다. 단일 엔드포인트를 배포합니다."}, {"k": "B", "t": "Use SageMaker AI multi-container endpoints. Deploy a single endpoint.", "kt": "SageMaker AI 다중 컨테이너 엔드포인트를 사용합니다. 단일 엔드포인트를 배포합니다."}, {"k": "C", "t": "Use Amazon SageMaker Studio. Deploy a single-model endpoint.", "kt": "Amazon SageMaker Studio를 사용합니다. 단일 모델 엔드포인트를 배포합니다."}, {"k": "D", "t": "Use inference pipelines in SageMaker AI to combine tasks from hundreds of models to 15 models.", "kt": "SageMaker AI의 추론 파이프라인을 사용해 수백 개 모델의 작업을 15개 모델로 결합합니다."}], "a": ["A"], "ko": "AWS는 하나의 추론 엔드포인트 뒤에서 여러 개의 학습된 모델을 호스팅하기 위해 Amazon SageMaker Multi-Model Endpoints를 제공합니다. 이 기능은 요청 트래픽에 따라 모델을 동적으로 메모리에 로드하므로 엔드포인트 난립을 크게 줄이고 운영 부담을 낮춥니다. 다중 모델 엔드포인트는 지리적 또는 지역별 모델처럼 수백 또는 수천 개의 관련 모델이 있지만 동시에 모두 호출되지는 않는 경우에 적합합니다. AWS 문서에서도 이를 비용 최적화와 배포 관리 단순화를 위한 모범 사례로 설명합니다. 다중 컨테이너 엔드포인트는 소수의 모델을 연결하는 용도이며 수백 개 모델 통합에 적합하지 않습니다. 단일 모델 엔드포인트는 엔드포인트 통합 문제를 해결하지 못하고, inference pipeline은 모델링 전략을 변경하는 방식이므로 필요하지 않습니다. 따라서 단일 SageMaker 다중 모델 엔드포인트를 사용하는 것이 정답입니다.", "en": "AWS provides Amazon SageMaker Multi-Model Endpoints to host multiple trained models behind a single inference endpoint. This feature dynamically loads models into memory based on request traffic, significantly reducing endpoint sprawl and operational overhead. Multi-model endpoints are ideal when an organization has hundreds or thousands of related models, such as geographic or regional models, that are not all invoked simultaneously. AWS documentation highlights this approach as a best practice for cost optimization and simplified deployment management. Option B (multi-container endpoints) is intended for chaining a small number of models, not hundreds. Option C does not address endpoint consolidation. Option D changes the modeling strategy and is not required. Therefore, using a single SageMaker multi-model endpoint is the correct solution."}, {"n": 227, "t": "single", "q": "A healthcare company wants to detect irregularities in patient vital signs that could indicate early signs of a medical condition. The company has an unlabeled dataset that includes patient health records, medication history, and lifestyle changes. Which algorithm and hyperparameter should the company use to meet this requirement?", "kq": "어떤 헬스케어 회사가 질병의 초기 징후를 나타낼 수 있는 환자 활력 징후의 이상을 탐지하려고 합니다. 회사에는 환자 건강 기록, 투약 이력, 생활 습관 변화가 포함된 레이블 없는 데이터셋이 있습니다. 이 요구 사항을 충족하기 위해 회사가 사용해야 할 알고리즘과 하이퍼파라미터는 무엇입니까?", "o": [{"k": "A", "t": "Use the Amazon SageMaker AI XGBoost algorithm. Set max_depth to greater than 100 to regulate tree complexity.", "kt": "Amazon SageMaker AI XGBoost 알고리즘을 사용합니다. 트리 복잡도를 조절하기 위해 max_depth를 100보다 크게 설정합니다."}, {"k": "B", "t": "Use the Amazon SageMaker AI k-means clustering algorithm. Set k to determine the number of clusters.", "kt": "Amazon SageMaker AI k-means 클러스터링 알고리즘을 사용합니다. 클러스터 수를 결정하기 위해 k를 설정합니다."}, {"k": "C", "t": "Use the Amazon SageMaker AI DeepAR algorithm. Set epochs to the number of training iterations.", "kt": "Amazon SageMaker AI DeepAR 알고리즘을 사용합니다. epochs를 학습 반복 횟수로 설정합니다."}, {"k": "D", "t": "Use the Amazon SageMaker AI Random Cut Forest (RCF) algorithm. Set num_trees to greater than 100.", "kt": "Amazon SageMaker AI Random Cut Forest(RCF) 알고리즘을 사용합니다. num_trees를 100보다 크게 설정합니다."}], "a": ["D"], "ko": "D안이 정답입니다. Amazon SageMaker AI Random Cut Forest(RCF)는 데이터셋 내 이상 데이터 포인트를 탐지하기 위한 비지도 알고리즘으로 AWS 문서에 설명되어 있습니다. 이 문제는 환자 활력 징후의 불규칙성을 탐지하려는 의료 사용 사례이며, 레이블이 없는 데이터셋만 보유하고 있습니다. 이는 지도 분류나 회귀가 아니라 비지도 이상 탐지에 직접적으로 해당합니다. RCF는 각 데이터 포인트에 이상 점수를 부여하며, 점수가 높을수록 잠재적으로 이상한 레코드임을 나타냅니다. 이는 활력 징후, 약물 이력, 생활 습관 변화의 비정상 조합을 조기에 식별해야 하는 의료 경고 시나리오에 적합합니다. num_trees는 RCF의 유효한 하이퍼파라미터로, 포리스트에 사용할 트리 수를 제어합니다. XGBoost는 일반적으로 지도 학습 작업에 사용되고, k-means는 이상 점수 산출이 아닌 클러스터링용이며, DeepAR는 일반적인 다차원 비지도 이상 탐지가 아니라 시계열 예측용입니다. 따라서 AWS 네이티브 비지도 이상 탐지 알고리즘인 Random Cut Forest를 사용하는 D안이 정답입니다.", "en": "Option D is correct because Amazon SageMaker AI Random Cut Forest (RCF) is documented by AWS as an unsupervised algorithm for detecting anomalous data points within a data set. The question describes a healthcare use case where the company wants to detect irregularities in patient vital signs and only has an unlabeled dataset. That is a direct match for anomaly detection with an unsupervised method rather than a supervised classification or regression algorithm. AWS documentation also notes that anomalies can appear as unexpected spikes, breaks in patterns, or otherwise unusual observations. RCF is a strong fit because it does not require labeled target outcomes to begin identifying unusual observations. AWS explains that RCF assigns an anomaly score to each data point, where higher scores indicate potentially anomalous records. This is especially suitable for early warning scenarios in healthcare, where the goal is to surface unusual combinations of vitals, medication history, and lifestyle changes for further review. The hyperparameter in the answer, num_trees, is a valid RCF hyperparameter and controls the number of trees used in the forest. In AWS examples and documentation, this is one of the key parameters used when configuring the algorithm. By contrast, XGBoost is generally used for supervised tasks, k-means is for clustering rather than anomaly scoring, and DeepAR is for forecasting time series rather than general anomaly detection across an unlabeled multidimensional dataset. Therefore, the fully verified AWS-docs answer is D, because Random Cut Forest is the AWS-native unsupervised anomaly detection algorithm best aligned to this healthcare irregularity-detection requirement."}, {"n": 228, "t": "single", "q": "Case Study A company is building a web-based AI application by using Amazon SageMaker. The application will provide the following capabilities and features: ML experimentation, training, a central model registry, model deployment, and model monitoring. The application must ensure secure and isolated use of training data during the ML lifecycle. The training data is stored in Amazon S3. The company needs to use the central model registry to manage different versions of models in the application. Which action will meet this requirement with the LEAST operational overhead?", "kq": "[사례 연구] 어떤 회사가 Amazon SageMaker를 사용해 웹 기반 AI 애플리케이션을 만들고 있습니다. 이 애플리케이션은 ML 실험, 학습, 중앙 모델 레지스트리, 모델 배포, 모델 모니터링 기능을 제공할 예정입니다. 애플리케이션은 ML 수명 주기 동안 학습 데이터를 안전하고 격리된 방식으로 사용해야 합니다. 학습 데이터는 Amazon S3에 저장되어 있습니다. 회사는 애플리케이션의 여러 모델 버전을 관리하기 위해 중앙 모델 레지스트리를 사용해야 합니다. 어떤 조치가 최소한의 운영 오버헤드로 이 요구 사항을 충족할까요?", "o": [{"k": "A", "t": "Create a separate Amazon Elastic Container Registry (Amazon ECR) repository for each model.", "kt": "각 모델마다 별도의 Amazon ECR 리포지토리를 만듭니다."}, {"k": "B", "t": "Use Amazon Elastic Container Registry (Amazon ECR) and unique tags for each model version.", "kt": "Amazon ECR과 각 모델 버전에 대한 고유한 태그를 사용합니다."}, {"k": "C", "t": "Use the SageMaker Model Registry and model groups to catalog the models.", "kt": "SageMaker Model Registry와 모델 그룹을 사용해 모델을 카탈로그화합니다."}, {"k": "D", "t": "Use the SageMaker Model Registry and unique tags for each model version.", "kt": "SageMaker Model Registry와 각 모델 버전에 대한 고유한 태그를 사용합니다."}], "a": ["C"], "ko": "Amazon SageMaker Model Registry는 머신러닝 모델의 전체 수명주기를 관리하도록 설계된 기능입니다. 이 기능은 모델을 체계적으로 카탈로그화하고, 버전을 관리하며, 배포할 수 있게 하여 효율적인 모델 거버넌스와 관리를 지원합니다. 주요 기능으로는 모델을 Model Group으로 구성하고 각 그룹에 여러 버전을 포함하는 중앙 카탈로그화, 모델 반복 이력을 유지하는 버전 관리, 학습 지표와 성능 평가 같은 메타데이터 연결, PendingManualApproval 또는 Approved와 같은 승인 상태 관리, SageMaker 배포 기능과의 직접 통합이 있습니다. 구현 단계는 관련 모델을 Model Group으로 정리하고, 각 모델 반복을 해당 그룹의 버전으로 등록하며, 배포 전 승인 상태를 지정하고, 승인된 모델을 SageMaker 엔드포인트로 배포하는 방식입니다. 이를 통해 회사는 모델을 중앙에서 관리하고, 버전 제어를 수행하며, 최소한의 운영 부담으로 효율적인 배포 워크플로를 구축할 수 있습니다. 따라서 SageMaker Model Registry와 model groups를 사용하는 C안이 정답입니다.", "en": "Amazon SageMaker Model Registry is a feature designed to manage machine learning (ML) models throughout their lifecycle. It allows users to catalog, version, and deploy models systematically, ensuring efficient model governance and management. Key Features of SageMaker Model Registry: Centralized Cataloging: Organizes models into Model Groups, each containing multiple versions. Version Control: Maintains a history of model iterations, making it easier to track changes. Metadata Association: Attach metadata such as training metrics and performance evaluations to models. Approval Status Management: Allows setting statuses like PendingManualApproval or Approved to ensure only vetted models are deployed. Seamless Deployment: Direct integration with SageMaker deployment capabilities for real-time inference or batch processing. Implementation Steps: Create a Model Group: Organize related models into groups to simplify management and versioning. Register Model Versions: Each model iteration is registered as a version within a specific Model Group. Set Approval Status: Assign approval statuses to models before deploying them to ensure quality control. Deploy the Model: Use SageMaker endpoints for deployment once the model is approved. Benefits: Centralized Management: Provides a unified platform to manage models efficiently. Streamlined Deployment: Facilitates smooth transitions from development to production. Governance and Compliance: Supports metadata association and approval processes. By leveraging the SageMaker Model Registry, the company can ensure organized management of models, version control, and efficient deployment workflows with minimal operational overhead. AWS Documentation: SageMaker Model Registry AWS Blog: Model Registry Features and Usage"}, {"n": 229, "t": "single", "q": "A hospital is using an ML model to validate x-ray results. The hospital runs a nightly batch inference job. The hospital needs to produce a daily report about model data quality and model performance. Which solution will meet these requirements?", "kq": "어떤 병원이 X선 판독 결과를 검증하기 위해 ML 모델을 사용하고 있습니다. 병원은 야간에 배치 추론 작업을 실행합니다. 병원은 모델 데이터 품질과 모델 성능에 관한 일일 보고서를 생성해야 합니다. 어떤 솔루션이 이러한 요구 사항을 충족할까요?", "o": [{"k": "A", "t": "Schedule a monitoring job in Amazon SageMaker Model Monitor. Generate the monitoring results for the model and data.", "kt": "Amazon SageMaker Model Monitor에서 모니터링 작업을 예약합니다. 모델과 데이터에 대한 모니터링 결과를 생성합니다."}, {"k": "B", "t": "Create an Amazon CloudWatch dashboard that includes the metrics for processing steps in the nightly batch inference job. Compare the baseline resource metrics. Share the dashboard link.", "kt": "야간 배치 추론 작업의 처리 단계 지표를 포함하는 Amazon CloudWatch 대시보드를 만듭니다. 기준 리소스 지표와 비교합니다. 대시보드 링크를 공유합니다."}, {"k": "C", "t": "Use AWS Glue DataBrew to create a custom recipe job that uses the Numerical Statistics data quality check for the model file. Generate the results.", "kt": "AWS Glue DataBrew로 모델 파일에 대해 Numerical Statistics 데이터 품질 검사를 사용하는 사용자 지정 레시피 작업을 만듭니다. 결과를 생성합니다."}, {"k": "D", "t": "Create a SageMaker AI pipeline that includes a QualityCheck step to run monitoring jobs. Generate the monitoring results for the model and the data.", "kt": "모니터링 작업을 실행하는 QualityCheck 단계가 포함된 SageMaker AI 파이프라인을 만듭니다. 모델과 데이터에 대한 모니터링 결과를 생성합니다."}], "a": ["A"], "ko": "A안이 정답입니다. Amazon SageMaker Model Monitor는 프로덕션 ML 모델의 데이터 품질과 모델 품질을 모니터링하기 위해 설계된 AWS 서비스입니다. AWS 문서에 따르면 Model Monitor는 정기적으로 실행되는 배치 변환 작업과 함께 지속적인 모니터링을 지원하며, 비동기 배치 변환 작업에 대한 예약 모니터링도 지원합니다. 이는 병원이 매일 밤 배치 추론 작업을 실행하고 입력 데이터와 모델 예측 성능에 대한 일일 보고서를 필요로 하는 시나리오와 직접적으로 일치합니다. 데이터 품질 모니터링은 DefaultModelMonitor와 BatchTransformInput을 사용해 배치 변환 작업에 대해 예약할 수 있고, 모델 품질 모니터링은 ModelQualityMonitor를 사용해 Amazon S3에 저장된 실제 정답 레이블과 예측값을 비교할 수 있습니다. CloudWatch 대시보드는 운영 및 리소스 지표를 보여줄 수 있지만 ML 특화 데이터 품질 및 모델 품질 보고서를 제공하지 않습니다. Glue DataBrew는 데이터 준비 및 프로파일링용이지 모델 성능 모니터링용이 아닙니다. SageMaker Pipelines의 QualityCheck 단계도 가능해 보일 수 있으나, 프로덕션 배치 추론 워크로드의 예약 모니터링에는 Model Monitor가 AWS 문서상 기본 솔루션입니다.", "en": "Option A is correct because Amazon SageMaker Model Monitor is the AWS service specifically built to monitor data quality and model quality for ML models in production. AWS documentation states that Model Monitor supports continuous monitoring with a batch transform job that runs regularly and also supports on- schedule monitoring for asynchronous batch transform jobs. That aligns directly with the scenario of a hospital running a nightly batch inference job and needing a daily report on both the incoming data and the model's predictive performance. AWS documentation also separates the two monitoring needs very clearly. Data quality monitoring can be scheduled for batch transform jobs by using DefaultModelMonitor with a BatchTransformInput. Model quality monitoring can also be scheduled for batch transform jobs by using ModelQualityMonitor, which compares predictions against actual ground-truth labels stored in Amazon S3. Since the question explicitly asks for both model data quality and model performance, SageMaker Model Monitor is the documented feature that covers both requirements together. Option B is not sufficient because CloudWatch dashboards show operational and resource metrics, not the full ML-specific data quality and model quality reports required here. Option C is incorrect because AWS Glue DataBrew is for data preparation and profiling, not model performance monitoring. Option D is partially plausible because SageMaker Pipelines integrates with QualityCheck steps and can run monitoring jobs on demand, but the AWS docs position Model Monitor as the native solution for scheduled monitoring of production batch inference workloads. Therefore, the best AWS-documented answer is A."}, {"n": 230, "t": "single", "q": "A company runs its ML workflows on an on-premises Kubernetes cluster. The ML workflows include ML services that perform training and inferences for ML models. Each ML service runs from its own standalone Docker image. The company needs to perform a lift and shift from the on-premises Kubernetes cluster to an Amazon Elastic Kubernetes Service (Amazon EKS) cluster. Which solution will meet this requirement with the LEAST operational overhead?", "kq": "어떤 회사가 온프레미스 Kubernetes 클러스터에서 ML 워크플로를 실행합니다. 이 ML 워크플로에는 ML 모델의 학습과 추론을 수행하는 ML 서비스들이 포함됩니다. 각 ML 서비스는 자체 독립 Docker 이미지에서 실행됩니다. 회사는 온프레미스 Kubernetes 클러스터를 Amazon EKS 클러스터로 리프트 앤 시프트해야 합니다. 어떤 솔루션이 최소한의 운영 오버헤드로 이 요구 사항을 충족할까요?", "o": [{"k": "A", "t": "Redesign the ML services to be configured in Kubeflow. Deploy the new Kubeflow managed ML services to the EKS cluster.", "kt": "ML 서비스를 Kubeflow에서 구성되도록 재설계합니다. 새로운 Kubeflow 관리형 ML 서비스를 EKS 클러스터에 배포합니다."}, {"k": "B", "t": "Upload the Docker images to an Amazon Elastic Container Registry (Amazon ECR) repository. Configure a deployment pipeline to deploy the images to the EKS cluster.", "kt": "Docker 이미지를 Amazon ECR 리포지토리에 업로드합니다. 이미지를 EKS 클러스터에 배포하는 배포 파이프라인을 구성합니다."}, {"k": "C", "t": "Migrate the training data to an Amazon Redshift cluster. Retrain the models from the migrated training data by using Amazon Redshift ML. Deploy the retrained models to the EKS cluster.", "kt": "학습 데이터를 Amazon Redshift 클러스터로 마이그레이션합니다. Amazon Redshift ML로 마이그레이션된 학습 데이터에서 모델을 재학습시킵니다. 재학습된 모델을 EKS 클러스터에 배포합니다."}, {"k": "D", "t": "Configure an Amazon SageMaker AI notebook. Retrain the models with the same code. Deploy the retrained models to the EKS cluster.", "kt": "Amazon SageMaker AI 노트북을 구성합니다. 동일한 코드로 모델을 재학습시킵니다. 재학습된 모델을 EKS 클러스터에 배포합니다."}], "a": ["B"], "ko": "리프트 앤 시프트 마이그레이션은 아키텍처 변경을 최소화해야 합니다. 회사는 이미 Kubernetes와 독립 실행형 Docker 이미지를 사용하고 있으며, 이는 Amazon Elastic Kubernetes Service와 호환됩니다. 운영 부담이 가장 낮은 방식은 기존 Docker 이미지를 Amazon Elastic Container Registry에 업로드한 뒤 표준 Kubernetes 매니페스트나 Helm 차트를 사용해 EKS 클러스터에 직접 배포하는 것입니다. 이 방식은 기존 ML 워크플로, 학습 로직, 추론 서비스를 리팩터링 없이 유지합니다. Kubeflow로 서비스를 재설계하는 A안은 복잡성을 크게 증가시키고, C안은 데이터 저장소와 학습 방식을 모두 변경합니다. D안은 모델 재학습과 운영 워크플로 변경이 필요합니다. 따라서 Docker 이미지를 ECR에 업로드하고 EKS에 배포하는 B안이 올바른 리프트 앤 시프트 솔루션입니다.", "en": "A lift-and-shift migration requires minimal architectural changes. The company already uses Kubernetes and standalone Docker images, which are fully compatible with Amazon Elastic Kubernetes Service. The lowest-overhead approach is to push the existing Docker images to Amazon Elastic Container Registry and deploy them directly to the EKS cluster using standard Kubernetes manifests or Helm charts. This approach preserves the existing ML workflows, training logic, and inference services without refactoring. Option A requires redesigning services with Kubeflow, significantly increasing complexity. Option C changes both data storage and training methodology. Option D requires retraining models and changing operational workflows. Therefore, uploading Docker images to Amazon ECR and deploying them to EKS is the correct lift-and- shift solution."}, {"n": 231, "t": "single", "q": "A company is planning to use Amazon Redshift ML in its primary AWS account. The source data is in an Amazon S3 bucket in a secondary account. An ML engineer needs to set up an ML pipeline in the primary account to access the S3 bucket in the secondary account. The solution must not require public IPv4 addresses. Which solution will meet these requirements?", "kq": "어떤 회사가 주 AWS 계정에서 Amazon Redshift ML을 사용할 계획입니다. 원천 데이터는 보조 계정의 Amazon S3 버킷에 있습니다. ML 엔지니어는 주 계정에서 보조 계정의 S3 버킷에 접근할 수 있도록 ML 파이프라인을 구성해야 합니다. 솔루션은 퍼블릭 IPv4 주소를 필요로 하지 않아야 합니다. 어떤 솔루션이 이러한 요구 사항을 충족할까요?", "o": [{"k": "A", "t": "Provision a Redshift cluster and Amazon SageMaker Studio in a VPC with no public access enabled in the primary account. Create a VPC peering connection between the accounts. Update the VPC route tables to remove the route to 0.0.0.0/0.", "kt": "주 계정에서 퍼블릭 접근이 비활성화된 VPC에 Redshift 클러스터와 Amazon SageMaker Studio를 프로비저닝합니다. 두 계정 사이에 VPC 피어링 연결을 만듭니다. VPC 라우팅 테이블에서 0.0.0.0/0 경로를 제거합니다."}, {"k": "B", "t": "Provision a Redshift cluster and Amazon SageMaker Studio in a VPC with no public access enabled in the primary account. Create an AWS Direct Connect connection and a transit gateway. Associate the VPCs from both accounts with the transit gateway. Update the VPC route tables to remove the route to 0.0.0.0/0.", "kt": "주 계정에서 퍼블릭 접근이 비활성화된 VPC에 Redshift 클러스터와 Amazon SageMaker Studio를 프로비저닝합니다. AWS Direct Connect 연결과 전송 게이트웨이를 만듭니다. 두 계정의 VPC를 전송 게이트웨이에 연결합니다. VPC 라우팅 테이블에서 0.0.0.0/0 경로를 제거합니다."}, {"k": "C", "t": "Provision a Redshift cluster and Amazon SageMaker Studio in a VPC in the primary account. Create an AWS Site-to-Site VPN connection with two encrypted IPsec tunnels between the accounts. Set up interface VPC endpoints for Amazon S3.", "kt": "주 계정의 VPC에 Redshift 클러스터와 Amazon SageMaker Studio를 프로비저닝합니다. 두 계정 사이에 암호화된 IPsec 터널 2개가 있는 AWS Site-to-Site VPN 연결을 만듭니다. Amazon S3용 인터페이스 VPC 엔드포인트를 설정합니다."}, {"k": "D", "t": "Provision a Redshift cluster and Amazon SageMaker Studio in a VPC in the primary account. Create an S3 gateway endpoint. Update the S3 bucket policy to allow IAM principals from the primary account.Set up interface VPC endpoints for SageMaker and Amazon Redshift.", "kt": "주 계정의 VPC에 Redshift 클러스터와 Amazon SageMaker Studio를 프로비저닝합니다. S3 게이트웨이 엔드포인트를 만듭니다. 주 계정의 IAM 주체를 허용하도록 S3 버킷 정책을 업데이트합니다. SageMaker와 Amazon Redshift용 인터페이스 VPC 엔드포인트를 설정합니다."}], "a": ["D"], "ko": "S3 Gateway Endpoint는 퍼블릭 IPv4 주소 없이 VPC 내부에서 Amazon S3에 비공개로 접근할 수 있게 합니다. 이를 통해 기본 계정과 보조 계정 간 데이터 전송을 안전하고 비공개로 처리할 수 있습니다. 보조 계정의 S3 버킷 정책은 기본 계정의 IAM 주체가 접근할 수 있도록 명시적으로 허용해야 합니다. 또한 SageMaker와 Amazon Redshift에 대한 인터페이스 VPC 엔드포인트를 구성하면 VPC와 해당 AWS 서비스 간 통신도 퍼블릭 인터넷 없이 비공개로 이루어집니다. 따라서 S3 Gateway Endpoint, S3 버킷 정책 업데이트, SageMaker 및 Redshift 인터페이스 VPC 엔드포인트를 함께 구성하는 D안이 퍼블릭 IPv4 주소 없이 안전한 계정 간 접근 요구 사항을 충족합니다.", "en": "S3 Gateway Endpoint: Allows private access to S3 from within a VPC without requiring a public IPv4 address, ensuring that data transfer between the primary and secondary accounts is secure and private. Bucket Policy Update: The S3 bucket policy in the secondary account must explicitly allow access from the primary account's IAM principals to provide the necessary permissions. Interface VPC Endpoints: Required for private communication between the VPC and Amazon SageMaker and Amazon Redshift services, ensuring the solution operates without public internet access. This configuration meets the requirement to avoid public IPv4 addresses and allows secure and private communication between the accounts."}, {"n": 232, "t": "single", "q": "A company is developing an ML model by using Amazon SageMaker AI. The company must monitor bias in the model and display the results on a dashboard. An ML engineer creates a bias monitoring job. How should the ML engineer capture bias metrics to display on the dashboard?", "kq": "어떤 회사가 Amazon SageMaker AI를 사용해 ML 모델을 개발하고 있습니다. 회사는 모델의 편향을 모니터링하고 결과를 대시보드에 표시해야 합니다. ML 엔지니어가 편향 모니터링 작업을 만들었습니다. 대시보드에 표시할 편향 지표를 어떻게 수집해야 합니까?", "o": [{"k": "A", "t": "Capture AWS CloudTrail metrics from SageMaker Clarify.", "kt": "SageMaker Clarify에서 AWS CloudTrail 지표를 수집합니다."}, {"k": "B", "t": "Capture Amazon CloudWatch metrics from SageMaker Clarify.", "kt": "SageMaker Clarify에서 Amazon CloudWatch 지표를 수집합니다."}, {"k": "C", "t": "Capture SageMaker Model Monitor metrics from Amazon EventBridge.", "kt": "Amazon EventBridge에서 SageMaker Model Monitor 지표를 수집합니다."}, {"k": "D", "t": "Capture SageMaker Model Monitor metrics from Amazon SNS.", "kt": "Amazon SNS에서 SageMaker Model Monitor 지표를 수집합니다."}], "a": ["B"], "ko": "Amazon SageMaker Clarify는 ML 모델의 편향과 공정성 지표를 탐지하고 정량화하는 AWS 서비스입니다. 편향 모니터링 작업이 실행되면 Clarify는 편향 지표를 Amazon CloudWatch로 직접 게시합니다. CloudWatch 지표는 CloudWatch 대시보드에서 시각화하거나 다른 모니터링 도구와 통합할 수 있어 실시간 또는 주기적인 편향 보고에 적합합니다. CloudTrail은 API 활동 로그를 기록할 뿐 ML 지표를 수집하지 않습니다. EventBridge와 SNS는 이벤트 라우팅 및 알림용 서비스이지 지표 시각화의 원천이 아닙니다. AWS 문서에서도 Clarify 편향 지표가 Amazon CloudWatch로 내보내진다고 명시하므로, 대시보드에 표시할 지표 출처로는 CloudWatch가 올바릅니다.", "en": "Amazon SageMaker Clarify is the AWS service used to detect and quantify bias and fairness metrics in ML models. When bias monitoring jobs run, Clarify publishes bias metrics directly to Amazon CloudWatch. CloudWatch metrics can be visualized using CloudWatch dashboards or integrated into other monitoring tools, making them ideal for real-time or periodic bias reporting. CloudTrail logs API activity and does not capture ML metrics. EventBridge and SNS are used for event routing and notifications, not metric visualization. AWS documentation explicitly states that Clarify bias metrics are emitted to Amazon CloudWatch, which is the correct source for dashboards. Therefore, Option B is the correct and AWS-verified answer."}, {"n": 233, "t": "single", "q": "A company has an ML model that needs to run one time each night to predict stock values. The model input is 3 MB of data that is collected during the current day. The model produces the predictions for the next day. The prediction process takes less than 1 minute to finish running. How should the company deploy the model on Amazon SageMaker to meet these requirements?", "kq": "어떤 회사에 주식 가치를 예측하기 위해 매일 밤 한 번 실행되어야 하는 ML 모델이 있습니다. 모델 입력은 당일 수집된 3MB의 데이터입니다. 모델은 다음 날에 대한 예측을 생성합니다. 예측 프로세스는 완료까지 1분 미만이 걸립니다. 요구 사항을 충족하려면 Amazon SageMaker에 모델을 어떻게 배포해야 합니까?", "o": [{"k": "A", "t": "Use a multi-model serverless endpoint. Enable caching.", "kt": "다중 모델 서버리스 엔드포인트를 사용합니다. 캐싱을 활성화합니다."}, {"k": "B", "t": "Use an asynchronous inference endpoint. Set the InitialInstanceCount parameter to 0.", "kt": "비동기 추론 엔드포인트를 사용합니다. InitialInstanceCount 파라미터를 0으로 설정합니다."}, {"k": "C", "t": "Use a real-time endpoint. Configure an auto scaling policy to scale the model to 0 when the model is not in use.", "kt": "실시간 엔드포인트를 사용합니다. 모델을 사용하지 않을 때 0으로 축소하는 Auto Scaling 정책을 구성합니다."}, {"k": "D", "t": "Use a serverless inference endpoint. Set the MaxConcurrency parameter to 1.", "kt": "서버리스 추론 엔드포인트를 사용합니다. MaxConcurrency 파라미터를 1로 설정합니다."}], "a": ["D"], "ko": "Amazon SageMaker의 서버리스 추론 엔드포인트는 모델 호출 빈도가 낮은 사용 사례에 적합합니다. 이 문제처럼 하루에 한 번 밤에만 실행되는 작업은 상시 실행 인스턴스를 유지할 필요가 없으므로, 서버리스 추론을 사용하면 모델을 사용하지 않는 시간의 유휴 리소스 비용을 제거할 수 있습니다. MaxConcurrency 값을 1로 설정하면 필요한 단일 야간 호출을 지원하면서 비용 효율성을 유지할 수 있습니다. 입력 데이터 크기가 3MB이고 처리 시간이 1분 미만이므로 서버리스 추론의 사용 조건에도 적합합니다. 따라서 서버리스 추론 엔드포인트를 사용하고 MaxConcurrency를 1로 설정하는 D안이 가장 적절합니다.", "en": "A serverless inference endpoint in Amazon SageMaker is ideal for use cases where the model is invoked infrequently, such as running one time each night. It eliminates the cost of idle resources when the model is not in use. Setting the MaxConcurrency parameter to 1 ensures cost-efficiency while supporting the required single nightly invocation. This solution minimizes costs and matches the requirement to process a small amount of data quickly."}, {"n": 234, "t": "single", "q": "A recommendation model uses ML and calls an Amazon SageMaker AI endpoint to get recommendations. An ML engineer must ensure that the model stays available during an expected increase in user traffic. Which solution will meet these requirements?", "kq": "어떤 추천 모델이 ML을 사용하며 추천을 얻기 위해 Amazon SageMaker AI 엔드포인트를 호출합니다. ML 엔지니어는 사용자 트래픽 증가가 예상되는 동안 모델이 계속 가용 상태를 유지하도록 해야 합니다. 어떤 솔루션이 이러한 요구 사항을 충족할까요?", "o": [{"k": "A", "t": "Configure auto scaling on the SageMaker AI endpoint.", "kt": "SageMaker AI 엔드포인트에 Auto Scaling을 구성합니다."}, {"k": "B", "t": "Create a new SageMaker AI endpoint. Deploy the model to the new endpoint.", "kt": "새 SageMaker AI 엔드포인트를 만듭니다. 새 엔드포인트에 모델을 배포합니다."}, {"k": "C", "t": "Use SageMaker Neo to optimize the model for inference.", "kt": "SageMaker Neo를 사용해 추론을 위해 모델을 최적화합니다."}, {"k": "D", "t": "Attach an Auto Scaling group to the SageMaker AI endpoint.", "kt": "SageMaker AI 엔드포인트에 Auto Scaling 그룹을 연결합니다."}], "a": ["A"], "ko": "Amazon SageMaker AI는 호스팅된 모델에 대해 자동 확장을 지원하며, 워크로드 변화에 따라 모델에 프로비저닝된 인스턴스 수를 동적으로 조정할 수 있습니다. 사용자 트래픽이 증가하면 자동 확장이 추가 인스턴스를 기동하여 처리 용량을 확보하고, 트래픽이 감소하면 불필요한 용량을 줄입니다. 이는 추천 엔드포인트가 예상되는 트래픽 증가 중에도 가용성을 유지해야 한다는 요구 사항과 직접적으로 일치합니다. SageMaker는 Application Auto Scaling과 통합되어 대상 추적, 단계 조정, 예약 조정 정책을 사용할 수 있습니다. 새 엔드포인트를 생성하는 방식은 트래픽 변동을 자동으로 처리하지 못하고 운영 복잡성을 높입니다. SageMaker Neo는 추론 성능 최적화 도구이지만 탄력적 용량 관리를 제공하지 않습니다. 또한 SageMaker 엔드포인트에는 EC2 Auto Scaling 그룹을 직접 연결하지 않습니다. 따라서 SageMaker AI 엔드포인트에 자동 확장을 구성하는 A안이 정답입니다.", "en": "Option A is correct because Amazon SageMaker AI supports automatic scaling for hosted models, and AWS documentation states that auto scaling dynamically adjusts the number of instances provisioned for a model in response to workload changes. When traffic increases, auto scaling brings more instances online; when traffic decreases, it removes unneeded capacity. This directly matches the requirement to keep the recommendation endpoint available during an expected increase in user traffic. AWS also documents that SageMaker integrates with Application Auto Scaling, and you can scale SageMaker endpoint variants by using target tracking, step scaling, and scheduled scaling policies. That means the service is purpose-built for this scenario: maintaining availability and capacity as inference demand changes over time. Since the model is already being served from a SageMaker endpoint, the most direct and AWS-recommended solution is to configure endpoint auto scaling rather than redesigning the deployment. The other options do not address the requirement as effectively. Creating a new endpoint does not automatically handle fluctuating traffic and adds unnecessary operational complexity. SageMaker Neo optimizes models for inference performance on supported hardware, but it does not provide elastic capacity management. Attaching an Auto Scaling group to a SageMaker endpoint is incorrect because SageMaker endpoints do not use EC2 Auto Scaling groups directly; scaling is handled through SageMaker's integration with Application Auto Scaling. Therefore, to maintain availability during traffic spikes, the best AWS- documented answer is A: configure auto scaling on the SageMaker AI endpoint."}, {"n": 235, "t": "single", "q": "A company is using ML to predict the presence of a specific weed in a farmer's field. The company is using the Amazon SageMaker linear learner built-in algorithm with a value of multiclass_classifier for the predictor_type hyperparameter. What should the company do to MINIMIZE false positives?", "kq": "어떤 회사가 농부의 밭에서 특정 잡초의 존재를 예측하기 위해 ML을 사용하고 있습니다. 회사는 Amazon SageMaker linear learner 내장 알고리즘을 사용하며 predictor_type 하이퍼파라미터 값으로 multiclass_classifier를 지정했습니다. 거짓 양성(false positive)을 최소화하려면 어떻게 해야 합니까?", "o": [{"k": "A", "t": "Set the value of the weight decay hyperparameter to zero.", "kt": "weight decay 하이퍼파라미터 값을 0으로 설정합니다."}, {"k": "B", "t": "Increase the number of training epochs.", "kt": "학습 에포크 수를 늘립니다."}, {"k": "C", "t": "Increase the value of the target_precision hyperparameter.", "kt": "target_precision 하이퍼파라미터 값을 높입니다."}, {"k": "D", "t": "Change the value of the predictor_type hyperparameter to regressor.", "kt": "predictor_type 하이퍼파라미터 값을 regressor로 변경합니다."}], "a": ["C"], "ko": "Amazon SageMaker Linear Learner의 target_precision 하이퍼파라미터는 모델의 정밀도와 재현율 간의 균형을 조정하는 데 사용됩니다. target_precision 값을 높이면 모델이 양성으로 예측할 때 더 신중해지므로 거짓 양성을 줄이는 데 도움이 됩니다. 특정 잡초가 있다고 잘못 판단하는 false positive를 최소화해야 하는 상황에서는 정밀도를 높이는 방향이 적절합니다. weight decay를 0으로 설정하거나 학습 epoch 수를 늘리는 것은 false positive 최소화와 직접적으로 연결되지 않으며, predictor_type을 regressor로 변경하는 것은 분류 문제에 맞지 않습니다. 따라서 target_precision 값을 높이는 C안이 정답입니다.", "en": "The target_precision hyperparameter in the Amazon SageMaker linear learner controls the trade-off between precision and recall for the model. Increasing the target_precision prioritizes minimizing false positives by making the model more cautious in its predictions. This approach is effective for use cases where false positives have higher consequences than false negatives."}, {"n": 236, "t": "single", "q": "Case study An ML engineer is developing a fraud detection model on AWS. The training dataset includes transaction logs, customer profiles, and tables from an on-premises MySQL database. The transaction logs and customer profiles are stored in Amazon S3. The dataset has a class imbalance that affects the learning of the model's algorithm. Additionally, many of the features have interdependencies. The algorithm is not capturing all the desired underlying patterns in the data. The ML engineer needs to use an Amazon SageMaker built-in algorithm to train the model. Which algorithm should the ML engineer use to meet this requirement?", "kq": "[사례 연구] ML 엔지니어가 AWS에서 사기 탐지 모델을 개발하고 있습니다. 학습 데이터셋에는 거래 로그, 고객 프로필, 그리고 온프레미스 MySQL 데이터베이스의 테이블들이 포함됩니다. 거래 로그와 고객 프로필은 Amazon S3에 저장되어 있습니다. 데이터셋에는 모델 알고리즘의 학습에 영향을 주는 클래스 불균형이 있습니다. 또한 많은 특성들이 서로 종속되어 있습니다. 알고리즘이 데이터에 내재된 패턴을 모두 포착하지 못하고 있습니다. ML 엔지니어는 모델을 학습시키기 위해 Amazon SageMaker 내장 알고리즘을 사용해야 합니다. 이 요구 사항을 충족하려면 어떤 알고리즘을 사용해야 합니까?", "o": [{"k": "A", "t": "LightGBM", "kt": "LightGBM"}, {"k": "B", "t": "Linear learner", "kt": "Linear learner"}, {"k": "C", "t": "k-means clustering", "kt": "k-means 클러스터링"}, {"k": "D", "t": "Neural Topic Model (NTM)", "kt": "Neural Topic Model (NTM)"}], "a": ["B"], "ko": "SageMaker의 Linear Learner 알고리즘은 사기 탐지와 같은 이진 분류 문제에 적합합니다. 이 알고리즘은 클래스 간 가중치 균형을 설정할 수 있어 클래스 불균형을 효과적으로 처리할 수 있으며, 계산 효율성도 높습니다. 주요 특징으로는 소수 클래스와 다수 클래스에 대한 가중치 조정, 분류 및 회귀 작업 지원, 경사 최적화를 통한 특성 간 관계 학습 등이 있습니다. 구현 시에는 SageMaker Python SDK로 Linear Learner 학습 작업을 구성하고, 클래스 가중치 균형을 활성화하는 하이퍼파라미터를 설정한 뒤, SageMaker Data Wrangler 등을 통해 준비된 균형 데이터셋으로 모델을 학습하면 됩니다. 따라서 이 요구 사항에는 Linear Learner를 사용하는 B안이 가장 적절합니다.", "en": "Why Linear Learner? SageMaker's Linear Learner algorithm is well-suited for binary classification problems such as fraud detection. It handles class imbalance effectively by incorporating built-in options for weight balancing across classes. Linear Learner can capture patterns in the data while being computationally efficient. Key Features of Linear Learner: Automatically weights minority and majority classes. Supports both classification and regression tasks. Handles interdependencies among features effectively through gradient optimization. Steps to Implement: Use the SageMaker Python SDK to set up a training job with the Linear Learner algorithm. Configure the hyperparameters to enable balanced class weights. Train the model with the balanced dataset created using SageMaker Data Wrangler."}, {"n": 238, "t": "single", "q": "A company runs an ML model on Amazon SageMaker AI. The company uses an automatic process that makes API calls to create training jobs for the model. The company has new compliance rules that prohibit the collection of aggregated metadata from training jobs. Which solution will prevent SageMaker AI from collecting metadata from the training jobs?", "kq": "어떤 회사가 Amazon SageMaker AI에서 ML 모델을 실행합니다. 회사는 모델의 학습 작업을 생성하기 위해 API 호출을 수행하는 자동화 프로세스를 사용합니다. 회사에 학습 작업에서 집계된 메타데이터 수집을 금지하는 새로운 컴플라이언스 규정이 생겼습니다. SageMaker AI가 학습 작업에서 메타데이터를 수집하지 못하게 하는 방법은 무엇입니까?", "o": [{"k": "A", "t": "Opt out of metadata tracking for any training job that is submitted.", "kt": "제출되는 모든 학습 작업에 대해 메타데이터 추적을 옵트아웃합니다."}, {"k": "B", "t": "Ensure that training jobs are running in a private subnet in a custom VPC.", "kt": "학습 작업이 사용자 지정 VPC의 프라이빗 서브넷에서 실행되도록 합니다."}, {"k": "C", "t": "Encrypt the training data with an AWS Key Management Service (AWS KMS) customer managed key.", "kt": "AWS KMS 고객 관리형 키로 학습 데이터를 암호화합니다."}, {"k": "D", "t": "Reconfigure the training jobs to use only AWS Nitro instances.", "kt": "학습 작업이 AWS Nitro 인스턴스만 사용하도록 재구성합니다."}], "a": ["A"], "ko": "Amazon SageMaker AI는 학습 작업의 신뢰성, 성능, 운영 인사이트 개선을 위해 학습 작업에서 집계된 메타데이터를 자동으로 수집할 수 있습니다. 이 메타데이터에는 알고리즘 사용 정보, 인스턴스 유형, 리소스 사용률, 작업 구성 정보 등이 포함될 수 있습니다. 그러나 AWS 문서에서는 규제 또는 컴플라이언스 요구 사항을 충족하기 위해 SageMaker 메타데이터 수집을 옵트아웃할 수 있다고 설명합니다. 학습 작업을 제출할 때 콘솔, AWS CLI 또는 SDK를 통해 메타데이터 추적을 명시적으로 옵트아웃하면 해당 작업에 대한 집계 메타데이터 수집이 중지됩니다. 프라이빗 서브넷에서 실행하는 것은 네트워크 격리를 제어할 뿐 서비스 수준 메타데이터 수집을 막지 못합니다. KMS 키로 학습 데이터를 암호화하는 것은 저장 및 전송 중 데이터를 보호하지만 학습 작업의 운영 메타데이터 수집을 방지하지 않습니다. Nitro 인스턴스 사용도 인프라 보안과 성능 격리를 제공할 뿐 SageMaker의 메타데이터 수집 방식에는 영향을 주지 않습니다. 따라서 학습 작업별로 메타데이터 추적을 옵트아웃하는 A안이 컴플라이언스 요구 사항을 직접적으로 충족합니다.", "en": "Amazon SageMaker AI automatically collects aggregated metadata from training jobs to improve service reliability, performance, and operational insights. This metadata can include information such as algorithm usage, instance types, resource utilization, and job configuration details. However, AWS documentation clearly states that customers can opt out of SageMaker metadata collection to meet regulatory or compliance requirements. SageMaker provides a supported mechanism to disable metadata tracking at the training job level. By explicitly opting out of metadata tracking when submitting training jobs-either through the AWS Management Console, AWS CLI, or SDK-the service will stop collecting aggregated metadata for those jobs. This option is specifically designed for customers with strict compliance, data residency, or regulatory constraints. Option B is incorrect because running training jobs in a private subnet within a custom VPC controls network isolation, not service-level telemetry or metadata collection. Metadata collection occurs at the SageMaker service layer and is independent of VPC configuration. Option C is also incorrect because encrypting training data with a customer-managed AWS KMS key protects data at rest and in transit but does not prevent SageMaker from collecting operational metadata about training jobs. Option D is incorrect because AWS Nitro instances provide enhanced security and performance isolation at the infrastructure level but have no impact on SageMaker's metadata collection mechanisms. Therefore, opting out of metadata tracking for training jobs is the only solution that directly addresses the compliance requirement and is explicitly supported by AWS documentation."}, {"n": 240, "t": "single", "q": "A company is using an Amazon Redshift database as its single data source. Some of the data is sensitive. A data scientist needs to use some of the sensitive data from the database. An ML engineer must give the data scientist access to the data without transforming the source data and without storing anonymized data in the database. Which solution will meet these requirements with the LEAST implementation effort?", "kq": "어떤 회사가 Amazon Redshift 데이터베이스를 단일 데이터 소스로 사용하고 있습니다. 일부 데이터는 민감합니다. 한 데이터 사이언티스트가 이 데이터베이스의 민감한 데이터 일부를 사용해야 합니다. ML 엔지니어는 원천 데이터를 변형하지 않고, 익명화된 데이터를 데이터베이스에 저장하지도 않으면서 데이터 사이언티스트에게 데이터 접근을 제공해야 합니다. 구현 부담이 가장 적은 방법은 무엇입니까?", "o": [{"k": "A", "t": "Configure dynamic data masking policies to control how sensitive data is shared with the data scientist at query time.", "kt": "쿼리 시점에 민감한 데이터가 데이터 사이언티스트에게 어떻게 공유될지 제어하도록 동적 데이터 마스킹 정책을 구성합니다."}, {"k": "B", "t": "Create a materialized view with masking logic on top of the database. Grant the necessary read permissions to the data scientist.", "kt": "데이터베이스 위에 마스킹 로직이 적용된 구체화된 뷰(materialized view)를 만듭니다. 데이터 사이언티스트에게 필요한 읽기 권한을 부여합니다."}, {"k": "C", "t": "Unload the Amazon Redshift data to Amazon S3. Use Amazon Athena to create schema-on-read with masking logic. Share the view with the data scientist.", "kt": "Amazon Redshift 데이터를 Amazon S3로 언로드합니다. Amazon Athena로 마스킹 로직이 적용된 schema-on-read를 만듭니다. 해당 뷰를 데이터 사이언티스트와 공유합니다."}, {"k": "D", "t": "Unload the Amazon Redshift data to Amazon S3. Create an AWS Glue job to anonymize the data.Share the dataset with the data scientist.", "kt": "Amazon Redshift 데이터를 Amazon S3로 언로드합니다. 데이터를 익명화하는 AWS Glue 작업을 만듭니다. 데이터셋을 데이터 사이언티스트와 공유합니다."}], "a": ["A"], "ko": "동적 데이터 마스킹은 원본 데이터를 수정하거나 변환된 데이터를 별도로 저장하지 않고, 쿼리 실행 시점에 사용자에게 민감 데이터가 어떻게 표시될지를 제어할 수 있는 기능입니다. Amazon Redshift는 동적 데이터 마스킹을 지원하므로 비교적 적은 구현 노력으로 민감 데이터를 보호하면서 데이터 과학자가 필요한 정보에 접근하도록 할 수 있습니다. Materialized view나 S3로 언로드한 뒤 Athena 또는 Glue로 마스킹하는 방식은 추가 데이터 저장, 변환, 관리 작업이 필요하므로 요구 사항의 “소스 데이터를 변환하지 않고 익명화된 데이터를 데이터베이스에 저장하지 않는다”는 조건에 비해 복잡합니다. 따라서 Redshift의 동적 데이터 마스킹 정책을 구성하는 A안이 가장 적은 구현 노력으로 요구 사항을 충족합니다.", "en": "Dynamic data masking allows you to control how sensitive data is presented to users at query time, without modifying or storing transformed versions of the source data. Amazon Redshift supports dynamic data masking, which can be implemented with minimal effort. This solution ensures that the data scientist can access the required information while sensitive data remains protected, meeting the requirements efficiently and with the least implementation effort."}, {"n": 241, "t": "single", "q": "A company launches a feature that predicts home prices. An ML engineer trained a regression model using the SageMaker AI XGBoost algorithm. The model performs well on training data but underperforms on real- world validation data. Which solution will improve the validation score with the LEAST implementation effort?", "kq": "어떤 회사가 주택 가격을 예측하는 기능을 출시했습니다. ML 엔지니어가 SageMaker AI XGBoost 알고리즘으로 회귀 모델을 학습시켰습니다. 모델은 학습 데이터에서는 좋은 성능을 보이지만 실제 검증 데이터에서는 성능이 낮습니다. 구현 부담이 가장 적게 검증 점수를 개선하는 방법은 무엇입니까?", "o": [{"k": "A", "t": "Create a larger training dataset with more real-world data and retrain.", "kt": "더 많은 실제 데이터를 포함한 더 큰 학습 데이터셋을 만들어 재학습시킵니다."}, {"k": "B", "t": "Increase the num_round hyperparameter.", "kt": "num_round 하이퍼파라미터를 늘립니다."}, {"k": "C", "t": "Change the eval_metric from RMSE to Error.", "kt": "eval_metric을 RMSE에서 Error로 변경합니다."}, {"k": "D", "t": "Increase the lambda hyperparameter.", "kt": "lambda 하이퍼파라미터를 늘립니다."}], "a": ["D"], "ko": "이 시나리오는 과적합을 나타냅니다. XGBoost에 대한 AWS 문서에서는 과적합을 줄이고 일반화 성능을 개선하기 위해 L2 정규화 파라미터인 lambda 값을 높일 것을 권장합니다. num_round 값을 늘리면 과적합이 더 심해질 수 있습니다. 평가 지표를 변경하는 것은 모델의 동작 자체를 바꾸지 않습니다. 더 많은 실제 데이터를 수집하는 것도 효과적일 수 있지만 상당한 노력이 필요합니다. 반면 정규화는 구현 노력이 적으면서도 효과가 큰 개선 방법입니다. 따라서 D안이 정답입니다.", "en": "This scenario indicates overfitting. AWS documentation for XGBoost recommends increasing the L2 regularization parameter (lambda) to reduce overfitting and improve generalization. Increasing num_round worsens overfitting. Changing evaluation metrics does not change model behavior. Collecting more data is effective but requires significant effort. Regularization is a low-effort, high-impact fix. Therefore, Option D is correct."}, {"n": 242, "t": "single", "q": "A company has a team of data scientists who use Amazon SageMaker notebook instances to test ML models. When the data scientists need new permissions, the company attaches the permissions to each individual role that was created during the creation of the SageMaker notebook instance. The company needs to centralize management of the team's permissions. Which solution will meet this requirement?", "kq": "어떤 회사에 Amazon SageMaker 노트북 인스턴스로 ML 모델을 테스트하는 데이터 사이언티스트 팀이 있습니다. 데이터 사이언티스트들에게 새 권한이 필요할 때, 회사는 SageMaker 노트북 인스턴스 생성 시 만들어진 각 개별 역할에 권한을 연결합니다. 회사는 팀의 권한 관리를 중앙화해야 합니다. 어떤 솔루션이 이 요구 사항을 충족할까요?", "o": [{"k": "A", "t": "Create a single IAM role that has the necessary permissions. Attach the role to each notebook instance that the team uses.", "kt": "필요한 권한을 가진 단일 IAM 역할을 만듭니다. 팀이 사용하는 각 노트북 인스턴스에 이 역할을 연결합니다."}, {"k": "B", "t": "Create a single IAM group. Add the data scientists to the group. Associate the group with each notebook instance that the team uses.", "kt": "단일 IAM 그룹을 만듭니다. 데이터 사이언티스트들을 그룹에 추가합니다. 팀이 사용하는 각 노트북 인스턴스에 그룹을 연결합니다."}, {"k": "C", "t": "Create a single IAM user. Attach the AdministratorAccess AWS managed IAM policy to the user. Configure each notebook instance to use the IAM user.", "kt": "단일 IAM 사용자를 만듭니다. AdministratorAccess AWS 관리형 IAM 정책을 해당 사용자에 연결합니다. 각 노트북 인스턴스가 이 IAM 사용자를 사용하도록 구성합니다."}, {"k": "D", "t": "Create a single IAM group. Add the data scientists to the group. Create an IAM role. Attach the AdministratorAccess AWS managed IAM policy to the role. Associate the role with the group.Associate the group with each notebook instance that the team uses.", "kt": "단일 IAM 그룹을 만듭니다. 데이터 사이언티스트들을 그룹에 추가합니다. IAM 역할을 만듭니다. AdministratorAccess AWS 관리형 IAM 정책을 해당 역할에 연결합니다. 역할을 그룹에 연결합니다. 팀이 사용하는 각 노트북 인스턴스에 그룹을 연결합니다."}], "a": ["A"], "ko": "여러 Amazon SageMaker 노트북 인스턴스의 권한을 개별적으로 관리하면 복잡성이 커질 수 있습니다. 권한 관리를 중앙화하고 단순화하려면 필요한 권한을 포함하는 단일 IAM 역할을 생성한 뒤, 데이터 과학자 팀이 사용하는 각 노트북 인스턴스에 이 역할을 연결하는 것이 권장됩니다. 이 역할에는 SageMaker 작업과 팀이 사용하는 다른 AWS 서비스에 필요한 권한을 포함할 수 있으며, AmazonSageMakerFullAccess 같은 AWS 관리형 정책을 연결할 수도 있습니다. 노트북 인스턴스를 생성하거나 업데이트할 때 이 IAM 역할을 지정하면 모든 노트북 인스턴스가 일관된 권한 집합으로 동작합니다. 이 방식은 권한 변경 시 역할의 정책만 수정하면 연결된 모든 노트북 인스턴스에 변경 사항이 적용되므로 중앙 집중식 권한 관리에 적합합니다. IAM 그룹은 사용자 권한 관리용이며 노트북 인스턴스 같은 AWS 리소스에 직접 연결할 수 없습니다. 단일 IAM 사용자에 AdministratorAccess를 부여하는 방식은 보안상 부적절하며, IAM 그룹을 역할이나 노트북 인스턴스에 직접 연결하는 방식도 유효하지 않습니다. 따라서 단일 IAM 역할을 생성해 각 노트북 인스턴스에 연결하는 A안이 정답입니다.", "en": "Managing permissions for multiple Amazon SageMaker notebook instances can become complex when handled individually. To centralize and streamline permission management, AWS recommends creating a single IAM role with the necessary permissions and attaching this role to each notebook instance used by the data science team. Steps to Implement the Solution: Create a Single IAM Role with Necessary Permissions: Define an IAM role that encompasses all permissions required by the data scientists for their tasks. This includes permissions for SageMaker operations and any other AWS services they interact with. AWS provides managed policies like AmazonSageMakerFullAccess that can be attached to the role to grant comprehensive SageMaker permissions.(IAM Policies for SageMaker) Attach the IAM Role to Each Notebook Instance: When creating or updating a SageMaker notebook instance, specify the IAM role created in the previous step. This ensures that all notebook instances operate under a consistent set of permissions. In the SageMaker console, during the notebook instance setup, you can choose an existing IAM role to associate with the instance.(Creating SageMaker Workspaces) Benefits of This Approach: Centralized Permission Management:By using a single IAM role, you simplify the process of updating permissions. Changes to the role's policies automatically propagate to all associated notebook instances, ensuring consistent access control. Adherence to Best Practices:AWS recommends using IAM roles to manage permissions for applications running on services like SageMaker. This approach avoids the need to manage individual user permissions separately.(IAM Best Practices for SageMaker) Alternative Options and Their Drawbacks: Option B: Creating a single IAM group and adding data scientists to it does not directly associate the group with notebook instances. IAM groups are used to manage user permissions, not to assign roles to AWS resources like notebook instances. Option C: Using a single IAM user with the AdministratorAccess policy is not recommended due to security risks associated with granting broad permissions and the challenges in managing shared user credentials. Option D: Associating an IAM group with a role and then with notebook instances is not a valid approach, as IAM groups cannot be directly associated with AWS resources. Conclusion: Option A is the most effective solution to centralize and manage permissions for SageMaker notebook instances, aligning with AWS best practices for IAM role management. References: AWS Documentation: IAM Policies for SageMaker AWS Documentation: Creating SageMaker Workspaces AWS Documentation: IAM Best Practices for SageMaker"}];
const KEY = "mla-c01-quiz-v1";

let st = { pick:{}, done:{}, flag:{}, order:null, i:0, filter:"all", reveal:false, theme:"", trans:true };
try { const s = JSON.parse(localStorage.getItem(KEY)); if (s) st = Object.assign(st, s); } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) {} };

if (st.theme) document.documentElement.setAttribute("data-theme", st.theme);

/* ---------- order + filter ---------- */
const baseOrder = () => Q.map((_, k) => k);
if (!st.order || st.order.length !== Q.length) st.order = baseOrder();

function pool() {
  const o = st.order;
  if (st.filter === "unseen") return o.filter(k => !st.done[Q[k].n]);
  if (st.filter === "wrong")  return o.filter(k => st.done[Q[k].n] === "bad");
  if (st.filter === "flag")   return o.filter(k => st.flag[Q[k].n]);
  return o;
}
const clampIdx = () => { const p = pool(); if (!p.length) return; if (st.i >= p.length) st.i = p.length - 1; if (st.i < 0) st.i = 0; };

const cur = () => { const p = pool(); return p.length ? Q[p[st.i]] : null; };

/* ---------- grading ---------- */
function graded(q) {
  const p = st.pick[q.n];
  if (p == null) return null;
  if (q.t === "match") {
    if (p.length !== q.a.length || p.some(v => v === "" || v == null)) return null;
    return p.every((v, j) => Number(v) === q.a[j]) ? "ok" : "bad";
  }
  const got = [...p].sort().join(","), want = [...q.a].sort().join(",");
  return got === want ? "ok" : "bad";
}
const ready = q => {
  const p = st.pick[q.n];
  if (p == null) return false;
  if (q.t === "match") return p.length === q.a.length && p.every(v => v !== "" && v != null);
  return p.length === (q.t === "multi" ? q.a.length : 1);
};

/* ---------- render ---------- */
const el = (t, c, txt) => { const n = document.createElement(t); if (c) n.className = c; if (txt != null) n.textContent = txt; return n; };
const stage = document.getElementById("stage");

function render() {
  clampIdx();
  const q = cur();
  stage.replaceChildren();
  if (!q) {
    const e = el("p", "empty", "이 필터에 해당하는 문항이 없습니다. 필터를 ‘전체’로 바꿔 보세요.");
    stage.append(e); chrome(); return;
  }
  const shown = st.done[q.n] != null || st.reveal;
  const g = graded(q);

  const head = el("div", "qhead");
  head.append(el("span", "qno", "Q " + q.n));
  head.append(el("span", "badge", q.t === "match" ? "순서·매칭" : q.t === "multi" ? "복수정답 " + q.a.length + "개" : "단일정답"));
  const fb = el("button", "flagbtn", st.flag[q.n] ? "★ 북마크" : "☆ 북마크");
  fb.setAttribute("aria-pressed", st.flag[q.n] ? "true" : "false");
  fb.onclick = () => { st.flag[q.n] ? delete st.flag[q.n] : st.flag[q.n] = 1; save(); render(); };
  head.append(fb);
  stage.append(head, el("p", "stem", q.q));
  if (st.trans && q.kq) stage.append(el("p", "stem-ko", q.kq));

  if (q.t === "match") stage.append(matchRows(q, shown));
  else stage.append(optList(q, shown));

  const acts = el("div", "actions");
  const chk = el("button", "btn btn-a", shown ? "해설 보기" : "정답 확인");
  chk.disabled = !shown && !ready(q);
  chk.onclick = () => { if (st.done[q.n] == null) { const v = graded(q); if (v) { st.done[q.n] = v; save(); } } render(); };
  acts.append(chk);
  if (st.done[q.n] != null) {
    const again = el("button", "btn btn-g", "다시 풀기");
    again.onclick = () => { delete st.done[q.n]; delete st.pick[q.n]; save(); render(); };
    acts.append(again);
  }
  stage.append(acts);

  if (shown) stage.append(verdict(q, g));
  chrome();
  document.getElementById("main").scrollTop = 0;
}

function optList(q, shown) {
  const ul = el("ul", "opts");
  q.o.forEach(o => {
    const li = el("li");
    const b = el("button", "opt");
    const sel = (st.pick[q.n] || []).includes(o.k);
    b.setAttribute("aria-pressed", sel ? "true" : "false");
    if (shown) {
      b.disabled = true;
      if (q.a.includes(o.k)) b.classList.add("is-ok");
      else if (sel) b.classList.add("is-bad");
    }
    const tx = el("span", "tx", o.t);
    if (st.trans && o.kt) tx.append(el("span", "tx-ko", o.kt));
    b.append(el("span", "k", o.k), tx,
             el("span", "mk", shown ? (q.a.includes(o.k) ? "✓" : sel ? "✗" : "") : ""));
    b.onclick = () => {
      let p = st.pick[q.n] ? [...st.pick[q.n]] : [];
      if (q.t === "multi") {
        p.includes(o.k) ? p = p.filter(x => x !== o.k) : p.length < q.a.length ? p.push(o.k) : (p = [...p.slice(1), o.k]);
      } else p = [o.k];
      st.pick[q.n] = p; save(); render();
    };
    li.append(b); ul.append(li);
  });
  return ul;
}

function matchRows(q, shown) {
  const wrap = el("div", "rows");
  const label = ci => (st.trans && q.kc ? q.kc[ci] : q.c[ci]);
  q.p.forEach((prompt, j) => {
    const picked = (st.pick[q.n] || [])[j];
    const row = el("div", "row");
    const isStep = /^Step \d+$/.test(prompt);
    if (isStep) {
      row.append(el("div", "lab step", st.trans && q.kp ? q.kp[j] : prompt));
    } else {
      row.append(el("div", "lab", prompt));
      if (st.trans && q.kp) row.append(el("div", "lab-ko", q.kp[j]));
    }
    const sel = el("select");
    sel.id = "q" + q.n + "-" + j;
    sel.append(el("option", null, "선택…"));
    sel.firstChild.value = "";
    q.c.forEach((c, ci) => { const op = el("option", null, label(ci)); op.value = String(ci); sel.append(op); });
    sel.value = picked == null || picked === "" ? "" : String(picked);
    if (shown) {
      sel.disabled = true;
      const good = Number(picked) === q.a[j];
      row.classList.add(good ? "is-ok" : "is-bad");
      row.append(sel);
      if (!good) {
        const fix = el("div", "fix");
        fix.append(el("b", null, "정답"), el("span", null, label(q.a[j])));
        row.append(fix);
      }
    } else {
      sel.onchange = () => {
        const p = st.pick[q.n] ? [...st.pick[q.n]] : new Array(q.p.length).fill("");
        while (p.length < q.p.length) p.push("");
        p[j] = sel.value; st.pick[q.n] = p; save();
        document.querySelector(".btn-a").disabled = !ready(q);
      };
      row.append(sel);
    }
    wrap.append(row);
  });
  return wrap;
}

function verdict(q, g) {
  const v = el("div", "verdict");
  const line = el("div", "vline");
  line.append(el("span", "vtag " + (g || "idle"), g === "ok" ? "정답" : g === "bad" ? "오답" : "미풀이"));
  if (q.t !== "match") {
    const ans = el("span", "vans");
    ans.append(el("em", null, "정답 · "));
    ans.append(document.createTextNode(q.a.join(", ")));
    line.append(ans);
  }
  v.append(line);

  const box = el("div", "exp");
  box.append(el("h3", null, "해설"));
  if (q.ko) box.append(el("p", null, q.ko));
  else box.append(Object.assign(el("p", null, "이 문항은 원본 문서에 해설이 없습니다. 정답만 확인하세요."),
                                { style: "color:var(--ink-3)" }));
  if (q.en && q.en !== q.ko) {
    const d = el("details", "en");
    d.append(el("summary", null, "English explanation"));
    d.append(el("p", null, q.en));
    box.append(d);
  }
  v.append(box);
  return v;
}

/* ---------- chrome ---------- */
function chrome() {
  let ok = 0, bad = 0;
  Q.forEach(q => { const d = st.done[q.n]; if (d === "ok") ok++; else if (d === "bad") bad++; });
  const left = Q.length - ok - bad;
  const t = document.getElementById("tally");
  t.replaceChildren();
  t.append(el("i", "t-ok", "정답 " + ok), el("i", "t-bad", "오답 " + bad), el("i", "t-left", "남음 " + left));
  const tr = document.getElementById("track").children;
  tr[0].style.width = (ok / Q.length * 100) + "%";
  tr[1].style.width = (bad / Q.length * 100) + "%";

  const p = pool();
  document.getElementById("pos").textContent = p.length ? (st.i + 1) + " / " + p.length : "0 / 0";
  document.getElementById("prev").disabled = st.i <= 0;
  document.getElementById("next").disabled = st.i >= p.length - 1;
  document.getElementById("btnFilter").textContent = "필터: " +
    ({ all: "전체", unseen: "안 푼 문제", wrong: "틀린 문제", flag: "북마크" })[st.filter];
  document.getElementById("btnReveal").setAttribute("aria-pressed", st.reveal ? "true" : "false");
  document.getElementById("btnTrans").setAttribute("aria-pressed", st.trans ? "true" : "false");
  document.getElementById("btnShuffle").setAttribute("aria-pressed", st.shuffled ? "true" : "false");
  document.getElementById("brandsub").textContent = "AWS ML Engineer · Associate · " + Q.length + "문항";
}

const go = d => { st.i += d; save(); render(); };
document.getElementById("prev").onclick = () => go(-1);
document.getElementById("next").onclick = () => go(1);

document.getElementById("btnFilter").onclick = () => {
  const seq = ["all", "unseen", "wrong", "flag"];
  st.filter = seq[(seq.indexOf(st.filter) + 1) % seq.length];
  st.i = 0; save(); render();
};
document.getElementById("btnShuffle").onclick = () => {
  if (st.shuffled) { st.order = baseOrder(); st.shuffled = false; }
  else {
    const o = baseOrder();
    for (let i = o.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [o[i], o[j]] = [o[j], o[i]]; }
    st.order = o; st.shuffled = true;
  }
  st.i = 0; save(); render();
};
document.getElementById("btnReveal").onclick = () => { st.reveal = !st.reveal; save(); render(); };
document.getElementById("btnTrans").onclick = () => { st.trans = !st.trans; save(); render(); };
document.getElementById("btnTheme").onclick = () => {
  const now = document.documentElement.getAttribute("data-theme");
  const nxt = now === "dark" ? "light" : now === "light" ? "" : "dark";
  nxt ? document.documentElement.setAttribute("data-theme", nxt) : document.documentElement.removeAttribute("data-theme");
  st.theme = nxt; save();
};
document.getElementById("btnReset").onclick = () => {
  if (!confirm("풀이 기록·북마크를 모두 지웁니다. 계속할까요?")) return;
  st.pick = {}; st.done = {}; st.flag = {}; st.i = 0; save(); render();
};

/* ---------- sheet ---------- */
const sheet = document.getElementById("sheet");
function openSheet() {
  const cells = document.getElementById("cells");
  cells.replaceChildren();
  const p = pool();
  st.order.forEach(k => {
    const q = Q[k];
    const b = el("button", "cell", String(q.n));
    const d = st.done[q.n];
    if (d === "ok") b.classList.add("c-ok");
    if (d === "bad") b.classList.add("c-bad");
    if (st.flag[q.n]) b.classList.add("c-flag");
    const at = p.indexOf(k);
    if (at === st.i && at > -1) b.classList.add("c-now");
    b.onclick = () => {
      if (at > -1) st.i = at;
      else { st.filter = "all"; st.i = pool().indexOf(k); }
      save(); sheet.hidden = true; render();
    };
    cells.append(b);
  });
  sheet.hidden = false;
}
document.getElementById("btnGrid").onclick = openSheet;
document.getElementById("sheetClose").onclick = () => { sheet.hidden = true; };
sheet.onclick = e => { if (e.target === sheet) sheet.hidden = true; };
const jump = test => {
  const p = pool();
  const at = p.findIndex(k => test(Q[k]));
  if (at < 0) { alert("해당하는 문항이 없습니다."); return; }
  st.i = at; save(); sheet.hidden = true; render();
};
document.getElementById("jumpUnseen").onclick = () => jump(q => st.done[q.n] == null);
document.getElementById("jumpWrong").onclick = () => jump(q => st.done[q.n] === "bad");

/* ---------- keys ---------- */
document.addEventListener("keydown", e => {
  if (e.target.matches("select,input,textarea")) return;
  if (e.key === "Escape") { sheet.hidden = true; return; }
  if (e.key === "ArrowLeft") { go(-1); return; }
  if (e.key === "ArrowRight") { go(1); return; }
  const q = cur(); if (!q) return;
  if (e.key === "b" || e.key === "B") { st.flag[q.n] ? delete st.flag[q.n] : st.flag[q.n] = 1; save(); render(); return; }
  if (e.key === "t" || e.key === "T") { st.trans = !st.trans; save(); render(); return; }
  if (e.key === "Enter") { const b = document.querySelector(".btn-a"); if (b && !b.disabled) b.click(); return; }
  if (q.t !== "match" && /^[1-6]$/.test(e.key)) {
    const o = q.o[+e.key - 1];
    if (o && st.done[q.n] == null) document.querySelectorAll(".opt")[+e.key - 1].click();
  }
});

render();
</script>
</body>
</html>
