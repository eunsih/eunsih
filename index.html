fore, EventBridge-triggered Step Functions is the correct solution."}, {"n": 182, "t": "single", "q": "A streaming media company uses a churn risk model to assess the churn risk of its premium tier customers. Each month, the company runs an aggregation job on individual customers' streaming data and uploads the user engagement features to an Amazon S3 bucket. The company manually re-trains the churn risk model with the user engagement data. The current process requires manual intervention and is time-consuming. The company needs a solution that automatically re-trains the churn prediction model with the most recent data. Which solution will meet these requirements with the SHORTEST delay?", "kq": "어떤 스트리밍 미디어 회사가 프리미엄 등급 고객의 이탈 위험을 평가하기 위해 이탈 위험 모델을 사용합니다. 회사는 매달 개별 고객의 스트리밍 데이터에 대해 집계 작업을 실행하고 사용자 참여 특성을 Amazon S3 버킷에 업로드합니다. 회사는 이 사용자 참여 데이터로 이탈 위험 모델을 수동으로 재학습시킵니다. 현재 프로세스는 수동 개입이 필요하고 시간이 많이 걸립니다. 회사는 가장 최신 데이터로 이탈 예측 모델을 자동으로 재학습시키는 솔루션이 필요합니다. 지연이 가장 짧은 방법은 무엇입니까?", "o": [{"k": "A", "t": "Set up an Amazon EventBridge rule to run an Amazon Elastic Container Service (Amazon ECS) task hourly for model re-training. Configure the ECS task to use the most recent data from the S3 bucket.", "kt": "모델 재학습을 위해 Amazon ECS 태스크를 매시간 실행하는 Amazon EventBridge 규칙을 설정합니다. S3 버킷의 가장 최신 데이터를 사용하도록 ECS 태스크를 구성합니다."}, {"k": "B", "t": "Configure the S3 bucket to invoke an AWS Lambda function that re-trains the model.", "kt": "모델을 재학습시키는 AWS Lambda 함수를 호출하도록 S3 버킷을 구성합니다."}, {"k": "C", "t": "Create a pipeline in Amazon SageMaker Pipelines for re-training. Configure an Amazon EventBridge rule to monitor S3 PutObject creation events and invoke the pipeline.", "kt": "Amazon SageMaker Pipelines에서 재학습용 파이프라인을 만듭니다. S3 PutObject 생성 이벤트를 모니터링해 파이프라인을 호출하도록 Amazon EventBridge 규칙을 구성합니다."}, {"k": "D", "t": "Create a pipeline in Amazon SageMaker Pipelines for re-training. Configure a pipeline schedule to re- train the model.", "kt": "Amazon SageMaker Pipelines에서 재학습용 파이프라인을 만듭니다. 모델을 재학습시키도록 파이프라인 일정을 구성합니다."}], "a": ["C"], "ko": "정답은 C입니다. 재학습을 위한 Amazon SageMaker Pipelines 파이프라인을 만들고, Amazon EventBridge 규칙이 S3 PutObject 생성 이벤트를 모니터링하여 해당 파이프라인을 호출하도록 구성하는 방식입니다. SageMaker Pipelines는 ML 모델 학습, 검증, 배포를 위한 완전 관리형 워크플로 오케스트레이션 프레임워크를 제공합니다. 이 시나리오에서는 새로운 사용자 참여 데이터가 S3에 업로드될 때마다 이탈 예측 모델을 자동으로 재학습해야 합니다. SageMaker Pipelines와 EventBridge를 통합하면 S3 PutObject 이벤트가 발생하는 즉시 파이프라인을 트리거할 수 있으므로, 데이터 도착과 모델 재학습 사이의 지연 시간을 최소화할 수 있습니다. A안은 ECS 작업을 매시간 실행하므로 새 데이터가 도착해도 다음 실행 시점까지 지연될 수 있습니다. B안은 Lambda 실행 시간과 컴퓨팅 용량 제한 때문에 대규모 데이터셋이나 복잡한 모델 재학습에는 적합하지 않습니다. D안의 예약 기반 파이프라인은 운영은 단순하지만 스케줄 간격만큼 불필요한 지연이 발생할 수 있습니다. 따라서 EventBridge로 SageMaker Pipelines를 즉시 호출하는 C안이 가장 짧은 지연으로 자동 재학습을 수행하는 올바른 방식입니다.", "en": "The correct answer is C. Create a pipeline in Amazon SageMaker Pipelines for re-training. Configure an Amazon EventBridge rule to monitor S3 PutObject creation events and invoke the pipeline. Amazon SageMaker Pipelines provides a fully managed workflow orchestration framework for ML model training, validation, and deployment. In this scenario, the company requires automatic re- training of the churn prediction model whenever new user engagement data becomes available in S3. By integrating SageMaker Pipelines with EventBridge, the pipeline can be triggered immediately upon an S3 PutObject event, ensuring minimal latency between data arrival and model re-training. Option A, running an ECS task hourly, introduces fixed-time delays, as the new data may arrive at any time within the hour and would not be processed until the next scheduled run. Option B, invoking a Lambda function, is limited by execution duration and compute capacity; re-training ML models entirely within Lambda is not practical for large datasets or complex model architectures. Option D, using a scheduled SageMaker pipeline, reduces operational complexity but also introduces latency proportional to the schedule interval, which may delay model updates unnecessarily. Using EventBridge-triggered SageMaker Pipelines ensures the shortest possible delay because the re- training pipeline is invoked immediately when new data arrives. This design follows AWS best practices for ML workflow orchestration and deployment, ensuring automated, event-driven retraining that keeps models up-to- date with the latest data. It also provides observability, logging, and error handling within the SageMaker Pipelines framework, reducing manual intervention and operational overhead while maintaining production- quality ML workflow management. This approach is ideal for streaming and high-velocity datasets where model freshness is critical for predictive accuracy and business outcomes."}, {"n": 183, "t": "single", "q": "A company wants to deploy an Amazon SageMaker AI model that can queue requests. The model needs to handle payloads of up to 1 GB that take up to 1 hour to process. The model must return an inference for each request. The model also must scale down when no requests are available to process. Which inference option will meet these requirements?", "kq": "어떤 회사가 요청을 큐에 넣을 수 있는 Amazon SageMaker AI 모델을 배포하려고 합니다. 모델은 처리에 최대 1시간이 걸리는 최대 1GB 페이로드를 처리해야 합니다. 모델은 각 요청에 대해 추론 결과를 반환해야 합니다. 또한 처리할 요청이 없을 때는 축소되어야 합니다. 요구 사항을 충족하는 추론 옵션은 무엇입니까?", "o": [{"k": "A", "t": "Asynchronous inference", "kt": "비동기 추론(Asynchronous inference)"}, {"k": "B", "t": "Batch transform", "kt": "배치 변환(Batch transform)"}, {"k": "C", "t": "Serverless inference", "kt": "서버리스 추론(Serverless inference)"}, {"k": "D", "t": "Real-time inference", "kt": "실시간 추론(Real-time inference)"}], "a": ["A"], "ko": "Amazon SageMaker 비동기 추론은 장시간 실행되는 추론 요청과 대용량 페이로드를 처리하도록 특별히 설계되어 있습니다. 최대 1GB의 페이로드와 최대 1시간의 처리 시간을 지원하며, 요청을 자동으로 큐에 저장할 수 있습니다. 비동기 추론은 결과를 Amazon S3에 저장하고, 클라이언트가 처리가 완료된 후 추론 결과를 가져올 수 있게 합니다. 또한 들어오는 요청이 없을 때는 자동으로 0까지 확장할 수 있어 비용을 절감합니다. Batch Transform은 오프라인 대량 추론용이며 요청별 비동기 응답 패턴을 제공하지 않습니다. 서버리스 추론과 실시간 추론은 페이로드 크기와 제한 시간이 엄격하여 1시간 처리를 지원하지 않습니다. 따라서 제시된 모든 요구 사항을 충족하는 SageMaker 추론 옵션은 비동기 추론입니다.", "en": "Amazon SageMaker Asynchronous Inference is specifically designed for long-running inference requests and large payloads. It supports payload sizes up to 1 GB and processing times of up to 1 hour, while automatically queuing requests. Asynchronous inference stores results in Amazon S3 and allows clients to retrieve inference outputs after processing completes. It also supports auto scaling down to zero when there are no incoming requests, reducing cost. Batch transform is intended for offline, bulk inference and does not return per-request results in an asynchronous request-response pattern. Serverless and real-time inference have strict payload size and timeout limits that do not support 1-hour processing. Therefore, asynchronous inference is the only SageMaker inference option that meets all stated requirements."}, {"n": 185, "t": "single", "q": "An ML engineer is using a training job to fine-tune a deep learning model in Amazon SageMaker Studio. The ML engineer previously used the same pre-trained model with a similar dataset. The ML engineer expects vanishing gradient, underutilized GPU, and overfitting problems. The ML engineer needs to implement a solution to detect these issues and to react in predefined ways when the issues occur. The solution also must provide comprehensive real-time metrics during the training. Which solution will meet these requirements with the LEAST operational overhead?", "kq": "ML 엔지니어가 Amazon SageMaker Studio에서 학습 작업을 사용해 딥러닝 모델을 파인튜닝하고 있습니다. ML 엔지니어는 이전에 유사한 데이터셋으로 같은 사전 학습 모델을 사용한 적이 있습니다. ML 엔지니어는 기울기 소실, GPU 활용 저하, 과적합 문제가 발생할 것으로 예상합니다. ML 엔지니어는 이러한 문제를 감지하고 문제가 발생하면 미리 정의된 방식으로 대응하는 솔루션을 구현해야 합니다. 또한 솔루션은 학습 중 포괄적인 실시간 지표를 제공해야 합니다. 어떤 솔루션이 최소한의 운영 오버헤드로 이러한 요구 사항을 충족할까요?", "o": [{"k": "A", "t": "Use TensorBoard to monitor the training job. Publish the findings to an Amazon Simple Notification Service (Amazon SNS) topic. Create an AWS Lambda function to consume the findings and to initiate the predefined actions.", "kt": "TensorBoard로 학습 작업을 모니터링합니다. 결과를 Amazon SNS 토픽에 게시합니다. 결과를 소비해 미리 정의된 작업을 시작하는 AWS Lambda 함수를 만듭니다."}, {"k": "B", "t": "Use Amazon CloudWatch default metrics to gain insights about the training job. Use the metrics to invoke an AWS Lambda function to initiate the predefined actions.", "kt": "Amazon CloudWatch 기본 지표로 학습 작업에 대한 인사이트를 얻습니다. 해당 지표로 AWS Lambda 함수를 호출해 미리 정의된 작업을 시작합니다."}, {"k": "C", "t": "Expand the metrics in Amazon CloudWatch to include the gradients in each training step. Use the metrics to invoke an AWS Lambda function to initiate the predefined actions.", "kt": "Amazon CloudWatch의 지표를 확장해 각 학습 단계의 기울기를 포함시킵니다. 해당 지표로 AWS Lambda 함수를 호출해 미리 정의된 작업을 시작합니다."}, {"k": "D", "t": "Use SageMaker Debugger built-in rules to monitor the training job. Configure the rules to initiate the predefined actions.", "kt": "SageMaker Debugger 내장 규칙으로 학습 작업을 모니터링합니다. 미리 정의된 작업을 시작하도록 규칙을 구성합니다."}], "a": ["D"], "ko": "SageMaker Debugger는 학습 작업 중 기울기 소실, GPU 활용률 부족, 과적합과 같은 문제를 자동으로 탐지할 수 있는 내장 규칙을 제공합니다. 또한 실시간 지표를 생성하고, 특정 문제가 발생했을 때 사전에 정의한 작업을 트리거하도록 구성할 수 있습니다. 이 솔루션은 사용자 지정 모니터링 구성이나 광범위한 수동 개입 없이 SageMaker Debugger의 관리형 모니터링 기능을 활용하므로 운영 부담을 최소화합니다. 따라서 D안이 정답입니다.", "en": "SageMaker Debugger provides built-in rules to automatically detect issues like vanishing gradients, underutilized GPU, and overfitting during training jobs. It generates real-time metrics and allows users to define predefined actions that are triggered when specific issues occur. This solution minimizes operational overhead by leveraging the managed monitoring capabilities of SageMaker Debugger without requiring custom setups or extensive manual intervention."}, {"n": 186, "t": "single", "q": "An ML engineer develops a neural network model to predict whether customers will continue to subscribe to a service. The model performs well on training data. However, the accuracy of the model decreases significantly on evaluation data. The ML engineer must resolve the model performance issue. Which solution will meet this requirement?", "kq": "ML 엔지니어가 고객이 서비스 구독을 계속할지 예측하는 신경망 모델을 개발했습니다. 모델은 학습 데이터에서는 좋은 성능을 보입니다. 그러나 평가 데이터에서는 모델의 정확도가 크게 떨어집니다. ML 엔지니어는 이 모델 성능 문제를 해결해야 합니다. 어떤 솔루션이 이 요구 사항을 충족할까요?", "o": [{"k": "A", "t": "Penalize large weights by using L1 or L2 regularization.", "kt": "L1 또는 L2 정규화를 사용해 큰 가중치에 페널티를 부여합니다."}, {"k": "B", "t": "Remove dropout layers from the neural network.", "kt": "신경망에서 드롭아웃 레이어를 제거합니다."}, {"k": "C", "t": "Train the model for longer by increasing the number of epochs.", "kt": "에포크 수를 늘려 모델을 더 오래 학습시킵니다."}, {"k": "D", "t": "Capture complex patterns by increasing the number of layers.", "kt": "레이어 수를 늘려 복잡한 패턴을 포착합니다."}], "a": ["A"], "ko": "이 시나리오는 명확한 과적합 문제를 설명합니다. 신경망 모델이 학습 데이터에서는 잘 동작하지만 평가 데이터에서는 일반화하지 못하고 있습니다. AWS 머신러닝 및 딥러닝 모범 사례에 따르면 과적합은 모델이 일반화 가능한 관계가 아니라 학습 데이터의 노이즈나 지나치게 구체적인 패턴을 학습할 때 발생합니다. L1 및 L2 정규화는 과적합을 줄이기 위한 대표적인 기법입니다. 이 방법들은 최적화 과정에서 큰 가중치 값을 벌점으로 부여하여 모델 복잡도를 제한합니다. L1 정규화는 희소성을 유도하고, L2 정규화는 가중치 분포를 부드럽게 만듭니다. AWS 문서에서도 학습 성능과 평가 성능 사이의 차이가 클 때 일반화 성능을 높이기 위한 주요 방법으로 정규화를 권장합니다. Dropout 계층을 제거하면 오히려 과적합이 증가하고, 에포크 수를 늘리면 모델이 학습 데이터를 더 많이 외울 수 있습니다. 계층 수를 늘리는 것도 모델 복잡도를 높여 과적합을 악화시킵니다. 따라서 큰 가중치에 L1 또는 L2 정규화를 적용하는 A안이 정답입니다.", "en": "This scenario clearly describes an overfitting problem. The neural network performs well on training data but fails to generalize to evaluation data. According to AWS Machine Learning and deep learning best practices, overfitting occurs when a model learns noise or overly specific patterns in the training data instead of generalizable relationships. L1 and L2 regularization are well-established techniques to combat overfitting. They work by penalizing large weight values during optimization, effectively constraining the model's complexity. L1 regularization encourages sparsity, while L2 regularization (weight decay) smooths the weight distribution. AWS documentation recommends regularization as a primary method for improving generalization when a model shows a large gap between training and evaluation performance. Option B is incorrect because removing dropout layers would increase overfitting, not reduce it. Dropout is itself a regularization technique. Option C would likely worsen overfitting, as training for more epochs allows the model to memorize the training data even further. Option D increases model complexity, which again exacerbates overfitting rather than resolving it. Therefore, penalizing large weights using L1 or L2 regularization is the correct solution."}, {"n": 188, "t": "match", "q": "A company uses AWS CodePipeline to orchestrate a continuous integration and continuous delivery (CI/CD) pipeline for ML models and applications. Select and order the steps from the following list to describe a CI/CD process for a successful deployment. Select each step one time. (Select and order FIVE.)", "kq": "어떤 회사가 ML 모델과 애플리케이션의 CI/CD 파이프라인을 오케스트레이션하기 위해 AWS CodePipeline을 사용합니다. 배포 성공까지의 CI/CD 프로세스를 설명하도록 아래 목록에서 단계를 선택해 순서대로 배치하세요. 각 단계는 한 번만 선택합니다. (5개 선택 및 순서 배치)", "p": ["Step 1", "Step 2", "Step 3", "Step 4", "Step 5"], "c": ["CodePipeline deploys ML models and applications to production.", "CodePipeline detects code changes and starts to build automatically.", "Human approval is provided after testing is successful.", "The company builds and deploys ML models and applications to staging servers for testing.", "The company commits code changes or new training datasets to a Git repository."], "kp": ["1단계", "2단계", "3단계", "4단계", "5단계"], "kc": ["CodePipeline이 ML 모델과 애플리케이션을 운영 환경에 배포한다.", "CodePipeline이 코드 변경을 감지하고 자동으로 빌드를 시작한다.", "테스트가 성공한 후 사람의 승인이 이루어진다.", "회사가 테스트를 위해 ML 모델과 애플리케이션을 빌드해 스테이징 서버에 배포한다.", "회사가 코드 변경 사항 또는 새 학습 데이터셋을 Git 리포지토리에 커밋한다."], "a": [4, 1, 3, 2, 0], "ko": "1단계는 회사가 코드 변경 사항 또는 새 학습 데이터셋을 Git 저장소에 커밋하는 것입니다. 이는 CI/CD 파이프라인을 시작하는 트리거 지점입니다. 2단계는 CodePipeline이 코드 변경을 감지하고 자동으로 빌드를 시작하는 것입니다. CodePipeline은 AWS CodeCommit, GitHub, Bitbucket과 같은 Git 저장소를 모니터링하고 변경이 감지되면 파이프라인을 자동으로 실행합니다. 3단계는 회사가 ML 모델과 애플리케이션을 빌드하고 테스트를 위해 스테이징 서버에 배포하는 것입니다. 이 과정에서 파이프라인은 AWS CodeBuild와 SageMaker 등을 사용해 빌드, 학습, 테스트 단계를 실행하고 검증용 환경에 산출물을 배포합니다. 4단계는 테스트가 성공한 후 사람이 승인하는 것입니다. 수동 승인 단계는 운영 배포 전 거버넌스, 규정 준수, 품질 검사를 보장하기 위한 모범 사례입니다. 5단계는 승인 후 CodePipeline이 ML 모델과 애플리케이션을 프로덕션에 배포하는 것입니다. 이 순서는 소스 변경, 자동 빌드, 스테이징 검증, 승인, 운영 배포로 이어지는 표준 CI/CD 흐름을 나타냅니다.", "en": "Step 1: The company commits code changes or new training datasets to a Git repository. This is the trigger point. A source code or data change initiates the CI/CD pipeline. Step 2: CodePipeline detects code changes and starts to build automatically. CodePipeline monitors the Git repository (for example, AWS CodeCommit, GitHub, or Bitbucket) and automatically triggers the pipeline when changes are detected. Step 3: The company builds and deploys ML models and applications to staging servers for testing. The pipeline runs build, training, and test stages (often using AWS CodeBuild and SageMaker) and deploys artifacts to a staging or test environment for validation. Step 4: Human approval is provided after testing is successful. A manual approval action is a best practice for ML workflows to ensure governance, compliance, and quality checks before production deployment.Step 5: CodePipeline deploys ML models and applications to production. After approval, the pipeline automatically deploys the validated model or application to the production environment."}, {"n": 189, "t": "single", "q": "An ML engineer is using an Amazon SageMaker Studio notebook to train a neural network by creating an estimator. The estimator runs a Python training script that uses Distributed Data Parallel (DDP) on a single instance that has more than one GPU. The ML engineer discovers that the training script is underutilizing GPU resources. The ML engineer must identify the point in the training script where resource utilization can be optimized. Which solution will meet this requirement?", "kq": "ML 엔지니어가 Amazon SageMaker Studio 노트북에서 estimator를 만들어 신경망을 학습시키고 있습니다. 이 estimator는 GPU가 여러 개인 단일 인스턴스에서 DDP(Distributed Data Parallel)를 사용하는 Python 학습 스크립트를 실행합니다. ML 엔지니어는 학습 스크립트가 GPU 리소스를 충분히 활용하지 못하고 있음을 발견했습니다. ML 엔지니어는 학습 스크립트에서 리소스 활용을 최적화할 수 있는 지점을 식별해야 합니다. 어떤 솔루션이 이 요구 사항을 충족할까요?", "o": [{"k": "A", "t": "Use Amazon CloudWatch metrics to create a report that describes GPU utilization over time.", "kt": "Amazon CloudWatch 지표를 사용해 시간 경과에 따른 GPU 활용률을 설명하는 보고서를 만듭니다."}, {"k": "B", "t": "Add SageMaker Profiler annotations to the training script. Run the script and generate a report from the results.", "kt": "학습 스크립트에 SageMaker Profiler 주석을 추가합니다. 스크립트를 실행하고 결과로 보고서를 생성합니다."}, {"k": "C", "t": "Use AWS CloudTrail to create a report that describes GPU utilization and GPU memory utilization over time.", "kt": "AWS CloudTrail을 사용해 시간 경과에 따른 GPU 활용률과 GPU 메모리 활용률을 설명하는 보고서를 만듭니다."}, {"k": "D", "t": "Create a default monitor in Amazon SageMaker Model Monitor and suggest a baseline. Generate a report based on the constraints and statistics the monitor generates.", "kt": "Amazon SageMaker Model Monitor에서 기본 모니터를 만들고 기준선을 제안합니다. 모니터가 생성한 제약과 통계를 기반으로 보고서를 생성합니다."}], "a": ["B"], "ko": "학습 스크립트 내부의 비효율 지점을 정확히 찾아내려면 AWS는 Amazon SageMaker Profiler 사용을 권장합니다. SageMaker Profiler는 학습 중 CPU, GPU, 메모리, I/O 사용량과 프레임워크 수준 작업에 대한 세밀한 가시성을 제공합니다. 학습 스크립트에 profiler annotation을 직접 추가하면 비효율적인 데이터 로딩, DDP 동기화 지연, 학습 단계 사이의 GPU 유휴 시간 같은 병목을 식별할 수 있습니다. CloudWatch 지표는 전반적인 사용률 추세는 보여주지만 코드 수준의 정확한 비효율 지점을 식별할 수 없습니다. CloudTrail은 감사 서비스이며 성능 프로파일링과 관련이 없습니다. Model Monitor는 데이터 및 모델 품질에 초점을 두며 학습 리소스 사용률 분석 도구가 아닙니다. 따라서 SageMaker Profiler가 올바른 도구입니다.", "en": "To pinpoint inefficiencies inside a training script, AWS recommends using Amazon SageMaker Profiler. SageMaker Profiler provides fine-grained visibility into CPU, GPU, memory, I/O usage, and framework-level operations during training. By adding profiler annotations directly to the training script, the ML engineer can identify bottlenecks such as inefficient data loading, synchronization delays in DDP, or idle GPU time between training steps. CloudWatch metrics provide high-level utilization trends but cannot identify exact code-level inefficiencies. CloudTrail is an auditing service and is irrelevant to performance profiling. Model Monitor focuses on data and model quality, not training resource utilization. Therefore, SageMaker Profiler is the correct tool."}, {"n": 190, "t": "single", "q": "An ML engineer is analyzing a classification dataset before training a model in Amazon SageMaker AI. The ML engineer suspects that the dataset has a significant imbalance between class labels that could lead to biased model predictions. To confirm class imbalance, the ML engineer needs to select an appropriate pre- training bias metric. Which metric will meet this requirement?", "kq": "ML 엔지니어가 Amazon SageMaker AI에서 모델을 학습시키기 전에 분류 데이터셋을 분석하고 있습니다. ML 엔지니어는 데이터셋의 클래스 레이블 간 불균형이 심해 편향된 모델 예측으로 이어질 수 있다고 의심합니다. 클래스 불균형을 확인하기 위해 ML 엔지니어는 적절한 사전 학습 편향 지표를 선택해야 합니다. 이 요구 사항을 충족하는 지표는 무엇입니까?", "o": [{"k": "A", "t": "Mean squared error (MSE)", "kt": "평균 제곱 오차(MSE)"}, {"k": "B", "t": "Difference in proportions of labels (DPL)", "kt": "레이블 비율 차이(DPL, Difference in proportions of labels)"}, {"k": "C", "t": "Silhouette score", "kt": "실루엣 점수(Silhouette score)"}, {"k": "D", "t": "Structural similarity index measure (SSIM)", "kt": "구조적 유사도 지수(SSIM)"}], "a": ["B"], "ko": "Amazon SageMaker AI에서 모델 학습 전에 머신러닝 데이터셋의 편향을 식별하는 것은 예측의 공정성과 신뢰성을 보장하기 위한 중요한 단계입니다. 이를 사전 학습 편향 분석이라고 하며, 학습 데이터 자체가 특히 클래스 라벨이나 민감 속성의 불균형을 통해 편향을 유발하는지 이해하는 데 초점을 둡니다. Difference in Proportions of Labels(DPL)는 클래스 불균형을 측정하도록 설계된 사전 학습 편향 지표입니다. DPL은 데이터셋 내 서로 다른 그룹이나 클래스 간 특정 라벨의 비율을 비교합니다. 특정 클래스나 그룹이 다른 그룹에 비해 과도하게 대표되면 DPL 값이 0에서 크게 벗어나 불균형을 명확히 나타냅니다. AWS 문서에서도 DPL을 SageMaker Clarify가 모델 학습 전에 라벨 불균형을 탐지하는 주요 지표로 설명합니다. 반면 평균제곱오차(MSE)는 학습 후 예측 오류를 측정하는 회귀 평가 지표이며 데이터셋 편향 지표가 아닙니다. Silhouette score는 클러스터링 품질을 평가하는 비지도 학습 지표이고, SSIM은 컴퓨터 비전에서 이미지 품질을 측정하는 지표입니다. 따라서 사전 학습 편향 분석에서 클래스 불균형을 확인하기 위한 올바른 지표는 DPL입니다.", "en": "In Amazon SageMaker AI, identifying bias in machine learning datasets before model training is a critical step to ensure fairness and reliability of predictions. This process is referred to as pre-training bias analysis, and it focuses on understanding whether the training data itself introduces bias- particularly through imbalanced class labels or sensitive attributes. The Difference in Proportions of Labels (DPL) is a pre-training bias metric specifically designed to measure class imbalance. DPL compares the proportion of a specific label (such as a positive outcome) across different groups or classes within a dataset. If one class or group is overrepresented relative to another, the DPL value will deviate significantly from zero, clearly indicating imbalance. AWS documentation highlights DPL as a key metric used by SageMaker Clarify to detect label imbalance prior to model training. By contrast, Mean Squared Error (MSE) is a regression evaluation metric used after model training to measure prediction error, not dataset bias. Silhouette score is an unsupervised learning metric used to evaluate clustering quality, making it irrelevant for supervised classification bias detection. Structural Similarity Index Measure (SSIM) is an image-quality metric used in computer vision tasks and has no application in dataset bias analysis. Using DPL allows ML engineers to proactively detect and address skewed label distributions-such as by re- sampling, re-weighting, or collecting additional data-before training begins. This aligns with AWS best practices for responsible AI and helps reduce the risk of biased predictions that could negatively impact real- world decision-making. Therefore, Difference in Proportions of Labels (DPL) is the correct and AWS-recommended metric for confirming class imbalance during pre-training bias analysis in Amazon SageMaker AI."}, {"n": 191, "t": "single", "q": "A company needs to create a central catalog for all the company's ML models. The models are in AWS accounts where the company developed the models initially. The models are hosted in Amazon Elastic Container Registry (Amazon ECR) repositories. Which solution will meet these requirements?", "kq": "어떤 회사가 회사의 모든 ML 모델을 위한 중앙 카탈로그를 만들어야 합니다. 모델들은 회사가 처음 개발한 각각의 AWS 계정에 있습니다. 모델들은 Amazon ECR 리포지토리에 호스팅되어 있습니다. 어떤 솔루션이 이러한 요구 사항을 충족할까요?", "o": [{"k": "A", "t": "Configure ECR cross-account replication for each existing ECR repository. Ensure that each model is visible in each AWS account.", "kt": "기존 각 ECR 리포지토리에 대해 ECR 교차 계정 복제를 구성합니다. 각 모델이 모든 AWS 계정에서 보이도록 합니다."}, {"k": "B", "t": "Create a new AWS account with a new ECR repository as the central catalog. Configure ECR cross- account replication between the initial ECR repositories and the central catalog.", "kt": "중앙 카탈로그로 사용할 새 ECR 리포지토리가 있는 새 AWS 계정을 만듭니다. 초기 ECR 리포지토리와 중앙 카탈로그 사이에 ECR 교차 계정 복제를 구성합니다."}, {"k": "C", "t": "Use the Amazon SageMaker Model Registry to create a model group for models hosted in Amazon ECR. Create a new AWS account. In the new account, use the SageMaker Model Registry as the central catalog. Attach a cross-account resource policy to each model group in the initial AWS accounts.", "kt": "Amazon SageMaker Model Registry를 사용해 Amazon ECR에 호스팅된 모델을 위한 모델 그룹을 만듭니다. 새 AWS 계정을 만듭니다. 새 계정에서 SageMaker Model Registry를 중앙 카탈로그로 사용합니다. 초기 AWS 계정의 각 모델 그룹에 교차 계정 리소스 정책을 연결합니다."}, {"k": "D", "t": "Use an AWS Glue Data Catalog to store the models. Run an AWS Glue crawler to migrate the models from the ECR repositories to the Data Catalog. Configure cross-account access to the Data Catalog.", "kt": "AWS Glue Data Catalog를 사용해 모델을 저장합니다. AWS Glue 크롤러를 실행해 ECR 리포지토리의 모델을 Data Catalog로 마이그레이션합니다. Data Catalog에 대한 교차 계정 접근을 구성합니다."}], "a": ["C"], "ko": "Amazon SageMaker Model Registry는 Amazon ECR에 호스팅된 모델을 포함해 ML 모델을 관리하고 카탈로그화하도록 설계된 서비스입니다. 각 모델에 대해 SageMaker Model Registry에서 모델 그룹을 생성하고 계정 간 리소스 정책을 설정하면, 회사는 새 AWS 계정에 중앙 모델 카탈로그를 구축할 수 있습니다. 이를 통해 초기 계정들에 있는 모든 모델을 통합된 중앙 방식으로 접근할 수 있으므로, 모델의 구성, 관리, 거버넌스를 더 효율적으로 수행할 수 있습니다. 이 솔루션은 기존 AWS 서비스를 활용하며 확장성과 낮은 운영 부담을 보장합니다.", "en": "The Amazon SageMaker Model Registry is designed to manage and catalog ML models, including those hosted in Amazon ECR. By creating a model group for each model in the SageMaker Model Registry and setting up cross-account resource policies, the company can establish a central catalog in a new AWS account. This allows all models from the initial accounts to be accessible in a unified, centralized manner for better organization, management, and governance. This solution leverages existing AWS services and ensures scalability and minimal operational overhead."}, {"n": 192, "t": "single", "q": "A company wants to develop an ML model by using tabular data from its customers. The data contains meaningful ordered features with sensitive information that should not be discarded. An ML engineer must ensure that the sensitive data is masked before another team starts to build the model. Which solution will meet these requirements?", "kq": "어떤 회사가 고객의 표 형식 데이터를 사용해 ML 모델을 개발하려고 합니다. 데이터에는 버려서는 안 되는 민감한 정보가 포함된, 의미 있는 순서를 가진 특성들이 있습니다. ML 엔지니어는 다른 팀이 모델 구축을 시작하기 전에 민감한 데이터가 마스킹되도록 해야 합니다. 어떤 솔루션이 이러한 요구 사항을 충족할까요?", "o": [{"k": "A", "t": "Use Amazon Macie to categorize the sensitive data.", "kt": "Amazon Macie를 사용해 민감한 데이터를 분류합니다."}, {"k": "B", "t": "Prepare the data by using AWS Glue DataBrew.", "kt": "AWS Glue DataBrew로 데이터를 준비합니다."}, {"k": "C", "t": "Run an AWS Batch job to change the sensitive data to random values.", "kt": "AWS Batch 작업을 실행해 민감한 데이터를 무작위 값으로 변경합니다."}, {"k": "D", "t": "Run an Amazon EMR job to change the sensitive data to random values.", "kt": "Amazon EMR 작업을 실행해 민감한 데이터를 무작위 값으로 변경합니다."}], "a": ["B"], "ko": "AWS Glue DataBrew는 민감 정보를 마스킹하거나 난독화하는 기능을 포함해 데이터를 준비하고 변환할 수 있는 사용하기 쉬운 인터페이스를 제공합니다. 내장된 데이터 마스킹 기능을 사용하면 ML 엔지니어가 데이터의 구조와 의미를 유지하면서도 민감 데이터를 안전하게 처리할 수 있습니다. 이 방식은 코딩이 거의 필요 없고 효율적이므로, 다른 팀이 모델 구축을 시작하기 전에 민감 데이터가 마스킹되도록 보장하는 데 적합합니다.", "en": "AWS Glue DataBrew provides an easy-to-use interface for preparing and transforming data, including masking or obfuscating sensitive information. It offers built-in data masking features, allowing the ML engineer to handle sensitive data securely while retaining its structure and meaning. This solution is efficient and requires minimal coding, making it ideal for ensuring sensitive data is masked before model building begins."}, {"n": 193, "t": "match", "q": "An ML engineer is using Amazon SageMaker JumpStart to fine-tune a Llama 3.2 model for text generation. The ML engineer is using an instruction-based fine-tuning method. The model uses 70 billion parameters. Select the correct fine-tuning term from the following list to match each description. Select each term one time or not at all. (Select THREE.)", "kq": "ML 엔지니어가 텍스트 생성을 위해 Amazon SageMaker JumpStart로 Llama 3.2 모델을 파인튜닝하고 있습니다. ML 엔지니어는 지시 기반 파인튜닝 방법을 사용하고 있습니다. 이 모델은 700억 개의 파라미터를 사용합니다. 아래 목록에서 각 설명에 맞는 파인튜닝 용어를 선택하세요. 각 용어는 한 번만 선택하거나 선택하지 않습니다. (3개 선택)", "p": ["A method to reduce memory usage by representing model weights with lower precision", "A parameter-efficient fine tuning (PEFT) technique that trains only a subset of model layers", "A distributed training technique to shard model parameters across GPUs"], "c": ["Hyperparameter tuning", "Low-rank adaptation (LoRA)", "Fully Sharded Data Parallel (FSDP)", "Learning rate", "Int8 quantization"], "kp": ["모델 가중치를 더 낮은 정밀도로 표현해 메모리 사용량을 줄이는 방법", "모델 레이어의 일부만 학습시키는 파라미터 효율적 파인튜닝(PEFT) 기법", "GPU 간에 모델 파라미터를 분할(shard)하는 분산 학습 기법"], "kc": ["Hyperparameter tuning (하이퍼파라미터 튜닝)", "Low-rank adaptation (LoRA)", "Fully Sharded Data Parallel (FSDP)", "Learning rate (학습률)", "Int8 quantization (Int8 양자화)"], "a": [4, 1, 2], "ko": "정답 매핑은 Int8 quantization, Low-rank adaptation(LoRA), Fully Sharded Data Parallel(FSDP)입니다. 첫 번째 설명은 모델 가중치를 더 낮은 정밀도로 표현해 메모리 사용량을 줄이는 것이므로 Int8 quantization에 해당합니다. 양자화는 가중치와 활성값을 INT8과 같은 낮은 정밀도 형식으로 변환해 메모리 요구 사항과 하드웨어 부담을 줄입니다. 두 번째 설명은 전체 모델을 모두 미세 조정하지 않고 일부 학습 가능한 파라미터만 업데이트하는 파라미터 효율적 미세 조정 방식이므로 LoRA에 해당합니다. LoRA는 대규모 언어 모델을 효율적으로 미세 조정하기 위해 저랭크 어댑터 형태의 업데이트만 학습합니다. 세 번째 설명은 여러 GPU에 모델 상태를 샤딩하여 대규모 분산 학습을 가능하게 하는 기법이므로 FSDP에 해당합니다. FSDP는 모델 파라미터와 상태를 GPU 간에 분산해 70B 규모 모델 학습 시 메모리 부담을 줄이고 확장성을 높입니다.", "en": "* Int8 quantization * Low-rank adaptation (LoRA) * Fully Sharded Data Parallel (FSDP) These three mappings align with AWS documentation for large-model training and optimization in SageMaker AI. For 1, the correct answer is Int8 quantization. AWS documentation explains that quantization reduces hardware and memory requirements by using a less precise data type for weights and activations, including INT8 formats. AWS Prescriptive Guidance also states that quantization reduces memory footprint by converting higher-precision weights to lower-precision formats such as FP16 to INT8. That matches the description of reducing memory usage by representing model weights with lower precision. For 2, the correct answer is Low-rank adaptation (LoRA). In practice, LoRA is a standard parameter- efficient fine-tuning (PEFT) method that updates only a small subset of trainable parameters instead of full-model fine- tuning. In SageMaker JumpStart workflows for large language models, LoRA is used specifically to make fine-tuning large models more efficient by training adapter-style low-rank updates rather than all original model weights. This matches the description of a PEFT technique that trains only a subset of model parameters. For 3, the correct answer is Fully Sharded Data Parallel (FSDP). AWS documentation states that SageMaker model parallelism integrates with PyTorch FSDP, which shards model states across GPUs and supports large- scale distributed training. That directly matches the description of a distributed training technique used to share or shard model parameters across GPUs."}, {"n": 194, "t": "single", "q": "An advertising company uses AWS Lake Formation to manage a data lake. The data lake contains structured data and unstructured data. The company's ML engineers are assigned to specific advertisement campaigns. The ML engineers must interact with the data through Amazon Athena and by browsing the data directly in an Amazon S3 bucket. The ML engineers must have access to only the resources that are specific to their assigned advertisement campaigns. Which solution will meet these requirements in the MOST operationally efficient way?", "kq": "어떤 광고 회사가 데이터 레이크를 관리하기 위해 AWS Lake Formation을 사용합니다. 데이터 레이크에는 정형 데이터와 비정형 데이터가 포함되어 있습니다. 회사의 ML 엔지니어들은 특정 광고 캠페인에 배정되어 있습니다. ML 엔지니어들은 Amazon Athena를 통해, 그리고 Amazon S3 버킷에서 데이터를 직접 탐색하는 방식으로 데이터를 다뤄야 합니다. ML 엔지니어들은 자신이 배정된 광고 캠페인에 해당하는 리소스에만 접근할 수 있어야 합니다. 가장 운영 효율적으로 요구 사항을 충족하는 방법은 무엇입니까?", "o": [{"k": "A", "t": "Configure IAM policies on an AWS Glue Data Catalog to restrict access to Athena based on the ML engineers' campaigns.", "kt": "ML 엔지니어의 캠페인을 기준으로 Athena 접근을 제한하도록 AWS Glue Data Catalog에 IAM 정책을 구성합니다."}, {"k": "B", "t": "Store users and campaign information in an Amazon DynamoDB table. Configure DynamoDB Streams to invoke an AWS Lambda function to update S3 bucket policies.", "kt": "사용자와 캠페인 정보를 Amazon DynamoDB 테이블에 저장합니다. S3 버킷 정책을 업데이트하는 AWS Lambda 함수를 호출하도록 DynamoDB Streams를 구성합니다."}, {"k": "C", "t": "Use Lake Formation to authorize AWS Glue to access the S3 bucket. Configure Lake Formation tags to map ML engineers to their campaigns.", "kt": "Lake Formation을 사용해 AWS Glue가 S3 버킷에 접근할 수 있도록 승인합니다. ML 엔지니어를 각자의 캠페인에 매핑하도록 Lake Formation 태그를 구성합니다."}, {"k": "D", "t": "Configure S3 bucket policies to restrict access to the S3 bucket based on the ML engineers' campaigns.", "kt": "ML 엔지니어의 캠페인을 기준으로 S3 버킷 접근을 제한하도록 S3 버킷 정책을 구성합니다."}], "a": ["C"], "ko": "AWS Lake Formation은 데이터 레이크에 대한 세분화된 접근 제어와 데이터 거버넌스를 단순화합니다. Lake Formation 태그를 사용해 ML 엔지니어를 각 광고 캠페인에 매핑하면, 데이터 레이크의 구조화 데이터와 비정형 데이터 모두에 대해 캠페인별 접근 권한을 제한할 수 있습니다. 이 방식은 접근 제어 관리를 Lake Formation에서 중앙화하므로 운영 효율성이 높고, Amazon Athena와 S3 버킷 접근 모두에서 일관된 권한 관리를 보장합니다. 또한 정책을 수동으로 갱신하거나 DynamoDB 기반 사용자 지정 로직을 만들 필요가 없습니다.", "en": "AWS Lake Formation provides fine-grained access control and simplifies data governance for data lakes. By configuring Lake Formation tags to map ML engineers to their specific campaigns, you can restrict access to both structured and unstructured data in the data lake. This method is operationally efficient, as it centralizes access control management within Lake Formation and ensures consistency across Amazon Athena and S3 bucket access without requiring manual updates to policies or DynamoDB-based custom logic."}, {"n": 195, "t": "match", "q": "An ML engineer needs to use Amazon SageMaker Feature Store to create and manage features to train a model. Select and order the steps from the following list to create and use the features in Feature Store. Each step should be selected one time. (Select and order three.)", "kq": "ML 엔지니어가 모델 학습을 위한 특성을 만들고 관리하기 위해 Amazon SageMaker Feature Store를 사용해야 합니다. Feature Store에서 특성을 만들고 사용하는 단계를 아래 목록에서 선택해 순서대로 배치하세요. 각 단계는 한 번만 선택합니다. (3개 선택 및 순서 배치)", "p": ["Step 1", "Step 2", "Step 3"], "c": ["Access the store to build datasets for training.", "Create a feature group.", "Ingest the records."], "kp": ["1단계", "2단계", "3단계"], "kc": ["학습 데이터셋을 만들기 위해 스토어에 접근한다.", "Feature Group을 생성한다.", "레코드를 수집(ingest)한다."], "a": [1, 2, 0], "ko": "올바른 순서는 1단계 Feature Group 생성, 2단계 레코드 수집, 3단계 학습 데이터셋 생성을 위한 Feature Store 접근입니다. Feature Group은 SageMaker Feature Store의 기본 단위로, 특성의 이름과 데이터 형식, 식별 키, 오프라인 저장소 위치 등을 정의합니다. Feature Group을 생성한 후에는 원천 데이터를 Feature Store로 수집해야 하며, 이 과정에서 레코드는 정의된 스키마를 따라 온라인 및 오프라인 저장소에서 사용할 수 있게 됩니다. 이후 저장된 특성을 조회하여 모델 학습용 데이터셋을 구성할 수 있습니다. 일반적으로 오프라인 저장소는 배치 학습에 사용되고, 온라인 저장소는 실시간 추론에 사용됩니다. 이 순서를 따르면 특성을 체계적으로 정의, 적재, 활용할 수 있습니다.", "en": "Step 1: Create a feature group. Step 2: Ingest the records. Step 3: Access the store to build datasets for training. Step 1: Create a Feature Group Why? A feature group is the foundational unit in SageMaker Feature Store, where features are defined, stored, and organized. Creating a feature group specifies the schema (name, data type) for the features and the primary keys for data identification. How? Use the SageMaker Python SDK or AWS CLI to define the feature group by specifying its name, schema, and S3 storage location for offline access. Step 2: Ingest the Records Why? After creating the feature group, the raw data must be ingested into the Feature Store. This step populates the feature group with data, making it available for both real-time and offline use. How? Use the SageMaker SDK or AWS CLI to batch-ingest historical data or stream new records into the feature group. Ensure the records conform to the feature group schema. Step 3: Access the Store to Build Datasets for Training Why? Once the features are stored, they can be accessed to create training datasets. These datasets combine relevant features into a single format for machine learning model training. How? Use the SageMaker Python SDK to query the offline store or retrieve real-time features using the online store API. The offline store is typically used for batch training, while the online store is used for inference. Order Summary: Create a feature group. Ingest the records. Access the store to build datasets for training. This process ensures the features are properly managed, ingested, and accessible for model training using Amazon SageMaker Feature Store."}, {"n": 199, "t": "single", "q": "A company is building a conversational AI assistant on Amazon Bedrock. The company is using Retrieval Augmented Generation (RAG) to reference the company's internal knowledge base. The AI assistant uses the Anthropic Claude 4 foundation model (FM). The company needs a solution that uses a vector embedding model, a vector store, and a vector search algorithm. Which solution will develop the AI assistant with the LEAST development effort?", "kq": "어떤 회사가 Amazon Bedrock에서 대화형 AI 어시스턴트를 만들고 있습니다. 회사는 사내 지식 기반을 참조하기 위해 RAG(검색 증강 생성)를 사용합니다. AI 어시스턴트는 Anthropic Claude 4 파운데이션 모델(FM)을 사용합니다. 회사는 벡터 임베딩 모델, 벡터 저장소, 벡터 검색 알고리즘을 사용하는 솔루션이 필요합니다. 개발 부담이 가장 적게 AI 어시스턴트를 개발하는 방법은 무엇입니까?", "o": [{"k": "A", "t": "Use Amazon Kendra Experience Builder.", "kt": "Amazon Kendra Experience Builder를 사용합니다."}, {"k": "B", "t": "Use Amazon Aurora PostgreSQL with the pgvector extension.", "kt": "pgvector 확장이 적용된 Amazon Aurora PostgreSQL을 사용합니다."}, {"k": "C", "t": "Use Amazon RDS for PostgreSQL with the pgvector extension.", "kt": "pgvector 확장이 적용된 Amazon RDS for PostgreSQL을 사용합니다."}, {"k": "D", "t": "Use the AWS Glue Data Catalog metadata repository.", "kt": "AWS Glue Data Catalog 메타데이터 리포지토리를 사용합니다."}], "a": ["A"], "ko": "Amazon Kendra Experience Builder는 대화형 검색 및 질의응답 애플리케이션을 구축하기 위한 완전 관리형 로우코드 솔루션입니다. Kendra는 의미 검색, 벡터 임베딩, 벡터 기반 검색을 기본적으로 지원하므로 최소한의 개발 노력으로 RAG 스타일 애플리케이션을 구성하는 데 적합합니다. Amazon Bedrock과 통합하면 Kendra가 검색 계층 역할을 수행해 문서 수집, 인덱싱, 임베딩 생성, 관련성 순위 지정 등을 자동으로 처리할 수 있습니다. 따라서 임베딩 모델, 벡터 데이터베이스, 검색 로직을 직접 관리할 필요가 없습니다. Aurora PostgreSQL 또는 RDS PostgreSQL의 pgvector는 벡터 검색을 지원하지만 스키마 설계, 인덱싱, 쿼리 로직, 운영 관리가 필요해 개발 및 유지보수 부담이 큽니다. Glue Data Catalog는 메타데이터 카탈로그용이며 벡터 검색과는 관련이 없습니다. 따라서 A안이 가장 적절합니다.", "en": "Amazon Kendra Experience Builder provides a fully managed, low-code solution for building conversational search and question-answering applications. AWS documentation states that Kendra natively supports semantic search, vector embeddings, and vector-based retrieval, making it well suited for RAG-style applications with minimal development effort. When integrated with Amazon Bedrock, Kendra can act as the retrieval layer, handling document ingestion, indexing, embedding generation, and relevance ranking automatically. This eliminates the need to manually manage embedding models, vector databases, and search logic. Options B and C require custom schema design, vector indexing, query logic, and operational management of PostgreSQL instances. Although pgvector supports vector search, it significantly increases development and maintenance effort. Option D is unrelated to vector search and is used only for metadata cataloging. AWS explicitly positions Amazon Kendra as the fastest way to build enterprise-grade conversational assistants that integrate with foundation models. Therefore, Option A is the correct and most AWS-aligned solution."}, {"n": 200, "t": "single", "q": "A music streaming company constantly streams song ratings from an application to an Amazon S3 bucket. The company wants to use the ratings as an input for training and inference of an Amazon SageMaker AI model. The company has an AWS Glue Data Catalog that is configured with the S3 bucket as the source. An ML engineer needs to implement a solution to create a repository for this data. The solution must ensure that the data stays synchronized during batch training and real-time inference. Which solution will meet these requirements?", "kq": "어떤 음악 스트리밍 회사가 애플리케이션에서 Amazon S3 버킷으로 곡 평점을 지속적으로 스트리밍합니다. 회사는 이 평점을 Amazon SageMaker AI 모델의 학습과 추론 입력으로 사용하려고 합니다. 회사에는 해당 S3 버킷을 소스로 구성한 AWS Glue Data Catalog가 있습니다. ML 엔지니어는 이 데이터를 위한 리포지토리를 만드는 솔루션을 구현해야 합니다. 솔루션은 배치 학습과 실시간 추론 중에 데이터가 동기화된 상태를 유지하도록 보장해야 합니다. 어떤 솔루션이 이러한 요구 사항을 충족할까요?", "o": [{"k": "A", "t": "Ingest data into SageMaker Feature Store from the S3 bucket. Apply tags and indexes.", "kt": "S3 버킷에서 SageMaker Feature Store로 데이터를 수집합니다. 태그와 인덱스를 적용합니다."}, {"k": "B", "t": "Use Amazon Athena. Create tables by using CREATE TABLE AS SELECT (CTAS) queries to group data.", "kt": "Amazon Athena를 사용합니다. CTAS(CREATE TABLE AS SELECT) 쿼리로 테이블을 만들어 데이터를 그룹화합니다."}, {"k": "C", "t": "Use AWS Lake Formation. Apply tag-based control on the data.", "kt": "AWS Lake Formation을 사용합니다. 데이터에 태그 기반 제어를 적용합니다."}, {"k": "D", "t": "Use the Generate Data Insights function in SageMaker Data Wrangler.", "kt": "SageMaker Data Wrangler의 Generate Data Insights 기능을 사용합니다."}], "a": ["A"], "ko": "Amazon SageMaker Feature Store는 학습과 추론에 일관되게 사용되는 ML 특성을 위한 중앙 저장소 역할을 하도록 설계된 서비스입니다. Feature Store는 데이터 탐색, 모델 학습, 모델 추론에 사용할 특성을 생성, 저장, 공유, 관리하는 과정을 단순화합니다. 이 문제의 핵심 요구 사항은 스트리밍되는 노래 평점 데이터를 배치 학습과 실시간 추론 모두에서 동기화된 상태로 사용하는 것입니다. Feature Store는 오프라인 저장소와 온라인 저장소를 모두 제공합니다. 오프라인 저장소는 과거 데이터, 모델 학습, 배치 추론에 사용되고, 온라인 저장소는 실시간 추론 시 낮은 지연 시간으로 특성을 조회하는 데 사용됩니다. 이러한 이중 저장소 구조는 학습과 서빙 워크플로 전반에서 특성 일관성을 유지하기 위해 Feature Store를 사용하는 핵심 이유입니다. Athena CTAS는 쿼리 결과를 구성할 수는 있지만 온라인/오프라인 ML 사용을 위한 동기화된 특성 저장소를 제공하지 않습니다. Lake Formation은 데이터 레이크 접근을 관리하지만 특성 저장소가 아니며, Data Wrangler의 Generate Data Insights는 분석 및 준비용 기능입니다. 따라서 A안이 가장 적절합니다.", "en": "Option A is correct because Amazon SageMaker Feature Store is the AWS service designed to act as a centralized repository for ML features that are used consistently across training and inference. AWS documentation states that SageMaker Feature Store simplifies how you create, store, share, and manage features for data exploration, model training, and model inference. This directly matches the requirement to create a repository for streamed song ratings that will be used in both batch training and real-time inference. The most important requirement in the question is that the data must stay synchronized between batch training and real-time inference. AWS documents explain that Feature Store provides both an offline store and an online store. The offline store is used for historical data, model training, and batch inference, while the online store is a low-latency, high-availability store intended for real-time lookup during inference. This dual-store design is exactly why Feature Store is used to maintain feature consistency across training and serving workflows. AWS Well-Architected guidance also explicitly says Feature Store provides online storage for real-time inference and offline storage for model training and batch inference. The other options do not solve the full problem. Athena CTAS can organize query results but does not provide a synchronized feature repository for online and offline ML use. Lake Formation governs access to data lakes but is not a feature repository for training and inference consistency. Data Wrangler Generate Data Insights is for analysis and preparation, not synchronized feature serving. Therefore, the best AWS- documented answer is A."}, {"n": 202, "t": "match", "q": "A hospital wants to predict patient outcomes for the coming year An ML engineer must improve several existing ML models that currently perform poorly. Select the correct regularization method from the following list to improve each model Select each regularization method one time, more than one time, or not at all. (Select THREE.)", "kq": "어떤 병원이 내년 환자 결과를 예측하려고 합니다. ML 엔지니어는 현재 성능이 좋지 않은 기존 ML 모델 여러 개를 개선해야 합니다. 아래 목록에서 각 모델을 개선할 올바른 정규화 방법을 선택하세요. 각 정규화 방법은 한 번, 여러 번 선택하거나 선택하지 않을 수 있습니다. (3개 선택)", "p": ["A linear regression model whose coefficients should shrink but not become zero", "A polynomial regression model with irrelevant polynomial terms that should be eliminated", "A logistic regression model that has highly correlated features to eliminate highly redundant predictors"], "c": ["L1 regularization", "L2 regularization", "Early stopping"], "kp": ["계수가 줄어들어야 하지만 0이 되어서는 안 되는 선형 회귀 모델", "제거해야 할 불필요한 다항식 항이 있는 다항 회귀 모델", "상관관계가 높은 특성을 가지고 있어 중복성이 큰 예측 변수를 제거해야 하는 로지스틱 회귀 모델"], "kc": ["L1 regularization (L1 정규화)", "L2 regularization (L2 정규화)", "Early stopping (조기 종료)"], "a": [1, 0, 0], "ko": "이 문항은 세 가지 정규화 선택지를 구분하는 문제입니다. 계수는 줄어들어야 하지만 0이 되어서는 안 되는 선형 회귀 모델의 경우 L2 정규화가 정답입니다. L2 정규화는 전체 가중치의 크기를 줄이지만 계수를 정확히 0으로 만들지는 않기 때문에, 모든 예측 변수를 유지하되 영향력을 낮추고자 할 때 적합합니다. 불필요한 다항식 항을 제거해야 하는 다항 회귀 모델의 경우 L1 정규화가 정답입니다. L1 정규화는 작은 값이나 중요하지 않은 계수를 0으로 밀어내어 희소성을 만들기 때문에, 관련 없는 항을 모델에서 제거하는 효과가 있습니다. 마지막으로, 매우 상관관계가 높은 특성을 가진 로지스틱 회귀 모델에서 중복성이 높은 예측 변수를 제거해야 하는 경우에도 L1 정규화가 가장 적절합니다. L2 정규화도 특성 간 상관관계가 높을 때 가중치를 안정화하는 데 도움이 될 수 있지만, 문제에서 명시적으로 중복 예측 변수를 제거해야 한다고 했으므로, 계수를 0으로 만들어 불필요한 예측 변수를 제거할 수 있는 L1 정규화가 요구 사항에 더 잘 부합합니다.", "en": "Linear regression model whose coefficients should shrink but not become zero The answer: L2 regularization AWS says L2 produces smaller overall weight values and is the right fit when coefficients should be reduced without being forced to zero. Polynomial regression model with irrelevant polynomial terms that should be eliminated The answer: L1 regularization AWS says L1 reduces the number of features used by pushing small weights to zero, which matches elimination of irrelevant terms. Logistic regression model that has highly correlated features to eliminate highly redundant predictors The answer: L1 regularization This is the nuanced one. AWS says L2 stabilizes weights when there is high correlation between features, but because the question explicitly says eliminate highly redundant predictors, L1 is the better match since it creates sparsity and removes predictors by zeroing coefficients."}, {"n": 203, "t": "match", "q": "A company needs to combine data from multiple sources. The company must use Amazon Redshift Serverless to query an AWS Glue Data Catalog database and underlying data that is stored in an Amazon S3 bucket. Select and order the correct steps from the following list to meet these requirements. Select each step one time or not at all. (Select and order three.)", "kq": "어떤 회사가 여러 소스의 데이터를 결합해야 합니다. 회사는 Amazon Redshift Serverless를 사용해 AWS Glue Data Catalog 데이터베이스와 Amazon S3 버킷에 저장된 기본 데이터를 쿼리해야 합니다. 요구 사항을 충족할 올바른 단계를 아래 목록에서 선택해 순서대로 배치하세요. 각 단계는 한 번만 선택하거나 선택하지 않습니다. (3개 선택 및 순서 배치)", "p": ["Step 1", "Step 2", "Step 3"], "c": ["Attach the IAM role to the Redshift cluster.", "Attach the IAM role to the Redshift namespace.", "Create an external database in Amazon Redshift to point to the Data Catalog schema.", "Create an external schema in Amazon Redshift to point to the Data Catalog database.", "Create an IAM role for Amazon Redshift to use to access only the S3 bucket that contains underlying data.", "Create an IAM role for Amazon Redshift to use to access the Data Catalog and the S3 bucket that contains underlying data."], "kp": ["1단계", "2단계", "3단계"], "kc": ["IAM 역할을 Redshift 클러스터에 연결한다.", "IAM 역할을 Redshift 네임스페이스에 연결한다.", "Data Catalog 스키마를 가리키는 외부 데이터베이스를 Amazon Redshift에 만든다.", "Data Catalog 데이터베이스를 가리키는 외부 스키마를 Amazon Redshift에 만든다.", "기본 데이터가 있는 S3 버킷에만 접근할 수 있는 Amazon Redshift용 IAM 역할을 만든다.", "Data Catalog와 기본 데이터가 있는 S3 버킷에 접근할 수 있는 Amazon Redshift용 IAM 역할을 만든다."], "a": [5, 1, 3], "ko": "1단계는 Amazon Redshift가 Data Catalog와 기본 데이터가 저장된 S3 버킷에 접근할 수 있도록 IAM 역할을 생성하는 것입니다. 이 역할에는 glue:GetDatabase, glue:GetTables와 같은 AWS Glue Data Catalog 권한과 기본 데이터가 저장된 Amazon S3 버킷에 대한 권한이 포함되어야 합니다. 2단계는 이 IAM 역할을 Redshift 네임스페이스에 연결하는 것입니다. Redshift Serverless는 클러스터가 아니라 네임스페이스를 사용하므로, 외부 데이터를 쿼리할 때 Redshift가 해당 역할을 수임할 수 있도록 역할을 네임스페이스에 연결해야 합니다. 3단계는 Amazon Redshift에서 Data Catalog 데이터베이스를 가리키는 외부 스키마를 생성하는 것입니다. 외부 스키마는 Redshift를 Glue Data Catalog 데이터베이스와 매핑하여 Redshift가 S3에 저장된 테이블을 쿼리할 수 있도록 해줍니다.", "en": "Step 1 Create an IAM role for Amazon Redshift to use to access the Data Catalog and the S3 bucket that contains underlying data. This role must include: Permissions for AWS Glue Data Catalog (e.g., glue:GetDatabase, glue:GetTables) Permissions for the Amazon S3 bucket that stores the underlying dataStep 2 Attach the IAM role to the Redshift namespace. Redshift Serverless uses a namespace, not a cluster, so the role must be associated with the namespace to allow Redshift to assume it when querying external data. Step 3 Create an external schema in Amazon Redshift to point to the Data Catalog database. The external schema maps Redshift to the Glue Data Catalog database so Redshift can query the tables stored in S3."}, {"n": 204, "t": "single", "q": "A company needs to host a custom ML model to perform forecast analysis. The forecast analysis will occur with predictable and sustained load during the same 2-hour period every day. Multiple invocations during the analysis period will require quick responses. The company needs AWS to manage the underlying infrastructure and any auto scaling activities. Which solution will meet these requirements?", "kq": "어떤 회사가 예측 분석을 수행하기 위해 사용자 지정 ML 모델을 호스팅해야 합니다. 예측 분석은 매일 같은 2시간 동안 예측 가능하고 지속적인 부하로 발생합니다. 분석 기간 중 여러 번의 호출에 빠른 응답이 필요합니다. 회사는 AWS가 기본 인프라와 Auto Scaling 활동을 관리해 주기를 원합니다. 어떤 솔루션이 이러한 요구 사항을 충족할까요?", "o": [{"k": "A", "t": "Schedule an Amazon SageMaker batch transform job by using AWS Lambda.", "kt": "AWS Lambda로 Amazon SageMaker 배치 변환 작업을 예약합니다."}, {"k": "B", "t": "Configure an Auto Scaling group of Amazon EC2 instances to use scheduled scaling.", "kt": "예약 스케일링을 사용하도록 Amazon EC2 인스턴스 Auto Scaling 그룹을 구성합니다."}, {"k": "C", "t": "Use Amazon SageMaker Serverless Inference with provisioned concurrency.", "kt": "프로비저닝된 동시성을 적용한 Amazon SageMaker Serverless Inference를 사용합니다."}, {"k": "D", "t": "Run the model on an Amazon Elastic Kubernetes Service (Amazon EKS) cluster on Amazon EC2 with pod auto scaling.", "kt": "파드 Auto Scaling이 적용된 Amazon EC2 기반 Amazon EKS 클러스터에서 모델을 실행합니다."}], "a": ["C"], "ko": "SageMaker Serverless Inference는 예측 가능하지만 간헐적으로 발생하는 워크로드에 적합합니다. 프로비저닝된 동시성을 활성화하면 수요가 높은 2시간 동안 여러 호출에 빠르게 응답할 수 있습니다. AWS가 기본 인프라와 확장을 관리하므로 운영 부담을 최소화하면서 성능 요구 사항을 충족할 수 있습니다. 또한 사용하지 않는 시간에는 축소되므로 비용 효율적입니다.", "en": "SageMaker Serverless Inference is ideal for workloads with predictable, intermittent demand. By enabling provisioned concurrency, the model can handle multiple invocations quickly during the high- demand 2-hour period. AWS manages the underlying infrastructure and scaling, ensuring the solution meets performance requirements with minimal operational overhead. This approach is cost-effective since it scales down when not in use."}, {"n": 205, "t": "single", "q": "A company needs to analyze a large dataset that is stored in Amazon S3 in Apache Parquet format. The company wants to use one-hot encoding for some of the columns. The company needs a no-code solution to transform the data. The solution must store the transformed data back to the same S3 bucket for model training. Which solution will meet these requirements?", "kq": "어떤 회사가 Amazon S3에 Apache Parquet 형식으로 저장된 대규모 데이터셋을 분석해야 합니다. 회사는 일부 컬럼에 원-핫 인코딩을 사용하려고 합니다. 회사는 데이터를 변환할 노코드 솔루션이 필요합니다. 또한 솔루션은 모델 학습을 위해 변환된 데이터를 같은 S3 버킷에 다시 저장해야 합니다. 어떤 솔루션이 이러한 요구 사항을 충족할까요?", "o": [{"k": "A", "t": "Configure an AWS Glue DataBrew project that connects to the data. Use the DataBrew interactive interface to create a recipe that performs the one-hot encoding transformation. Create a job to apply the transformation and write the output back to an S3 bucket.", "kt": "데이터에 연결되는 AWS Glue DataBrew 프로젝트를 구성합니다. DataBrew 대화형 인터페이스로 원-핫 인코딩 변환을 수행하는 레시피를 만듭니다. 변환을 적용하고 출력을 S3 버킷에 다시 쓰는 작업을 만듭니다."}, {"k": "B", "t": "Use Amazon Athena SQL queries to perform the one-hot encoding transformation.", "kt": "Amazon Athena SQL 쿼리로 원-핫 인코딩 변환을 수행합니다."}, {"k": "C", "t": "Use an AWS Glue ETL interactive notebook to perform the transformation.", "kt": "AWS Glue ETL 대화형 노트북으로 변환을 수행합니다."}, {"k": "D", "t": "Use Amazon Redshift Spectrum to perform the transformation.", "kt": "Amazon Redshift Spectrum으로 변환을 수행합니다."}], "a": ["A"], "ko": "AWS Glue DataBrew는 분석 및 머신러닝을 위한 노코드 및 로우코드 데이터 준비를 제공하도록 설계된 서비스입니다. Apache Parquet와 같은 일반 파일 형식을 지원하며 Amazon S3와 직접 통합됩니다. DataBrew를 사용하면 코드를 작성하지 않고도 원-핫 인코딩과 같은 변환을 시각적으로 recipe로 만들 수 있습니다. recipe가 정의되면 DataBrew 작업을 실행해 데이터셋을 처리하고 변환된 결과를 다시 Amazon S3에 저장할 수 있습니다. B, C, D안은 모두 SQL 또는 코드 작성이 필요하므로 노코드 요구 사항에 맞지 않습니다. 따라서 DataBrew를 사용하는 A안이 정답입니다.", "en": "AWS Glue DataBrew is specifically designed to provide no-code and low-code data preparation for analytics and machine learning. It supports common file formats such as Apache Parquet and integrates directly with Amazon S3. Using DataBrew, users can visually create recipes that apply transformations such as one-hot encoding without writing any code. Once the recipe is defined, a DataBrew job can be run to process the dataset and store the transformed output back into Amazon S3. Options B, C, and D all require writing SQL or code, which violates the no-code requirement. AWS documentation clearly identifies DataBrew as the correct service for interactive, visual data transformation at scale. Therefore, Option A is the correct solution."}, {"n": 206, "t": "single", "q": "A company is building an enterprise AI platform. The company must catalog models for production, manage model versions, and associate metadata such as training metrics with models. The company needs to eliminate the burden of managing different versions of models. Which solution will meet these requirements?", "kq": "어떤 회사가 엔터프라이즈 AI 플랫폼을 구축하고 있습니다. 회사는 운영용 모델을 카탈로그화하고, 모델 버전을 관리하고, 학습 지표 같은 메타데이터를 모델과 연결해야 합니다. 회사는 서로 다른 모델 버전을 관리하는 부담을 없애야 합니다. 어떤 솔루션이 이러한 요구 사항을 충족할까요?", "o": [{"k": "A", "t": "Use the Amazon SageMaker Model Registry to catalog the models. Create unique tags for each model version. Create key-value pairs to maintain associated metadata.", "kt": "Amazon SageMaker Model Registry로 모델을 카탈로그화합니다. 각 모델 버전에 고유한 태그를 만듭니다. 연결된 메타데이터를 유지하기 위해 키-값 쌍을 만듭니다."}, {"k": "B", "t": "Use the Amazon SageMaker Model Registry to catalog the models. Create model groups for each model to manage the model versions and to maintain associated metadata.", "kt": "Amazon SageMaker Model Registry로 모델을 카탈로그화합니다. 각 모델에 대해 모델 그룹을 만들어 모델 버전을 관리하고 연결된 메타데이터를 유지합니다."}, {"k": "C", "t": "Create a separate Amazon Elastic Container Registry (Amazon ECR) repository for each model. Use the repositories to catalog the models and to manage model versions and associated metadata.", "kt": "각 모델마다 별도의 Amazon ECR 리포지토리를 만듭니다. 이 리포지토리를 사용해 모델을 카탈로그화하고 모델 버전과 연결된 메타데이터를 관리합니다."}, {"k": "D", "t": "Create a separate Amazon Elastic Container Registry (Amazon ECR) repository for each model. Create unique tags for each model version. Create key-value pairs to maintain associated metadata.", "kt": "각 모델마다 별도의 Amazon ECR 리포지토리를 만듭니다. 각 모델 버전에 고유한 태그를 만듭니다. 연결된 메타데이터를 유지하기 위해 키-값 쌍을 만듭니다."}], "a": ["B"], "ko": "정답은 B입니다. Amazon SageMaker Model Registry를 사용해 모델을 카탈로그화하고, 각 모델에 대해 모델 그룹을 생성하여 모델 버전과 관련 메타데이터를 관리하는 방식입니다. SageMaker Model Registry는 운영급 ML 모델 수명주기 관리를 위해 설계된 SageMaker 내 관리형 저장소입니다. 모델을 카탈로그화하고, 여러 버전을 추적하며, 학습 지표·하이퍼파라미터·모델 아티팩트 같은 풍부한 메타데이터를 연결하고, 배포 워크플로를 확장 가능하고 통제된 방식으로 관리할 수 있습니다. 모델 그룹은 특정 모델의 모든 버전을 담는 컨테이너 역할을 하며, 재현성, 감사, 단계 간 승격 자동화를 지원합니다. A안은 Model Registry를 사용하더라도 태그와 키-값 쌍에 수동으로 의존하므로 구조화된 버전 관리가 부족하고 오류가 발생하기 쉽습니다. C와 D안의 Amazon ECR은 컨테이너 이미지를 저장할 수는 있지만 ML 특화 메타데이터, 버전 관리, 승인 워크플로 기능을 제공하지 않습니다. 따라서 Model Registry와 모델 그룹을 사용하는 방식이 엔터프라이즈 규모 모델 카탈로그화와 버전 관리에 대한 AWS 권장 접근 방식입니다.", "en": "The correct answer is B. Use the Amazon SageMaker Model Registry to catalog the models. Create model groups for each model to manage the model versions and to maintain associated metadata. The Amazon SageMaker Model Registry is a managed repository within SageMaker designed specifically for production-grade ML model lifecycle management. It allows organizations to catalog models, track multiple versions of a model, associate rich metadata, and manage deployment workflows in a scalable, controlled manner. Each model can belong to a model group, which acts as a container for all versions of that particular model. Versions can store training metrics, hyperparameters, model artifacts, and other key metadata, enabling reproducibility, auditing, and automated promotion between stages (e.g., Staging → Production). Option A, while using the Model Registry, relies on manually tagging versions and creating key-value pairs to store metadata. This approach is error-prone, lacks structured versioning, and does not integrate with SageMaker's deployment pipelines. Options C and D suggest using Amazon ECR repositories. While ECR can store containerized model artifacts, it is not designed for ML-specific metadata, versioning, or automated model stage transitions. Using ECR alone would require custom-built solutions for metadata management, auditing, and version tracking, adding unnecessary operational overhead. By leveraging the Model Registry with model groups, organizations can automate promotions, apply approval workflows, and track lineage efficiently, fully aligning with AWS best practices for ML model development and production readiness. This ensures compliance, reproducibility, and reduces operational complexity in enterprise AI platforms. Using the Model Registry and model groups is the standard AWS-recommended approach for enterprise-scale model cataloging and version control, enabling teams to focus on model improvement rather than infrastructure management."}, {"n": 207, "t": "single", "q": "An ML engineer uses one ML framework to train multiple ML models. The ML engineer needs to optimize inference costs and host the models on Amazon SageMaker AI. Which solution will meet these requirements MOST cost-effectively?", "kq": "ML 엔지니어가 하나의 ML 프레임워크로 여러 개의 ML 모델을 학습시킵니다. ML 엔지니어는 추론 비용을 최적화하고 이 모델들을 Amazon SageMaker AI에 호스팅해야 합니다. 어떤 솔루션이 가장 비용 효율적으로 이러한 요구 사항을 충족할까요?", "o": [{"k": "A", "t": "Create a multi-container inference endpoint for direct invocation.", "kt": "직접 호출용 다중 컨테이너 추론 엔드포인트를 만듭니다."}, {"k": "B", "t": "Create a multi-model inference endpoint for all the models.", "kt": "모든 모델을 위한 다중 모델 추론 엔드포인트를 만듭니다."}, {"k": "C", "t": "Create a multi-container inference endpoint for sequential invocation.", "kt": "순차 호출용 다중 컨테이너 추론 엔드포인트를 만듭니다."}, {"k": "D", "t": "Create multiple single-model inference endpoints for each model.", "kt": "각 모델마다 단일 모델 추론 엔드포인트를 여러 개 만듭니다."}], "a": ["B"], "ko": "Amazon SageMaker 다중 모델 엔드포인트(MME)는 하나의 엔드포인트 뒤에서 여러 모델을 호스팅하고, 필요할 때 모델을 동적으로 메모리에 로드하도록 설계되어 있습니다. AWS 문서에서도 여러 모델이 동일한 ML 프레임워크와 추론 컨테이너를 공유하는 경우 비용 효율적인 솔루션으로 MME를 권장합니다. MME는 호출된 모델만 Amazon S3에서 로드하고, 사용하지 않는 모델은 자동으로 언로드하므로 필요한 인스턴스 수를 크게 줄일 수 있습니다. 다중 컨테이너 엔드포인트는 추론 파이프라인이나 앙상블에 적합하며 모든 컨테이너가 시작 시 로드되어 비용이 증가할 수 있습니다. 모델별 개별 엔드포인트를 배포하면 인프라가 중복되어 비용이 가장 높습니다. 따라서 B안이 가장 비용 효율적인 정답입니다.", "en": "Amazon SageMaker multi-model endpoints (MME) are designed to host multiple models behind a single endpoint, dynamically loading models into memory on demand. AWS documentation explicitly recommends MME as the most cost-effective solution when multiple models share the same ML framework and inference container. With MME, SageMaker loads models from Amazon S3 only when they are invoked and unloads idle models automatically. This dramatically reduces the number of instances required and avoids paying for always-on resources for infrequently used models. Multi-container endpoints are intended for inference pipelines or ensembles and require all containers to be loaded at startup, which increases cost. Deploying separate endpoints for each model results in the highest cost due to duplicated infrastructure. AWS best practices clearly position multi-model endpoints as the optimal choice for reducing inference costs when hosting many models with similar runtime requirements. Therefore, Option B is the correct and AWS-verified solution."}, {"n": 209, "t": "single", "q": "An ML engineer decides to use Amazon SageMaker AI automated model tuning (AMT) for hyperparameter optimization (HPO). The ML engineer requires a tuning strategy that uses regression to slowly and sequentially select the next set of hyperparameters based on previous runs. The strategy must work across small hyperparameter ranges. Which solution will meet these requirements?", "kq": "ML 엔지니어가 하이퍼파라미터 최적화(HPO)를 위해 Amazon SageMaker AI 자동 모델 튜닝(AMT)을 사용하기로 결정했습니다. ML 엔지니어는 회귀를 사용해 이전 실행 결과를 기반으로 다음 하이퍼파라미터 세트를 천천히 순차적으로 선택하는 튜닝 전략이 필요합니다. 이 전략은 좁은 하이퍼파라미터 범위에서도 동작해야 합니다. 어떤 솔루션이 이러한 요구 사항을 충족할까요?", "o": [{"k": "A", "t": "Grid search", "kt": "그리드 탐색(Grid search)"}, {"k": "B", "t": "Random search", "kt": "무작위 탐색(Random search)"}, {"k": "C", "t": "Bayesian optimization", "kt": "베이지안 최적화(Bayesian optimization)"}, {"k": "D", "t": "Hyperband", "kt": "Hyperband"}], "a": ["C"], "ko": "Amazon SageMaker 자동 모델 튜닝은 여러 하이퍼파라미터 탐색 전략을 지원합니다. 베이지안 최적화는 회귀 기법을 사용하여 하이퍼파라미터와 목적 지표 간의 관계를 모델링하도록 설계되어 있습니다. 이전 학습 작업 결과를 기반으로 모델 성능을 개선할 가능성이 높은 하이퍼파라미터 조합을 예측하고 이를 다음에 평가합니다. AWS 문서에서도 탐색 공간이 작거나 중간 규모이고 학습 작업 비용이 큰 경우 베이지안 최적화를 권장합니다. 이전 실행 결과를 학습하므로 가능성이 낮은 구성에 리소스를 낭비하지 않고 효율적으로 수렴할 수 있습니다. 그리드 탐색은 모든 조합을 평가하므로 비효율적이고, 랜덤 탐색은 이전 실행 정보를 활용하지 않습니다. Hyperband는 조기 종료와 리소스 할당에 초점을 두며 회귀 기반 순차 선택 전략은 아닙니다. 따라서 C안이 정답입니다.", "en": "Amazon SageMaker Automated Model Tuning supports several hyperparameter search strategies. Bayesian optimization is explicitly designed to model the relationship between hyperparameters and objective metrics using regression techniques. Based on results from previous training jobs, Bayesian optimization predicts which hyperparameter combinations are most likely to improve model performance and evaluates those next. AWS documentation highlights Bayesian optimization as the preferred strategy when the hyperparameter search space is small to medium and when training jobs are expensive. Because the algorithm learns from prior runs, it avoids wasting resources on unpromising configurations and converges efficiently. Grid search exhaustively evaluates all combinations and becomes inefficient even with moderately sized search spaces. Random search does not use information from prior runs and is less efficient. Hyperband focuses on aggressive early stopping and resource allocation, not regression-based sequential selection. Therefore, Option C is the correct and AWS-verified solution."}, {"n": 210, "t": "single", "q": "A company has an application that uses different APIs to generate embeddings for input text. The company needs to implement a solution to automatically rotate the API tokens every 3 months. Which solution will meet this requirement?", "kq": "어떤 회사가 입력 텍스트의 임베딩을 생성하기 위해 여러 API를 사용하는 애플리케이션을 보유하고 있습니다. 회사는 3개월마다 API 토큰을 자동으로 교체하는 솔루션을 구현해야 합니다. 어떤 솔루션이 이 요구 사항을 충족할까요?", "o": [{"k": "A", "t": "Store the tokens in AWS Secrets Manager. Create an AWS Lambda function to perform the rotation.", "kt": "토큰을 AWS Secrets Manager에 저장합니다. 교체를 수행하는 AWS Lambda 함수를 만듭니다."}, {"k": "B", "t": "Store the tokens in AWS Systems Manager Parameter Store. Create an AWS Lambda function to perform the rotation.", "kt": "토큰을 AWS Systems Manager Parameter Store에 저장합니다. 교체를 수행하는 AWS Lambda 함수를 만듭니다."}, {"k": "C", "t": "Store the tokens in AWS Key Management Service (AWS KMS). Use an AWS managed key to perform the rotation.", "kt": "토큰을 AWS KMS에 저장합니다. AWS 관리형 키를 사용해 교체를 수행합니다."}, {"k": "D", "t": "Store the tokens in AWS Key Management Service (AWS KMS). Use an AWS owned key to perform the rotation.", "kt": "토큰을 AWS KMS에 저장합니다. AWS 소유 키를 사용해 교체를 수행합니다."}], "a": ["A"], "ko": "AWS Secrets Manager는 API 토큰을 포함한 비밀 정보를 안전하게 저장, 관리, 자동 교체하도록 설계된 서비스입니다. 사용자 지정 교체 로직을 수행하는 Lambda 함수를 구성하면 요구 사항에 따라 3개월마다 API 토큰을 자동으로 교체할 수 있습니다. Secrets Manager는 비밀 관리 기능을 단순화하고 다른 AWS 서비스와 원활하게 통합되므로 이 사용 사례에 가장 적합한 선택입니다.", "en": "AWS Secrets Manager is designed for securely storing, managing, and automatically rotating secrets, including API tokens. By configuring a Lambda function for custom rotation logic, the solution can automatically rotate the API tokens every 3 months as required. Secrets Manager simplifies secret management and integrates seamlessly with other AWS services, making it the ideal choice for this use case."}, {"n": 211, "t": "single", "q": "A company is developing an ML model for a customer. The training data is stored in an Amazon S3 bucket in the customer's AWS account (Account A). The company runs Amazon SageMaker AI training jobs in a separate AWS account (Account B). The company defines an S3 bucket policy and an IAM policy to allow reads to the S3 bucket. Which additional steps will meet the cross-account access requirement?", "kq": "어떤 회사가 고객을 위한 ML 모델을 개발하고 있습니다. 학습 데이터는 고객의 AWS 계정(계정 A)에 있는 Amazon S3 버킷에 저장되어 있습니다. 회사는 별도의 AWS 계정(계정 B)에서 Amazon SageMaker AI 학습 작업을 실행합니다. 회사는 S3 버킷 읽기를 허용하기 위해 S3 버킷 정책과 IAM 정책을 정의합니다. 교차 계정 접근 요구 사항을 충족하는 추가 단계는 무엇입니까?", "o": [{"k": "A", "t": "Create the S3 bucket policy in Account A. Attach the IAM policy to an IAM role that SageMaker AI uses in Account A.", "kt": "계정 A에 S3 버킷 정책을 만듭니다. 계정 A에서 SageMaker AI가 사용하는 IAM 역할에 IAM 정책을 연결합니다."}, {"k": "B", "t": "Create the S3 bucket policy in Account A. Attach the IAM policy to an IAM role that SageMaker AI uses in Account B.", "kt": "계정 A에 S3 버킷 정책을 만듭니다. 계정 B에서 SageMaker AI가 사용하는 IAM 역할에 IAM 정책을 연결합니다."}, {"k": "C", "t": "Create the S3 bucket policy in Account B. Attach the IAM policy to an IAM role that SageMaker AI uses in Account A.", "kt": "계정 B에 S3 버킷 정책을 만듭니다. 계정 A에서 SageMaker AI가 사용하는 IAM 역할에 IAM 정책을 연결합니다."}, {"k": "D", "t": "Create the S3 bucket policy in Account B. Attach the IAM policy to an IAM role that SageMaker AI uses in Account B.", "kt": "계정 B에 S3 버킷 정책을 만듭니다. 계정 B에서 SageMaker AI가 사용하는 IAM 역할에 IAM 정책을 연결합니다."}], "a": ["B"], "ko": "계정 간 Amazon S3 접근에는 두 가지 구성이 필요합니다. 첫째, 버킷을 소유한 계정(Account A)에 S3 버킷 정책을 생성하여 다른 계정의 주체에게 접근 권한을 부여해야 합니다. 둘째, 데이터를 사용하는 계정(Account B)에 있는 SageMaker 실행 역할에 해당 버킷을 읽을 수 있는 IAM 정책을 연결해야 합니다. SageMaker 학습 작업은 작업이 실행되는 계정의 IAM 역할을 사용하므로, 이 경우 IAM 정책은 Account B의 SageMaker 실행 역할에 연결되어야 합니다. 반면 S3 버킷 정책은 버킷 소유자인 Account A에 있어야 하며, Account B의 IAM 역할이 학습 데이터를 읽도록 명시적으로 허용해야 합니다. 다른 선택지는 정책이 잘못된 계정에 있거나 SageMaker가 실제로 사용하는 역할이 아니므로 요구 사항을 충족하지 못합니다. 따라서 B안이 정답입니다.", "en": "For cross-account Amazon S3 access, AWS requires two components: An S3 bucket policy in the owning account (Account A) that grants access to a principal in another account An IAM role policy in the consuming account (Account B) that allows the service to access the bucket Amazon SageMaker training jobs assume an IAM role in the account where the job runs-in this case, Account B. Therefore, the IAM policy must be attached to the SageMaker execution role in Account B. The S3 bucket policy must reside in Account A because bucket policies are owned and enforced by the bucket owner. This policy explicitly allows the IAM role from Account B to read the training data. Any other combination fails either because the policy is in the wrong account or because the role is not the one used by SageMaker. AWS documentation clearly describes this pattern as the correct way to grant cross-account access for SageMaker training jobs. Therefore, Option B is the correct and AWS-aligned solution."}, {"n": 213, "t": "single", "q": "An ML engineer is configuring auto scaling for an inference component of a model that runs behind an Amazon SageMaker AI endpoint. The ML engineer configures SageMaker AI auto scaling with a target tracking scaling policy set to 100 invocations per model per minute. The SageMaker AI endpoint scales appropriately during normal business hours. However, the ML engineer notices that at the start of each business day, there are zero instances available to handle requests, which causes delays in processing. The ML engineer must ensure that the SageMaker AI endpoint can handle incoming requests at the start of each business day. Which solution will meet this requirement?", "kq": "ML 엔지니어가 Amazon SageMaker AI 엔드포인트 뒤에서 실행되는 모델의 추론 구성 요소에 Auto Scaling을 구성하고 있습니다. ML 엔지니어는 모델당 분당 100회 호출을 목표로 하는 대상 추적 스케일링 정책으로 SageMaker AI Auto Scaling을 구성했습니다. SageMaker AI 엔드포인트는 정상 업무 시간에는 적절히 확장됩니다. 그러나 ML 엔지니어는 매 영업일 시작 시점에 요청을 처리할 수 있는 인스턴스가 0개여서 처리 지연이 발생하는 것을 확인했습니다. ML 엔지니어는 SageMaker AI 엔드포인트가 매 영업일 시작 시점에 들어오는 요청을 처리할 수 있도록 해야 합니다. 어떤 솔루션이 이 요구 사항을 충족할까요?", "o": [{"k": "A", "t": "Reduce the SageMaker AI auto scaling cooldown period to the minimum supported value. Add an auto scaling lifecycle hook to scale the SageMaker AI instances.", "kt": "SageMaker AI Auto Scaling 쿨다운 기간을 지원되는 최소값으로 줄입니다. SageMaker AI 인스턴스를 확장하는 Auto Scaling 수명 주기 후크를 추가합니다."}, {"k": "B", "t": "Change the target metric to CPU utilization.", "kt": "대상 지표를 CPU 사용률로 변경합니다."}, {"k": "C", "t": "Modify the scaling policy target value to one.", "kt": "스케일링 정책의 목표값을 1로 수정합니다."}, {"k": "D", "t": "Apply a step scaling policy that scales based on an Amazon CloudWatch alarm. Apply a second CloudWatch alarm and scaling policy to scale the minimum number of instances from zero to one at the start of each business day.", "kt": "Amazon CloudWatch 알람을 기반으로 확장하는 단계 스케일링 정책을 적용합니다. 매 영업일 시작 시점에 최소 인스턴스 수를 0에서 1로 늘리는 두 번째 CloudWatch 알람과 스케일링 정책을 적용합니다."}], "a": ["D"], "ko": "이 문제는 대상 추적 자동 확장이 엔드포인트를 0개 인스턴스까지 축소할 수 있고, 트래픽이 도착한 후에야 확장이 시작되기 때문에 발생합니다. 업무 시작 시점에는 실행 중인 인스턴스가 없으므로 첫 요청에서 콜드 스타트 지연이 발생합니다. AWS 문서에서는 예측 가능한 트래픽 패턴이 있는 경우 예약 또는 단계 조정 정책을 사용할 것을 권장합니다. 이 경우 업무 시간이 예측 가능하므로 트래픽이 도착하기 전에 엔드포인트를 미리 확장하는 것이 모범 사례입니다. D안은 CloudWatch 경보와 단계 조정 정책을 사용해 업무 시작 시 최소 인스턴스 수를 0에서 1로 늘리므로, 최소 하나의 준비된 인스턴스가 요청을 즉시 처리할 수 있습니다. A, B, C안은 트래픽이 시작되기 전에 인스턴스 가용성을 보장하지 못합니다. 따라서 CloudWatch 경보 기반 단계 조정 정책을 사용하는 D안이 정답입니다.", "en": "This issue occurs because target tracking auto scaling allows the endpoint to scale down to zero, and scaling up only happens after traffic arrives. At the start of the business day, no instances are running, so the first requests experience cold-start delays. AWS documentation for Amazon SageMaker recommends using scheduled or step scaling policies when predictable traffic patterns exist. In this case, business hours are predictable, so the best practice is to proactively scale the endpoint before traffic arrives. Option D correctly uses Amazon CloudWatch alarms with step scaling to increase the minimum instance count from zero to one at the start of the business day. This ensures at least one warm instance is ready to handle requests immediately, eliminating startup latency. Options A, B, and C do not guarantee instance availability before traffic begins. Cooldown tuning and metric changes only react after load is detected. Therefore, scheduled step scaling using CloudWatch alarms is the correct solution."}, {"n": 214, "t": "single", "q": "An ML engineer uses an Amazon SageMaker AI notebook instance to run a training job that trains a neural network model with an estimator. The training job loads data iteratively from an Amazon S3 path that is configured as an environment variable. The ML engineer viewed a profiling report of the training job. The ML engineer discovered that a substantial amount of the training time is spent during data loading. How can the ML engineer improve the training speed?", "kq": "ML 엔지니어가 Amazon SageMaker AI 노트북 인스턴스를 사용해 estimator로 신경망 모델을 학습시키는 작업을 실행합니다. 이 학습 작업은 환경 변수로 구성된 Amazon S3 경로에서 데이터를 반복적으로 로드합니다. ML 엔지니어가 학습 작업의 프로파일링 보고서를 확인한 결과, 학습 시간의 상당 부분이 데이터 로딩에 소비되고 있음을 발견했습니다. 학습 속도를 개선하려면 어떻게 해야 합니까?", "o": [{"k": "A", "t": "Provision Amazon Elastic Block Store (Amazon EBS) Provisioned IOPS SSD io1 storage during the estimator initialization. Download the training data from the S3 path to Amazon EBS. Point the data loader to the EBS location.", "kt": "estimator 초기화 중에 Amazon EBS Provisioned IOPS SSD io1 스토리지를 프로비저닝합니다. S3 경로에서 Amazon EBS로 학습 데이터를 다운로드합니다. 데이터 로더가 EBS 위치를 가리키도록 합니다."}, {"k": "B", "t": "Provision Amazon Elastic File System (Amazon EFS) storage during the estimator initialization. Download the training data to Amazon EFS by using the S3 path. Point the data loader to the EFS location.", "kt": "estimator 초기화 중에 Amazon EFS 스토리지를 프로비저닝합니다. S3 경로를 사용해 Amazon EFS로 학습 데이터를 다운로드합니다. 데이터 로더가 EFS 위치를 가리키도록 합니다."}, {"k": "C", "t": "Download the training data to the estimator by using fast file mode. Point the data loader to the location specified by the S3 path.", "kt": "빠른 파일 모드를 사용해 estimator로 학습 데이터를 다운로드합니다. 데이터 로더가 S3 경로로 지정된 위치를 가리키도록 합니다."}, {"k": "D", "t": "Configure the path to the S3 bucket that contains the training data as a hyperparameter instead of an environment variable.", "kt": "학습 데이터가 있는 S3 버킷 경로를 환경 변수 대신 하이퍼파라미터로 구성합니다."}], "a": ["C"], "ko": "정답은 C입니다. SageMaker의 fast file mode를 사용해 학습 데이터를 estimator로 가져오고, 데이터 로더가 S3 경로에 해당하는 위치를 참조하도록 설정하는 방식입니다. 신경망 모델 학습에서는 대규모 데이터를 S3에서 반복적으로 읽을 때 I/O가 병목이 될 수 있습니다. fast file mode는 학습 전에 데이터를 로컬 컴퓨팅 인스턴스에 캐시하여, 모델이 네트워크를 통해 S3에서 반복적으로 데이터를 가져오는 대신 로컬 스토리지에서 빠르게 읽을 수 있게 합니다. 이 방식은 데이터 로딩 지연을 크게 줄이고 전체 학습 속도를 개선합니다. A안은 EBS 성능을 높일 수 있지만 수동 복사 및 구성이 필요해 운영 부담이 큽니다. B안의 EFS는 네트워크 기반 I/O로 신경망 학습의 고처리량 순차 읽기에 최적화되어 있지 않습니다. D안은 S3 경로 전달 방식만 바꾸는 것으로 I/O 성능에는 영향을 주지 않습니다. 따라서 fast file mode를 사용하는 C안이 적절합니다.", "en": "The correct answer is C. Download the training data to the estimator by using fast file mode. Point the data loader to the location specified by the S3 path. When training neural network models in Amazon SageMaker, I/O operations can become a bottleneck, especially when reading large datasets directly from S3. SageMaker provides a fast file mode that allows the training job to cache data locally on the compute instance before training. This significantly reduces data- loading latency, as the model can access the data from local storage instead of repeatedly fetching it over the network from S3. Fast file mode automatically handles staged caching of S3 data in the container's file system or attached EBS volumes, ensuring that the estimator sees high-throughput access to the dataset. This approach improves overall training speed without requiring manual configuration of EBS or EFS volumes. Option A, provisioning EBS with io1 storage, may increase I/O performance but requires manual copying of the data and adds operational complexity. Option B, using EFS, introduces network-based I/O overhead and is not optimized for high-throughput sequential reads, which are typical in neural network training. Option D, changing the S3 path to a hyperparameter, has no effect on I/O performance or data-loading speed-it is merely a way to pass metadata to the training job. Using fast file mode is AWS-recommended when profiling shows that training is bottlenecked by data access. It provides a managed, high-throughput, low-latency caching layer, allowing ML engineers to focus on model architecture and hyperparameter tuning rather than data transfer optimizations. This aligns with best practices for ML model development by reducing training time while maintaining scalability and simplicity in SageMaker training workflows."}, {"n": 215, "t": "single", "q": "An ML engineer is preparing a dataset that contains medical records to train an ML model to predict the likelihood of patients developing diseases. The dataset contains columns for patient ID, age, medical conditions, test results, and a \" Disease \" target column. How should the ML engineer configure the data to train the model?", "kq": "ML 엔지니어가 환자가 질병에 걸릴 가능성을 예측하는 ML 모델을 학습시키기 위해 의료 기록이 포함된 데이터셋을 준비하고 있습니다. 데이터셋에는 환자 ID, 나이, 병력, 검사 결과, 그리고 'Disease' 대상 컬럼이 있습니다. 모델을 학습시키기 위해 데이터를 어떻게 구성해야 합니까?", "o": [{"k": "A", "t": "Remove the patient ID column.", "kt": "환자 ID 컬럼을 제거합니다."}, {"k": "B", "t": "Remove the age column.", "kt": "나이 컬럼을 제거합니다."}, {"k": "C", "t": "Remove the medical conditions and test results columns.", "kt": "병력과 검사 결과 컬럼을 제거합니다."}, {"k": "D", "t": "Remove the \" Disease \" target column.", "kt": "'Disease' 대상 컬럼을 제거합니다."}], "a": ["A"], "ko": "Patient ID는 고유 식별자이며 예측에 의미 있는 정보를 제공하지 않습니다. 이를 모델 학습에 포함하면 모델이 의미 있는 패턴을 학습하기보다 개별 레코드를 외우는 방식으로 과적합될 수 있습니다. AWS ML 모범 사례에서도 목표 변수와 인과적으로 관련이 없는 식별자는 제거할 것을 권장합니다. 반면 나이, 의료 상태, 검사 결과는 임상적으로 관련 있는 특성이므로 유지해야 합니다. 또한 Disease 타깃 컬럼은 지도 학습에서 반드시 필요합니다. 따라서 Patient ID 컬럼을 제거하는 A안이 정답입니다.", "en": "Patient ID is a unique identifier and does not contain predictive information. Including it can cause the model to overfit by memorizing records rather than learning meaningful patterns. AWS ML best practices recommend removing identifiers that are not causally related to the target variable. Age, medical conditions, and test results are clinically relevant features and should be retained. The target column must remain for supervised learning. Therefore, Option A is the correct and AWS-aligned choice."}, {"n": 217, "t": "single", "q": "A company is exploring generative AI and wants to add a new product feature. An ML engineer is making API calls from existing Amazon EC2 instances to Amazon Bedrock. The EC2 instances are in a private subnet and must remain private during the implementation. The EC2 instances have a security group that allows access to all IP addresses in the private subnet. What should the ML engineer do to establish a connection between the EC2 instances and Amazon Bedrock?", "kq": "어떤 회사가 생성형 AI를 검토하며 새로운 제품 기능을 추가하려고 합니다. ML 엔지니어가 기존 Amazon EC2 인스턴스에서 Amazon Bedrock으로 API 호출을 수행하고 있습니다. EC2 인스턴스는 프라이빗 서브넷에 있으며 구현 중에도 계속 프라이빗이어야 합니다. EC2 인스턴스에는 프라이빗 서브넷의 모든 IP 주소에 대한 접근을 허용하는 보안 그룹이 있습니다. EC2 인스턴스와 Amazon Bedrock 간 연결을 구성하려면 어떻게 해야 합니까?", "o": [{"k": "A", "t": "Modify the security group to allow inbound and outbound traffic to and from Amazon Bedrock.", "kt": "Amazon Bedrock으로의 인바운드·아웃바운드 트래픽을 허용하도록 보안 그룹을 수정합니다."}, {"k": "B", "t": "Use AWS PrivateLink to access Amazon Bedrock through an interface VPC endpoint.", "kt": "AWS PrivateLink를 사용해 인터페이스 VPC 엔드포인트를 통해 Amazon Bedrock에 접근합니다."}, {"k": "C", "t": "Configure Amazon Bedrock to use the private subnet where the EC2 instances are deployed.", "kt": "EC2 인스턴스가 배포된 프라이빗 서브넷을 사용하도록 Amazon Bedrock을 구성합니다."}, {"k": "D", "t": "Use AWS Direct Connect to link the VPC to Amazon Bedrock.", "kt": "AWS Direct Connect를 사용해 VPC를 Amazon Bedrock에 연결합니다."}], "a": ["B"], "ko": "Amazon Bedrock은 완전 관리형 AWS 서비스이며 고객 VPC 내부에 배포되는 서비스가 아닙니다. 프라이빗 서브넷의 EC2 인스턴스가 퍼블릭 인터넷을 사용하지 않고 Bedrock에 접근하려면 AWS PrivateLink를 사용하는 것이 권장됩니다. Amazon Bedrock용 인터페이스 VPC 엔드포인트를 생성하면 EC2 인스턴스와 Bedrock 간 트래픽이 AWS 네트워크 내부에 유지됩니다. 이 방식은 프라이빗 서브넷 구성을 유지하면서 보안 요구 사항을 충족합니다. 보안 그룹만으로는 관리형 서비스 엔드포인트와의 연결을 생성할 수 없으며, Bedrock은 고객 서브넷에 배포할 수 없습니다. Direct Connect는 온프레미스 연결용이지 VPC 내부에서 AWS 관리형 서비스에 접근하기 위한 기본 방식이 아닙니다. 따라서 AWS PrivateLink를 통해 Bedrock 인터페이스 VPC 엔드포인트를 사용하는 B안이 정답입니다.", "en": "Amazon Bedrock is a fully managed AWS service and does not reside inside customer VPCs. To allow private connectivity from EC2 instances in a private subnet without using the public internet, AWS documentation recommends AWS PrivateLink. By creating an interface VPC endpoint for Amazon Bedrock, traffic between the EC2 instances and Bedrock remains entirely within the AWS network. This approach preserves the private subnet configuration and meets strict security requirements. Security groups alone cannot establish connectivity to a managed service endpoint. Amazon Bedrock cannot be deployed into a customer subnet, making Option C invalid. AWS Direct Connect is designed for on- premises connectivity, not for accessing AWS managed services from within a VPC. AWS explicitly documents that PrivateLink is the correct mechanism for private access to Amazon Bedrock. Therefore, Option B is the correct and AWS-verified answer."}, {"n": 218, "t": "single", "q": "An ML engineer needs to organize a large set of text documents into topics. The ML engineer will not know what the topics are in advance. The ML engineer wants to use built-in algorithms or pre-trained models available through Amazon SageMaker AI to process the documents. Which solution will meet these requirements?", "kq": "ML 엔지니어가 대규모 텍스트 문서 집합을 주제(topic)별로 정리해야 합니다. ML 엔지니어는 주제가 무엇인지 미리 알지 못합니다. ML 엔지니어는 Amazon SageMaker AI에서 제공하는 내장 알고리즘 또는 사전 학습 모델로 문서를 처리하려고 합니다. 어떤 솔루션이 이러한 요구 사항을 충족할까요?", "o": [{"k": "A", "t": "Use the BlazingText algorithm to identify the relevant text and to create a set of topics based on the documents.", "kt": "BlazingText 알고리즘을 사용해 관련 텍스트를 식별하고 문서를 기반으로 주제 세트를 만듭니다."}, {"k": "B", "t": "Use the Sequence-to-Sequence algorithm to summarize the text and to create a set of topics based on the documents.", "kt": "Sequence-to-Sequence 알고리즘을 사용해 텍스트를 요약하고 문서를 기반으로 주제 세트를 만듭니다."}, {"k": "C", "t": "Use the Object2Vec algorithm to create embeddings and to create a set of topics based on the embeddings.", "kt": "Object2Vec 알고리즘을 사용해 임베딩을 만들고 그 임베딩을 기반으로 주제 세트를 만듭니다."}, {"k": "D", "t": "Use the Latent Dirichlet Allocation (LDA) algorithm to process the documents and to create a set of topics based on the documents.", "kt": "LDA(Latent Dirichlet Allocation) 알고리즘을 사용해 문서를 처리하고 문서를 기반으로 주제 세트를 만듭니다."}], "a": ["D"], "ko": "이 작업은 사전에 주제가 정의되어 있지 않은 문서 집합에서 숨겨진 주제를 찾아내는 비지도 토픽 모델링 문제입니다. Lat
