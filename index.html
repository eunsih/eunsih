eployDefault.LambdaLinear10PercentEvery10Minutes"}, {"k": "B", "t": "CodeDeployDefault.ECSAllAtOnce", "kt": "CodeDeployDefault.ECSAllAtOnce"}, {"k": "C", "t": "CodeDeployDefault.ECSCanary10Percent15Minutes", "kt": "CodeDeployDefault.ECSCanary10Percent15Minutes"}, {"k": "D", "t": "CodeDeployDefault.LambdaCanary10Percent15Minutes", "kt": "CodeDeployDefault.LambdaCanary10Percent15Minutes"}], "a": ["C"], "ko": "AWS CodeDeploy는 ECS에 대해 카나리 및 선형 트래픽 전환을 지원하는 사전 정의된 배포 구성을 제공합니다. ECSCanary10Percent15Minutes 구성은 먼저 트래픽의 10%를 새 버전으로 전환하고 15분 동안 대기한 뒤 나머지 트래픽을 전환합니다. 이는 초기 10% 전환 후 지정된 10~15분 범위 내에 나머지 90%를 전환해야 한다는 요구 사항과 정확히 일치합니다. Lambda 배포 구성은 ECS에는 적용되지 않으며, ECSAllAtOnce는 점진적 트래픽 전환을 수행하지 않습니다. 따라서 CodeDeployDefault.ECSCanary10Percent15Minutes인 C안이 정답입니다.", "en": "AWS CodeDeploy provides predefined deployment configurations for ECS that support canary and linear traffic shifting. The ECSCanary10Percent15Minutes configuration shifts 10% of traffic initially, waits 15 minutes, and then shifts the remaining traffic. This matches the exact requirement: a 10% initial shift followed by the remaining 90% within the specified time window. Lambda deployment configurations are not applicable to ECS. ECSAllAtOnce does not perform gradual traffic shifting. AWS documentation explicitly defines ECSCanary10Percent15Minutes for controlled, low-risk ECS deployments. Therefore, Option C is the correct and AWS-verified answer."}, {"n": 88, "t": "single", "q": "Case study An ML engineer is developing a fraud detection model on AWS. The training dataset includes transaction logs, customer profiles, and tables from an on-premises MySQL database. The transaction logs and customer profiles are stored in Amazon S3. The dataset has a class imbalance that affects the learning of the model's algorithm. Additionally, many of the features have interdependencies. The algorithm is not capturing all the desired underlying patterns in the data. Which AWS service or feature can aggregate the data from the various data sources?", "kq": "[사례 연구] ML 엔지니어가 AWS에서 사기 탐지 모델을 개발하고 있습니다. 학습 데이터셋에는 거래 로그, 고객 프로필, 그리고 온프레미스 MySQL 데이터베이스의 테이블들이 포함됩니다. 거래 로그와 고객 프로필은 Amazon S3에 저장되어 있습니다. 데이터셋에는 모델 알고리즘의 학습에 영향을 주는 클래스 불균형이 있습니다. 또한 많은 특성들이 서로 종속되어 있습니다. 알고리즘이 데이터에 내재된 패턴을 모두 포착하지 못하고 있습니다. 여러 데이터 소스의 데이터를 집계할 수 있는 AWS 서비스 또는 기능은 무엇입니까?", "o": [{"k": "A", "t": "Amazon EMR Spark jobs", "kt": "Amazon EMR Spark 작업"}, {"k": "B", "t": "Amazon Kinesis Data Streams", "kt": "Amazon Kinesis Data Streams"}, {"k": "C", "t": "Amazon DynamoDB", "kt": "Amazon DynamoDB"}, {"k": "D", "t": "AWS Lake Formation", "kt": "AWS Lake Formation"}], "a": ["A"], "ko": "이 문제는 Amazon S3의 거래 로그와 고객 프로필, 온프레미스 MySQL 데이터베이스의 테이블 등 여러 데이터 소스를 중앙에서 처리할 수 있도록 집계해야 하는 상황입니다. 해설에서는 AWS Lake Formation이 다양한 소스의 데이터를 수집, 카탈로그화, 보호하고 AWS Glue와 연계해 ETL 워크플로를 수행할 수 있으므로 적합하다고 설명합니다. Lake Formation은 S3와 관계형 데이터베이스, 온프레미스 시스템의 데이터를 중앙 데이터 레이크로 통합하고, 검색 가능한 카탈로그로 관리하며, 이후 Athena나 SageMaker에서 분석 및 모델링에 사용할 수 있게 합니다. 또한 Glue 작업을 통해 클래스 불균형 처리나 특성 간 의존성 정리와 같은 전처리 작업을 수행할 수 있습니다. EMR Spark 작업은 대규모 분석에는 적합하지만 다양한 소스의 데이터 거버넌스와 통합을 기본적으로 제공하지 않습니다. Kinesis Data Streams는 실시간 스트리밍용이고, DynamoDB는 여러 소스 데이터를 집계하는 용도에 적합하지 않습니다. 따라서 해설의 논리상 AWS Lake Formation이 가장 적합한 서비스입니다.", "en": "Problem Description: The dataset includes multiple data sources: Transaction logs and customer profiles in Amazon S3. Tables in an on-premises MySQL database. There is a class imbalance in the dataset and interdependencies among features that need to be addressed. The solution requires data aggregation from diverse sources for centralized processing. Why AWS Lake Formation? AWS Lake Formation is designed to simplify the process of aggregating, cataloging, and securing data from various sources, including S3, relational databases, and other on-premises systems. It integrates with AWS Glue for data ingestion and ETL (Extract, Transform, Load) workflows, making it a robust choice for aggregating data from Amazon S3 and on-premises MySQL databases. How It Solves the Problem: Data Aggregation: Lake Formation collects data from diverse sources, such as S3 and MySQL, and consolidates it into a centralized data lake. Cataloging and Discovery: Automatically crawls and catalogs the data into a searchable catalog, which the ML engineer can query for analysis or modeling. Data Transformation: Prepares data using Glue jobs to handle preprocessing tasks such as addressing class imbalance (e.g., oversampling, undersampling) and handling interdependencies among features. Security and Governance: Offers fine-grained access control, ensuring secure and compliant data management. Steps to Implement Using AWS Lake Formation: Step 1: Set up Lake Formation and register data sources, including the S3 bucket and on-premises MySQL database. Step 2: Use AWS Glue to create ETL jobs to transform and prepare data for the ML pipeline. Step 3: Query and access the consolidated data lake using services such as Athena or SageMaker for further ML processing. Why Not Other Options? Amazon EMR Spark jobs: While EMR can process large-scale data, it is better suited for complex big data analytics tasks and does not inherently support data aggregation across sources like Lake Formation. Amazon Kinesis Data Streams: Kinesis is designed for real-time streaming data, not batch data aggregation across diverse sources. Amazon DynamoDB: DynamoDB is a NoSQL database and is not suitable for aggregating data from multiple sources like S3 and MySQL. Conclusion: AWS Lake Formation is the most suitable service for aggregating data from S3 and on- premises MySQL databases, preparing the data for downstream ML tasks, and addressing challenges like class imbalance and feature interdependencies. AWS Lake Formation Documentation AWS Glue for Data Preparation"}, {"n": 89, "t": "single", "q": "A company needs to give its ML engineers appropriate access to training data. The ML engineers must access training data from only their own business group. The ML engineers must not be allowed to access training data from other business groups. The company uses a single AWS account and stores all the training data in Amazon S3 buckets. All ML model training occurs in Amazon SageMaker. Which solution will provide the ML engineers with the appropriate access?", "kq": "어떤 회사가 ML 엔지니어들에게 학습 데이터에 대한 적절한 접근 권한을 부여해야 합니다. ML 엔지니어들은 자기 사업부의 학습 데이터에만 접근해야 하며, 다른 사업부의 학습 데이터에는 접근할 수 없어야 합니다. 회사는 단일 AWS 계정을 사용하고 모든 학습 데이터를 Amazon S3 버킷에 저장합니다. 모든 ML 모델 학습은 Amazon SageMaker에서 이루어집니다. ML 엔지니어들에게 적절한 접근 권한을 제공하는 방법은 무엇입니까?", "o": [{"k": "A", "t": "Enable S3 bucket versioning.", "kt": "S3 버킷 버전 관리를 활성화합니다."}, {"k": "B", "t": "Configure S3 Object Lock settings for each user.", "kt": "사용자별로 S3 Object Lock 설정을 구성합니다."}, {"k": "C", "t": "Add cross-origin resource sharing (CORS) policies to the S3 buckets.", "kt": "S3 버킷에 CORS(교차 출처 리소스 공유) 정책을 추가합니다."}, {"k": "D", "t": "Create IAM policies. Attach the policies to IAM users or IAM roles.", "kt": "IAM 정책을 만듭니다. 해당 정책을 IAM 사용자 또는 IAM 역할에 연결합니다."}], "a": ["D"], "ko": "특정 권한을 가진 IAM 정책을 생성하면 사용자의 비즈니스 그룹에 따라 Amazon S3 버킷 또는 객체에 대한 접근을 제한할 수 있습니다. 이러한 정책을 ML 엔지니어와 연결된 IAM 사용자 또는 IAM 역할에 연결하면 각 엔지니어가 자신이 속한 그룹의 학습 데이터에만 접근하도록 보장할 수 있습니다. 이 방식은 안전하고 확장 가능하며, AWS의 접근 제어 모범 사례에 부합합니다.", "en": "By creating IAM policies with specific permissions, you can restrict access to Amazon S3 buckets or objects based on the user's business group. These policies can be attached to IAM users or IAM roles associated with the ML engineers, ensuring that each engineer can only access training data belonging to their group. This approach is secure, scalable, and aligns with AWS best practices for access control."}, {"n": 90, "t": "single", "q": "An ML engineer is using Amazon SageMaker AI to train an ML model. The ML engineer needs to use SageMaker AI automatic model tuning (AMT) features to tune the model hyperparameters over a large parameter space. The model has 20 categorical hyperparameters and 7 continuous hyperparameters that can be tuned. The ML engineer needs to run the tuning job a maximum of 1,000 times. The ML engineer must ensure that each parameter trial is built based on the performance of the previous trial. Which solution will meet these requirements?", "kq": "ML 엔지니어가 Amazon SageMaker AI로 ML 모델을 학습시키고 있습니다. ML 엔지니어는 넓은 파라미터 공간에서 모델 하이퍼파라미터를 튜닝하기 위해 SageMaker AI 자동 모델 튜닝(AMT) 기능을 사용해야 합니다. 이 모델에는 튜닝 가능한 20개의 범주형 하이퍼파라미터와 7개의 연속형 하이퍼파라미터가 있습니다. ML 엔지니어는 튜닝 작업을 최대 1,000회 실행해야 합니다. 또한 각 파라미터 시도가 이전 시도의 성능을 기반으로 구성되도록 해야 합니다. 어떤 솔루션이 이러한 요구 사항을 충족할까요?", "o": [{"k": "A", "t": "Define the search space as categorical parameters of 1,000 possible combinations. Use grid search.", "kt": "탐색 공간을 1,000가지 조합의 범주형 파라미터로 정의합니다. 그리드 탐색을 사용합니다."}, {"k": "B", "t": "Define the search space as continuous parameters. Use random search. Set the maximum number of tuning jobs to 1,000.", "kt": "탐색 공간을 연속형 파라미터로 정의합니다. 무작위 탐색을 사용합니다. 최대 튜닝 작업 수를 1,000으로 설정합니다."}, {"k": "C", "t": "Define the search space as categorical parameters and continuous parameters. Use Bayesian optimization. Set the maximum number of training jobs to 1,000.", "kt": "탐색 공간을 범주형 파라미터와 연속형 파라미터로 정의합니다. 베이지안 최적화를 사용합니다. 최대 학습 작업 수를 1,000으로 설정합니다."}, {"k": "D", "t": "Define the search space as categorical parameters and continuous parameters. Use grid search. Set the maximum number of tuning jobs to 1,000.", "kt": "탐색 공간을 범주형 파라미터와 연속형 파라미터로 정의합니다. 그리드 탐색을 사용합니다. 최대 튜닝 작업 수를 1,000으로 설정합니다."}], "a": ["C"], "ko": "각 파라미터 시도가 이전 시도의 성능을 기반으로 구성되어야 한다는 요구 사항은 베이지안 최적화의 핵심 특징입니다. Amazon SageMaker Automatic Model Tuning에서 베이지안 최적화는 이전 시도 결과를 활용해 다음 하이퍼파라미터 조합을 지능적으로 선택하므로, 특히 크고 혼합된 탐색 공간에서 그리드 탐색이나 랜덤 탐색보다 훨씬 효율적입니다. 이 시나리오는 범주형 하이퍼파라미터 20개와 연속형 하이퍼파라미터 7개를 포함하며, 최대 1,000개의 학습 작업을 허용하므로 SageMaker AMT의 지원 범위 안에 있습니다. 베이지안 최적화는 혼합 파라미터 유형을 기본적으로 지원하며, AWS에서도 대규모 고차원 탐색 공간에서 전체 그리드 탐색이 비현실적인 경우 권장합니다. A와 D의 그리드 탐색은 조합을 독립적으로 평가하므로 이전 시도에서 학습하지 못하고, 차원이 증가할수록 계산 비용이 급격히 커집니다. B의 랜덤 탐색도 이전 결과를 활용하지 않으므로 핵심 요구 사항을 충족하지 않습니다. 따라서 범주형 및 연속형 파라미터를 모두 정의하고 최대 1,000개 작업으로 베이지안 최적화를 사용하는 C안이 올바른 AWS 권장 해결책입니다.", "en": "The requirement that each parameter trial is built based on the performance of the previous trial is the defining characteristic of Bayesian optimization. In Amazon SageMaker Automatic Model Tuning, Bayesian optimization uses prior trial results to intelligently select the next set of hyperparameters, making it far more efficient than grid or random search-especially in large, mixed search spaces. This scenario includes both categorical (20) and continuous (7) hyperparameters and allows up to 1,000 training jobs, which is well within the supported limits of SageMaker AMT. Bayesian optimization natively supports mixed parameter types and is explicitly recommended by AWS for large, high-dimensional search spaces where exhaustive grid search is impractical. Option A and D (grid search) do not meet the requirement because grid search evaluates combinations independently and does not learn from previous trials. Additionally, grid search becomes computationally infeasible as dimensionality increases. Option B (random search) also evaluates trials independently and does not leverage previous results, violating the core requirement. Therefore, defining both categorical and continuous parameters and using Bayesian optimization with a maximum of 1,000 jobs is the correct and AWS-recommended solution."}, {"n": 91, "t": "single", "q": "A company has a large collection of chat recordings from customer interactions after a product release. An ML engineer needs to create an ML model to analyze the chat data. The ML engineer needs to determine the success of the product by reviewing customer sentiments about the product. Which action should the ML engineer take to complete the evaluation in the LEAST amount of time?", "kq": "어떤 회사가 제품 출시 후 고객 상호작용에서 나온 대규모 채팅 녹취 모음을 보유하고 있습니다. ML 엔지니어는 이 채팅 데이터를 분석하는 ML 모델을 만들어야 합니다. ML 엔지니어는 제품에 대한 고객 감정을 검토해 제품의 성공 여부를 판단해야 합니다. 가장 짧은 시간 안에 평가를 완료하려면 ML 엔지니어는 어떤 조치를 취해야 할까요?", "o": [{"k": "A", "t": "Use Amazon Rekognition to analyze sentiments of the chat conversations.", "kt": "Amazon Rekognition을 사용해 채팅 대화의 감정을 분석합니다."}, {"k": "B", "t": "Train a Naive Bayes classifier to analyze sentiments of the chat conversations.", "kt": "나이브 베이즈 분류기를 학습시켜 채팅 대화의 감정을 분석합니다."}, {"k": "C", "t": "Use Amazon Comprehend to analyze sentiments of the chat conversations.", "kt": "Amazon Comprehend를 사용해 채팅 대화의 감정을 분석합니다."}, {"k": "D", "t": "Use random forests to classify sentiments of the chat conversations.", "kt": "랜덤 포레스트를 사용해 채팅 대화의 감정을 분류합니다."}], "a": ["C"], "ko": "Amazon Comprehend는 완전 관리형 자연어 처리(NLP) 서비스로, 내장 감성 분석 기능을 제공합니다. 텍스트 데이터를 빠르고 효율적으로 분석하여 감성이 긍정, 부정, 중립 또는 혼합인지 판단할 수 있습니다. Amazon Comprehend를 사용하면 사용자 지정 모델을 학습하거나 배포할 필요 없이 최소한의 설정만으로 정확한 결과를 얻을 수 있으므로, 이 작업을 가장 빠르고 효율적으로 완료할 수 있습니다.", "en": "Amazon Comprehend is a fully managed natural language processing (NLP) service that includes a built-in sentiment analysis feature. It can quickly and efficiently analyze text data to determine whether the sentiment is positive, negative, neutral, or mixed. Using Amazon Comprehend requires minimal setup and provides accurate results without the need to train and deploy custom models, making it the fastest and most efficient solution for this task."}, {"n": 92, "t": "single", "q": "A company is using an AWS Lambda function to monitor the metrics from an ML model. An ML engineer needs to implement a solution to send an email message when the metrics breach a threshold. Which solution will meet this requirement?", "kq": "어떤 회사가 ML 모델의 지표를 모니터링하기 위해 AWS Lambda 함수를 사용하고 있습니다. ML 엔지니어는 지표가 임계값을 초과할 때 이메일 메시지를 보내는 솔루션을 구현해야 합니다. 어떤 솔루션이 이 요구 사항을 충족할까요?", "o": [{"k": "A", "t": "Log the metrics from the Lambda function to AWS CloudTrail. Configure a CloudTrail trail to send the email message.", "kt": "Lambda 함수의 지표를 AWS CloudTrail에 기록합니다. 이메일 메시지를 보내도록 CloudTrail 추적을 구성합니다."}, {"k": "B", "t": "Log the metrics from the Lambda function to Amazon CloudFront. Configure an Amazon CloudWatch alarm to send the email message.", "kt": "Lambda 함수의 지표를 Amazon CloudFront에 기록합니다. 이메일 메시지를 보내도록 Amazon CloudWatch 알람을 구성합니다."}, {"k": "C", "t": "Log the metrics from the Lambda function to Amazon CloudWatch. Configure a CloudWatch alarm to send the email message.", "kt": "Lambda 함수의 지표를 Amazon CloudWatch에 기록합니다. 이메일 메시지를 보내도록 CloudWatch 알람을 구성합니다."}, {"k": "D", "t": "Log the metrics from the Lambda function to Amazon CloudWatch. Configure an Amazon CloudFront rule to send the email message.", "kt": "Lambda 함수의 지표를 Amazon CloudWatch에 기록합니다. 이메일 메시지를 보내도록 Amazon CloudFront 규칙을 구성합니다."}], "a": ["C"], "ko": "Lambda 함수에서 생성한 지표를 Amazon CloudWatch에 기록하면 해당 지표를 효과적으로 추적하고 모니터링할 수 있습니다. CloudWatch 경보는 지표가 사전에 정의된 임계값을 초과할 때 트리거되도록 구성할 수 있으며, Amazon SNS를 통해 이메일 알림을 보낼 수 있습니다. 이는 원하는 기능을 구현하는 표준적이고 가장 효율적인 방법입니다.", "en": "Logging the metrics to Amazon CloudWatch allows the metrics to be tracked and monitored effectively. CloudWatch Alarms can be configured to trigger when metrics breach a predefined threshold. The alarm can be set to notify through Amazon Simple Notification Service (SNS), which can send email messages to the configured recipients. This is the standard and most efficient way to achieve the desired functionality."}, {"n": 93, "t": "multi", "q": "A company wants to improve the sustainability of its ML operations. Which actions will reduce the energy usage and computational resources that are associated with the company's training jobs? (Choose two.)", "kq": "어떤 회사가 ML 운영의 지속 가능성을 개선하려고 합니다. 회사의 학습 작업과 관련된 에너지 사용량과 컴퓨팅 리소스를 줄일 수 있는 조치는 무엇입니까? (2개 선택)", "o": [{"k": "A", "t": "Use Amazon SageMaker Debugger to stop training jobs when non-converging conditions are detected.", "kt": "Amazon SageMaker Debugger를 사용해 수렴하지 않는 조건이 감지되면 학습 작업을 중단합니다."}, {"k": "B", "t": "Use Amazon SageMaker Ground Truth for data labeling.", "kt": "데이터 레이블링에 Amazon SageMaker Ground Truth를 사용합니다."}, {"k": "C", "t": "Deploy models by using AWS Lambda functions.", "kt": "AWS Lambda 함수를 사용해 모델을 배포합니다."}, {"k": "D", "t": "Use AWS Trainium instances for training.", "kt": "학습에 AWS Trainium 인스턴스를 사용합니다."}, {"k": "E", "t": "Use PyTorch or TensorFlow with the distributed training option.", "kt": "PyTorch 또는 TensorFlow를 분산 학습 옵션과 함께 사용합니다."}], "a": ["A", "D"], "ko": "SageMaker Debugger는 학습 작업이 수렴하지 않거나 비생산적인 상태에 머물러 있는 경우를 식별할 수 있습니다. 이러한 작업을 조기에 중단하면 불필요한 에너지와 컴퓨팅 리소스 사용을 줄여 지속 가능성을 높일 수 있습니다. AWS Trainium 인스턴스는 ML 학습을 위해 특별히 설계되었으며 에너지 효율성과 비용 효율성에 최적화되어 있습니다. 범용 인스턴스보다 학습 작업당 더 적은 에너지를 사용하므로 지속 가능한 선택입니다.", "en": "SageMaker Debugger can identify when a training job is not converging or is stuck in a non- productive state. By stopping these jobs early, unnecessary energy and computational resources are conserved, improving sustainability. AWS Trainium instances are purpose-built for ML training and are optimized for energy efficiency and cost- effectiveness. They use less energy per training task compared to general-purpose instances, making them a sustainable choice."}, {"n": 94, "t": "single", "q": "An ML engineer is deploying a generative AI model-based customer support agent that uses Amazon SageMaker AI for inference. The customer support agent must respond to customer questions about topics such as shipping policies, refund processes, and account management. The generative AI model generates one token at a time. Customers report dissatisfaction with how long the customer support agent takes to generate lengthy responses to questions. The ML engineer must apply an inference optimization technique to improve the performance of the customer support agent. Which solution will meet this requirement?", "kq": "ML 엔지니어가 추론에 Amazon SageMaker AI를 사용하는 생성형 AI 모델 기반 고객 지원 에이전트를 배포하고 있습니다. 이 고객 지원 에이전트는 배송 정책, 환불 절차, 계정 관리 같은 주제에 대한 고객 질문에 답해야 합니다. 생성형 AI 모델은 한 번에 토큰 하나씩 생성합니다. 고객들은 에이전트가 긴 응답을 생성하는 데 시간이 너무 오래 걸린다고 불만을 제기합니다. ML 엔지니어는 에이전트의 성능을 개선하기 위해 추론 최적화 기법을 적용해야 합니다. 어떤 솔루션이 이 요구 사항을 충족할까요?", "o": [{"k": "A", "t": "Compilation", "kt": "컴파일(Compilation)"}, {"k": "B", "t": "Speculative decoding", "kt": "추측 디코딩(Speculative decoding)"}, {"k": "C", "t": "Quantization", "kt": "양자화(Quantization)"}, {"k": "D", "t": "Fast model loading", "kt": "빠른 모델 로딩(Fast model loading)"}], "a": ["B"], "ko": "B안이 정답입니다. AWS 문서에 따르면 speculative decoding은 대규모 언어 모델의 디코딩 과정을 빠르게 하는 데 특화된 기법입니다. 문제에서는 모델이 한 번에 하나의 토큰을 생성하고, 긴 응답을 생성하는 데 시간이 오래 걸린다고 설명합니다. 이는 speculative decoding이 직접적으로 개선하는 추론 단계입니다. 이 방법은 더 작고 빠른 초안 모델이 후보 토큰을 먼저 생성하고, 더 큰 대상 모델이 이를 검증하는 방식으로 동작합니다. 초안 모델은 여러 후보 토큰을 빠르게 생성하고 대상 모델은 이를 병렬로 평가하므로 최종 응답 생성 속도를 높일 수 있습니다. Compilation은 배포나 하드웨어 최적화에 더 가깝고, Quantization은 비용과 하드웨어 요구 사항 감소에 도움이 되지만 순차 디코딩 지연을 직접 해결하는 최적의 답은 아닙니다. Fast model loading은 모델 시작 및 스케일아웃 시간 개선에 초점을 둡니다. 따라서 긴 응답 생성 지연을 줄이기 위한 가장 적절한 방법은 speculative decoding입니다.", "en": "Option B is correct because AWS documentation states that speculative decoding is specifically a technique to speed up the decoding process of large language models. The question highlights that the model generates one token at a time and that users are unhappy with the time needed to generate lengthy responses. That is exactly the stage of inference targeted by speculative decoding. AWS explains that this method improves latency without compromising the quality of the generated text. According to AWS, speculative decoding works by using a smaller, faster draft model to generate candidate tokens first. The larger target model then verifies those tokens. AWS further explains that the draft model can generate multiple candidate tokens quickly, and the target model evaluates them in parallel, which speeds up the final response. This directly addresses the problem in the scenario: the customer support agent is slow not because of startup time, but because long answers require many decoding steps. The other options are not the best fit. Compilation reduces deployment time and auto-scaling latency through ahead-of-time compilation, but AWS documents it primarily as helping model deployment and hardware optimization rather than token-by-token response generation. Quantization reduces hardware requirements and can lower cost, but the docs do not present it as the most direct answer to slow sequential decoding. Fast model loading improves how quickly the model loads onto instances, which helps startup and scale-out time, not long response generation after the model is already serving traffic. Therefore, the best AWS-documented answer is B."}, {"n": 95, "t": "single", "q": "An ML engineer needs to deploy ML models to get inferences from large datasets in an asynchronous manner. The ML engineer also needs to implement scheduled monitoring of the data quality of the models. The ML engineer must receive alerts when changes in data quality occur. Which solution will meet these requirements?", "kq": "ML 엔지니어가 대규모 데이터셋에서 비동기 방식으로 추론을 얻기 위해 ML 모델을 배포해야 합니다. 또한 모델의 데이터 품질을 예약 기반으로 모니터링하고, 데이터 품질에 변화가 발생하면 알림을 받아야 합니다. 어떤 솔루션이 이러한 요구 사항을 충족할까요?", "o": [{"k": "A", "t": "Deploy the models by using scheduled AWS Glue jobs. Use Amazon CloudWatch alarms to monitor the data quality and to send alerts.", "kt": "예약된 AWS Glue 작업으로 모델을 배포합니다. Amazon CloudWatch 알람으로 데이터 품질을 모니터링하고 알림을 보냅니다."}, {"k": "B", "t": "Deploy the models by using scheduled AWS Batch jobs. Use AWS CloudTrail to monitor the data quality and to send alerts.", "kt": "예약된 AWS Batch 작업으로 모델을 배포합니다. AWS CloudTrail로 데이터 품질을 모니터링하고 알림을 보냅니다."}, {"k": "C", "t": "Deploy the models by using Amazon Elastic Container Service (Amazon ECS) on AWS Fargate. Use Amazon EventBridge to monitor the data quality and to send alerts.", "kt": "AWS Fargate 기반 Amazon ECS로 모델을 배포합니다. Amazon EventBridge로 데이터 품질을 모니터링하고 알림을 보냅니다."}, {"k": "D", "t": "Deploy the models by using Amazon SageMaker batch transform. Use SageMaker Model Monitor to monitor the data quality and to send alerts.", "kt": "Amazon SageMaker 배치 변환(batch transform)으로 모델을 배포합니다. SageMaker Model Monitor로 데이터 품질을 모니터링하고 알림을 보냅니다."}], "a": ["D"], "ko": "Amazon SageMaker Batch Transform은 실시간 입력을 요구하지 않고 데이터를 배치 단위로 처리하므로 대규모 데이터셋에서 비동기 방식으로 추론을 수행하는 데 적합합니다. SageMaker Model Monitor는 데이터 품질을 예약된 방식으로 모니터링하고, 입력 데이터 특성의 변화나 데이터 품질 변화를 탐지하며, 변화가 발생했을 때 알림을 생성할 수 있습니다. 이 조합은 비동기 추론과 데이터 품질 모니터링을 모두 완전 관리형 방식으로 처리할 수 있어 운영 부담이 적습니다.", "en": "Amazon SageMaker batch transform is ideal for obtaining inferences from large datasets in an asynchronous manner, as it processes data in batches rather than requiring real-time inputs. SageMaker Model Monitor allows scheduled monitoring of data quality, detecting shifts in input data characteristics, and generating alerts when changes in data quality occur. This solution provides a fully managed, efficient way to handle both asynchronous inference and data quality monitoring with minimal operational overhead."}, {"n": 96, "t": "single", "q": "A company has deployed an XGBoost prediction model in production to predict if a customer is likely to cancel a subscription. The company uses Amazon SageMaker Model Monitor to detect deviations in the F1 score. During a baseline analysis of model quality, the company recorded a threshold for the F1 score. After several months of no change, the model's F1 score decreases significantly. What could be the reason for the reduced F1 score?", "kq": "어떤 회사가 고객이 구독을 해지할 가능성을 예측하는 XGBoost 예측 모델을 운영 환경에 배포했습니다. 회사는 F1 점수의 편차를 감지하기 위해 Amazon SageMaker Model Monitor를 사용합니다. 모델 품질에 대한 기준선 분석 과정에서 회사는 F1 점수의 임계값을 기록했습니다. 몇 달간 변화가 없다가 모델의 F1 점수가 크게 하락했습니다. F1 점수가 낮아진 이유는 무엇일 수 있습니까?", "o": [{"k": "A", "t": "Concept drift occurred in the underlying customer data that was used for predictions.", "kt": "예측에 사용된 기반 고객 데이터에서 개념 드리프트(concept drift)가 발생했습니다."}, {"k": "B", "t": "The model was not sufficiently complex to capture all the patterns in the original baseline data.", "kt": "모델이 원래 기준선 데이터의 모든 패턴을 포착할 만큼 충분히 복잡하지 않았습니다."}, {"k": "C", "t": "The original baseline data had a data quality issue of missing values.", "kt": "원래 기준선 데이터에 결측값이라는 데이터 품질 문제가 있었습니다."}, {"k": "D", "t": "Incorrect ground truth labels were provided to Model Monitor during the calculation of the baseline.", "kt": "기준선 계산 과정에서 Model Monitor에 잘못된 정답 레이블(ground truth)이 제공되었습니다."}], "a": ["A"], "ko": "F1 점수는 정밀도와 재현율의 균형을 나타내는 지표이며, 이 값이 크게 감소했다는 것은 모델의 예측이 더 이상 실제 데이터 분포와 잘 맞지 않는다는 의미입니다. 가장 가능성 높은 원인은 개념 드리프트입니다. 개념 드리프트는 시간이 지나면서 타깃 변수나 특성의 통계적 속성이 변하는 현상입니다. 예를 들어 고객 행동이나 구독 취소 패턴이 변하면 모델 정확도가 낮아질 수 있습니다. 모델이 처음에는 잘 작동했으므로 모델 복잡도 부족은 원인이 아닐 가능성이 큽니다. 원본 기준 데이터의 결측값 문제는 기준선 분석 단계에서 드러났을 가능성이 높고, 잘못된 정답 레이블을 사용했다면 기준선 자체가 처음부터 일관되게 나빴을 것입니다. 따라서 F1 점수 감소는 고객 데이터의 개념 드리프트 때문일 가능성이 가장 높으며, 최신 데이터로 모델을 재학습해야 합니다.", "en": "Problem Description: The F1 score, which is a balance of precision and recall, has decreased significantly. This indicates the model's predictions are no longer aligned with the real-world data distribution. Why Concept Drift? Concept drift occurs when the statistical properties of the target variable or features change over time. For example, customer behaviors or subscription cancellation patterns may have shifted, leading to reduced model accuracy. Signs of Concept Drift: Deviation in performance metrics (e.g., F1 score) over time. Declining prediction accuracy for certain groups or scenarios. Solution: Monitor for drift using tools like SageMaker Model Monitor. Regularly retrain the model with updated data to account for the drift. Why Not Other Options?: B: Model complexity is unrelated if the model initially performed well. C: Data quality issues would have been detected during baseline analysis. D: Incorrect ground truth labels would have resulted in a consistently poor baseline. Conclusion: The decrease in F1 score is most likely due to concept drift in the customer data, requiring retraining of the model with new data."}, {"n": 97, "t": "single", "q": "A company is developing an ML model to forecast future values based on time series data. The dataset includes historical measurements collected at regular intervals and categorical features. The model needs to predict future values based on past patterns and trends. Which algorithm and hyperparameters should the company use to develop the model?", "kq": "어떤 회사가 시계열 데이터를 기반으로 미래 값을 예측하는 ML 모델을 개발하고 있습니다. 데이터셋에는 일정한 간격으로 수집된 과거 측정값과 범주형 특성이 포함되어 있습니다. 모델은 과거 패턴과 추세를 기반으로 미래 값을 예측해야 합니다. 회사가 모델 개발에 사용해야 할 알고리즘과 하이퍼파라미터는 무엇입니까?", "o": [{"k": "A", "t": "Use the Amazon SageMaker AI XGBoost algorithm. Set the scale_pos_weight hyperparameter to adjust for class imbalance.", "kt": "Amazon SageMaker AI XGBoost 알고리즘을 사용합니다. 클래스 불균형을 조정하기 위해 scale_pos_weight 하이퍼파라미터를 설정합니다."}, {"k": "B", "t": "Use k-means clustering with k to specify the number of clusters.", "kt": "클러스터 수를 지정하는 k와 함께 k-means 클러스터링을 사용합니다."}, {"k": "C", "t": "Use the Amazon SageMaker AI DeepAR algorithm with matching context length and prediction length hyperparameters.", "kt": "context length와 prediction length 하이퍼파라미터를 맞춘 Amazon SageMaker AI DeepAR 알고리즘을 사용합니다."}, {"k": "D", "t": "Use the Amazon SageMaker AI Random Cut Forest (RCF) algorithm with contamination to set the expected proportion of anomalies.", "kt": "예상 이상치 비율을 설정하는 contamination과 함께 Amazon SageMaker AI Random Cut Forest(RCF) 알고리즘을 사용합니다."}], "a": ["C"], "ko": "이 문제는 과거 데이터와 범주형 특성을 기반으로 미래 값을 예측하는 시계열 예측 작업입니다. Amazon SageMaker DeepAR는 이러한 사용 사례를 위해 설계된 알고리즘입니다. DeepAR는 순환 신경망을 사용하여 여러 관련 시계열 전반의 시간적 패턴을 학습하고 범주형 공변량도 지원합니다. context length 하이퍼파라미터는 모델이 입력으로 사용할 과거 데이터의 길이를 제어하고, prediction length는 모델이 미래를 얼마나 멀리 예측할지를 지정합니다. 이러한 하이퍼파라미터를 적절히 설정하는 것은 추세와 계절성을 포착하는 데 중요합니다. XGBoost는 일반적인 표 형식 알고리즘으로 시간 의존성을 기본적으로 모델링하지 않으며, k-means는 클러스터링 알고리즘이고, Random Cut Forest는 이상 탐지용입니다. 따라서 적절한 context length와 prediction length를 사용하는 DeepAR가 정답입니다.", "en": "The problem is a time series forecasting task with historical data and categorical features. Amazon SageMaker DeepAR is purpose-built for this use case. DeepAR uses recurrent neural networks to learn temporal patterns across multiple related time series and supports categorical covariates. The context length hyperparameter controls how much historical data the model uses as input, while the prediction length specifies how far into the future the model forecasts. Correctly setting these hyperparameters is critical for capturing trends and seasonality. XGBoost is a general-purpose tabular algorithm and does not model temporal dependencies natively. k-means is a clustering algorithm. Random Cut Forest is used for anomaly detection, not forecasting. Therefore, DeepAR with appropriate context and prediction lengths is the correct and AWS- recommended solution."}, {"n": 98, "t": "single", "q": "A company uses Amazon SageMaker Studio to develop an ML model. The company has a single SageMaker Studio domain. An ML engineer needs to implement a solution that provides an automated alert when SageMaker AI compute costs reach a specific threshold. Which solution will meet these requirements?", "kq": "어떤 회사가 ML 모델 개발에 Amazon SageMaker Studio를 사용합니다. 회사에는 SageMaker Studio 도메인이 하나 있습니다. ML 엔지니어는 SageMaker AI 컴퓨팅 비용이 특정 임계값에 도달하면 자동 알림을 제공하는 솔루션을 구현해야 합니다. 어떤 솔루션이 이러한 요구 사항을 충족할까요?", "o": [{"k": "A", "t": "Add resource tagging by editing the SageMaker AI user profile in the SageMaker AI domain. Configure AWS Cost Explorer to send an alert when the threshold is reached.", "kt": "SageMaker AI 도메인의 SageMaker AI 사용자 프로필을 편집해 리소스 태깅을 추가합니다. 임계값 도달 시 알림을 보내도록 AWS Cost Explorer를 구성합니다."}, {"k": "B", "t": "Add resource tagging by editing the SageMaker AI user profile in the SageMaker AI domain. Configure AWS Budgets to send an alert when the threshold is reached.", "kt": "SageMaker AI 도메인의 SageMaker AI 사용자 프로필을 편집해 리소스 태깅을 추가합니다. 임계값 도달 시 알림을 보내도록 AWS Budgets를 구성합니다."}, {"k": "C", "t": "Add resource tagging by editing each user's IAM profile. Configure AWS Cost Explorer to send an alert when the threshold is reached.", "kt": "각 사용자의 IAM 프로필을 편집해 리소스 태깅을 추가합니다. 임계값 도달 시 알림을 보내도록 AWS Cost Explorer를 구성합니다."}, {"k": "D", "t": "Add resource tagging by editing each user's IAM profile. Configure AWS Budgets to send an alert when the threshold is reached.", "kt": "각 사용자의 IAM 프로필을 편집해 리소스 태깅을 추가합니다. 임계값 도달 시 알림을 보내도록 AWS Budgets를 구성합니다."}], "a": ["B"], "ko": "AWS 비용 거버넌스 모범 사례에서는 서비스 수준 지출을 추적하고 알림을 받기 위해 리소스 태깅과 AWS Budgets를 함께 사용할 것을 권장합니다. SageMaker Studio 사용자 프로필 수준에서 태그를 추가하면 사용자가 생성하는 컴퓨팅 리소스가 해당 태그를 자동으로 상속할 수 있습니다. AWS Budgets는 임계값 기반 알림을 지원하며, 지출이 정의된 한도를 초과하면 이메일 또는 Amazon SNS를 통해 알림을 보낼 수 있습니다. 반면 AWS Cost Explorer는 주로 과거 비용 분석과 시각화에 사용됩니다. IAM 프로필은 비용 추적과 직접 관련이 없으므로 C와 D는 적절하지 않습니다. 따라서 SageMaker 사용자 프로필에 태그를 지정하고 AWS Budgets를 사용하는 B안이 정답입니다.", "en": "AWS best practices for cost governance recommend using resource tagging combined with AWS Budgets to track and alert on service-level spending. By adding tags at the SageMaker Studio user profile level, all compute resources launched by users inherit those tags automatically. AWS Budgets supports threshold-based alerts, unlike AWS Cost Explorer, which is primarily used for historical analysis and visualization. Budgets can trigger notifications via email or Amazon SNS when spending exceeds defined limits. IAM profiles are unrelated to cost tracking, making options C and D invalid. Therefore, tagging SageMaker user profiles and using AWS Budgets is the correct solution."}, {"n": 99, "t": "single", "q": "A company is developing a generative AI conversational interface to assist customers with payments. The company wants to use an ML solution to detect customer intent. The company does not have training data to train a model. Which solution will meet these requirements?", "kq": "어떤 회사가 고객의 결제를 지원하는 생성형 AI 대화형 인터페이스를 개발하고 있습니다. 회사는 고객 의도(intent)를 감지하기 위해 ML 솔루션을 사용하려고 합니다. 회사에는 모델을 학습시킬 학습 데이터가 없습니다. 어떤 솔루션이 이러한 요구 사항을 충족할까요?", "o": [{"k": "A", "t": "Fine-tune a sequence-to-sequence (seq2seq) algorithm in Amazon SageMaker JumpStart.", "kt": "Amazon SageMaker JumpStart에서 sequence-to-sequence(seq2seq) 알고리즘을 파인튜닝합니다."}, {"k": "B", "t": "Use an LLM from Amazon Bedrock with zero-shot learning.", "kt": "Amazon Bedrock의 LLM을 제로샷 학습(zero-shot learning)으로 사용합니다."}, {"k": "C", "t": "Use the Amazon Comprehend DetectEntities API.", "kt": "Amazon Comprehend의 DetectEntities API를 사용합니다."}, {"k": "D", "t": "Run an LLM from Amazon Bedrock on Amazon EC2 instances.", "kt": "Amazon EC2 인스턴스에서 Amazon Bedrock의 LLM을 실행합니다."}], "a": ["B"], "ko": "이 시나리오의 핵심 요구 사항은 학습 데이터 없이 고객 의도를 탐지하는 것입니다. AWS 머신러닝 및 생성형 AI 문서에 따르면 zero-shot learning은 레이블이 지정된 학습 데이터가 없는 상황을 위해 설계되었습니다. Zero-shot learning은 사전 학습된 대규모 언어 모델이 일반 지식과 언어 이해 능력을 활용하여 명시적으로 학습하지 않은 작업도 수행할 수 있게 합니다. Amazon Bedrock은 zero-shot 및 few-shot learning을 지원하는 기반 모델과 LLM에 대한 완전 관리형 접근을 제공합니다. Bedrock의 LLM을 사용하면 별도 모델을 구축, 학습 또는 파인튜닝하지 않고도 자연어 입력에서 고객 의도를 직접 추론할 수 있습니다. JumpStart에서 seq2seq 모델을 파인튜닝하려면 레이블이 지정된 학습 데이터가 필요하고, Comprehend DetectEntities는 개체명 인식용이지 의도 탐지용이 아닙니다. EC2에서 LLM을 실행하는 방식은 인프라 관리 부담이 크며 Bedrock을 사용하는 이점이 없습니다. 따라서 Bedrock LLM과 zero-shot learning을 사용하는 B안이 가장 적절합니다.", "en": "The key requirement in this scenario is detecting customer intent without having any training data. According to AWS Machine Learning and Generative AI documentation, zero-shot learning is specifically designed for situations where labeled training data is unavailable. Zero-shot learning allows a pre-trained large language model (LLM) to perform tasks it has not been explicitly trained on by leveraging its general knowledge and language understanding. Amazon Bedrock provides fully managed access to foundation models (FMs) and LLMs that support zero- shot and few-shot learning. By using an LLM from Amazon Bedrock, the company can directly infer customer intent from natural language inputs without building, training, or fine-tuning a custom model. This approach is ideal for conversational interfaces where rapid deployment and scalability are required. Option A is incorrect because fine-tuning a sequence-to-sequence (seq2seq) model in Amazon SageMaker JumpStart still requires labeled training data. Since the company explicitly does not have training data, this option does not meet the requirement. Option C is also incorrect because the Amazon Comprehend DetectEntities API is designed for named entity recognition (NER), such as detecting names, dates, locations, or monetary values. It does not perform intent detection and is not suitable for conversational AI intent classification. Option D is partially misleading. While it is technically possible to run an LLM on Amazon EC2, this does not inherently solve the problem of intent detection without training data. Additionally, Amazon Bedrock already abstracts infrastructure management, scaling, and model hosting, making direct EC2 deployment unnecessary and less efficient. Therefore, using an LLM from Amazon Bedrock with zero-shot learning is the most appropriate, scalable, and AWS-recommended solution for intent detection without training data."}, {"n": 100, "t": "single", "q": "A company is creating an application that will recommend products for customers to purchase. The application will make API calls to Amazon Q Business. The company must ensure that responses from Amazon Q Business do not include the name of the company's main competitor. Which solution will meet this requirement?", "kq": "어떤 회사가 고객에게 구매할 제품을 추천하는 애플리케이션을 만들고 있습니다. 이 애플리케이션은 Amazon Q Business로 API 호출을 수행합니다. 회사는 Amazon Q Business의 응답에 회사의 주요 경쟁사 이름이 포함되지 않도록 해야 합니다. 어떤 솔루션이 이 요구 사항을 충족할까요?", "o": [{"k": "A", "t": "Configure the competitor's name as a blocked phrase in Amazon Q Business.", "kt": "Amazon Q Business에서 경쟁사 이름을 차단 문구(blocked phrase)로 구성합니다."}, {"k": "B", "t": "Configure an Amazon Q Business retriever to exclude the competitor's name.", "kt": "경쟁사 이름을 제외하도록 Amazon Q Business retriever를 구성합니다."}, {"k": "C", "t": "Configure an Amazon Kendra retriever for Amazon Q Business to build indexes that exclude the competitor's name.", "kt": "경쟁사 이름을 제외한 인덱스를 구축하도록 Amazon Q Business용 Amazon Kendra retriever를 구성합니다."}, {"k": "D", "t": "Configure document attribute boosting in Amazon Q Business to deprioritize the competitor's name.", "kt": "경쟁사 이름의 우선순위를 낮추도록 Amazon Q Business에서 문서 속성 부스팅을 구성합니다."}], "a": ["A"], "ko": "Amazon Q Business는 응답에서 특정 용어나 문구가 포함되지 않도록 blocked phrases를 구성할 수 있습니다. 경쟁사 이름을 차단 문구로 추가하면 API 응답에 해당 이름이 나타나지 않도록 보장할 수 있으며, 최소한의 설정으로 요구 사항을 효율적으로 충족할 수 있습니다.", "en": "Amazon Q Business allows configuring blocked phrases to exclude specific terms or phrases from the responses. By adding the competitor's name as a blocked phrase, the company can ensure that it will not appear in the API responses, meeting the requirement efficiently with minimal configuration."}, {"n": 101, "t": "single", "q": "Case study An ML engineer is developing a fraud detection model on AWS. The training dataset includes transaction logs, customer profiles, and tables from an on-premises MySQL database. The transaction logs and customer profiles are stored in Amazon S3. The dataset has a class imbalance that affects the learning of the model's algorithm. Additionally, many of the features have interdependencies. The algorithm is not capturing all the desired underlying patterns in the data. After the data is aggregated, the ML engineer must implement a solution to automatically detect anomalies in the data and to visualize the result. Which solution will meet these requirements?", "kq": "[사례 연구] ML 엔지니어가 AWS에서 사기 탐지 모델을 개발하고 있습니다. 학습 데이터셋에는 거래 로그, 고객 프로필, 그리고 온프레미스 MySQL 데이터베이스의 테이블들이 포함됩니다. 거래 로그와 고객 프로필은 Amazon S3에 저장되어 있습니다. 데이터셋에는 모델 알고리즘의 학습에 영향을 주는 클래스 불균형이 있습니다. 또한 많은 특성들이 서로 종속되어 있습니다. 알고리즘이 데이터에 내재된 패턴을 모두 포착하지 못하고 있습니다. 데이터가 집계된 후, ML 엔지니어는 데이터의 이상치를 자동으로 탐지하고 결과를 시각화하는 솔루션을 구현해야 합니다. 어떤 솔루션이 이러한 요구 사항을 충족할까요?", "o": [{"k": "A", "t": "Use Amazon Athena to automatically detect the anomalies and to visualize the result.", "kt": "Amazon Athena를 사용해 이상치를 자동으로 탐지하고 결과를 시각화합니다."}, {"k": "B", "t": "Use Amazon Redshift Spectrum to automatically detect the anomalies. Use Amazon QuickSight to visualize the result.", "kt": "Amazon Redshift Spectrum을 사용해 이상치를 자동으로 탐지합니다. Amazon QuickSight로 결과를 시각화합니다."}, {"k": "C", "t": "Use Amazon SageMaker Data Wrangler to automatically detect the anomalies and to visualize the result.", "kt": "Amazon SageMaker Data Wrangler를 사용해 이상치를 자동으로 탐지하고 결과를 시각화합니다."}, {"k": "D", "t": "Use AWS Batch to automatically detect the anomalies. Use Amazon QuickSight to visualize the result.", "kt": "AWS Batch를 사용해 이상치를 자동으로 탐지합니다. Amazon QuickSight로 결과를 시각화합니다."}], "a": ["C"], "ko": "Amazon SageMaker Data Wrangler는 데이터 준비 과정을 간소화하고 이상 탐지와 시각화를 위한 내장 기능을 제공하는 종합 도구입니다. SageMaker Data Wrangler는 Amazon S3와 온프레미스 데이터베이스 등 다양한 데이터 소스에 연결할 수 있어 트랜잭션 로그, 고객 프로필, MySQL 테이블을 손쉽게 집계할 수 있습니다. 또한 시계열 데이터의 이상치를 탐지하는 내장 분석 기능을 제공하여 사기 활동을 나타낼 수 있는 이상 패턴을 식별할 수 있습니다. 히스토그램, 산점도 등 시각화 도구도 제공하므로 데이터 분포와 특성 간 관계를 이해하는 데 도움이 됩니다. Data Wrangler의 데이터 플로우 인터페이스를 사용하면 여러 데이터셋을 결합하고 전처리하여 분석용 통합 데이터셋을 만들 수 있으며, 이상 탐지 임계값 등을 조정해 민감도를 설정할 수 있습니다. 이처럼 데이터 준비, 이상 탐지, 시각화를 하나의 인터페이스에서 처리할 수 있어 운영 부담을 줄이고, 대규모 트랜잭션 로그와 고객 프로필도 효율적으로 처리할 수 있습니다. 따라서 SageMaker Data Wrangler를 사용하는 C안이 요구 사항에 가장 적합합니다.", "en": "Amazon SageMaker Data Wrangler is a comprehensive tool that streamlines the process of data preparation and offers built-in capabilities for anomaly detection and visualization. Key Features of SageMaker Data Wrangler: Data Importation: Connects seamlessly to various data sources, including Amazon S3 and on- premises databases, facilitating the aggregation of transaction logs, customer profiles, and MySQL tables. Anomaly Detection: Provides built-in analyses to detect anomalies in time series data, enabling the identification of outliers that may indicate fraudulent activities. Visualization: Offers a suite of visualization tools, such as histograms and scatter plots, to help understand data distributions and relationships, which are crucial for feature engineering and model development. Implementation Steps: Data Aggregation: Import data from Amazon S3 and on-premises MySQL databases into SageMaker Data Wrangler. Utilize Data Wrangler's data flow interface to combine and preprocess datasets, ensuring a unified dataset for analysis. Anomaly Detection: Apply the anomaly detection analysis feature to identify outliers in the dataset. Configure parameters such as the anomaly threshold to fine-tune the detection sensitivity. Visualization: Use built-in visualization tools to create charts and graphs that depict data distributions and highlight anomalies. Interpret these visualizations to gain insights into potential fraud patterns and feature interdependencies. Advantages of Using SageMaker Data Wrangler: Integrated Workflow: Combines data preparation, anomaly detection, and visualization within a single interface, streamlining the ML development process. Operational Efficiency: Reduces the need for multiple tools and complex integrations, thereby minimizing operational overhead. Scalability: Handles large datasets efficiently, making it suitable for extensive transaction logs and customer profiles. By leveraging SageMaker Data Wrangler, the ML engineer can effectively detect anomalies and visualize results, facilitating the development of a robust fraud detection model. Analyze and Visualize - Amazon SageMaker Transform Data - Amazon SageMaker"}, {"n": 102, "t": "single", "q": "A company stores training data as a .csv file in an Amazon S3 bucket. The company must encrypt the data and must control which applications have access to the encryption key. Which solution will meet these requirements?", "kq": "어떤 회사가 학습 데이터를 .csv 파일로 Amazon S3 버킷에 저장합니다. 회사는 이 데이터를 암호화해야 하며, 어떤 애플리케이션이 암호화 키에 접근할 수 있는지 제어해야 합니다. 어떤 솔루션이 이러한 요구 사항을 충족할까요?", "o": [{"k": "A", "t": "Create a new SSH access key and use the AWS Encryption CLI to encrypt the file.", "kt": "새 SSH 액세스 키를 만들고 AWS Encryption CLI로 파일을 암호화합니다."}, {"k": "B", "t": "Create a new API key by using Amazon API Gateway and use it to encrypt the file.", "kt": "Amazon API Gateway로 새 API 키를 만들고 이를 사용해 파일을 암호화합니다."}, {"k": "C", "t": "Create a new IAM role with permissions for kms:GenerateDataKey and use the role to encrypt the file.", "kt": "kms:GenerateDataKey 권한이 있는 새 IAM 역할을 만들고 그 역할로 파일을 암호화합니다."}, {"k": "D", "t": "Create a new AWS Key Management Service (AWS KMS) key and use the AWS Encryption CLI with the KMS key to encrypt the file.", "kt": "새 AWS KMS 키를 만들고 AWS Encryption CLI와 해당 KMS 키를 사용해 파일을 암호화합니다."}], "a": ["D"], "ko": "AWS Key Management Service(AWS KMS)는 암호화와 키 접근 제어를 위해 권장되는 서비스입니다. 고객 관리형 KMS 키를 생성하면 어떤 애플리케이션과 역할이 해당 키를 사용할 수 있는지 세분화된 IAM 정책으로 제어할 수 있습니다. AWS Encryption CLI는 KMS와 직접 통합되어 Amazon S3에 저장하기 전에 파일을 클라이언트 측에서 암호화할 수 있게 합니다. 이 방식은 데이터가 저장 시 암호화되도록 보장하고, 권한이 있는 주체만 복호화할 수 있도록 합니다. SSH 키와 API 키는 데이터 암호화를 위해 설계된 것이 아니며, IAM 역할만으로는 암호화 키를 생성하거나 관리할 수 없습니다. AWS 문서에서도 KMS 고객 관리형 키가 중앙 집중식 키 관리, 감사, 접근 제어를 제공한다고 명시합니다. 따라서 D안이 올바른 AWS 기반 해결책입니다.", "en": "AWS Key Management Service (AWS KMS) is the recommended service for encryption and key access control. By creating a customer-managed KMS key, the company can define granular IAM policies that control which applications and roles can use the key. The AWS Encryption CLI integrates directly with KMS and enables client-side encryption of files before storing them in Amazon S3. This approach ensures data is encrypted at rest and that only authorized principals can decrypt it. SSH keys and API keys are not designed for data encryption. IAM roles alone do not create or manage encryption keys-they only grant permissions. AWS documentation explicitly states that KMS customer-managed keys provide centralized key management, auditing, and access control. Therefore, Option D is the correct and AWS-aligned solution."}, {"n": 103, "t": "single", "q": "An ML engineer at a credit card company built and deployed an ML model by using Amazon SageMaker AI. The model was trained on transaction data that contained very few fraudulent transactions. After deployment, the model is underperforming. What should the ML engineer do to improve the model's performance?", "kq": "어떤 신용카드 회사의 ML 엔지니어가 Amazon SageMaker AI로 ML 모델을 만들어 배포했습니다. 이 모델은 사기 거래가 극히 적게 포함된 거래 데이터로 학습되었습니다. 배포 후 모델의 성능이 낮습니다. 모델 성능을 개선하려면 어떻게 해야 합니까?", "o": [{"k": "A", "t": "Retrain the model with a different SageMaker built-in algorithm.", "kt": "다른 SageMaker 내장 알고리즘으로 모델을 재학습시킵니다."}, {"k": "B", "t": "Use random undersampling to reduce the majority class and retrain the model.", "kt": "무작위 언더샘플링으로 다수 클래스를 줄이고 모델을 재학습시킵니다."}, {"k": "C", "t": "Use Synthetic Minority Oversampling Technique (SMOTE) to generate synthetic minority samples and retrain the model.", "kt": "SMOTE(Synthetic Minority Oversampling Technique)로 합성 소수 클래스 샘플을 생성하고 모델을 재학습시킵니다."}, {"k": "D", "t": "Use random oversampling to duplicate minority samples and retrain the model.", "kt": "무작위 오버샘플링으로 소수 클래스 샘플을 복제하고 모델을 재학습시킵니다."}], "a": ["C"], "ko": "이는 사기 거래라는 소수 클래스가 매우 적게 포함된 전형적인 클래스 불균형 문제입니다. SageMaker Data Wrangler 관련 AWS 문서는 이러한 상황에서 모델 성능을 개선하기 위한 효과적인 방법으로 SMOTE를 권장합니다. SMOTE는 기존 소수 클래스 샘플 사이를 보간하여 새로운 합성 소수 클래스 샘플을 생성합니다. 이를 통해 단순히 데이터를 복제할 때 발생할 수 있는 과적합 위험을 줄이면서 모델이 의사결정 경계를 더 잘 학습하도록 돕습니다. 랜덤 언더샘플링은 다수 클래스의 유용한 데이터를 제거하여 모델의 견고성을 떨어뜨릴 수 있고, 랜덤 오버샘플링은 데이터를 중복시켜 과적합 위험을 높입니다. 알고리즘만 변경하는 것은 근본 원인인 클래스 불균형을 해결하지 못합니다. 따라서 SMOTE를 사용해 소수 클래스 샘플을 생성하고 모델을 재학습하는 C안이 정답입니다.", "en": "This is a classic class imbalance problem, where fraudulent transactions (minority class) are severely underrepresented. AWS documentation for SageMaker Data Wrangler recommends SMOTE (Synthetic Minority Oversampling Technique) as an effective approach for improving model performance in such scenarios. SMOTE generates synthetic minority samples by interpolating between existing minority class examples. This improves the model's ability to learn decision boundaries without simply duplicating data, which can cause overfitting. Random undersampling removes valuable majority class data, reducing overall model robustness. Random oversampling duplicates data and increases overfitting risk. Changing algorithms does not address the root cause. AWS best practices highlight SMOTE as the preferred technique for fraud detection and other highly imbalanced datasets. Therefore, Option C is the correct and AWS-verified answer."}, {"n": 104, "t": "single", "q": "A company is uploading thousands of PDF policy documents into Amazon S3 and Amazon Bedrock Knowledge Bases. Each document contains structured sections. Users often search for a small section but need the full section context. The company wants accurate section-level search with automatic context retrieval and minimal custom coding. Which chunking strategy meets these requirements?", "kq": "어떤 회사가 수천 개의 PDF 정책 문서를 Amazon S3와 Amazon Bedrock Knowledge Bases에 업로드하고 있습니다. 각 문서에는 구조화된 섹션이 포함되어 있습니다. 사용자들은 흔히 작은 섹션을 검색하지만 해당 섹션의 전체 맥락이 필요합니다. 회사는 자동 맥락 검색이 가능한 정확한 섹션 수준 검색을 원하며, 사용자 지정 코딩은 최소로 하고 싶어 합니다. 요구 사항을 충족하는 청킹 전략은 무엇입니까?", "o": [{"k": "A", "t": "Hierarchical", "kt": "계층적(Hierarchical)"}, {"k": "B", "t": "Maximum tokens", "kt": "최대 토큰(Maximum tokens)"}, {"k": "C", "t": "Semantic", "kt": "의미 기반(Semantic)"}, {"k": "D", "t": "Fixed-size", "kt": "고정 크기(Fixed-size)"}], "a": ["A"], "ko": "Amazon Bedrock Knowledge Bases는 검색 품질을 최적화하기 위해 여러 청킹 전략을 지원합니다. 계층적 청킹은 제목, 섹션, 하위 섹션이 있는 PDF와 같은 구조화된 문서를 위해 설계되었습니다. 이 방식은 하위 섹션 수준의 세밀한 검색을 가능하게 하면서도 상위 섹션의 문맥을 자동으로 보존합니다. 따라서 작은 부분이 검색되더라도 주변 섹션 정보가 함께 제공되어 기반 모델이 내용을 더 잘 이해할 수 있습니다. 고정 크기 청킹이나 최대 토큰 청킹은 콘텐츠를 임의로 나눌 수 있어 의미적·구조적 경계를 깨뜨릴 수 있습니다. 의미 기반 청킹은 의미에는 집중하지만 추가 로직 없이는 구조적 문맥 보존을 보장하지 않습니다. 따라서 구조화된 문서에서 문맥 무결성이 필요한 경우 계층적 청킹을 사용하는 A안이 적절합니다.", "en": "AWS Bedrock Knowledge Bases support multiple chunking strategies to optimize retrieval quality. Hierarchical chunking is specifically designed for structured documents such as PDFs with headings, sections, and subsections. Hierarchical chunking allows fine-grained retrieval at the subsection level while automatically preserving parent section context. This ensures that when a small portion is retrieved, the surrounding section is also provided to the foundation model for better understanding. Fixed-size and maximum-token chunking can split content arbitrarily, breaking semantic and structural boundaries. Semantic chunking focuses on meaning but does not guarantee structured context preservation without additional logic. AWS documentation highlights hierarchical chunking as the preferred strategy when documents are structured and contextual integrity is required. Therefore, Option A is the correct and AWS-aligned solution."}, {"n": 105, "t": "single", "q": "A company wants to predict the success of advertising campaigns by considering the color scheme of each advertisement. An ML engineer is preparing data for a neural network model. The dataset includes color information as categorical data. Which technique for feature engineering should the ML engineer use for the model?", "kq": "어떤 회사가 각 광고의 색상 배합을 고려해 광고 캠페인의 성공을 예측하려고 합니다. ML 엔지니어가 신경망 모델용 데이터를 준비하고 있습니다. 데이터셋에는 색상 정보가 범주형 데이터로 포함되어 있습니다. ML 엔지니어가 이 모델에 사용해야 할 특성 엔지니어링 기법은 무엇입니까?", "o": [{"k": "A", "t": "Apply label encoding to the color categories. Automatically assign each color a unique integer.", "kt": "색상 범주에 레이블 인코딩을 적용합니다. 각 색상에 고유한 정수를 자동으로 할당합니다."}, {"k": "B", "t": "Implement padding to ensure that all color feature vectors have the same length.", "kt": "모든 색상 특성 벡터의 길이가 같아지도록 패딩을 구현합니다."}, {"k": "C", "t": "Perform dimensionality reduction on the color categories.", "kt": "색상 범주에 차원 축소를 수행합니다."}, {"k": "D", "t": "One-hot encode the color categories to transform the color scheme feature into a binary matrix.", "kt": "색상 범주를 원-핫 인코딩해 색상 배합 특성을 이진 행렬로 변환합니다."}], "a": ["D"], "ko": "원-핫 인코딩은 색상 정보와 같은 범주형 데이터를 신경망 입력에 적합한 형식으로 변환하는 적절한 기법입니다. 이 방식은 각 고유 범주, 즉 각 색상을 별도의 이진 컬럼으로 표현합니다. 이를 통해 모델이 색상 간에 순서 관계가 있다고 잘못 해석하는 것을 방지할 수 있습니다. 따라서 데이터의 범주형 특성을 유지하면서 의도하지 않은 편향을 줄일 수 있습니다.", "en": "One-hot encoding is the appropriate technique for transforming categorical data, such as color information, into a format suitable for input to a neural network. This technique creates a binary vector representation where each unique category (color) is represented as a separate binary column, ensuring that the model does not infer ordinal relationships between categories. This approach preserves the categorical nature of the data and avoids introducing unintended biases."}, {"n": 106, "t": "single", "q": "A company is building a near real-time data analytics application to detect anomalies and failures for industrial equipment. The company has thousands of IoT sensors that send data every 60 seconds. When new versions of the application are released, the company wants to ensure that application code bugs do not prevent the application from running. Which solution will meet these requirements?", "kq": "어떤 회사가 산업 장비의 이상과 고장을 탐지하기 위해 준실시간 데이터 분석 애플리케이션을 만들고 있습니다. 회사에는 60초마다 데이터를 보내는 수천 개의 IoT 센서가 있습니다. 애플리케이션의 새 버전이 릴리스될 때, 회사는 애플리케이션 코드 버그로 인해 애플리케이션이 실행되지 못하는 상황을 방지하려고 합니다. 어떤 솔루션이 이러한 요구 사항을 충족할까요?", "o": [{"k": "A", "t": "Use Amazon Managed Service for Apache Flink with the system rollback capability enabled to build the data analytics application.", "kt": "시스템 롤백 기능이 활성화된 Amazon Managed Service for Apache Flink로 데이터 분석 애플리케이션을 구축합니다."}, {"k": "B", "t": "Use Amazon Managed Service for Apache Flink with manual rollback when an error occurs to build the data analytics application.", "kt": "오류 발생 시 수동 롤백을 하는 Amazon Managed Service for Apache Flink로 데이터 분석 애플리케이션을 구축합니다."}, {"k": "C", "t": "Use Amazon Data Firehose to deliver real-time streaming data programmatically for the data analytics application. Pause the stream when a new version of the application is released and resume the stream after the application is deployed.", "kt": "Amazon Data Firehose를 사용해 데이터 분석 애플리케이션에 실시간 스트리밍 데이터를 프로그래밍 방식으로 전달합니다. 애플리케이션의 새 버전이 릴리스되면 스트림을 일시 중지하고 배포 후 재개합니다."}, {"k": "D", "t": "Use Amazon Data Firehose to deliver data to Amazon EC2 instances across two Availability Zones for the data analytics application.", "kt": "Amazon Data Firehose를 사용해 데이터 분석 애플리케이션을 위해 두 가용 영역의 Amazon EC2 인스턴스로 데이터를 전달합니다."}], "a": ["A"], "ko": "스트리밍 IoT 데이터에서 준실시간 이상 탐지를 수행하려면 Amazon Managed Service for Apache Flink가 권장됩니다. Flink는 상태 기반의 낮은 지연 시간 스트림 처리를 위해 설계되어 시계열 센서 데이터 분석에 적합합니다. 이 문제의 핵심 요구 사항은 배포 중 애플리케이션 복원력입니다. Managed Flink는 시스템 롤백 기능을 지원하여 새 배포가 실패할 경우 마지막으로 안정적이었던 애플리케이션 버전으로 자동 되돌릴 수 있습니다. 이를 통해 애플리케이션 코드 버그가 새 버전에 포함되더라도 처리가 중단되지 않도록 보장할 수 있습니다. 수동 롤백은 운영 위험과 지연을 초래하며, Amazon Data Firehose는 전달 서비스일 뿐 복잡한 이상 탐지 로직이나 애플리케이션 버전 롤백을 지원하지 않습니다. 따라서 시스템 롤백을 활성화한 Managed Flink를 사용하는 A안이 정답입니다.", "en": "For near real-time anomaly detection on streaming IoT data, AWS recommends Amazon Managed Service for Apache Flink. Flink is designed for stateful, low-latency stream processing and is well suited for time- series sensor analytics. A key requirement is application resilience during deployments. Managed Flink supports system rollback, which automatically reverts to the last stable application version if a new deployment fails. This capability ensures uninterrupted processing even if application bugs are introduced, meeting the company's reliability requirement. Manual rollback (Option B) introduces operational risk and delays. Amazon Data Firehose (Options C and D) is a delivery service and does not support complex anomaly detection logic or application version rollback. Therefore, using Managed Flink with system rollback enabled is the correct solution."}, {"n": 107, "t": "single", "q": "A digital media entertainment company needs real-time video content moderation to ensure compliance during live streaming events. Which solution will meet these requirements with the LEAST operational overhead?", "kq": "어떤 디지털 미디어 엔터테인먼트 회사가 라이브 스트리밍 이벤트 중 규정 준수를 보장하기 위해 실시간 비디오 콘텐츠 모더레이션이 필요합니다. 어떤 솔루션이 최소한의 운영 오버헤드로 이러한 요구 사항을 충족할까요?", "o": [{"k": "A", "t": "Use Amazon Rekognition and AWS Lambda to extract and analyze the metadata from the videos' image frames.", "kt": "Amazon Rekognition과 AWS Lambda를 사용해 비디오 이미지 프레임에서 메타데이터를 추출하고 분석합니다."}, {"k": "B", "t": "Use Amazon Rekognition and a large language model (LLM) hosted on Amazon Bedrock to extract and analyze the metadata from the videos' image frames.", "kt": "Amazon Rekognition과 Amazon Bedrock에 호스팅된 대규모 언어 모델(LLM)을 사용해 비디오 이미지 프레임에서 메타데이터를 추출하고 분석합니다."}, {"k": "C", "t": "Use Amazon SageMaker AI to extract and analyze the metadata from the videos' image frames.", "kt": "Amazon SageMaker AI를 사용해 비디오 이미지 프레임에서 메타데이터를 추출하고 분석합니다."}, {"k": "D", "t": "Use Amazon Transcribe and Amazon Comprehend to extract and analyze the metadata from the videos' image frames.", "kt": "Amazon Transcribe와 Amazon Comprehend를 사용해 비디오 이미지 프레임에서 메타데이터를 추출하고 분석합니다."}], "a": ["A"], "ko": "실시간 비디오 콘텐츠 조정을 최소한의 운영 부담으로 수행하려면 완전 관리형 목적별 AI 서비스를 사용하는 것이 적절합니다. Amazon Rekognition은 라이브 비디오 스트림에 대한 콘텐츠 조정, 유해 콘텐츠 탐지, 라벨 인식 등 실시간 비디오 분석 기능을 제공합니다. Rekognition을 AWS Lambda와 통합하면 비디오 프레임을 자동으로 처리하고 조정 메타데이터를 추출하며, 서버나 모델 인프라를 직접 관리하지 않고도 스트림 표시 또는 중단과 같은 즉각적인 조치를 수행할 수 있습니다. Bedrock LLM은 이미지 기반 조정 작업에 불필요한 복잡성을 추가하고, SageMaker는 모델 학습과 엔드포인트 관리가 필요해 운영 부담이 증가합니다. Transcribe와 Comprehend는 오디오 및 텍스트 분석용 서비스이므로 이미지 또는 비디오 프레임 조정에는 적합하지 않습니다. 따라서 Rekognition과 Lambda를 사용하는 A안이 가장 효율적입니다.", "en": "For real-time video content moderation with minimal operational overhead, AWS documentation recommends using fully managed, purpose-built AI services. Amazon Rekognition provides real-time video analysis capabilities, including content moderation, unsafe content detection, and label recognition for live video streams. By integrating Rekognition with AWS Lambda, the company can automatically process video frames, extract moderation metadata, and take immediate action (such as flagging or stopping a stream) without managing servers, models, or infrastructure. This serverless architecture scales automatically and minimizes operational complexity. Option B introduces unnecessary complexity. While Amazon Bedrock LLMs are powerful, they are not required for image-based moderation tasks that Rekognition already handles natively. Option C is incorrect because using Amazon SageMaker would require model training, endpoint management, and scaling, significantly increasing operational overhead. Option D is incorrect because Amazon Transcribe and Amazon Comprehend are designed for audio and text analysis, not image or video frame moderation. Therefore, Amazon Rekognition with AWS Lambda is the most efficient, scalable, and low- maintenance solution for real-time video moderation during live streaming events."}, {"n": 108, "t": "single", "q": "A company's ML engineer is creating a classification model. The ML engineer explores the dataset and notices a column named day_of_week. The column contains the following values: Monday, Tuesday, Wednesday, Thursday, Friday, Saturday, and Sunday. Which technique should the ML engineer use to convert this column's data to binary values?", "kq": "어떤 회사의 ML 엔지니어가 분류 모델을 만들고 있습니다. ML 엔지니어가 데이터셋을 탐색하다가 day_of_week라는 컬럼을 발견했습니다. 이 컬럼에는 Monday, Tuesday, Wednesday, Thursday, Friday, Saturday, Sunday라는 값이 들어 있습니다. 이 컬럼의 데이터를 이진값으로 변환하려면 어떤 기법을 사용해야 합니까?", "o": [{"k": "A", "t": "Binary encoding", "kt": "이진 인코딩(Binary encoding)"}, {"k": "B", "t": "Label encoding", "kt": "레이블 인코딩(Label encoding)"}, {"k": "C", "t": "One-hot encoding", "kt": "원-핫 인코딩(One-hot encoding)"}, {"k": "D", "t": "Tokenization", "kt": "토큰화(Tokenization)"}], "a": ["C"], "ko": "day_of_week 특성은 고유값 수가 적고 고정되어 있으며 본질적인 순서 관계가 없는 범주형 변수입니다. AWS 머신러닝 모범 사례에서는 이러한 유형의 범주형 데이터를 분류 모델에 사용하기 전에 원-핫 인코딩할 것을 권장합니다. 원-핫 인코딩은 각 고유 범주를 별도의 이진 특성으로 변환합니다. 예를 들어 Monday는 Monday 컬럼이 1이고 나머지 요일 컬럼이 0인 형태로 표현됩니다. 이 방식은 모델이 범주 사이에 숫자적 또는 순서적 관계가 있다고 잘못 가정하지 않도록 합니다. 라벨 인코딩은 Monday=1, Tuesday=2와 같이 정수 값을 부여하므로 명목형 데이터에 잘못된 순서 의미를 부여할 수 있습니다. 바이너리 인코딩은 일반적으로 고카디널리티 범주형 변수에 사용되며, 요일처럼 7개 범주만 있는 경우에는 원-핫 인코딩이 더 명확하고 해석하기 쉽습니다. 토큰화는 NLP 작업에서 텍스트 처리에 사용하는 방식이므로 구조화된 범주형 특성에는 적합하지 않습니다. 따라서 C안이 정답입니다.", "en": "The day_of_week feature is a categorical variable with a small, fixed number of unique values and no inherent ordinal relationship. AWS machine learning best practices strongly recommend one-hot encoding for this type of categorical data when preparing features for classification models. One-hot encoding converts each unique category into a separate binary feature (0 or 1). For example, \"Monday\" becomes a column where Monday = 1 and all other days = 0. This ensures that the ML model does not incorrectly assume a numeric or ordered relationship between categories. Option B (label encoding) assigns integer values to categories (e.g., Monday = 1, Tuesday = 2). AWS documentation cautions against this approach for nominal data because models may incorrectly infer ordinal meaning, leading to biased or inaccurate predictions. Option A (binary encoding) is typically used for high-cardinality categorical features to reduce dimensionality. With only seven categories, AWS recommends one-hot encoding for clarity and interpretability. Option D (tokenization) is used for text processing, such as NLP tasks, and is not appropriate for structured categorical features. AWS SageMaker feature engineering guidelines emphasize that one-hot encoding is the preferred method for low-cardinality categorical variables in classification models, especially when using algorithms such as logistic regression, neural networks, and tree-based models. Therefore, Option C is the correct and AWS-aligned choice."}, {"n": 109, "t": "single", "q": "A company plans to use Amazon SageMaker AI to build image classification models. The company has 6 TB of training data stored on Amazon FSx for NetApp ONTAP. The file system is in the same VPC as SageMaker AI. An ML engineer must make the training data accessible to SageMaker AI training jobs. Which solution will meet these requirements?", "kq": "어떤 회사가 Amazon SageMaker AI로 이미지 분류 모델을 만들려고 합니다. 회사는 Amazon FSx for NetApp ONTAP에 6TB의 학습 데이터를 저장하고 있습니다. 이 파일 시스템은 SageMaker AI와 같은 VPC에 있습니다. ML 엔지니어는 SageMaker AI 학습 작업이 이 학습 데이터에 접근할 수 있게 해야 합니다. 어떤 솔루션이 이러한 요구 사항을 충족할까요?", "o": [{"k": "A", "t": "Mount the FSx for ONTAP file system as a volume to the SageMaker AI instance.", "kt": "FSx for ONTAP 파일 시스템을 SageMaker AI 인스턴스에 볼륨으로 마운트합니다."}, {"k": "B", "t": "Create an Amazon S3 bucket and use Mountpoint for Amazon S3 to link the bucket to FSx for ONTAP.", "kt": "Amazon S3 버킷을 만들고 Mountpoint for Amazon S3를 사용해 버킷을 FSx for ONTAP에 연결합니다."}, {"k": "C", "t": "Create a catalog connection from SageMaker Data Wrangler to the FSx for ONTAP file system.", "kt": "SageMaker Data Wrangler에서 FSx for ONTAP 파일 시스템으로 카탈로그 연결을 만듭니다."}, {"k": "D", "t": "Create a direct connection from SageMaker Data Wrangler to the FSx for ONTAP file system.", "kt": "SageMaker Data Wrangler에서 FSx for ONTAP 파일 시스템으로 직접 연결을 만듭니다."}], "a": ["A"], "ko": "Amazon SageMaker는 Amazon FSx를 통해 학습 작업에서 파일 시스템에 직접 접근하는 기능을 지원합니다. AWS 문서에 따르면 FSx for NetApp ONTAP 파일 시스템이 SageMaker AI와 동일한 VPC에 있는 경우 SageMaker 학습 인스턴스에 직접 마운트할 수 있습니다. FSx 파일 시스템을 마운트하면 6TB와 같은 대규모 이미지 데이터를 Amazon S3로 복사하지 않고도 효율적으로 스트리밍하여 학습에 사용할 수 있습니다. SageMaker Data Wrangler 관련 선택지는 데이터 준비와 탐색을 위한 기능이지 대규모 학습 데이터 접근을 위한 방법이 아닙니다. Mountpoint for Amazon S3도 필요하지 않으며 추가 복잡성을 유발합니다. 따라서 FSx for ONTAP 파일 시스템을 SageMaker AI 인스턴스에 볼륨으로 마운트하는 A안이 정답입니다.", "en": "Amazon SageMaker supports direct file system access for training jobs through Amazon FSx. AWS documentation states that FSx for NetApp ONTAP file systems can be mounted directly to SageMaker training instances when they are located in the same VPC. Mounting the FSx file system allows SageMaker to stream large datasets efficiently without copying data into Amazon S3. This is ideal for very large datasets such as 6 TB of image data and avoids unnecessary storage duplication. Options involving SageMaker Data Wrangler are intended for data preparation and exploration, not large- scale training data access. Mountpoint for Amazon S3 is not required and introduces additional complexity. Therefore, Option A is the correct and AWS-aligned solution."}, {"n": 110, "t": "single", "q": "A company is using Amazon SageMaker to create ML models. The company's data scientists need fine- grained control of the ML workflows that they orchestrate. The data scientists also need the ability to visualize SageMaker jobs and workflows as a directed acyclic graph (DAG). The data scientists must keep a running history of model discovery experiments and must establish model governance for auditing and compliance verifications. Which solution will meet these requirements?", "kq": "어떤 회사가 ML 모델을 만들기 위해 Amazon SageMaker를 사용합니다. 회사의 데이터 사이언티스트들은 자신이 오케스트레이션하는 ML 워크플로를 세밀하게 제어해야 합니다. 또한 SageMaker 작업과 워크플로를 방향성 비순환 그래프(DAG)로 시각화할 수 있어야 합니다. 데이터 사이언티스트들은 모델 탐색 실험의 실행 이력을 유지해야 하며, 감사와 컴플라이언스 검증을 위한 모델 거버넌스를 확립해야 합니다. 어떤 솔루션이 이러한 요구 사항을 충족할까요?", "o": [{"k": "A", "t": "Use AWS CodePipeline and its integration with SageMaker Studio to manage the entire ML workflows. Use SageMaker ML Lineage Tracking for the running history of experiments and for auditing and compliance verifications.", "kt": "AWS CodePipeline과 SageMaker Studio 통합을 사용해 전체 ML 워크플로를 관리합니다. 실험 실행 이력과 감사·컴플라이언스 검증에는 SageMaker ML Lineage Tracking을 사용합니다."}, {"k": "B", "t": "Use AWS CodePipeline and its integration with SageMaker Experiments to manage the entire ML workflows. Use SageMaker Experiments for the running history of experiments and for auditing and compliance verifications.", "kt": "AWS CodePipeline과 SageMaker Experiments 통합을 사용해 전체 ML 워크플로를 관리합니다. 실험 실행 이력과 감사·컴플라이언스 검증에는 SageMaker Experiments를 사용합니다."}, {"k": "C", "t": "Use SageMaker Pipelines and its integration with SageMaker Studio to manage the entire ML workflows. Use SageMaker ML Lineage Tracking for the running history of experiments and for auditing and compliance verifications.", "kt": "SageMaker Pipelines와 SageMaker Studio 통합을 사용해 전체 ML 워크플로를 관리합니다. 실험 실행 이력과 감사·컴플라이언스 검증에는 SageMaker ML Lineage Tracking을 사용합니다."}, {"k": "D", "t": "Use SageMaker Pipelines and its integration with SageMaker Experiments to manage the entire ML workflows. Use SageMaker Experiments for the running history of experiments and for auditing and compliance verifications.", "kt": "SageMaker Pipelines와 SageMaker Experiments 통합을 사용해 전체 ML 워크플로를 관리합니다. 실험 실행 이력과 감사·컴플라이언스 검증에는 SageMaker Experiments를 사용합니다."}], "a": ["C"], "ko": "SageMaker Pipelines는 ML 워크플로를 세밀하게 관리하고 시각화할 수 있는 방향성 비순환 그래프(DAG) 보기를 제공합니다. 또한 SageMaker Studio와 원활하게 통합되어 워크플로 오케스트레이션을 직관적으로 수행할 수 있습니다. SageMaker ML Lineage Tracking은 실험의 실행 이력을 유지하고 데이터셋, 모델, 학습 작업의 계보를 추적합니다. 이 기능은 모델 거버넌스, 감사, 규정 준수 검증 요구 사항을 충족하는 데 적합합니다. 따라서 SageMaker Pipelines와 SageMaker Studio, ML Lineage Tracking을 함께 사용하는 C안이 정답입니다.", "en": "SageMaker Pipelines provides a directed acyclic graph (DAG) view for managing and visualizing ML workflows with fine-grained control. It integrates seamlessly with SageMaker Studio, offering an intuitive interface for workflow orchestration. SageMaker ML Lineage Tracking keeps a running history of experiments and tracks the lineage of datasets, models, and training jobs. This feature supports model governance, auditing, and compliance verification requirements."}, {"n": 111, "t": "match", "q": "A company uses Amazon SageMaker AI to support ML workflows such as model training and deployment. Select the correct registry from the following list to meet the requirements for each use case with the LEAST operational overhead. Each registry should be selected one or more times. (Select FOUR.)", "kq": "어떤 회사가 모델 학습과 배포 같은 ML 워크플로를 지원하기 위해 Amazon SageMaker AI를 사용합니다. 아래 목록에서 각 사용 사례의 요구 사항을 운영 부담이 가장 적게 충족하는 레지스트리를 선택하세요. 각 레지스트리는 한 번 이상 선택할 수 있습니다. (4개 선택)", "p": ["Tag model packages and use model package groups that include container images for training and deployment", "Store predefined language packages, kernels, and relevant dependencies", "Organize models and their images into model groups for better discoverability", "Pull built-in SageMaker AI images for model training"], "c": ["Amazon Elastic Container Registry (Amazon ECR)", "SageMaker Model Registry"], "kp": ["모델 패키지에 태그를 지정하고, 학습·배포용 컨테이너 이미지가 포함된 모델 패키지 그룹을 사용한다", "사전 정의된 언어 패키지, 커널, 관련 종속성을 저장한다", "검색 가능성을 높이기 위해 모델과 해당 이미지를 모델 그룹으로 구성한다", "모델 학습을 위해 SageMaker AI 내장 이미지를 가져온다"], "kc": ["Amazon Elastic Container Registry (Amazon ECR)", "SageMaker Model Registry"], "a": [1, 0, 1, 0], "ko": "올바른 매핑은 SageMaker Model Registry와 Amazon ECR의 서로 다른 목적을 기준으로 결정됩니다. 모델 패키지, 모델 패키지 그룹, 모델 검색 가능성과 관련된 항목은 SageMaker Model Registry가 적합합니다. SageMaker Model Registry는 버전이 지정된 모델 패키지를 그룹으로 관리하고, 각 버전에 모델 아티팩트, 메타데이터, 배포에 사용되는 컨테이너 정보를 포함할 수 있습니다. 따라서 모델 패키지를 태그하고 모델 패키지 그룹을 사용하는 항목과, 모델 및 이미지를 모델 그룹으로 구성해 검색 가능성을 높이는 항목은 SageMaker Model Registry에 매핑됩니다. 반면 소프트웨어 환경, 언어 패키지, 커널, 종속성 및 학습용 컨테이너 이미지를 저장하거나 가져오는 항목은 Amazon ECR이 적합합니다. SageMaker는 Docker 컨테이너 이미지를 사용하며, 이러한 이미지는 프레임워크, 언어 패키지, 커널, 종속성 같은 소프트웨어 스택을 포함합니다. 또한 SageMaker의 사전 구축 학습 이미지는 Amazon ECR 이미지 URI를 통해 참조됩니다. 따라서 언어 패키지와 종속성을 저장하거나 내장 SageMaker AI 이미지를 가져오는 항목은 Amazon ECR에 매핑됩니다.", "en": "* Tag model packages and use model package groups that include container images for training and deployment → SageMaker Model Registry * Store predefined language packages, kernels, and relevant dependencies → Amazon Elastic Container Registry (Amazon ECR) * Organize models and their images into model groups for better discoverability → SageMaker Model Registry * Pull built-in SageMaker AI images for model training → Amazon Elastic Container Registry (Amazon ECR) The correct hotspot mapping is based on the different purposes of SageMaker Model Registry and Amazon ECR. For model packages, model package groups, and model discoverability, the correct choice is SageMaker Model Registry. AWS documentation states that a model package group is a collection of versioned model packages, and each version can contain the model artifacts, metadata, and container information used for deployment. AWS also documents that registered models can be organized into groups to support governance, discoverability, and lifecycle management. That is why both \"tag model packages and use model package groups\" and \"organize models and their images into model groups\" map to SageMaker Model Registry. For storing software environments and pulling training images, the correct choice is Amazon ECR. AWS documentation says SageMaker uses Docker container images, and these images contain the software stack such as frameworks, language packages, kernels, and dependencies. AWS also states that SageMaker provides prebuilt Docker images for training and inference, and these are referenced through Amazon ECR image URIs. Therefore, both \"store predefined language packages, kernels, and relevant dependencies\" and \"pull built-in SageMaker AI images for model training\" map to Amazon ECR."}, {"n": 112, "t": "single", "q": "A company is planning to create several ML prediction models. The training data is stored in Amazon S3. The entire dataset is more than 5 TB in size and consists of CSV, JSON, Apache Parquet, and simple text files. The data must be processed in several consecutive steps. The steps include complex manipulations that can take hours to finish running. Some of the processing involves natural language processing (NLP) transformations. The entire process must be automated. Which solution will meet these requirements?", "kq": "어떤 회사가 여러 개의 ML 예측 모델을 만들 계획입니다. 학습 데이터는 Amazon S3에 저장되어 있습니다. 전체 데이터셋은 5TB가 넘고 CSV, JSON, Apache Parquet, 단순 텍스트 파일로 구성되어 있습니다. 데이터는 여러 연속 단계로 처리되어야 합니다. 이 단계들에는 완료까지 몇 시간이 걸릴 수 있는 복잡한 조작이 포함됩니다. 일부 처리에는 자연어 처리(NLP) 변환이 포함됩니다. 전체 프로세스는 자동화되어야 합니다. 어떤 솔루션이 이러한 요구 사항을 충족할까요?", "o": [{"k": "A", "t": "Process data at each step by using Amazon SageMaker Data Wrangler. Automate the process by using Data Wrangler jobs.", "kt": "각 단계의 데이터를 Amazon SageMaker Data Wrangler로 처리합니다. Data Wrangler 작업으로 프로세스를 자동화합니다."}, {"k": "B", "t": "Use Amazon SageMaker notebooks for each data processing step. Automate the process by using Amazon EventBridge.", "kt": "각 데이터 처리 단계에 Amazon SageMaker 노트북을 사용합니다. Amazon EventBridge로 프로세스를 자동화합니다."}, {"k": "C", "t": "Process data at each step by using AWS Lambda functions. Automate the process by using AWS Step Functions and Amazon EventBridge.", "kt": "각 단계의 데이터를 AWS Lambda 함수로 처리합니다. AWS Step Functions와 Amazon EventBridge로 프로세스를 자동화합니다."}, {"k": "D", "t": "Use Amazon SageMaker Pipelines to create a pipeline of data processing steps. Automate the pipeline by using Amazon EventBridge.", "kt": "Amazon SageMaker Pipelines로 데이터 처리 단계의 파이프라인을 만듭니다. Amazon EventBridge로 파이프라인을 자동화합니다."}], "a": ["D"], "ko": "Amazon SageMaker Pipelines는 복잡한 데이터 전처리 작업을 포함해 엔드 투 엔드 ML 워크플로를 생성, 자동화, 관리하도록 설계된 서비스입니다. 대규모 데이터셋을 처리할 수 있으며, NLP 변환과 같은 사용자 지정 처리 단계와도 통합할 수 있습니다. SageMaker Pipelines를 Amazon EventBridge와 함께 사용하면 전체 워크플로를 자동으로 트리거하고 실행할 수 있어 확장성, 자동화, 복잡한 처리 요구 사항을 모두 충족할 수 있습니다.", "en": "Amazon SageMaker Pipelines is designed for creating, automating, and managing end-to-end ML workflows, including complex data preprocessing tasks. It supports handling large datasets and can integrate with custom steps, such as NLP transformations. By combining SageMaker Pipelines with Amazon EventBridge, the entire workflow can be triggered and automated efficiently, meeting the requirements for scalability, automation, and processing complexity."}, {"n": 113, "t": "single", "q": "A company needs to deploy a custom-trained classification ML model on AWS. The model must make near real-time predictions with low latency and must handle variable request volumes. Which solution will meet these requirements?", "kq": "어떤 회사가 사용자 지정 학습된 분류 ML 모델을 AWS에 배포해야 합니다. 모델은 낮은 지연 시간으로 준실시간 예측을 수행해야 하고, 변동하는 요청량을 처리할 수 있어야 합니다. 어떤 솔루션이 이러한 요구 사항을 충족할까요?", "o": [{"k": "A", "t": "Create an Amazon SageMaker AI batch transform job to process inference requests in batches.", "kt": "Amazon SageMaker AI 배치 변환 작업을 만들어 추론 요청을 배치로 처리합니다."}, {"k": "B", "t": "Use Amazon API Gateway to receive prediction requests. Use an Amazon S3 bucket to host and serve the model.", "kt": "Amazon API Gateway로 예측 요청을 받습니다. Amazon S3 버킷에 모델을 호스팅해 제공합니다."}, {"k": "C", "t": "Deploy an Amazon SageMaker AI endpoint. Configure auto scaling for the endpoint.", "kt": "Amazon SageMaker AI 엔드포인트를 배포합니다. 엔드포인트에 Auto Scaling을 구성합니다."}, {"k": "D", "t": "Launch AWS Deep Learning AMIs (DLAMI) on two Amazon EC2 instances. Run the instances behind an Application Load Balancer.", "kt": "두 개의 Amazon EC2 인스턴스에 AWS Deep Learning AMI(DLAMI)를 시작합니다. 인스턴스를 Application Load Balancer 뒤에서 실행합니다."}], "a": ["C"], "ko": "낮은 지연 시간의 준실시간 추론과 변동적인 트래픽을 처리하려면 AWS는 관리형 SageMaker 엔드포인트에 모델을 배포하는 방식을 권장합니다. Auto Scaling을 활성화하면 요청량에 따라 인스턴스 수가 자동으로 조정되어 성능을 안정적으로 유지하면서 비용을 최적화할 수 있습니다. SageMaker 엔드포인트는 인프라 관리, 상태 확인, 확장, 모델 배포를 추상화하므로 EC2 인스턴스를 직접 관리하는 방식보다 운영 부담이 낮습니다. Batch Transform은 오프라인 추론용이고, API Gateway와 S3만으로는 ML 모델을 제공할 수 없습니다. EC2 기반 배포는 수동 확장과 모니터링이 필요합니다. 따라서 Auto Scaling이 구성된 SageMaker 엔드포인트가 정답입니다.", "en": "For near real-time inference with low latency and variable traffic, AWS recommends deploying models to managed SageMaker endpoints. By enabling auto scaling, the endpoint automatically adjusts the number of instances based on request volume, ensuring consistent performance while optimizing cost. Amazon SageMaker Endpoints abstracts infrastructure management, health checks, scaling, and model deployment. This provides lower operational overhead than managing EC2 instances manually. Batch transform is for offline inference. API Gateway with S3 cannot serve ML models. EC2-based deployments require manual scaling and monitoring. Therefore, a SageMaker endpoint with auto scaling is the correct solution."}, {"n": 115, "t": "single", "q": "An ML engineer has trained an ML model by using Amazon SageMaker AI. The ML engineer determines that the model is overfitting and that the training data contains unnecessary features. The ML engineer must reduce the overfitting and the impact of the unnecessary features. Which solution will meet these requirements?", "kq": "ML 엔지니어가 Amazon SageMaker AI로 ML 모델을 학습시켰습니다. ML 엔지니어는 모델이 과적합되었고 학습 데이터에 불필요한 특성이 포함되어 있다고 판단했습니다. ML 엔지니어는 과적합과 불필요한 특성의 영향을 줄여야 합니다. 어떤 솔루션이 이러한 요구 사항을 충족할까요?", "o": [{"k": "A", "t": "Apply L1 regularization to the training data. Retrain the model.", "kt": "학습 데이터에 L1 정규화를 적용합니다. 모델을 재학습시킵니다."}, {"k": "B", "t": "Use SageMaker Debugger to apply L1 regularization to the running model.", "kt": "SageMaker Debugger를 사용해 실행 중인 모델에 L1 정규화를 적용합니다."}, {"k": "C", "t": "Increase the number of training iterations. Retrain the model.", "kt": "학습 반복 횟수를 늘립니다. 모델을 재학습시킵니다."}, {"k": "D", "t": "Decrease the number of training iterations. Retrain the model.", "kt": "학습 반복 횟수를 줄입니다. 모델을 재학습시킵니다."}], "a": ["A"], "ko": "A안이 정답입니다. AWS 문서에 따르면 정규화는 선형 모델의 과적합을 방지하는 데 도움이 되며, 특히 L1 정규화는 작은 특성 가중치를 0으로 만들어 모델에서 사용되는 특성 수를 줄입니다. 또한 L1 정규화는 희소 모델을 만들고 노이즈를 줄이는 데 도움이 됩니다. 이 시나리오에서 필요한 것은 모델의 과적합을 줄이고 불필요한 특성의 영향을 낮추는 것이므로, L1 정규화가 가장 적합합니다. L1 정규화는 규제 기법으로 작동하는 동시에 중요하지 않은 특성 계수를 0으로 축소하여 실질적으로 특성 선택 효과도 제공합니다. SageMaker Debugger는 학습 작업을 모니터링하고 분석하는 도구이지 실행 중인 모델에 L1 정규화를 적용하는 기능은 아닙니다. 학습 반복 횟수를 늘리면 과적합이 악화될 수 있으며, 반복 횟수를 줄이는 것은 일부 경우 과적합을 완화할 수 있지만 불필요한 특성 문제를 직접 해결하지는 못합니다. 따라서 L1 정규화를 적용하고 모델을 재학습하는 A안이 가장 적절합니다.", "en": "Option A is correct because AWS documentation states that regularization helps prevent linear models from overfitting, and specifically that L1 regularization reduces the number of features used in the model by pushing small feature weights to zero. AWS further explains that L1 regularization produces sparse models and reduces noise. That is the exact combination needed in this scenario: the model is overfitting, and the data contains unnecessary features whose impact should be reduced. AWS guidance on overfitting also says that to reduce model overfitting, you should reduce model flexibility by using feature selection and increasing the amount of regularization. L1 regularization is especially suitable here because it does both in practice: it acts as a regularizer and also effectively performs feature selection by shrinking unhelpful feature coefficients to zero. Even though the option wording says \"apply L1 regularization to the training data,\" the only answer choice that aligns with AWS-documented techniques for both overfitting reduction and unnecessary-feature suppression is L1 regularization with retraining. The other options do not meet both requirements. SageMaker Debugger monitors and helps analyze training jobs, but it is not the feature that \"applies L1 regularization\" to a running model. Increasing training iterations can make overfitting worse, not better. Decreasing training iterations may reduce overfitting in some cases, but it does not specifically address the presence of unnecessary features. Therefore, the AWS-aligned choice that best reduces overfitting and the impact of irrelevant features is A."}, {"n": 117, "t": "single", "q": "A company is developing an internal cost-estimation tool that uses an ML model in Amazon SageMaker AI. Users upload high-resolution images to the tool. The model must process each image and predict the cost of the object in the image. The model also must notify the user when processing is complete. Which solution will meet these requirements?", "kq": "어떤 회사가 Amazon SageMaker AI의 ML 모델을 사용하는 내부 비용 산정 도구를 개발하고 있습니다. 사용자들은 이 도구에 고해상도 이미지를 업로드합니다. 모델은 각 이미지를 처리해 이미지 속 물체의 비용을 예측해야 합니다. 또한 처리가 완료되면 사용자에게 알려야 합니다. 어떤 솔루션이 이러한 요구 사항을 충족할까요?", "o": [{"k": "A", "t": "Store the images in an Amazon S3 bucket. Deploy the model on SageMaker AI. Use batch transform jobs for model inference. Use an Amazon Simple Queue Service (Amazon SQS) queue to notify users.", "kt": "이미지를 Amazon S3 버킷에 저장합니다. SageMaker AI에 모델을 배포합니다. 모델 추론에는 배치 변환 작업을 사용합니다. 사용자 알림에는 Amazon SQS 큐를 사용합니다."}, {"k": "B", "t": "Store the images in an Amazon S3 bucket. Deploy the model on SageMaker AI. Use an asynchronous inference strategy for model inference. Use an Amazon Simple Notification Service (Amazon SNS) topic to notify users.", "kt": "이미지를 Amazon S3 버킷에 저장합니다. SageMaker AI에 모델을 배포합니다. 모델 추론에는 비동기 추론 전략을 사용합니다. 사용자 알림에는 Amazon SNS 토픽을 사용합니다."}, {"k": "C", "t": "Store the images in an Amazon Elastic File System (Amazon EFS) file system. Deploy the model on SageMaker AI. Use batch transform jobs for model inference. Use an Amazon Simple Queue Service (Amazon SQS) queue to notify users.", "kt": "이미지를 Amazon EFS 파일 시스템에 저장합니다. SageMaker AI에 모델을 배포합니다. 모델 추론에는 배치 변환 작업을 사용합니다. 사용자 알림에는 Amazon SQS 큐를 사용합니다."}, {"k": "D", "t": "Store the images in an Amazon Elastic File System (Amazon EFS) file system. Deploy the model on SageMaker AI. Use an asynchronous inference strategy for model inference. Use an Amazon Simple Notification Service (Amazon SNS) topic to notify users.", "kt": "이미지를 Amazon EFS 파일 시스템에 저장합니다. SageMaker AI에 모델을 배포합니다. 모델 추론에는 비동기 추론 전략을 사용합니다. 사용자 알림에는 Amazon SNS 토픽을 사용합니다."}], "a": ["B"], "ko": "이 사용 사례는 고해상도 이미지처럼 큰 페이로드, 가변적인 처리 시간, 처리 완료 시 사용자에게 알림을 보내야 하는 요구 사항을 포함합니다. AWS 문서에서는 이러한 시나리오에 Amazon SageMaker 비동기 추론을 권장합니다. 비동기 추론은 클라이언트가 응답을 기다리지 않고 추론 요청을 제출할 수 있게 하며, 요청 페이로드는 Amazon S3에 저장되고 처리가 완료되면 추론 결과가 다시 S3에 기록됩니다. 이 방식은 실시간 지연 시간 요구 사항을 충족하기 어렵거나 실시간 추론 한도를 초과하는 페이로드를 처리해야 하는 워크로드에 적합합니다. 또한 SageMaker 비동기 추론은 Amazon SNS와 기본적으로 통합되어 추론 완료 또는 실패 시 알림을 보낼 수 있으므로 사용자 알림 요구 사항을 직접 충족합니다. Batch Transform은 오프라인 대량 처리용이며 기본 사용자 알림 메커니즘을 제공하지 않습니다. Amazon EFS는 필요하지 않습니다. SageMaker는 추론 입력과 출력에 Amazon S3를 기본적으로 통합하기 때문입니다. 따라서 S3에 이미지를 저장하고 SageMaker 비동기 추론과 SNS 알림을 사용하는 B안이 정답입니다.", "en": "This use case involves large payloads (high-resolution images), variable processing time, and a requirement to notify users upon completion. AWS documentation recommends Amazon SageMaker asynchronous inference for exactly this scenario. Asynchronous inference allows clients to submit inference requests without waiting for a response. The request payload is stored in Amazon S3, and the inference result is written back to S3 when processing is complete. This approach is designed for workloads that ca
